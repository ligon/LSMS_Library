[project]
name = "LSMS_Library"
dynamic = []
description = "Abstraction layer for Living Standards Measurement Survey data"
authors = [ {name = "Ethan Ligon", email = "ligon@berkeley.edu"}
    ]
license = {text = "CC-BY-4.0"}
readme = "README.org"
requires-python = ">=3.11, <4.0"
dependencies = ["pandas >=3.0",
             "CFEDemands>=0.8.2",
             "PyYAML >=6.0,<7.0",
             "python-gnupg >=0.5,<1.0",
             # Explicit, though dvc[s3]/botocore pull it in anyway: this is the
             # S3 unlock path (GH #741), and it must not depend on another
             # package's extras continuing to ship it.  python-gnupg above is
             # now only needed for the interactive keyless fallback.
             "cryptography >=3.4",
             "scikit-learn (>=1.7.0,<2.0.0)",
             "dvc[s3] (>=3.67.0,<4.0.0)",
             "pyarrow (>=21.0.0)",
             "pyreadstat (>=1.3.0,<2.0.0)",
             "openai (>=1.99.5,<2.0.0)",
            "ligonlibrary (>=0.2.0)",
             "python-Levenshtein (>=0.27.3,<0.28.0)",
             "typer (>=0.12.0,<1.0.0)",
             "fooddatacentral (>=1.0.10,<2.0.0)",
             "pint (>=0.25.2,<0.26.0)",
             "platformdirs (>=4.0.0,<5.0.0)"]
version = "0.0.0"

[project.scripts]
lsms-library = "lsms_library.cli:main"

[project.urls]
repository = "https://github.com/ligon/LSMS_Library"

[tool.poetry]
include = [
    "lsms_library/countries/.dvc/config",
    "lsms_library/countries/.dvc/s3_config",
    "lsms_library/countries/.dvc/.gitignore",
    "lsms_library/countries/.dvc/plots/*.json",
    "lsms_library/countries/.dvc/s3_reader_creds.gpg",
    "lsms_library/countries/.dvc/s3_reader_creds.enc",
]

[tool.poetry.requires-plugins]
poetry-dynamic-versioning = { version = ">=1.0.0,<2.0.0", extras = ["plugin"] }

[tool.poetry.group.test.dependencies]
pytest = "^8.0.0"
pytest-xdist = "^3.6.0"
pytest-instafail = "^0.5.0"
pytest-timeout = "^2.3.0"
ipython = "^9.4.0"
matplotlib = "^3.10.0"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
mkdocs-material = ">=9.0"
mkdocstrings = {extras = ["python"], version = ">=0.28"}

[tool.poetry.group.profile]
optional = true

[tool.poetry.group.profile.dependencies]
pyinstrument = ">=4.6,<6.0"
snakeviz = "^2.2"

[tool.poetry-dynamic-versioning]
enable = false
vcs = "git"
style = "pep440"

[build-system]
requires = ["poetry-core>=2.0.0", "poetry-dynamic-versioning>=1.0.0,<2.0.0"]
build-backend = "poetry_dynamic_versioning.backend"

[tool.pytest.ini_options]
# Collect ONLY from tests/.  Without this pytest scans the repo root, so ANY
# file matching `test_*.py` or `*_test.py` anywhere in the tree is imported at
# collection -- including analysis scripts under `slurm_logs/` and `SkunkWorks/`.
#
# That is not theoretical.  `slurm_logs/ghanasps/plot_identity_permutation_test.py`
# (a re-checkable permutation test shipped alongside a findings doc, GH #729)
# matched `*_test.py`, did its data loading at MODULE level, and hit
# `NoCredentialsError` in CI:
#
#   ERROR collecting slurm_logs/ghanasps/plot_identity_permutation_test.py
#   !!!!!! Interrupted: 1 error during collection !!!!!!
#
# An error at COLLECTION aborts the whole session -- zero tests ran, and the
# message named neither a test nor the change under review.  Same failure shape
# as GH #680 (the `fooddatacentral` top-level `tests` package).
#
# `SkunkWorks/` already holds four `test_*.py` files that are collected today
# and are harmless only because their module-level code happens not to raise.
# Naming discipline was the only thing standing between us and this, and naming
# discipline is not enforcement.
#
# Measured before pinning: repo-root collection and `tests/`-only collection
# both yield **4,851** items, so this scopes without losing coverage.
testpaths = ["tests"]
