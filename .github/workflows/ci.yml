name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    # Weekly DVC remote reachability sweep (GH #750); see the job below.
    - cron: '17 6 * * 1'

# One live run per ref (push) or per PR (pull_request): a new push cancels the
# run it supersedes instead of queueing beside it.  2026-09-07: fourteen
# development / PR-branch runs were in flight at once, most of them on heads
# that had already been replaced, and had to be cancelled by hand.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Fast tests — no data access needed
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Poetry
        run: pip install poetry
      - name: Install dependencies
        run: poetry install
      - name: Run tests
        env:
          LSMS_SKIP_AUTH: "1"
          # One BLAS thread per worker.  OpenBLAS sizes its pool from `nproc`,
          # NOT from the xdist worker count, so `-n auto` x default threads
          # oversubscribes the runner and dies in `blas_thread_init:
          # pthread_create failed` -- which does not look like a test failure.
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          # One wave build at a time, per the Makefile recipe (AGENTS.md 3b).
          LSMS_BUILD_WORKERS: "1"
        # `--dist=loadfile` keeps one file's tests on one worker: the default
        # `--dist=load` scatters them, so several workers build the same table
        # at once (AGENTS.md, scrum-master addendum 3b).
        #
        # `--timeout` is the point of the pytest-timeout dependency, which was
        # declared and then never configured -- so a test that blocked on the
        # network ran to the 6-hour job limit and was indistinguishable from a
        # slow suite.  600 s is well above the slowest legitimate test and well
        # below anything anyone wants to wait for.
        #
        # `--durations` because this job took 1 h 58 m on 2026-09-13 and
        # nothing in its output said where the time went.
        run: >-
          poetry run pytest -n auto --dist=loadfile
          --timeout=600 --timeout-method=thread
          --durations=25

  # Windows reader smoke.  Nothing else in CI runs on Windows, so this is the
  # only place its defaults are exercised: the cp1252 text encoding, no
  # ``fork`` start method, no process groups, a case-insensitive checkout.
  # Scope is the READER path (install, load every country's config, parse
  # every data_info.yml) -- script-path ``make`` builds are not expected to
  # work on Windows yet.  No secrets: nothing here reads microdata.
  windows-smoke:
    runs-on: windows-latest
    # A hang (first seen: `import lsms_library; Country('Uganda')` sat for an
    # hour) must not run to the 6-hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Poetry
        run: pip install poetry
      - name: Install dependencies
        run: poetry install
      # Separate from pytest so an import-time failure is attributed to the
      # import, not lost inside test collection.
      - name: Import + config smoke
        env:
          LSMS_SKIP_AUTH: "1"
          PYTHONUTF8: "0"
          PYTHONUNBUFFERED: "1"
          PYTHONFAULTHANDLER: "1"
        # dump_traceback_later: if anything blocks, print every thread's
        # stack after 120 s and exit, so a hang names its own location.
        run: >-
          poetry run python -c "import faulthandler, sys; faulthandler.dump_traceback_later(120, exit=True);
          print(sys.version, sys.getfilesystemencoding(), __import__('locale').getpreferredencoding(), flush=True);
          import lsms_library as ll; print('imported', ll.__file__, flush=True);
          c = ll.Country('Uganda'); print('constructed', flush=True);
          print(c.waves, flush=True); print(len(c.data_scheme), flush=True)"
      - name: Collect tests
        env:
          LSMS_SKIP_AUTH: "1"
          PYTHONUTF8: "0"
          PYTHONUNBUFFERED: "1"
          PYTHONFAULTHANDLER: "1"
        run: >-
          poetry run pytest --collect-only -q
          tests/test_windows_portability.py
          tests/test_schema_consistency.py
      - name: Run portability + config tests
        env:
          LSMS_SKIP_AUTH: "1"
          # Deliberately OFF: UTF-8 mode would mask exactly the cp1252
          # decoding this job exists to catch.
          PYTHONUTF8: "0"
          PYTHONUNBUFFERED: "1"
          PYTHONFAULTHANDLER: "1"
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          LSMS_BUILD_WORKERS: "1"
        run: >-
          poetry run pytest -n auto --dist=loadfile
          --timeout=600 --timeout-method=thread
          tests/test_windows_portability.py
          tests/test_schema_consistency.py

  # GH #964 MEASUREMENT, not a gate: can GNU make + Git-for-Windows' sh drive
  # a country-shaped Makefile when invoked from Python the way
  # Country.run_make_target does?  Data-free fixture under
  # scripts/windows_make_probe/.  Runs as the image ships, then after
  # `choco install make`.  Replace with a real gate once #964 settles.
  windows-make-probe:
    runs-on: windows-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe (image as shipped)
        run: python scripts/windows_make_probe/probe.py
      - name: Install GNU make (chocolatey)
        run: choco install make -y --no-progress
      - name: Probe (after choco install make)
        run: |
          $env:PATH = "C:\ProgramData\chocolatey\bin;" + $env:PATH
          python scripts/windows_make_probe/probe.py
      # The conda route: native make + MSYS2 tools from conda-forge, with the
      # runner's own Git / MinGW / chocolatey tools stripped from PATH so the
      # measurement reflects a machine whose POSIX tools come from conda only.
      - uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: false
          miniforge-version: latest
          python-version: '3.11'
          activate-environment: probe
      - name: Install make + m2 tools (conda-forge)
        shell: cmd /C CALL {0}
        run: conda install -y -c conda-forge make m2-bash m2-coreutils m2-findutils
      - name: Probe (conda env, runner Git/MinGW/choco stripped)
        shell: cmd /C CALL {0}
        env:
          PROBE_STRIP: '\Git\,mingw64,chocolatey'
        run: python scripts/windows_make_probe/probe.py

  # DVC remote reachability (GH #750).  Every .dvc sidecar's blob must be on
  # the S3 remote; a sidecar that was `dvc add`ed and never `dvc push`ed is
  # silent until someone needs the file.  scripts/dvc_remote_reachability.py
  # lists the remote once and set-differences the md5s -- no `dvc` CLI, no
  # repo lock -- and exits 1 on any miss.  Runs weekly and on pushes to the
  # integration branches; reader creds only.
  dvc-remote-reachability:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/development' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install boto3 + pyyaml (the script needs nothing else)
        run: pip install boto3 pyyaml
      - name: Configure DVC credentials
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.LSMS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.LSMS_AWS_SECRET_ACCESS_KEY }}
        run: |
          cat > lsms_library/countries/.dvc/s3_creds <<EOF
          [default]
          aws_access_key_id = ${AWS_ACCESS_KEY_ID}
          aws_secret_access_key = ${AWS_SECRET_ACCESS_KEY}
          EOF
      - name: Sweep the remote
        run: python scripts/dvc_remote_reachability.py --out dvc_remote_missing.tsv
      - name: Upload the missing-blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dvc-remote-missing
          path: dvc_remote_missing.tsv
          if-no-files-found: ignore

  # DVC lockfile freshness — detect stale lockfiles and auto-commit fixes.
  # Core library changes (country.py, local_tools.py) dirty every country's
  # lockfile even when outputs are unchanged.  The refresh job uses
  # `dvc commit` to update dep hashes without re-running pipelines.
  dvc-lock-check:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    outputs:
      is_dirty: ${{ steps.check.outputs.is_dirty }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Poetry
        run: pip install poetry
      - name: Install dependencies
        run: poetry install
      - name: Verify DVC lockfiles
        id: check
        env:
          LSMS_SKIP_AUTH: "1"
        run: |
          if poetry run python -m lsms_library.cli refresh-dvc-locks --all --check; then
            echo "is_dirty=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_dirty=true" >> "$GITHUB_OUTPUT"
          fi
        # Don't fail the job — the refresh job below will fix it
        continue-on-error: true

  # Auto-refresh stale DVC lockfiles by updating dep hashes (no pipeline re-run).
  refresh-dvc-locks:
    runs-on: ubuntu-latest
    needs: dvc-lock-check
    if: needs.dvc-lock-check.outputs.is_dirty == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Need a token that can push back to the repo
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Poetry
        run: pip install poetry
      - name: Install dependencies
        run: poetry install
      - name: Refresh lockfile hashes
        env:
          LSMS_SKIP_AUTH: "1"
        run: poetry run python -m lsms_library.cli refresh-dvc-locks --all --commit-only
      - name: Commit and push updated lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lsms_library/countries/*/dvc.lock
          if git diff --cached --quiet; then
            echo "No lockfile changes to commit."
          else
            git commit -m "ci: refresh DVC lockfiles (dep hashes only)"
            git push
          fi

  # Build and deploy documentation to GitHub Pages
  docs:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install mkdocs-material 'mkdocstrings[python]'
      - name: Build docs
        env:
          LSMS_SKIP_AUTH: "1"
        run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

  # Full data tests — builds Uganda tables and runs invariance checks
  data-tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/separate_data')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Poetry
        run: pip install poetry
      - name: Install dependencies
        run: poetry install
      - name: Configure DVC credentials
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.LSMS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.LSMS_AWS_SECRET_ACCESS_KEY }}
        run: |
          cat > lsms_library/countries/.dvc/s3_creds <<EOF
          [default]
          aws_access_key_id = ${AWS_ACCESS_KEY_ID}
          aws_secret_access_key = ${AWS_SECRET_ACCESS_KEY}
          EOF
      - name: Build Uganda tables
        run: |
          cd lsms_library/countries/Uganda/_
          poetry run make -j2
        timeout-minutes: 30
      - name: Run full test suite
        run: poetry run pytest --tb=short
