        role: exclusion_evidence
        rows:
          - {code: 33, preferred: Crustaceans, raw_label: 'crustaceans (snails,lobsters,crabs,prawns)', line: 33}
    constraints:
      - Keep Snail and Crustaceans outside the group, as well as every fish item.
      - Do not infer that either modern member is fresh; preservation is unspecified.
    caveats:
      - >-
        Species, edible yield and preparation can differ. The joint label is
        interpretable but does not establish similar loadings or sufficient
        combined support. Historical Crustaceans explicitly includes snails.

