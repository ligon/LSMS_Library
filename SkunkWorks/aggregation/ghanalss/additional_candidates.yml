country_context:
  path: lsms_library/countries/GhanaLSS/_/CONTENTS.org
  sha256: 6d0f77d98fe98caebfd9ad0a58e9b19268f36aa632eddb52bc7830a7a09fac15
  idiosyncrasies:
    - >-
      Lines 1646-1677 describe six diary-supported five-day recalls in GLSS7:
      a wave total covers 30 days inside a 35-day cycle.
    - >-
      Lines 1679-1709 document that Section 9B mixes food and nonfood; Code_9b
      coverage performs the food selection. A module position is not semantic
      authority to add nonfood items to the estimation basket.
    - >-
      The correction at lines 3324-3342 states that historical wave Aggregate
      columns are not live and the country FCT crosswalk does not define the
      delivered item partition. Neither supplies approval for these groups.
  contradictions_found: []
  documentation_review: >-
    The country notes, including Open items and relevant dated corrections,
    were read before the source-table review. No TODO/WAITING/LOGBOOK entry
    supplies an additional aggregation decision. The source cautions below
    are qualifications for future curation, not reasons to dismiss the notes.
whole_group_rules:
  - >-
    Consider each listed set as a complete proposal. No pairwise chaining,
    automatic addition of an Other category, or union with another candidate
    is authorized. Recheck the full fine-member set whenever membership changes.
  - >-
    Members of these additional sets are disjoint from each other and from the
    existing nine sets. Display names must remain unique in the full partition.
  - >-
    Approved semantic scope below covers only these exact complete sets and their
    recorded definitions. Membership or source changes reopen that review. Store
    the accepted policy digest with an evaluated partition. Statistical evidence
    remains a separate publication requirement; a fit cannot resolve a documentary
    ambiguity about what an item measures.
  - >-
    Similar product names or older joint questionnaire entries do not imply
    similar betas, common error variances, or low aggregation cost. An
    unidentified sparse-item beta remains unknown after semantic review.
experiment_reservations:
  normalization_anchor: Salt
  prediction_targets: [Onion, Egg]
  overlapping_candidates:
    onion_shallot: [Onion]
  handling: >-
    Onion/shallot remains a semantic candidate. It must not enter score
    construction in the predeclared experiment that holds Onion out. A separate
    comparison can hold out the complete proposed group; merging the predictor
    with the reserved target after declaring that experiment would change it.
    No other proposal below touches Salt, Onion or Egg.

groups:
  - id: fish_fresh_frozen_named
    label: Fish (kapla/tilapia, fresh or frozen)
    members: [Kapla, Tilapia]
    semantic_scope:
      status: approved
      waves_with_members: ['2016-17']
      within_wave_merge_waves: ['2016-17']
      own_production: No mapping for either exact member in any wave; total adds no new source rows.
      country_wide_obstruction: null
    reason: >-
      Both purchase labels explicitly identify fresh/frozen fish, distinguished
      here by species. This extends the search beyond the existing smoked-fish
      candidate while retaining the preservation boundary.
    positive_households: {Kapla: 3018, Tilapia: 833}
    evidence:
      - source: glss7
        code_column: Code_9b
        rows:
          - {code: 149, preferred: Kapla, raw_label: 'Kpala (Starvids) frozen', line: 116}
          - {code: 160, preferred: Tilapia, raw_label: 'Tilapia (fresh and frozen)', line: 127}
      - source: glss3
        code_column: Code_8h
        role: exclusion_evidence
        rows:
          - {code: 69, preferred: 'Fish (fresh and frozen)', raw_label: 'Fish & Shellfish', line: 387}
    constraints:
      - Exclude smoked, dried, salted, fried and processed fish and all shellfish.
      - >-
        Do not add Fish, Other Fish or Fish (fresh and frozen) from earlier waves
        by name. The old production mapping for the latter also covers Fish &
        Shellfish; an all-wave or total-value extension requires separate review.
    caveats:
      - >-
        The Tilapia label already combines fresh and frozen. Species, sourcing,
        quality and prices can still differ from the explicitly frozen Kapla.

  - id: crab_shrimp
    label: Crab and shrimp
    members: [Crab, Shrimp]
    semantic_scope:
