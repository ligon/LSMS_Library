# HISTORICAL (PR #937, 2026-09-16): this review was made on the WAVE vocabulary
# that reached the API before PR #935 applied the wave->country crosswalk.
# Two members are spelled as leaked wave labels and no longer exist on the
# served axis: 'Milk (tinned, condensed)' is the country label
# 'Milk (tinned, condensed/unsweetened)', and 'Pepper (dried, red)' is
# 'Pepper (dried)'.  The candidates were carried into proposed_groups.yml
# (schema_version 2) on the corrected spellings and gated there; this file
# is kept for its source-row evidence and sha256 provenance only.
schema_version: 1
country: GhanaLSS
status: draft
author: Sue
date: '2026-09-16'
source_revision: 8715d8a943aec66d9d5ecd054e5ee76f05b70c4b
purpose: >-
  Additional exact-member candidates after reviewing all 233 delivered
  Preferred labels. These extend the five groups and four deferred alternatives
  in proposed_groups.yml; none is a statistical approval or a live mapping.
default: Keep every item not selected in an evaluated group as its own singleton.
scope:
  reviewed_waves: ['1987-88', '1988-89', '1991-92', '1998-99', '2005-06', '2012-13', '2016-17']
  expenditure_bases: [purchased, total_recorded_value]
  review_kind: semantic_scope_only
  reviewer: Sue
  review_date: '2026-09-16'
  statistical_approval: false
  exact_members_only: >-
    Every purchase and own-production mapping for each exact member was reviewed
    across all seven waves. A member can be absent in a wave, or a group can only
    rename one existing label there. Neither requires adding a generic historical
    label outside the proposed set. All such outside labels retain their identity.
  historical_evidence: >-
    Earlier source rows determine the meanings already inside these exact members.
    They are not evidence that betas, survey errors or recall periods are stable
    across waves. Code_12A/12B are purchase/own-production columns in GLSS1/2;
    Code_9b/8h serve those roles in GLSS3-7.
  total_basis_review: >-
    An item with only purchase mappings adds no new semantic content on the total
    recorded-value basis. Only Onion and Coconut (fresh) among the proposed members
    have own-production mappings. Their complete rows are included below. Reviewing
    a mapped production code does not assert that its amount is currently emitted
    in every wave; GLSS3's own-production amounts are not wired in the current API.
  primary_empirical_comparison: 2016-17 household wave-total purchased amounts
