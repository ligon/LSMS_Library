      country_wide_obstruction: null
    reason: >-
      Two separately named crustacean foods form a bounded candidate, without
      adding fish or the heterogeneous historical Crustaceans item.
    positive_households: {Crab: 555, Shrimp: 218}
    evidence:
      - source: glss7
        code_column: Code_9b
        rows:
          - {code: 150, preferred: Shrimp, raw_label: Shrimps, line: 117}
          - {code: 152, preferred: Crab, raw_label: Crab, line: 119}
      - source: glss5
