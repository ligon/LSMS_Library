          - {code: 48, preferred: 'Milk (tinned, condensed)', raw_label: 'tinned milk (condensed)', line: 48}
    documentary_evidence:
      - document: glss7_module_b
        paragraph_index: 21432
        heading: 'Evaporated Milk (e.g. Ideal, Peak etc.)'
        codes: [301, 302, 303, 304, 305, 306]
      - document: glss7_module_b
