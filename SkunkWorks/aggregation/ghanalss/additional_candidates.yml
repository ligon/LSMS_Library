other_items_kept_separate:
  - members: [Cocoa Powder, 'Cocoa (milk powder beverages)', Chocolate Drink]
    reason: >-
      Cocoa Powder changes meaning: GLSS5 Code_9b 130 says chocolate drinks
      (including milo,bournvita etc), while GLSS7 code 551 says Pure Cocoa Powder
      (eg. Brown gold). The GLSS7 beverage set includes Cow bell (coffee, choco
      etc.) at code 555. This is not a stable all-wave cocoa commodity.
    evidence: ['glss5:107', 'glss7:272', 'glss7:275']
  - members: ['Milk (powder)', 'Milk (powdered)', Baby Milk]
    reason: >-
      Do not treat spelling similarity as a complete milk-powder definition.
      GLSS5 maps both milk powder (code 45) and baby milk (code 46) to Milk
      (powdered). Infant formula needs explicit review before a powder pool.
    evidence: ['glss5:43', 'glss5:44']
  - members: [Egg, Other Eggs]
    reason: >-
      A joint egg group would be a cross-wave question and would touch the
      reserved Egg target. In GLSS7, codes 416 and 417 already deliver both
      chicken and other eggs as Egg, so this adds no within-wave candidate.
    evidence: ['glss7:175', 'glss7:176']
  - members: [Tomato Puree, 'Tomato (paste)', 'Tomato (fresh)', Tomato]
    reason: >-
      Puree/paste terminology warrants a cross-wave review, but Tomato Puree
      is not a separate GLSS7 delivered item. Fresh versus concentrated tomato
      remains a processing distinction; no new broad tomato group is proposed.
  - members: [Salt]
    reason: No additional semantically narrow salt group was identified; it remains unmerged.
