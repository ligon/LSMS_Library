      - source: glss7
        code_column: Code_8h
        rows:
          - {code: 26, preferred: 'Coconut (fresh)', raw_label: '26. Coconut', line: 185}
    constraints:
      - Exclude Oil (coconut), other nuts/seeds and generic Coconut from earlier waves.
      - >-
        Applying the group in 2005-06 and 2012-13 only renames Coconut (fresh),
        whose purchase and production sources say coconut without a form.
    caveats:
      - >-
        Drying can change culinary use, concentration, storage and purchasers.
        The source establishes the common food identity, not interchangeable
