# Sampling record -- does `v` denote the same cluster as in the PRECEDING wave of
# `Country('Benin').waves`?  The design fields are #793's curation and are not
# written yet; their absence here is "not curated", not "not found".  Read by
# `lsms_library/sampling.py`.  Vocabulary: see sampling.py.  Modelled on
# Togo/_/sampling.yml.  The first wave has no preceding wave and so no entry.

Sampling:

  '2021-22':
    panel:
      household_continuity: rotating-panel
      cluster_id_continuity: stable
      cluster_id_note: |-
        `grappe` in both waves, and the BID says "The 2021/22 survey is a panel survey by
        cluster".  Measured on the raw covers: all 670 grappes recur; region and milieu
        agree 670/670; the 2021-22 point equals the 2018-19 fix to the last digit on all
        670 (0.0 km).  `rotating-panel` records the DESIGN: the BID has the 12 households of
        2018/19 surveyed if found and the cluster completed otherwise.  The library serves
        NO household link across this boundary yet: 2021-22's `i` is `E2_`-prefixed (GH #1697).
        The 6,878 recurring keys with PanelHH = Panel agree with their 2018-19 head at
        real-link level (_/CONTENTS.org, "2021-22 wired"), and the link is ruled (2026-11-12,
        "Make Benin a panel country") for a follow-up PR with its own verification, GH #1705.
      source_type: local-documentation
      confidence: high
      source_file: 'lsms_library/countries/Benin/2021-22/Documentation/ben_ehcvm2_information_de_base_eng.pdf'
      locator: 'section 4.1 "Household and Community Components", PDF pp. 14-15; measured on s00_me_ben2021.dta, s00_me_ben2018.dta and grappe_gps_ben2018.dta through get_dataframe, 2026-11-04'
