# Derivations -- served numbers in this country's tables that are NOT survey
# answers but CONSTRUCTIONS from raw answers.  One entry per registry key,
# `country::table::name`; the same key sits in the served table's
# `Derivation` column on every row it produced.  Loader and field contract:
# lsms_library/derivations.py.  Design: SkunkWorks/derived_values.org.
#
# Sibling of population.yml and recall.yml: a .yml here moves no cache hash.

Benin::food_acquired::7day-purchase-at-last-purchase-unit-value:
  waves: ['2018-19', '2021-22']
  columns: [Expenditure]
  rows: {s: purchased}
  rule: >-
    Expenditure = Quantity * (s07bq08 / s07bq07a), where Quantity is the row's
    own served purchased quantity, (s07bq03a - s07bq04 - s07bq05).clip(lower=0)
    -- the 7-day consumption net of own production AND of gifts received, which
    is the survey's own accounting identity -- and s07bq08 / s07bq07a is the
    unit value of the household's LAST PURCHASE of the item.  NaN where
    s07bq07a is missing or not positive, and NaN where the last purchase was
    made in a different unit from the consumption unit (s07bq07b/s07bq07c vs
    s07bq03b/s07bq03c): no EHCVM wave ships a unit-conversion table, so there
    is no exact conversion and NA is the honest answer.  Units are compared on
    the EHCVM numeric code where the label carries one, else on the label with
    case, accents, padding and punctuation folded -- the two variables carry
    DIFFERENT value-label sets inside the same .dta.  Before GH #876 the served
    Expenditure was s07bq08 itself: the value of one purchase of unrecorded
    size made up to 30 days earlier, beside a 7-day quantity.
  function: lsms_library.ehcvm:derive_ehcvm_purchase_value
  inputs: lsms_library.countries.Benin.2018-19._.mapping:inputs_food_acquired
  raw_variables: [s07bq03a, s07bq03b, s07bq03c, s07bq04, s07bq05, s07bq07a,
                  s07bq07b, s07bq07c, s07bq08]
  assumptions:
    - text: >-
        the unit value of the last purchase is the price the household paid
        over the 7-day consumption window.  s07bq08 is the value of ONE
        purchase, which s07bq06 places up to 30 days back, while s07bq03a is
        the quantity consumed over 7 days -- one row, two clocks.
      basis: variable-label
      evidence: >-
        Stata labels in s07b_me_ben2018.dta: s07bq08 "7B.08. Valeur (en FCFA) du [PRODUIT]
        achete la derniere fois"; s07bq03a "7B.03a. Qtite tot du [PRODUIT]
        conso par le MEN au cours des 7 derniers jours"; s07bq07a "7B.07a.
        Quelle est la quantite du [PRODUIT] achete la derniere fois?"
    - text: >-
        a last purchase reported in a different unit from the consumption is
        NOT converted, and a row with no last purchase has no unit value to
        apply: the row is served with Expenditure NA. Counts are on the SERVED
        denominator -- purchased rows of the delivered table, after the
        canonical reshape and the (t, v, i, j, u, s) collapse -- because that
        is the number a user sees; the source-row counts are smaller and were
        what an earlier version of this entry quoted. 2018-19: 14,334 of the
        147,149 SERVED purchased rows (9.7%) -- 6,451 because no last purchase
        was reported at all (s07bq08 or s07bq07a missing / not positive),
        4,143 because the last purchase used a different unit CODE, 3,740
        because it used the same code in a different SIZE (Petit / Moyen /
        Grand / Taille unique), which is a different container and so a
        different price per unit.  2021-22: 16,429 of the 156,999 SERVED purchased rows
        (10.5%).  On source rows with a purchased quantity, 16,467 of 157,826: 11,289 with
        no last purchase, 4,037 in a different unit code, 1,141 in the same code at a
        different size.
      basis: variable-label
      evidence: >-
        no EHCVM wave distributes a unit-conversion table;
        lsms_library/categorical_mapping/ehcvm_units.org is a code->label
        codebook with no factors
    - text: >-
        the quantity multiplied is the SURVEY'S OWN accounting identity,
        (s07bq03a - s07bq04 - s07bq05).clip(0) -- construction "C", chosen by
        @ligon on 2026-09-12 because it is the only one of the three candidates
        ehcvm_conso reproduces.  The alternatives, measured, are A = the gross
        7-day consumption s07bq03a (which would put the value of own-produced
        and gifted food into Expenditure) and B = net of own production only.
        2018-19: A 75,023,618, B 73,221,530, C (served) 68,929,997 FCFA, against a raw s07bq08 total of 87,287,927.
        2021-22: A 94,742,444, B 92,634,171, C (served) 82,870,829 FCFA, against a raw s07bq08 total of 111,687,482.
      basis: modelling-choice
      evidence: SkunkWorks/derived_values.org; GH #876; measured 2026-09-12
    - text: >-
        the gift quantity s07bq05 is served as its own s = 'inkind' row, in the
        consumption unit s07bq03b, with Expenditure NA.  EHCVM asks no value for
        a gift.  UEMOA's depan(Don) is s07bq05 priced at this same last-purchase
        unit value -- verified, and therefore demonstrably an imputation by the
        people who built the aggregate rather than an answer anybody gave -- so
        it is checked and not served.  Own production keeps the identical
        treatment it already had (s = 'produced' from s07bq04, Expenditure NA).
        2018-19: 18,632 inkind rows carrying 53,318 units, 0 with an Expenditure.
        2021-22: 27,522 inkind rows carrying 77,695 units, 0 with an Expenditure.
      basis: modelling-choice
      evidence: SkunkWorks/derived_values.org; GH #876; measured 2026-09-12
  validated_against: >-
    the product-level check against ehcvm_conso does not run for this wave: its
    conso codpr does not share a keyspace with s07bq01 here, and CotedIvoire
    2018-19 distributes no conso file at all.  The construction is validated on
    the two waves where the join works -- Togo 2018 and Guinea-Bissau 2018-19 --
    in which it reproduces depan(Achat) within 1% for 99.5% / 100% of the rows
    where the candidates differ, against 13.1% / 48.6% for the
    own-production-only residual and 0.0% / 0.0% for the gross 7-day quantity;
    s07bq05 * uv reproduces depan(Don) for 99.7% / 100%, which is why the gift
    rows are served with Expenditure NA rather than with that imputation.  The
    instrument is the same in all twelve waves (identical s07bq0* Stata
    labels), so the reading carries by inference, not by measurement here.
    2021-22, ehcvm_conso_ben2021.dta, whose codpr does share s07bq01's codes: on the 1,245
    (household, product) rows where the candidates differ and an Achat row exists, the rule
    x 365/7 is within 1% of depan(Achat) for 90.6%, against 22.6% for the own-production-only
    residual and 0.3% for the gross quantity; s07bq05 * uv is within 1% of depan(Don) for
    90.6% of 14,014 rows; median ratio over all 141,359 joined rows 1.0.  THIS VALIDATES THE
    ARITHMETIC, NOT THE QUANTITY: a rescaled s07bq03a would pass it, as Togo 2021-22's does.
    What says this quantity is not rescaled is its own grid and q3/q4 mode, in
    _/CONTENTS.org, "2021-22 wired".
  contents: 'Benin/_/CONTENTS.org, "food_acquired: one row, two windows (GH #876)"'
  since: '2026-09-12'

Benin::community_prices::one-item-per-price:
  waves: ['2018-19']
  columns: [Quantity]
  rule: >-
    Quantity = 1 on every served community_prices row, in the row's own
    unit-size `u`.  s05_co_ben2018.dta records, per (grappe, product s05q01,
    unit-size s05q02), two prices -- s05q03 -> obs 1 and s05q04 -> obs 2 -- and
    NO quantity.  The form prices one item of the selected unit-size, so the
    quantity a price was recorded for is one `u` by construction of the form,
    not by any answer.  Price is served as recorded; nothing is divided,
    rescaled or converted, and no size is collapsed.
  function: lsms_library.countries.Benin.2018-19._.mapping:derive_s05_one_item_per_price
  inputs: lsms_library.countries.Benin.2018-19._.mapping:inputs_community_prices
  raw_variables: [grappe, vague, Existe, s05q01, s05q02, s05q03, s05q04]
  assumptions:
    - text: >-
        each recorded price is the price of ONE item of the selected unit-size.
        The held community workbooks, whose cover is REPUBLIQUE DU BENIN /
        INSAE, list in sheet SEC5_PRIX one row per (product, unit, size) with
        the columns "Relevé 1 Prix" and "Relevé 2 Prix" and no quantity column.
        Benin's CAPI price form has, per product present in the market, a
        multiple choice of at most six unit-sizes (5.02) and, per selected
        unit-size, 5.03 and 5.04, both NUMERIC: INTEGER, validated as multiples
        of 5 and above 0.  There is no quantity question.
      basis: questionnaire
      evidence: >-
        Held 2018-19/Documentation/ben_ehcvm1_qnr_community_excel_vague{1,2}.xls,
        sheet SEC5_PRIX.  UEMOA regional catalogue entry 44,
        https://phmecv.uemoa.int/nada/index.php/catalog/44/download/123 and
        /download/124 (BEN-EHCVM1-QNR-PRIX-CAPI-VAGUE1 / VAGUE2; not held).
    - text: >-
        the distributed prices are served as recorded, including the 19 s05q03
        and 12 s05q04 values that are not integers.  The instrument accepted
        only integers that are multiples of 5, so those values were produced
        after collection, by a mechanism no held document describes; they are
        taken to be per one item like the rest and are neither reversed nor
        flagged.
      basis: modelling-choice
      evidence: Benin/_/CONTENTS.org, "2018-19 community prices are wired (GH #1226)"
  validated_against: >-
    the instrument only.  No held file records the quantity behind a price, so
    the one-item reading cannot be checked against data.
  contents: 'Benin/_/CONTENTS.org, "2018-19 community prices are wired (GH #1226)"'
  since: '2026-11-04'

Benin::crop_production::hh-crop-sale-single-row:
  waves: ['2021-22']
  columns: [Quantity_sold, Unit_sold, Value_sold]
  rule: >-
    s16d records a sale for the household and crop, with no plot.  A sale is a
    record with a positive s16dq05a or s16dq06, after the file's exact repeats are
    removed.  Where the household has exactly one s16c row for the crop, the sale is
    served on that row: Quantity_sold = s16dq05a, Unit_sold = s16dq05b, Value_sold =
    s16dq06, as recorded, and that row carries this key.  What is derived is the
    ATTACHMENT, not the numbers.  Any other sale is served on one row of that household
    and crop with plot_id = 'Farm-level' and no key, because its index value already
    discloses it.  No sale is split, summed, scaled or dropped.  This key shares a row
    with harvest-to-date through derivations.MULTI_SEP, in sorted order.
  function: lsms_library.ehcvm:derive_hh_crop_sale_attachment
  inputs: lsms_library.countries.Benin.2021-22._.mapping:inputs_hh_crop_sale
  raw_variables: [s16cq02, s16cq03, s16cq04, s16dq01, s16dq04, s16dq05a, s16dq05b, s16dq06]
  assumptions:
    - text: >-
        s16d asks the sale once per crop, with no plot, and s16c records no sale.  Where
        the household has one harvest row for the crop, no other row can hold the sale.
        The sale is NOT thereby a share of that row's Quantity, and it may be in another
        unit: Unit_sold says which.
      basis: variable-label
      evidence: >-
        s16d_me_ben2021.dta has no field or parcel variable; s16dq05a "16D.05a. Quelle
        est la quantite de ce produit qui a deja ete vendue ?"; s16dq06 "16D.06. Quel a
        ete le montant tire de la vente de ce produit?".  s16c_me_ben2021.dta carries
        s16cq02 and s16cq03 and no sale variable.
    - text: >-
        a sale of a crop on two or more rows is not allocated among them, since any split
        would be invented.  It stays with the household and crop on a Farm-level row,
        with u = 'Unknown', where gross_crop_revenue and median_price_valuation can read
        it.  That row has no harvest Quantity.
      basis: modelling-choice
      evidence: >-
        ruling @ligon 2026-11-03, option (d), GH #824, for Mali 2021-22 and applied here
        by the brief of GH #1697 (split from #552); the Farm-level convention in lsms_library/data_info.yml.
    - text: >-
        identical s16d lines are one record.  The export repeats a crop's record once
        per harvest line: 627 of 8,328 rows are exact repeats, 392 of them sales, and
        no (household, crop) has two different records.
      basis: modelling-choice
      evidence: measured 2026-11-04; the same artefact as Niger 2021-22, GH #824
    - text: >-
        s16d's crop is matched to s16c's BY CODE.  s16dq01 labels only codes 1-47 and 65, so
        its 1,089 rows of codes 51-64, 919 of them Soja, have no label, and it spells codes
        42 and 65 otherwise than s16cq04.  On the codes every one of the 7,701 s16d pairs
        finds an s16c row; on the labels 1,098 do not.
      basis: variable-label
      evidence: value labels of s16dq01 and s16cq04 in the two files; measured 2026-11-04
  validated_against: >-
    tests/test_benin_2021_wave.py, whose oracle reads s16c and s16d directly.  Not
    validated against an external total: no document here reports one.
  contents: 'Benin/_/CONTENTS.org, "2021-22 wired"'
  since: '2026-11-04'

Benin::crop_production::harvest-to-date:
  waves: ['2021-22']
  columns: [Quantity]
  rule: >-
    Identity on a row whose harvest is not finished and which records a quantity: s16cq11
    = Non with s16cq16a.  The value is served as recorded.  The key names its WINDOW: the
    question asks the quantity ALREADY harvested, so the row covers a part of the season
    under a column that otherwise means all of it.  A row with no recorded quantity
    carries no key.
  function: lsms_library.ehcvm:derive_harvest_to_date
  inputs: lsms_library.countries.Benin.2021-22._.mapping:inputs_harvest_to_date
  raw_variables: [s16cq11, s16cq12, s16cq16a, s16cq16b]
  assumptions:
    - text: >-
        the recorded quantity on an unfinished row is what has been harvested so far, and
        not the season.  324 of the 970 unfinished rows record one, a median 50% of the
        area still to harvest; the instrument sends a crop with 100% left to the next crop.
      basis: variable-label
      evidence: >-
        s16c_me_ben2021.dta s16cq16a "16C.16a. Quantite deja recoltee pour la presente
        campagne 2021/22?", s16cq11 "16C.11. Avez vous fini la recolte de cette culture?",
        s16cq12 "16C.12. Quel pourcentage de la superficie vous reste-t-il a recolter?"
  validated_against: >-
    tests/test_benin_2021_wave.py, whose oracle reads s16c directly.  An identity has
    nothing to validate but its rows.
  contents: 'Benin/_/CONTENTS.org, "2021-22 wired"'
  since: '2026-11-04'

Benin::crop_production::harvest-from-dispositions:
  waves: ['2021-22']
  columns: [Quantity, u]
  rule: >-
    Where every s16c row of a household's crop answers s16cq11 = Oui, none records
    s16cq16a, and the positive s16d quantities s16dq02a (consumed), s16dq03a (given),
    s16dq05a (sold) and s16dq13a (in stock) all state one unit, Quantity is their sum and
    u that unit.  It goes on the crop's single s16c row, or for two or more rows on the
    crop's one plot_id = 'Farm-level' row, created if no sale made it, and is never split
    among plots.  A crop whose dispositions span units, a crop with none, a crop with a
    recorded quantity and a crop with an unfinished row all stay as recorded.  This key
    shares a row with hh-crop-sale-single-row through derivations.MULTI_SEP, in sorted order.
    It extends Mali's ruled derivation, Mali::crop_production::harvest-from-dispositions, to
    this wave (ruling @ligon 2026-11-12, "Extend Mali's derivation"); GH #1437 stays open.
  function: lsms_library.ehcvm:derive_hh_crop_harvest_total
  inputs: lsms_library.countries.Benin.2021-22._.mapping:inputs_harvest_from_dispositions
  raw_variables: [s16cq04, s16cq11, s16cq16a, s16dq01, s16dq02a, s16dq02b, s16dq03a, s16dq03b,
                  s16dq05a, s16dq05b, s16dq13a, s16dq13b]
  assumptions:
    - text: >-
        this extends Mali's ruled derivation, Mali::crop_production::harvest-from-dispositions
        (ruling @ligon 2026-11-04, option (b) of GH #1437), to Benin 2021-22, whose file has
        Mali's shape: s16cq16a is on 381 of 8,934 crop rows and 57 of the 7,964 finished ones.
        The same rule, the same shared function and the same hold-outs; only the file differs.
        The extension is itself ruled (@ligon 2026-11-12, "Extend Mali's derivation").  Why
        s16cq16a is blank is not answered by it: GH #1437 stays open.
      basis: modelling-choice
      evidence: >-
        ruling @ligon 2026-11-12, "Harvest from dispositions in Benin / Cote d'Ivoire 2021-22",
        option "Extend Mali's derivation (Recommended)"; Mali/_/derivations.yml; GH #1437 (open)
    - text: >-
        a finished harvest was consumed, given, sold or stored, so the four dispositions
        add up to it.  The instrument asks the quantity of a finished harvest and the file
        lacks it on 7,907 of 7,964 finished rows, a fielded skip or a release loss.
      basis: questionnaire
      evidence: >-
        ben_ehcvm2_qnr_men_excel_vague1.pdf, PDF p. 87: "(16C.11) Avez vous fini la recolte de
        cette culture? 1 = Oui >(16C.16)", and 16C.16 on p. 88.  Inside this wave the only test
        is small: on the 19 finished pairs with a recorded quantity and dispositions in that unit,
        9 are exact and 10 within 10%, median 1.0, p10 0.16, p90 2.13; on 128 unfinished pairs, 67
        exact.  Benin 2018-19 holds the harvest and all four dispositions on one row (s16cq12a;
        s16cq13a, s16cq14a, s16cq16a, s16cq22a).  Selection: finished rows with every positive
        disposition in the harvest's unit, 5,175, after decoding both of the code lists its unit
        variables use by vague (a comparison by label reads vague 1 alone, 2,920 rows, 79.1% exact;
        by code mostly vague 2, 1,738, 92.1%).  The sum equals the harvest exactly on 84.2%, within
        10% on 87.2%, median ratio 1.000, 5.8% over 1.1 and 7.0% under 0.9; over the 3,572 metric
        rows the kg totals differ by a ratio of 0.900.  This is consistency within a row, and a
        respondent may anchor on the harvest just stated.
    - text: >-
        not all of a harvest need appear: s16d asks no quantity for seed kept, loss after
        harvest or animal feed, so the sum can fall short of what was cut.  Not sized.
      basis: modelling-choice
      evidence: s16d_me_ben2021.dta variable labels
    - text: >-
        units are not converted: no factor exists.  2,009 finished crops span two or more
        units and stay NA.  Quantities in one unit are added across states: 132 of the 5,237
        derived crops state two of Grain, Epis/Panicules/coques and N/A in that unit, and those
        fold to different `condition` tokens, 130,580 of the 45,285,173 kg on metric-named units,
        0.3%.  They are served under `unknown_condition`, and nothing is held out.
      basis: modelling-choice
      evidence: ruling @ligon 2026-11-04, option (b) of GH #1437, for Mali and Burkina Faso; variables s16dq02c, s16dq03c, s16dq05d, s16dq13c
    - text: >-
        the sum is as good as its lines, and it inherits the file's large values.  It is not
        trimmed and no pair is held out for this, so the total is not a statistic: the top four
        rows hold 75.5% of 2021-22's kg, as four rows hold 54.5% of 2018-19's.  2021-22's four are
        `Tonne` rows that read as kilograms: cotton 5,800, 2,050 and 20,000, whose sold lines price
        at 0.28, 0.13 and 0.03 FCFA per kg as tonnes, and maize 6,400, stock only.  Site Q names all
        four.  Without each wave's top four the totals are 11,119,658 and 15,212,707 kg, 2,521 and
        2,527 kg per row with a kilogram figure.
      basis: modelling-choice
      evidence: >-
        measured 2026-11-05 from s16c and s16d.  As kilograms the sold lines price at 275, 129 and
        26.5 FCFA per kg, against a median of 260 on Tonne lines under 100; on the 5,800 and 2,050
        rows s16dq05c (275, 130) is the implied price and not a weight.  Pure-stand median kg/ha,
        2018-19 recorded / 2021-22 derived, one crop row on the plot and served Area over 0.01 and at
        most 100 ha: maize 1,165 / 958, cotton 1,247 / 1,212, sorghum 794 / 700, yam 3,148 / 2,299,
        rice 1,625 / 1,722, groundnut 1,161 / 1,000, all crops 1,200 / 976.  Any rule for these
        lines belongs in its own issue.
    - text: >-
        a crop with an unfinished row is held out (857 pairs, 201 of them one-unit), because
        its dispositions cover what is harvested so far.  A crop with a recorded quantity is
        held out (29 of the finished one-unit pairs), because a recorded harvest is not
        overridden and a Farm-level total beside it would count it twice.
      basis: modelling-choice
      evidence: GH #1437
  validated_against: >-
    tests/test_benin_2021_wave.py, whose oracle reads s16c and s16d directly.  Cold build of
    2021-22: 5,237 keyed rows, 4,982 on the single s16c row and 255 Farm-level.  Not validated
    against an external total: no document here reports one.
  contents: 'Benin/_/CONTENTS.org, "2021-22 wired"'
  since: '2026-11-04'

Benin::sample::region-milieu-stratum:
  waves: ['2018-19', '2021-22']
  columns: [strata]
  rows: {}
  rule: >-
    strata = '<s00q01 label> <s00q04 label>', the department and residence
    milieu recorded on each wave's household cover, s00_me_ben2018.dta and
    s00_me_ben2021.dta. Strip each label and join with one space; NA where
    either is missing or blank. Nonstring codes are refused. Preserve the
    native labels without a geographic crosswalk or a fallback to the former
    department-only value. The 2021-22 weights file's own `strat` is not read.
  function: lsms_library.ehcvm:derive_region_milieu_stratum
  inputs: lsms_library.countries.Benin.2018-19._.mapping:inputs_strata
  raw_variables: [s00q01, s00q04]
  assumptions:
    - text: >-
        the original 2018/19 design stratum combines department and residence
        milieu. The second-edition BID explicitly describes that original
        draw; 2021/22 revisits its clusters, so its households carry their
        clusters' strata. 2018-19 was wired on 2026-11-10; 2021-22 on
        2026-11-12, by the ruling "Same rule as #1575".
      basis: questionnaire
      evidence: >-
        Own INStaD Basic Information Document (survey design documentation,
        not a questionnaire item), September 2023,
        2021-22/Documentation/ben_ehcvm2_information_de_base.pdf, section 4.1,
        PDF p.13 (English edition p.14): "La strate est la combinaison
        département/milieu de résidence." GH #1575; approved 2026-11-10.
        Extended to 2021-22 by ruling @ligon 2026-11-12, "Same rule as #1575
        (Recommended)", which also records the weights file's `strat` as a
        comparison and not the served value (Benin/_/CONTENTS.org, 2026-11-12).
    - text: >-
        the own DDI's planned 23 explicit strata and purely urban Littoral
        describe the design, not a rule for pruning recorded rows or forcing
        an observed count. Missing operands remain NA. Household and cluster
        identity, weights and Rural retain their existing construction.
      basis: questionnaire
      evidence: >-
        Own 2018-19/Documentation/ddi-documentation-english_microdata-4291.pdf,
        Sampling Procedure, PDF p.4; Benin/_/CONTENTS.org preserves the
        cluster-split wording tension separately from this construction.
  validated_against: >-
    Documentary definition and static wiring only; actual-row validation UNRUN.
    No observed stratum count, native missingness, cluster consistency or
    cold/warm Country/Feature acceptance is claimed here. (That sentence is the
    2026-11-10 construction stage; see CONTENTS.org for its completed validation.)
    2021-22, extended 2026-11-12: a cold sample() in a private root serves a
    stratum on all 8,032 households, from this wave's own cover, the key on
    every one, no grappe holding two strata, the department part equal to
    cluster_features.Region and the milieu part to Rural on every grappe, and
    v, Rural and both weights unchanged from the wiring before the extension;
    tests/test_benin_2021_wave.py re-derives the served value from the inputs.
    Not validated against the weights file's own `strat`, which is department
    x visit, not a stratum of this construction (Benin/_/CONTENTS.org).
  contents: 'Benin/_/CONTENTS.org, "2018-19 department x milieu strata wiring (GH #1575)"'
  since: '2026-11-10'
