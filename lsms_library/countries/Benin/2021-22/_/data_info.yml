Country: Benin
Wave: 2021-22

# EHCVM-2 (WB 6272).  Read _/CONTENTS.org "2021-22 wired" first.  What shapes every
# block here:
#   - `i` is `E2_<grappe><menage:03d>`, by mapping.i: no link to 2018-19 is served
#     (GH #552), so the ids must not be able to meet;
#   - variable names survive where meanings do not: compare labels, not names;
#   - the files are full grids where 2018-19's held only the answered lines, and s01
#     and s04a carry 6,138 people who have left, with only why and when they left.

sample:
    dfs:
        - df_cover
        - df_weights
    df_cover:
        file: s00_me_ben2021.dta
        idxvars:
            v: grappe
            i:
                - grappe
                - menage
        myvars:
            # GH #812: region only.  2018-19's strata became department x milieu under
            # GH #1575, ruled for 2018-19 only, so the two waves now differ:
            # _/CONTENTS.org, 2026-11-12.  The weights file's `strat` (24 region x
            # milieu cells) is not read.
            strata: s00q01
            Rural:
                - s00q04
                - mapping:
                    Rural: Rural
                    Urbain: Urban
    df_weights:
        # One row per household, unlike 2018-19's one per grappe.  `poids` takes two
        # values in 337 of the 670 grappes, one for each value of PanelHH, and equals
        # ehcvm_welfare.hhweight on all 8,032.  No longitudinal weight is shipped, so
        # panel_weight is poids, as Togo, Niger and Mali 2021-22; a family ruling is
        # pending.  Do not read it as a panel weight.
        file: ehcvm_ponderations_ben2021.dta
        idxvars:
            i:
                - grappe
                - menage
        myvars:
            weight: poids
            panel_weight: poids
    merge_on:
        - i
    final_index:
        - i
        - t

cluster_features:
    # One file: the cover carries the GPS 2018-19 kept in grappe_gps_ben2018.dta, one
    # point per grappe.  Projected to (t, v) by mapping.cluster_features.
    file: s00_me_ben2021.dta
    idxvars:
        v: grappe
    myvars:
        Region: s00q01
        Rural:
            - s00q04
            - mapping:
                Rural: Rural
                Urbain: Urban
        Latitude: GPS__Latitude
        Longitude: GPS__Longitude

household_roster:
    dfs:
        - df_main
        - df_cover
    df_main:
        file: s01_me_ben2021.dta
        idxvars:
            v: grappe
            i:
                - grappe
                - menage
            pid: membres__id
        myvars:
            # s01q00aa, "is [NOM] still a member of this household?": the 6,138 who are not
            # record why and when they left, and no sex, relationship or age.
            # mapping.household_roster drops them.
            StillMember: s01q00aa
            Sex: s01q01
            Relationship: s01q02
            Age:
                - s01q04a
                - s01q03a
                - s01q03b
                - s01q03c
            MonthsSpent:
                - s01q12
                - mapping:
                    Oui: 12
                    Non: 0
    df_cover:
        file: s00_me_ben2021.dta
        idxvars:
            v: grappe
            i:
                - grappe
                - menage
        myvars:
            interview_date: s00q23a
    merge_on:
        - v
        - i
    final_index:
        - v
        - i
        - pid

individual_education:
    file: ehcvm_individu_ben2021.dta
    idxvars:
        v: grappe
        i:
            - grappe
            - menage
        pid: numind
    myvars:
        Educational Attainment:
            - educ_hi
            - mappings: ['harmonize_education', 'Original Label', 'Preferred Label']

subjective_well_being:
    # 2018-19's s20q05 is s20aq05 here, on the same code list (1 = Riche).  The mapping
    # is keyed on the labels, and the served step runs the other way from the codes.
    file: s20a_me_ben2021.dta
    idxvars:
        i:
            - grappe
            - menage
    myvars:
        Own Step:
            - s20aq05
            - mapping:
                Très pauvre: 1
                Pauvre: 2
                Moyen: 3
                Riche: 4
                Ne sait pas: null

assets:
    # The grid, as in 2018-19: 361,440 rows of which 40,335 are owned, and only those
    # record a number, so the all-NA drop serves the owned lines.
    file: s12_me_ben2021.dta
    idxvars:
        i:
            - grappe
            - menage
        j: s12q01
    myvars:
        Quantity: s12q03
        Age: s12q07
        Value: s12q09
        Purchase Price: s12q08

shocks:
    # s14a is the COVID-19 module; s14b is the module 2018-19 called s14.  The coping
    # columns hold ranks here, not 2018-19's indicators, except Cope25: mapping.shocks.
    # The framework drops the rows with no follow-up: 4,756 of 10,982 reported shocks
    # are served, because the instrument asks follow-ups only of the last 12 months.
    # 2018-19 serves all 12,305, so a cross-wave incidence reads as a false fall.
    file: s14b_me_ben2021.dta
    idxvars:
        i:
            - grappe
            - menage
        Shock: s14bq01
    myvars:
        AffectedIncome:
            - s14bq04a
            - mapping:
                Diminué: True
                Augmenté: True
                Inchangé: False
                Non-concerné: False
        AffectedAssets:
            - s14bq04b
            - mapping:
                Diminué: True
                Augmenté: True
                Inchangé: False
                Non-concerné: False
        AffectedProduction:
            - s14bq04c
            - mapping:
                Diminué: True
                Augmenté: True
                Inchangé: False
                Non-concerné: False
        # s14bq04d is the herd ("l'Effectif du cheptel"), s14bq04e "le Stock produits
        # alimentaires" and s14bq04f "les Achats produits alimentaires", in both vagues.
        # Ruling (GH #1556 / #1561): AffectedConsumption is food PURCHASES and
        # AffectedFoodStock food STOCKS, as the core 2021-22 waves read them.
        AffectedFoodStock:
            - s14bq04e
            - mapping:
                Diminué: True
                Augmenté: True
                Inchangé: False
                Non-concerné: False
        AffectedConsumption:
            - s14bq04f
            - mapping:
                Diminué: True
                Augmenté: True
                Inchangé: False
                Non-concerné: False
        Cope1: s14bq05__1
        Cope2: s14bq05__2
        Cope3: s14bq05__3
        Cope4: s14bq05__4
        Cope5: s14bq05__5
        Cope6: s14bq05__6
        Cope7: s14bq05__7
        Cope8: s14bq05__8
        Cope9: s14bq05__9
        Cope10: s14bq05__10
        Cope11: s14bq05__11
        Cope12: s14bq05__12
        Cope13: s14bq05__13
        Cope14: s14bq05__14
        Cope15: s14bq05__15
        Cope16: s14bq05__16
        Cope17: s14bq05__17
        Cope18: s14bq05__18
        Cope19: s14bq05__19
        Cope20: s14bq05__20
        Cope21: s14bq05__21
        Cope22: s14bq05__22
        Cope23: s14bq05__23
        Cope24: s14bq05__24
        Cope25: s14bq05__25
        Cope26: s14bq05__26

housing:
    # The section shifted by one: roof and floor are s11q19 and s11q20 here, s11q20 and
    # s11q21 in 2018-19.  The same mapping as 2018-19, then the country's Roof and
    # Floor tables at read time.
    file: s11_me_ben2021.dta
    idxvars:
        i:
            - grappe
            - menage
    myvars:
        Roof:
            - s11q19
            - mapping:
                Dalle en ciment: Concrete Slab
                Tuile: Clay Tiles
                Tôles: Iron Sheets
                Paille: Thatch
                Banco: Adobe
                Chaume: Straw
                Nattes: Mats
                'Autre (à préciser)': Other
        Floor:
            - s11q20
            - mapping:
                Carreaux/Marbre: Tiles
                Ciment/Béton: Cement
                Terre battue/Sable: Earth
                Bouse d'animaux: Dung
                Autre: Other

interview_date:
    file: s00_me_ben2021.dta
    idxvars:
        i:
            - grappe
            - menage
    myvars:
        # q23/q24/q25 a/b = visits 1/2/3 start/end
        int_start:    s00q23a
        int_end:      s00q23b
        int_start_v2: s00q24a
        int_end_v2:   s00q24b
        int_start_v3: s00q25a
        int_end_v3:   s00q25b

food_security:
    # FIES, EHCVM section 8A, last 12 months.  s08aq01..s08aq08 map in order to the 8
    # canonical items, by the labels of this file.  s08aq07a and s08aq08a are frequency
    # follow-ups and are not read.
    file: s08a_me_ben2021.dta
    idxvars:
        v: grappe
        i:
            - grappe
            - menage
    myvars:
        Worried:
            - s08aq01
            - mapping:
                Oui: True
                Non: False
                Ne sait pas: null
                Refus: null
        HealthyDiet:
            - s08aq02
            - mapping:
                Oui: True
                Non: False
                Ne sait pas: null
                Refus: null
        FewFoods:
            - s08aq03
            - mapping:
                Oui: True
                Non: False
                Ne sait pas: null
                Refus: null
        SkippedMeal:
            - s08aq04
            - mapping:
                Oui: True
                Non: False
                Ne sait pas: null
                Refus: null
        AteLess:
            - s08aq05
            - mapping:
                Oui: True
                Non: False
                Ne sait pas: null
                Refus: null
        RanOut:
            - s08aq06
            - mapping:
                Oui: True
                Non: False
                Ne sait pas: null
                Refus: null
        Hungry:
            - s08aq07
            - mapping:
                Oui: True
                Non: False
                Ne sait pas: null
                Refus: null
        WholeDay:
            - s08aq08
            - mapping:
                Oui: True
                Non: False
                Ne sait pas: null
                Refus: null

food_acquired:
    # A full grid: 1,333,313 rows, 204,206 consumed (s07bq02 = Oui), where 2018-19's
    # file holds the 187,672 consumed lines only.  The rest record nothing and the
    # reshape drops them.
    file: s07b_me_ben2021.dta
    idxvars:
        v: grappe
        visit: vague
        i:
            - grappe
            - menage
        j:
            - s07bq01
            - mappings: ['harmonize_food', 'Original Label', 'Preferred Label']
        # Codes 217 and 218 are not bundles: they respell the sized forms 2018-19 serves,
        # and every row of them is size-free in s07bq03c.  Here and not in the country's u
        # table, which may not hold a sized label (test_food_kg_size_pool).
        u:
            - s07bq03b
            - mapping:
                tongolo avec 1 brassée: Tohoungolo (Avec 1 brassée)
                tongolo avec 2 brassées: Tohoungolo (Avec 2 brassées)
    myvars:
        Quantity: s07bq03a
        Produced: s07bq04
        # GH #876.  Expenditure is derived by mapping.food_acquired, as in 2018-19; these
        # raw inputs feed that hook and are dropped by the reshape.
        GiftQuantity: s07bq05
        # Read through mapping.ConsumptionUnitCode and mapping.LastPurchaseUnitCode: each
        # of the file's two unit variables lacks a label the other has, and unit_match
        # reads labels.
        ConsumptionUnitCode: s07bq03b
        ConsumptionUnitSize: s07bq03c
        LastPurchaseQuantity: s07bq07a
        LastPurchaseUnitCode: s07bq07b
        LastPurchaseUnitSize: s07bq07c
        LastPurchaseValue: s07bq08
