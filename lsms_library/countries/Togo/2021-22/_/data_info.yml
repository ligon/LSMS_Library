                Refus: null
        RanOut:
            - s08aq06
            - mapping:
                Oui: True
                Non: False
                Ne sait pas: null
                Refus: null
        Hungry:
            - s08aq07
            - mapping:
                Oui: True
                Non: False
                Ne sait pas: null
                Refus: null
        WholeDay:
            - s08aq08
