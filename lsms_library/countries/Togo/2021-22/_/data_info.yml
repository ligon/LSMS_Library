Country: Togo
Wave: 2021-22

# EHCVM-2 (WB 6279).  Read _/CONTENTS.org "2021-22 wired" first.  The two facts
# that shape every block here:
#   - `i` is `E2_<grappe>0<menage>`, by mapping.i: the (grappe, menage) keys recur
#     from 2018 and do not mean the same household (GH #552, no link is served);
#   - variable names survive where meanings do not: compare labels, not names.

sample:
    dfs:
        - df_cover
        - df_weights
    df_cover:
        file: s00_me_tgo2021.dta
        idxvars:
            v: grappe
            i:
                - grappe
                - menage
        myvars:
            # GH #812: region only, as 2018.  Code 6 is `Grand Lomé` here and
            # `Lomé commune` in 2018, on the same 98 grappes: served as recorded.
            strata: s00q01
            Rural:
                - s00q04
                - mapping:
                    Rural: Rural
                    Urbain: Urban
    df_weights:
        # One row per household, unlike 2018's one per grappe.  `poids` takes two
        # values within most grappes, by the file's own `panel` flag.  There is no
        # longitudinal weight, so panel_weight is poids, as Niger and Mali 2021-22.
        file: ehcvm_ponderations_tgo2021.dta
        idxvars:
            i:
                - grappe
                - menage
        myvars:
            weight: poids
            panel_weight: poids
    merge_on:
        - i
    final_index:
        - i
        - t

cluster_features:
    # One file: the cover carries the GPS 2018 kept in grappe_gps_tgo2018.dta, and
    # one point per grappe.  Projected to (t, v) by mapping.cluster_features.
    file: s00_me_tgo2021.dta
    idxvars:
        v: grappe
    myvars:
        Region: s00q01
        Rural:
            - s00q04
            - mapping:
                Rural: Rural
                Urbain: Urban
        Latitude: GPS__Latitude
        Longitude: GPS__Longitude

household_roster:
    dfs:
        - df_main
        - df_cover
    df_main:
        file: s01_me_tgo2021.dta
        idxvars:
            v: grappe
            i:
                - grappe
                - menage
            pid: membres__id
        myvars:
            Sex: s01q01
            Relationship: s01q02
            Age:
                - s01q04a
                - s01q03a
                - s01q03b
                - s01q03c
            MonthsSpent:
                - s01q12
                - mapping:
                    Oui: 12
                    Non: 0
    df_cover:
        file: s00_me_tgo2021.dta
        idxvars:
            v: grappe
            i:
                - grappe
                - menage
        myvars:
            interview_date: s00q23a
    merge_on:
        - v
        - i
    final_index:
        - v
        - i
        - pid

individual_education:
    file: ehcvm_individu_tgo2021.dta
    idxvars:
        v: grappe
        i:
            - grappe
            - menage
        pid: numind
    myvars:
        Educational Attainment:
            - educ_hi
            - mappings: ['harmonize_education', 'Original Label', 'Preferred Label']

subjective_well_being:
    # 2018's s20q05 is s20aq05 here, and its codes run the other way (1 = Riche);
    # the mapping is keyed on the labels, so the served step is unchanged.
    file: s20a_me_tgo2021.dta
    idxvars:
        i:
            - grappe
            - menage
    myvars:
        Own Step:
            - s20aq05
            - mapping:
                Très pauvre: 1
                Pauvre: 2
                Moyen: 3
                Riche: 4
                Ne sait pas: null
                Refus: null

assets:
    # Unlike 2018's full grid (277,695 rows, s12q02 Oui or Non), this file ships
    # only the items owned (33,619 rows, all Oui).
    file: s12_me_tgo2021.dta
    idxvars:
        i:
            - grappe
            - menage
        j: s12q01
    myvars:
        Quantity: s12q03
        Age: s12q07
        Value: s12q09
        Purchase Price: s12q08

shocks:
    # s14a is the COVID-19 module; s14b is the module 2018 called s14.  The coping
    # columns hold ranks here, not 2018's indicators: see mapping.shocks.
    file: s14b_me_tgo2021.dta
    idxvars:
        i:
            - grappe
            - menage
        Shock: s14bq01
    myvars:
        AffectedIncome:
            - s14bq04a
            - mapping:
                Diminué: True
                Augmenté: True
                Inchangé: False
                Non-concerné: False
        AffectedAssets:
            - s14bq04b
            - mapping:
                Diminué: True
                Augmenté: True
                Inchangé: False
                Non-concerné: False
        AffectedProduction:
            - s14bq04c
            - mapping:
                Diminué: True
                Augmenté: True
                Inchangé: False
                Non-concerné: False
        AffectedConsumption:
            - s14bq04d
            - mapping:
                Diminué: True
                Augmenté: True
                Inchangé: False
                Non-concerné: False
        Cope1: s14bq05__1
        Cope2: s14bq05__2
        Cope3: s14bq05__3
        Cope4: s14bq05__4
        Cope5: s14bq05__5
        Cope6: s14bq05__6
        Cope7: s14bq05__7
        Cope8: s14bq05__8
        Cope9: s14bq05__9
        Cope10: s14bq05__10
        Cope11: s14bq05__11
        Cope12: s14bq05__12
        Cope13: s14bq05__13
        Cope14: s14bq05__14
        Cope15: s14bq05__15
        Cope16: s14bq05__16
        Cope17: s14bq05__17
        Cope18: s14bq05__18
        Cope19: s14bq05__19
        Cope20: s14bq05__20
        Cope21: s14bq05__21
        Cope22: s14bq05__22
        Cope23: s14bq05__23
        Cope24: s14bq05__24
        Cope25: s14bq05__25
        Cope26: s14bq05__26

housing:
    # The section shifted by one: roof and floor are s11q19 and s11q20 here,
    # s11q20 and s11q21 in 2018.
    file: s11_me_tgo2021.dta
    idxvars:
        i:
            - grappe
            - menage
    myvars:
        Roof:
            - s11q19
            - mapping:
                Dalle en ciment: Concrete Slab
                Tuile: Clay Tiles
                Tôles: Iron Sheets
                Paille: Thatch
                Banco: Mud
                Chaume: Thatch
                Nattes: Woven Mats
                Autre (à préciser): Other
        Floor:
            - s11q20
            - mapping:
                Carreaux/Marbre: Tile
                Ciment/Béton: Cement
                Terre battue/Sable: Earth
                Bouse d'animaux: Dung
                Autre: Other

interview_date:
    file: s00_me_tgo2021.dta
    idxvars:
        i:
            - grappe
            - menage
    myvars:
        # q23/q24/q25 a/b = visits 1/2/3 start/end
        int_start:    s00q23a
        int_end:      s00q23b
        int_start_v2: s00q24a
        int_end_v2:   s00q24b
        int_start_v3: s00q25a
        int_end_v3:   s00q25b

food_security:
    # FIES, EHCVM section 8A, last 12 months.  s08aq01..s08aq08 map in order to the
    # 8 canonical items, by the labels of this file.  s08aq07a and s08aq08a are
    # frequency follow-ups and are not read.
    file: s08a_me_tgo2021.dta
    idxvars:
        i:
            - grappe
            - menage
    myvars:
        Worried:
            - s08aq01
            - mapping:
                Oui: True
                Non: False
                Ne sait pas: null
                Refus: null
        HealthyDiet:
            - s08aq02
            - mapping:
                Oui: True
                Non: False
                Ne sait pas: null
                Refus: null
        FewFoods:
            - s08aq03
            - mapping:
                Oui: True
                Non: False
                Ne sait pas: null
                Refus: null
        SkippedMeal:
            - s08aq04
            - mapping:
                Oui: True
                Non: False
                Ne sait pas: null
                Refus: null
        AteLess:
            - s08aq05
            - mapping:
                Oui: True
                Non: False
