# Derivations -- served numbers in this country's tables that are NOT survey
# answers but CONSTRUCTIONS from raw answers.  One entry per registry key,
# `country::table::name`; the same key sits in the served table's
# `Derivation` column on every row it produced.  Loader and field contract:
# lsms_library/derivations.py.  Design: SkunkWorks/derived_values.org.
#
# Sibling of population.yml and recall.yml: a .yml here moves no cache hash.

Togo::food_acquired::7day-purchase-at-last-purchase-unit-value:
  waves: ['2018', '2021-22']
  columns: [Expenditure]
  rows: {s: purchased}
  rule: >-
    Expenditure = Quantity * (s07bq08 / s07bq07a), where Quantity is the row's
    own served purchased quantity, (s07bq03a - s07bq04 - s07bq05).clip(lower=0)
    -- the 7-day consumption net of own production AND of gifts received, which
    is the survey's own accounting identity -- and s07bq08 / s07bq07a is the
    unit value of the household's LAST PURCHASE of the item.  NaN where
    s07bq07a is missing or not positive, and NaN where the last purchase was
    made in a different unit from the consumption unit (s07bq07b/s07bq07c vs
    s07bq03b/s07bq03c): no EHCVM wave ships a unit-conversion table, so there
    is no exact conversion and NA is the honest answer.  Units are compared on
    the EHCVM numeric code where the label carries one, else on the label with
    case, accents, padding and punctuation folded -- the two variables carry
    DIFFERENT value-label sets inside the same .dta.  Before GH #876 the served
    Expenditure was s07bq08 itself: the value of one purchase of unrecorded
    size made up to 30 days earlier, beside a 7-day quantity.
  function: lsms_library.ehcvm:derive_ehcvm_purchase_value
  inputs: lsms_library.countries.Togo.2018._.mapping:inputs_food_acquired
  raw_variables: [s07bq03a, s07bq03b, s07bq03c, s07bq04, s07bq05, s07bq07a,
                  s07bq07b, s07bq07c, s07bq08]
  assumptions:
    - text: >-
        the unit value of the last purchase is the price the household paid
        over the 7-day consumption window.  s07bq08 is the value of ONE
        purchase, which s07bq06 places up to 30 days back, while s07bq03a is
        the quantity consumed over 7 days -- one row, two clocks.
      basis: variable-label
      evidence: >-
        Stata labels in s07b_me_tgo2018.dta: s07bq08 "7B.08. Valeur (en FCFA) du [PRODUIT]
        achete la derniere fois"; s07bq03a "7B.03a. Qtite tot du [PRODUIT]
        conso par le MEN au cours des 7 derniers jours"; s07bq07a "7B.07a.
        Quelle est la quantite du [PRODUIT] achete la derniere fois?"
    - text: >-
        a last purchase reported in a different unit from the consumption is
        NOT converted, and a row with no last purchase has no unit value to
        apply: the row is served with Expenditure NA. Counts are on the SERVED
        denominator -- purchased rows of the delivered table, after the
        canonical reshape and the (t, v, i, j, u, s) collapse -- because that
        is the number a user sees; the source-row counts are smaller and were
        what an earlier version of this entry quoted. 2018: 15,747 of the
        83,090 SERVED purchased rows (19.0%) -- 8,602 because no last purchase
        was reported at all (s07bq08 or s07bq07a missing / not positive),
        3,633 because the last purchase used a different unit CODE, 3,512
        because it used the same code in a different SIZE (Petit / Moyen /
        Grand / Taille unique), which is a different container and so a
        different price per unit.  2021-22: 38,092 of the 107,841 SERVED purchased
        rows (35.3%).  On source rows with a purchased quantity, 38,182 of 108,057:
        34,510 with no last purchase, 1,303 in a different unit code, 2,369 in the
        same code at a different size.  The share is higher than 2018's because
        s07bq03a is rescaled by region in this file, which leaves a phantom purchased
        residual on rows with no purchase (11,952 of 12,963 Jamais rows; 166 in 2018);
        it is not the fill rule, which 2018 shares.  See _/CONTENTS.org, "s07bq03a is
        rescaled by region".
      basis: variable-label
      evidence: >-
        no EHCVM wave distributes a unit-conversion table;
        lsms_library/categorical_mapping/ehcvm_units.org is a code->label
        codebook with no factors
    - text: >-
        the quantity multiplied is the SURVEY'S OWN accounting identity,
        (s07bq03a - s07bq04 - s07bq05).clip(0) -- construction "C", chosen by
        @ligon on 2026-09-12 because it is the only one of the three candidates
        ehcvm_conso reproduces.  The alternatives, measured, are A = the gross
        7-day consumption s07bq03a (which would put the value of own-produced
        and gifted food into Expenditure) and B = net of own production only.
        2018: A 32,656,157, B 32,224,365, C (served) 31,676,795 FCFA, against a raw s07bq08 total of 44,452,024.
        2021-22: A 35,429,400, B 35,230,935, C (served) 34,464,072 FCFA, against a raw s07bq08 total of 45,908,210.
      basis: modelling-choice
      evidence: SkunkWorks/derived_values.org; GH #876; measured 2026-09-12
    - text: >-
        the gift quantity s07bq05 is served as its own s = 'inkind' row, in the
        consumption unit s07bq03b, with Expenditure NA.  EHCVM asks no value for
        a gift.  UEMOA's depan(Don) is s07bq05 priced at this same last-purchase
        unit value -- verified, and therefore demonstrably an imputation by the
        people who built the aggregate rather than an answer anybody gave -- so
        it is checked and not served.  Own production keeps the identical
        treatment it already had (s = 'produced' from s07bq04, Expenditure NA).
        2018: 10,212 inkind rows carrying 26,045 units, 0 with an Expenditure.
        2021-22: 10,579 inkind rows carrying 24,394 units, 0 with an Expenditure.
      basis: modelling-choice
      evidence: SkunkWorks/derived_values.org; GH #876; measured 2026-09-12
  validated_against: >-
    ehcvm_conso_tgo2018.dta, the survey's OWN aggregate (UEMOA; one row per
    household x product x modep with an annual value depan).  On the 434 unique
    (household, product) rows where an Achat row exists, the units match and the
    candidate constructions differ (s07bq04 or s07bq05 positive), this rule
    x 365/7 reproduces depan(Achat) within 1% for 99.5% of rows, against 13.1%
    for the own-production-only residual and 0.0% for the gross 7-day quantity.
    s07bq04 * uv reproduces depan(Autoconso) and s07bq05 * uv depan(Don) --
    the latter within 1% for 99.7% of 1,255 rows, which is how we know
    depan(Don) is an IMPUTATION at the same unit value and not a value the
    survey asked for; it is checked and deliberately not served.  The 365/7
    (median ratio 0.99931 = (365/7)/(365.25/7)) shows UEMOA reads the 7-day
    consumption as the week.  2021-22, ehcvm_conso_tgo2021.dta, the same test: on the
    2,068 (household, product) rows where the candidates differ and an Achat row
    exists, the rule x 365/7 is within 1% of depan(Achat) for 90.8%, against 13.5%
    for the own-production-only residual and 0.0% for the gross quantity; s07bq05 *
    uv is within 1% of depan(Don) for 91.0% of 1,914 rows.  Median ratio over all
    69,875 joined rows 1.00000.  THIS VALIDATES THE ARITHMETIC AND NOT THE 2021-22
    QUANTITY: ehcvm_conso carries the same regional scaling as s07bq03a (Achat on 91.6%
    of Jamais rows; its Achat/Autoconso equals residual/s07bq04), so the agreement could
    not have revealed it.  See _/CONTENTS.org, "s07bq03a is rescaled by region".
  contents: 'Togo/_/CONTENTS.org, "food_acquired: one row, two windows (GH #876)"'
  since: '2026-09-12'

Togo::crop_production::hh-crop-sale-single-row:
  waves: ['2021-22']
  columns: [Quantity_sold, Unit_sold, Value_sold]
  rule: >-
    s16d records a sale for the household and crop, with no plot.  A sale is a
    record with a positive s16dq05a or s16dq06, after the file's exact repeats are
    removed.  Where the household has exactly one s16c row for the crop, the sale is
    served on that row: Quantity_sold = s16dq05a, Unit_sold = s16dq05b, Value_sold =
    s16dq06, as recorded, and that row carries this key.  What is derived is the
    ATTACHMENT, not the numbers.  Any other sale is served on one row of that household
    and crop with plot_id = 'Farm-level' and no key, because its index value already
    discloses it.  No sale is split, summed, scaled or dropped.  This key shares a row
    with harvest-to-date through derivations.MULTI_SEP, in sorted order.
  function: lsms_library.ehcvm:derive_hh_crop_sale_attachment
  inputs: lsms_library.countries.Togo.2021-22._.mapping:inputs_hh_crop_sale
  raw_variables: [s16cq02, s16cq03, s16cq04, s16dq01, s16dq04, s16dq05a, s16dq05b, s16dq06]
  assumptions:
    - text: >-
        s16d asks the sale once per crop, with no plot, and s16c records no sale.  Where
        the household has one harvest row for the crop, no other row can hold the sale.
        The sale is NOT thereby a share of that row's Quantity, and it may be in another
        unit: Unit_sold says which.
      basis: variable-label
      evidence: >-
        s16d_me_tgo2021.dta has no field or parcel variable; s16dq05a "16D.05a. Quelle
        est la quantite de ce produit qui a deja ete vendue ?"; s16dq06 "16D.06. Quel a
        ete le montant tire de la vente de ce produit?".  s16c_me_tgo2021.dta carries
        s16cq02 and s16cq03 and no sale variable.
    - text: >-
        a sale of a crop on two or more rows is not allocated among them, since any split
        would be invented.  It stays with the household and crop on a Farm-level row,
        with u = 'Unknown', where gross_crop_revenue and median_price_valuation can read
        it.  That row has no harvest Quantity.
      basis: modelling-choice
      evidence: >-
        ruling @ligon 2026-11-03, option (d), GH #824, for Mali 2021-22 and applied here
        by the brief of GH #1697 (split from #552); the Farm-level convention in lsms_library/data_info.yml.
    - text: >-
        identical s16d lines are one record.  The export repeats a crop's record once
        per harvest line: 1,111 of 10,325 rows are exact repeats, 782 of them sales, and
        no (household, crop) has two different records.
      basis: modelling-choice
      evidence: measured 2026-11-04; the same artefact as Niger 2021-22, GH #824
  validated_against: >-
    tests/test_togo_2021_wave.py, whose oracle reads s16c and s16d directly.  Not
    validated against an external total: no document here reports one.
  contents: 'Togo/_/CONTENTS.org, "2021-22 wired"'
  since: '2026-11-04'

Togo::crop_production::harvest-to-date:
  waves: ['2021-22']
  columns: [Quantity]
  rule: >-
    Identity on a row whose harvest is not finished and which records a quantity: s16cq11
    = Non with s16cq16a.  The value is served as recorded.  The key names its WINDOW: the
    question asks the quantity ALREADY harvested, so the row covers a part of the season
    under a column that otherwise means all of it.  A row with no recorded quantity
    carries no key.
  function: lsms_library.ehcvm:derive_harvest_to_date
  inputs: lsms_library.countries.Togo.2021-22._.mapping:inputs_harvest_to_date
  raw_variables: [s16cq11, s16cq12, s16cq16a, s16cq16b]
  assumptions:
    - text: >-
        the recorded quantity on an unfinished row is what has been harvested so far, and
        not the season.  111 of the 403 unfinished rows record one.
      basis: variable-label
      evidence: >-
        s16c_me_tgo2021.dta s16cq16a "16C.16a. Quantite deja recoltee pour la presente
        campagne 2021/22?", s16cq11 "16C.11. Avez vous fini la recolte de cette culture?",
        s16cq12 "16C.12. Quel pourcentage de la superficie vous reste-t-il a recolter?"
  validated_against: >-
    tests/test_togo_2021_wave.py, whose oracle reads s16c directly.  An identity has
    nothing to validate but its rows.
  contents: 'Togo/_/CONTENTS.org, "2021-22 wired"'
  since: '2026-11-04'

Togo::sample::region-milieu-stratum:
  waves: ['2018', '2021-22']
  columns: [strata]
  rows: {}
  rule: >-
    strata = '<s00q01 label> <s00q04 label>', the cover page's region and
    residence-milieu labels, each stripped of surrounding whitespace. NA where
    either is missing or blank; nonmissing nonstring coding is refused. Native
    labels are preserved without a geographic crosswalk or an old-region fill.
    Each wave reads its own cover (2018 s00_me_tgo2018.dta, 2021-22
    s00_me_tgo2021.dta) with its own labels: region code 6 is 'Lomé commune' in
    2018 and 'Grand Lomé' in 2021-22, on the same 98 grappes, and neither is
    renamed to the other, so 'Lomé commune Urbain' and 'Grand Lomé Urbain' are
    two labels.
  function: lsms_library.ehcvm:derive_region_milieu_stratum
  inputs: lsms_library.countries.Togo.2018._.mapping:inputs_strata
  raw_variables: [s00q01, s00q04]
  assumptions:
    - text: >-
        the original 2018/19 household sampling stratum is the combination of
        region and residence milieu, and 2021/22 revisits the same clusters, so
        its households carry their clusters' strata. 2018 was wired on
        2026-11-10; 2021-22 on 2026-11-12, by the ruling "Same rule as #1575".
      basis: questionnaire
      evidence: >-
        Togo's own September 2023 Basic Information Document (survey design
        documentation, not a questionnaire question), held as
        2021-22/Documentation/tgo_ehcvm2_information_de_base.pdf, section 4.1,
        French PDF p.12 / printed p.11 (English edition p.11): "La strate est
        la combinaison région/milieu de résidence." This retrospectively
        describes the original 2018/19 design. GH #1575 documentary findings
        merged in PR #1637; documented combination selected 2026-11-10. The
        same section has 2021/22 revisit the 2018/19 clusters rather than draw
        new ones; extended to 2021-22 by ruling @ligon 2026-11-12, "Same rule as
        #1575 (Recommended)".
    - text: >-
        both recorded labels are used as written; no milieu is fabricated or
        excluded to reconcile documents or force an observed-cell count.
      basis: modelling-choice
      evidence: >-
        June 2021 original BID p.10 says "except Lome Commune where all
        respondents are from rural areas"; September 2023 retrospective
        Table 1a names Grand Lomé with 98 urban / 0 rural clusters. Their
        geographic equivalence, a typo correction and a formal excluded-cell
        rule remain unestablished. Togo/_/CONTENTS.org preserves both accounts.
  validated_against: >-
    Documentary definition and static wiring only. Actual-row validation UNRUN:
    native label-card coverage, missingness, cluster consistency and original
    versus candidate normal-data/cold-warm/Feature comparisons remain separate
    acceptance gates. No observed stratum count is asserted.
  contents: 'Togo/_/CONTENTS.org, "2018 strata wiring selected (GH #1575)"'
  since: '2026-11-10'
