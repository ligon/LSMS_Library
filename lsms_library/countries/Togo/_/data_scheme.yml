Country: Togo

Data Scheme:
  sample:
    index: (i, t)
    v: str
    weight: float
    panel_weight: float
    strata: str
    Rural: str
  cluster_features:
    # GRAIN (GH #323).  df_main is the EHCVM *household* cover page
    # (2018/Data1/s00_me_tgo2018.dta, 6,171 households / 540 grappes), so
    # the raw extraction emitted 6,171 rows for this 540-row table -- all of
    # them on a duplicated (t, v) tuple, 5,631 of them EXCESS.  The projection
    # to cluster grain now happens in the EXTRACTION: 2018/_/mapping.py
    # alias-imports the SHIPPED reducer as its df_edit hook
    #   from lsms_library.transformations import (
    #       collapse_to_cluster_grain as cluster_features,
    #   )
    # which CHECKS that Region/Rural really are constant within a grappe (they
    # are: 0/540 violations) instead of leaning on the framework's
    # groupby().first(), which would return a silently WRONG Region the day
    # that stopped holding.  Do NOT declare a reducer here, and do NOT
    # re-implement the helper in mapping.py; see _/CONTENTS.org "Grain: two
    # cells that leaned on the framework collapse" and
    # .coder/ledger/323-togo.md section 7.
    index: (t, v)
    Region: str
    Rural: str
    Latitude: float
    Longitude: float
  household_roster:
    index: (t, i, pid)
    Sex: str
    Age: int
    Relationship: str
    Generation: int
    Distance: int
    Affinity: str
  individual_education:
    index: (t, i, pid)
    Educational Attainment: str
  subjective_well_being:
    # EHCVM §20 'Pauvreté relative' ladder item s20q05: self-placement
    # on a 4-point welfare ladder (Très pauvre=1, Pauvre=2, Moyen=3,
    # Riche=4; higher = better off, as in Malawi/Cantril).  Ne sait pas /
    # Refus / NaN -> NaN.  Only the Own-placement item exists in EHCVM;
    # no Neighbors/Friends steps (unlike Malawi).
    index: (t, i)
    Own Step: int
  food_acquired:
    # Canonical post-2026-05-05 (GH #169): s axis carries acquisition
    # source (purchased / produced / inkind / other).  The wave-level
    # mapping.py food_acquired() function reshapes the wide-form
    # (Quantity-total, Produced-subset, Expenditure) into long-form on s.
    # `visit` (vague) is dropped: in EHCVM 2018 it's a sample split
    # (each grappe surveyed in exactly one vague), not a repeated measure,
    # so households are uniquely keyed by (t, v, i, j, u, s) without it.
    index: (t, v, i, j, u, s)
    Quantity: float
    Expenditure: float
  assets:
    index: (t, i, j)
    Quantity: float
    Age: float
    Value: float
    Purchase Price: float
  shocks:
    index: (t, i, Shock)
    AffectedIncome: bool
    AffectedAssets: bool
    AffectedProduction: bool
    AffectedConsumption: bool
    HowCoped0: str
    HowCoped1: str
    HowCoped2:
      type: str
      optional: true

  food_security:
    # FAO Food Insecurity Experience Scale (FIES), EHCVM §8A
    # 'Sécurité alimentaire'.  Recall period: last 12 months.  The 8
    # experience items s08aq01..s08aq08 map IN ORDER to the canonical
    # FIES bools; FIES_score (0-8) is the count of True items, computed
    # by the food_security() function in 2018/_/mapping.py.
    index: (t, i)
    Worried: bool
    HealthyDiet: bool
    FewFoods: bool
    SkippedMeal: bool
    AteLess: bool
    RanOut: bool
    Hungry: bool
    WholeDay: bool
    FIES_score: int

  housing:
    index: (t, i)
    Roof: str
    Floor: str

  interview_date:
    index: (t, i, visit)
    Interview start: datetime
    Interview end: datetime
    aggregation:
      visit: first

  plot_features:
    # Lasting parcel-level characteristics from the EHCVM agriculture
    # module s16a (GH #167; Mali is the EHCVM reference, PR #284).  Togo
    # has a single EHCVM wave (2018).  The source file lives in
    # 2018/Data1/ (NOT 2018/Data/, which holds only _forEthan extracts).
    # plot_id = "{field_no}_{parcel_no}".  Latitude / Longitude are NOT
    # emitted — EHCVM s16a has no decimal-degree parcel GPS (s16aq47 is
    # an area, not a coordinate); deferred as in Uganda.
    index: (t, i, plot_id)
    Area: float
    AreaUnit: str
    Tenure: str
    TenureSystem: str
    SoilType: str
    Irrigated: bool
    materialize: make

  livestock:
    # Item-level livestock roster (EHCVM cluster; cloned from Niger
    # 2018-19, GAP 4).  One row per REPORTED (household, species) the
    # household owns/raises, from the EHCVM §17 'Élevage' roster
    # (2018/Data1/s17_me_tgo2018.dta, NOT the bespoke Togo_survey2018_*
    # files).  Source: s17q02 species (1-11, harmonize_species_ehcvm),
    # s17q06 head, s17q08 bought, s17q10 sold; s17q03==1 owned gate
    # (roster is pre-filtered to owned).
    #
    # GRAIN (t, i, animal) — NO v level: 'livestock' is in the
    # framework's _no_v_join set, so the household-level rows carry no
    # cluster level and the framework does NOT join one from sample().
    # `animal` is the harmonized species Preferred Label
    # (harmonize_species_ehcvm).
    #
    # COLUMNS (reported, item-level): HeadCount (owned now), HeadAcquired
    # (number bought in the last 12 months), HeadSold (number sold on the
    # hoof in the last 12 months).  A `Value` (herd value) column is
    # intentionally OMITTED: EHCVM s17 asks no current herd value (only
    # purchase / sale FLOW values), so an all-NaN Value column would only
    # trip the sanity checker.
    index: (t, i, animal)
    HeadCount: float
    HeadAcquired: float
    HeadSold: float
    materialize: make

  crop_production:
    # Item-level crop harvest (EHCVM cluster; cloned from Niger 2018-19,
    # GAP 1).  One row per REPORTED (field, parcel, crop) harvest line from
    # the EHCVM agriculture module (2018/Data1/s16c_me_tgo2018.dta, NOT the
    # bespoke Togo_survey2018_* files).  REPORTED values only; harvest_kg /
    # yield / main_crop / value-shares are transformations, never columns.
    # crop labels pass through as raw French (Togo has no harmonize_food
    # table); u via the library-level u table.  plot = "{s16cq02}_{s16cq03}"
    # aligns with plot_features' plot_id.  `u` is in the index (as in
    # food_acquired) because one (plot, crop) can be reported in several
    # units.  planting_month / perennial omitted (not recorded by EHCVM
    # s16c); harvest_month all-NaN here (only 2014-15 ECVMA recorded it) but
    # carried for cross-wave schema parity; intercropped from s16cq07.
    index: (t, i, plot, crop, u)
    Quantity: float
    Quantity_sold: float
    Value_sold: float
    harvest_month:
      type: float
      optional: true
    intercropped: bool
    materialize: make

  plot_inputs:
    # Item-level agricultural inputs (EHCVM cluster; cloned from Niger
    # 2018-19, GAP 2).  One row per REPORTED input applied by a household
    # (2018/Data1/s16b_me_tgo2018.dta).  REPORTED values only; seed_kg /
    # nitrogen_kg / fertilizer totals are transformations, never columns.
    # GRAIN NOTE: EHCVM records inputs at the HOUSEHOLD x input grain, NOT
    # plot x input (no parcel-level input question), so `plot` is NOT in the
    # index; the feature keeps the GAP-2 name `plot_inputs`.  input ->
    # harmonize_input, crop -> harmonize_seed_crop (both copied from Niger
    # into Togo/_/categorical_mapping.org — the EHCVM s16b labels are
    # identical across EHCVM countries); u via the library-level u table.
    # Non-crop-specific rows carry the sentinel '(not crop-specific)' and a
    # missing unit the 'Manquant' u label, both non-null so the framework's
    # canonical NaN-key de-dup collapse does not silently drop them.
    index: (t, i, input, crop, u)
    Quantity: float
    Purchased: bool
    Quantity_purchased: float
    materialize: make

  plot_labor:
    # Item-level plot labor (EHCVM cluster; cloned from Niger 2018-19,
    # GAP 3).  One row per REPORTED labor SOURCE on a plot from the EHCVM
    # agriculture-parcel module (2018/Data1/s16a_me_tgo2018.dta — the same
    # file plot_features reads, so plot ids align).  REPORTED values only;
    # total_labor_days / hired_labor_value are transformations, never
    # columns.  GRAIN (t, i, plot, source): source is 'family' / 'hired'
    # (EHCVM s16a records family vs non-family only — no free/exchange
    # 'other').  PersonDays = within-source sum over the member / gender-
    # category / phase strata (NOT a cross-source rollup); EHCVM hired
    # person-days = Σ(#workers × days).  Wage = cash paid to hired labor
    # (CFA francs); NaN for family.  plot = "{s16aq02}_{s16aq03}".
    index: (t, i, plot, source)
    PersonDays: float
    Wage: float
    materialize: make

  people_last7days:
    # Individual 7-day activity (EHCVM cluster; cloned from Niger 2018-19,
    # GAP 3).  One row per individual from the EHCVM 7-day employment module
    # (2018/Data1/s04_me_tgo2018.dta) merged to the s01 roster for age.
    # GRAIN (t, i, pid); pid = s01q00a (matches household_roster).  EHCVM
    # records only the three participation DUMMIES (s04q06 farm -> farm_work,
    # s04q07 own-business -> SOB_work, s04q08 wage -> wage_work) and
    # working_age (roster Age >= 6).  It does NOT record productive-work
    # hours or the WB 7-day industry section code, so farm_hrs / SB_hrs /
    # wage_hrs and Industry are NA (declared for cross-wave schema parity).
    index: (t, i, pid)
    farm_work: bool
    SOB_work: bool
    wage_work: bool
    farm_hrs: {type: float, optional: true}
    SB_hrs: {type: float, optional: true}
    wage_hrs: {type: float, optional: true}
    Industry: {type: str, optional: true}
    working_age: bool
    materialize: make

  nonfood_expenditures:
    # Household non-food expenditure, item-level, from the EHCVM section-9
    # modules 2018/Data1/s09b..s09f_me_tgo2018.dta.  (NOT from 2018/Data/,
    # which held the five Togo_survey2018_nonfooditems*.csv researcher
    # extracts — `dvc add`ed in 2021, never pushed, unrecoverable per GH
    # #750, and retired with this feature.  Data1/ carries the same five
    # recall windows in the published EHCVM distribution.)
    #
    # THE INSTRUMENT, quoted (2018/Documentation/
    # tgo_ehcvm1_qnr_household_excel_vague1.xls, sheets S9b..S9f, row 0/1;
    # vague1 and vague2 are byte-identical over section 9):
    #   "SECTION 9 : DÉPENSES RÉTROSPECTIVES NON ALIMENTAIRES DU MÉNAGE"
    #   "PARTIE B: DEPENSES NON ALIMENTAIRES DES 7 DERNIERS JOURS"
    #   "PARTIE C: DEPENSES NON ALIMENTAIRES DES 30 DERNIERS JOURS"
    #   "PARTIE D: DEPENSES NON ALIMENTAIRES DES 3 DERNIERS MOIS"
    #   "PARTIE E: DEPENSES NON ALIMENTAIRES DES 6 DERNIERS MOIS"
    #   "PARTIE F: DEPENSES NON ALIMENTAIRES DES 12 DERNIERS MOIS"
    # So the five sub-modules ARE a recall-window split, and s09?q03 is the
    # amount spent OVER THAT WINDOW.
    #
    # WINDOW DECISION: NOT ANNUALISED.  `Expenditure` is the FCFA figure the
    # household reported, and `RecallWindow` names its window verbatim.
    # Annualising is a transformation, and REPORTED values only is the rule
    # this file already applies to crop_production / plot_labor.  To scale:
    #   annual = Expenditure * 365.25 / days, days = {'7 days': 7,
    #     '30 days': 30, '3 months': 91.3125, '6 months': 182.625,
    #     '12 months': 365.25}[RecallWindow]
    # RecallWindow is a COLUMN, not an index level, because EHCVM gives each
    # sub-module a disjoint item-code block (201-217 / 301-322 / 401-418 /
    # 501-512 / 601-653), so `j` already determines the window; making it a
    # level would bake a functional dependency into the key.
    #
    # GRAIN (t, i, j).  No `v` — the framework joins it from sample() at API
    # time.  No `vague` — each grappe is visited in exactly one vague.
    # (t, i, j) is unique in the source; the wave script asserts it, so
    # nothing is reduced.  j = nonfood_items Preferred Label (122 items,
    # decoded from the instrument, injectivity asserted at build time).
    #
    # PARTIE A (s09a, 'DEPENSES DES FETES ET CEREMONIES AU COURS DES 12
    # DERNIERS MOIS') IS EXCLUDED: it is keyed by EVENT, not product, and two
    # of its five amount columns are food.  Consequence, stated because it is
    # a real bias: 9E/9F instruct the enumerator NOT to include clothing,
    # footwear and jewellery bought for ceremonies (those go in 9A.05), so
    # this table UNDERCOUNTS those categories.  See _/CONTENTS.org
    # "nonfood_expenditures (EHCVM section 9)" for the proposed follow-up
    # (a ceremony_expenditures feature keyed (t, i, event)).
    index: (t, i, j)
    Expenditure: float
    RecallWindow: str
    materialize: make
