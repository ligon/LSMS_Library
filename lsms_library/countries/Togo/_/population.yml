# Population record -- what this survey's documentation says the sample
# represents.  One entry per wave, keyed by the API wave label (the value that
# appears in the `t` index level, i.e. an element of `Country(...).waves`).
#
# GENERATED by scripts/promote_population_records.py from
# slurm_logs/POPULATION_STATEMENTS_2026-07-21.org.  Edit the source document and
# re-run rather than editing this file by hand; every quoted block below is a
# verbatim transcription of survey documentation, sic spellings included.
#
#   THE TAG IS AN EDITORIAL READING.  IT IS NOT A QUOTE, AND NO DOCUMENT USES IT.
#
# `universe_tag` therefore never travels alone.  `source_type` says where the
# statement was found and `confidence` says how strongly it is a universe
# statement at all -- `medium` = "a coverage or representativeness claim, not a
# universe declaration"; `low` = "this is sample-design text and should not be
# laundered into a universe".  A reader who quotes the tag without those two has
# turned an editorial reading into a fact.
#
# `status: inert` marks a row the sweep recorded for a wave the library cannot
# currently build (no `_/data_scheme.yml`, or a duplicate staging directory).
# It is kept so the record is not lost, and is never returned by the loader.

Population:
  '2018':
    universe_tag: national-all-households
    source_type: wb-catalog
    confidence: high
    survey: 'Enquête Harmonisée sur les Conditions de Vie des Ménages (EHCVM) 2018-2019 / Harmonized Survey on Households Living Standards, Togo 2018-2019 (TGO_2018_EHCVM_v02_M)'
    language: 'English'
    source_file: 'https://microdata.worldbank.org/index.php/catalog/4298/study-description (World Bank Microdata Library catalog entry 4298, ref. TGO_2018_EHCVM_v02_M); corroborating: Basic Information Document, INSEED, June 2021, PDF downloaded from https://microdata.worldbank.org/catalog/4298/download/52590'
    locator: 'Catalog study-description page, section "Coverage" > field "Universe" (the exclusion clause is inside that same Universe field). Corroborating sample-coverage sentence: catalog section "Sampling" > "Sampling Procedure", first sentence; identical text in the Basic Information Document, page 10, section "Sample", first sentence.'
    population_statement: |-
      The survey covered all de jure households excluding prisons, hospitals, military barracks, and school dormitories.
    exclusions: |-
      excluding prisons, hospitals, military barracks, and school dormitories  [Geographic Coverage, same page:] "National coverage"  [Sampling Procedure, same catalog page, and Basic Information Document p.10 §"Sample":] "The Togo EHCVM 2018/19 sample covers all regions with urban and rural areas surveyed in all regions except Lome Commune where all respondents are from rural areas."
    translation: |-
      n/a — the source text is in English. (The catalog metadata page for this WAEMU/INSEED survey is published in English; the local questionnaires are in French.)
    notes: |-
      One wave only. The wave directory is labelled '2018' but the survey is the two-wave EHCVM 2018/19: wave 1 fielded Sept-Dec 2018, wave 2 April-June 2019 (BID p.4, §"Survey Characteristics": "The surveys took place in two waves with each wave covering half of the sample. The first wave was fielded between September 2018 and December 2018, while the second wave occurred between April 2019 and June 2019. The two-wave approach was chosen to account for seasonality of consumption.").  NO universe/target-population statement exists in any LOCAL repo document for this wave; the quote above is from the World Bank catalog (and is corroborated verbatim, for the sample-coverage sentence, by the INSEED Basic Information Document). The local Documentation/ folder holds only questionnaires.  WARNING about the sample-coverage sentence, quoted verbatim above and NOT corrected here: the documentation says "...surveyed in all regions except Lome Commune where all respondents are from rural areas." That is what both the catalog page and BID p.10 literally say. It is internally implausible (Lomé Commune is the wholly urban capital district) and reads like an urban/rural transposition error in the source document, but it is reproduced exactly as written; do not silently 'fix' it when recording the population.  Sample design detail (NOT the universe; BID p.10 §"Sample" / catalog "Sampling Procedure"): two-stage design, 540 EAs selected at stage 1, 12 households per EA at stage 2; total 6,171 households — 2,270 urban, 3,901 rural; each EA split into two halves, one per wave; wave 1 = 2,931 households (1,034 urban, 1,897 rural), wave 2 = 3,240 households (1,236 urban, 2,004 rural).  Programme context (BID p.3): the EHCVM 2018/19 is described as "the first edition of a nationally representative household survey conducted within the Programme d'Harmonisation et de Modernisation des enquetes sur les Conditions de Vie des Menages (PHMECV program)", a joint World Bank / WAEMU Commission programme covering Benin, Burkina Faso, Cote d'Ivoire, Guinee Bissau, Mali, Niger, Senegal and Togo — so a near-identical universe statement should be expected for the sibling EHCVM countries.  Note also: lsms_library/countries/Togo/2018/Data/ additionally contains non-EHCVM extracts (Togo_survey2018_*_forEthan.dta / .csv) with no documentation of their own; no universe statement is available for those files, and nothing was inferred from any .dta.
    record_source: slurm_logs/POPULATION_STATEMENTS_2026-07-21.org (section 3, 'Togo 2018')
  '2021-22':
    universe_tag: not-stated
    source_type: not-found
    confidence: high
    survey: 'Enquête Harmonisée sur le Conditions de Vie des Ménages 2021-2022 (EHCVM 2021/22), WB catalog id 6279 (TGO_2021_EHCVM-2_v01_M)'
    language: '(not recorded)'
    source_file: 'Searched (both local, neither states a universe): lsms_library/countries/Togo/2021-22/Documentation/tgo_ehcvm2_information_de_base_eng.pdf ; lsms_library/countries/Togo/2021-22/Documentation/tgo_ehcvm2_information_de_base.pdf ; World Bank catalog DDI export for study 6279 (https://microdata.worldbank.org/metadata/export/6279/json, fetched 2026-11-04)'
    locator: 'English BID: Section 4 ''Sampling'' / ''Household and Community Component'' (PDF pp. 11-12); price component, section 3.3 (PDF p. 10). French BID: keyword search and sampling section. WB catalog 6279 DDI export: study_desc.study_info, study_desc.method.data_collection.sampling_procedure. Text extracted with pdfminer.'
    population_statement: |-
      NOT FOUND — no universe / target-population statement exists in any Togo 2021-22 documentation examined. Positive evidence of absence: the catalog 6279 DDI export has universe null in study_desc.study_info, with geographic coverage given only as "National coverage"; neither the English nor the French Basic Information Document contains a universe, 'population cible' or 'champ de l'enquête' statement (searched by keyword, and section 4 read). The nearest verbatim material is Sampling-Procedure text, given in exclusions_verbatim and notes; it is NOT a universe declaration and must not be quoted as one.
    exclusions: |-
      (Sampling Procedure, WB catalog 6279 — NOT a universe statement): "The sampling frame for the 2018/2019 survey is the 2010 General Population and Housing Census (RGPH). In 2021/2022, the enumeration was conducted in the same clusters. The Togo EHCVM 2018/19 sample covers all regions with urban and rural areas surveyed in all regions except Lome Commune where all respondents are from rural areas. Upon deciding on the sample size and repartition, the survey design team implemented a 2-stage sampling methodology. At the first stage, 540 enumeration areas (EAs) were selected from the sample frame. In the second stage, 12 households were selected in each enumeration area randomly. The total survey sample size is 6,462 households - 2,459 from urban areas and 4,003 from rural areas. After that, the survey design randomly divided each enumeration area into two equal groups. The survey team interrogated the first group in wave 1 and the other in wave 2. In wave one, the survey teams interviewed 3,236 households (1,233 in urban areas and 2,003 in rural areas). In wave two, the teams interviewed 3,226 households (1,226 in urban areas and 2,000 in rural areas)."
    notes: |-
      Registered and wired 2026-11-04 (GH #552), every table 2018 serves, under ids with no link to 2018.  2021-22 revisits the 2018/19 clusters, so its documentation describes the 2018/19 design rather than declaring its own universe. Local English BID, VERBATIM: "In 2021/2022, the strategy involves revisiting the same clusters. This entails either surveying the 12 households from 2018/2019 if they are found (after the enumeration phase) or surveying the households that are found and completing the sample to 12 in the clusters where fewer are found during the enumeration phase (either because there were fewer than 12 households in the final 2018/2019 database or because some of the households could not be located)."  The 2018-19 universe statement is the natural candidate to inherit; that inheritance is an INFERENCE, not a documented claim, and needs a human decision.  The DDI's Sampling-Procedure sentence that Lomé Commune's respondents "are from rural areas" is quoted as printed.
    record_source: slurm_logs/POPULATION_STATEMENTS_2026-07-21.org (section 3, 'Togo 2021-22')
