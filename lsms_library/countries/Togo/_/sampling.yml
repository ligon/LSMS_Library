# Sampling record -- does `v` denote the same cluster as in the PRECEDING wave of
# `Country('Togo').waves`?  The design fields are #793's curation and are not
# written yet; their absence here is "not curated", not "not found".  Read by
# `lsms_library/sampling.py`.  Vocabulary: see sampling.py.  Modelled on
# Niger/_/sampling.yml.  The first wave has no preceding wave and so no entry.

Sampling:

  '2021-22':
    panel:
      household_continuity: rotating-panel
      cluster_id_continuity: stable
      cluster_id_note: |-
        `grappe` in both waves, and the BID says the enumeration "was conducted in
        the same clusters".  Measured on the raw covers: all 540 grappes recur;
        region, prefecture and milieu agree 540/540; the 2021-22 point equals the
        2018 fix to the last digit on all 535 with one (0.0 km).  `rotating-panel`
        records the DESIGN: the BID has the 12 households of 2018/19 surveyed if
        found and the cluster completed otherwise.  The library serves NO household
        link across this boundary: 2021-22's `i` is `E2_`-prefixed, because 1,397 of
        the 5,441 recurring (grappe, menage) keys are at the wrong-household baseline
        (_/CONTENTS.org, "2021-22 wired"; GH #1697).
      source_type: local-documentation
      confidence: high
      source_file: 'lsms_library/countries/Togo/2021-22/Documentation/tgo_ehcvm2_information_de_base_eng.pdf'
      locator: 'section 4.1 "Household and Community Component", PDF pp. 11-12; measured on s00_me_tgo2021.dta, s00_me_tgo2018.dta and grappe_gps_tgo2018.dta through get_dataframe, 2026-11-04'
