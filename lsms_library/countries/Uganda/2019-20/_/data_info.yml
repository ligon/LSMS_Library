Country: Uganda
Wave: 2019-20

household_roster:
    file: HH/gsec2.dta
    idxvars:
        i: hhid
        pid: pid
    myvars:
        Sex: h2q3
        Relationship: h2q4
        # Age list = [age, day, month, year] -> ../_/2019-20.py reduces
        # to a scalar via tools.age_handler() (GH #177).  h2q9b is an
        # English month name in this wave; the Age formatter normalises.
        Age:
            - h2q8
            - h2q9a
            - h2q9b
            - h2q9c
        MonthsSpent: h2q5

individual_education:
    file: HH/gsec4.dta
    idxvars:
        i: hhid
        pid: pid
    myvars:
        # GH #171: map raw attainment labels onto the canonical ordinal vocab
        # via the row-additive harmonize_education table (global base +
        # this country's per-country delta in _/categorical_mapping.org).
        Educational Attainment:
            - s4q07
            - mappings: ['harmonize_education', 'Original Label', 'Preferred Label']

people_last7days:
    file: HH/gsec15a.dta
    # GH #323 -- see 2018-19's data_info.yml for the full rationale.  Same
    # LONG-format gsec15a: two rows per hhid keyed by CEA01, which collided on
    # the declared (i, t) index and were reduced with groupby().first(),
    # destroying 3,038 of 6,156 rows.  `_category` carries CEA01 so the
    # country-level hook uganda.people_last7days() can select the member rows.
    idxvars:
        i: hhid
    myvars:
        _category: CEA01
        Men : CEA01A
        Women : CEA01B
        Boys : CEA01C
        Girls : CEA01D

housing:
    file: HH/gsec9.dta
    idxvars:
        i: hhid
    myvars:
        Roof: h9q04
        Floor: h9q06

sample:
    dfs: [locating_cover, origin_ea]
    locating_cover:
        file: HH/gsec1.dta
        idxvars:
            i: hhid
        myvars:
            _cover: hhid
            # GH #323: composite DISTRICT/PARISH key built by this wave's
            # mapping.v().  s1aq04a (the parish NAME) alone is not a cluster key --
            # 23 parish names recur across districts.  The reverse error (one real
            # parish split across two districts as coded) is handled by the three
            # `_V_ALIASES` entries in mapping.py; the "spans >1 district" metric
            # cannot see it, so read that comment before trusting this key.
            # `sample` and `cluster_features` MUST declare the identical pair so
            # _join_v_from_sample propagates a key that exists in both.
            v:
                - district
                - s1aq04a
            weight: wgt  # only weight provided; wave 8 appears to be panel-only (no refreshment)
            panel_weight: wgt
            strata: subreg
            Rural: urban
            Region: region
            # The household's OWN recorded district, the column `cluster_features` reads, so
            # `market='District'` labels a household its cluster's mates disagree about (GH #1441).
            District:  # row-valued, as in `cluster_features`, so mapping.District sees `_V_ALIASES`
                - district
                - s1aq04a
    # GH #689: the design PSU, which no file of this wave ships.  The country
    # hook `origin_ea` re-keys this 2015-16 frame to this wave's `hhid` through
    # gsec1.hhidold -> 2018-19 GSEC1.hhid -> t0_hhid, the survey's own tracking
    # keys; a household they do not reach stays NA.  Declared here so the files'
    # sidecars are in this wave's input hash, and so that a loss the GH #515 handler
    # catches costs `ea`, not `v`.  An unreachable remote is not caught: `sample`
    # raises here, where it used to need only this wave's cover (GH #1463).
    # Two files because a tracking key can name a household only 2015-16's AGSEC1
    # records (ruling 2026-11-04).
    origin_ea:
        file:
            - ../../2015-16/Data/gsec1.dta
            - ../../2015-16/Data/AGSEC1.dta
        idxvars:
            i: HHID
        myvars:
            ea: ea
    # NOT a sub-df (it is absent from `dfs:`), so it is never read or merged.
    # `origin_ea`'s hook reads this file for the middle of the chain, and
    # `_collect_file_paths_from_block` hashes every `file:` in the block.
    origin_ea_bridge:
        file: ../../2018-19/Data/GSEC1.dta

    merge_on: [i]
    # The cover alone decides which households exist; `left` also keeps this
    # wave's row order, which an outer merge would re-sort.
    merge_how: left
    final_index: [t, i]

cluster_features:
    dfs: [locating_cover]
    locating_cover:
        file: HH/gsec1.dta
        idxvars:
            i: hhid
            # GH #323: same composite DISTRICT/PARISH key as `sample` above.
            # (s1aq04a is the parish NAME; the parish codes are broken as in
            # 2018-19.)
            v:
                - district
                - s1aq04a
        myvars:
            _cover: hhid
            Region: region
            Rural: urban
            # GH #323: row-valued so mapping.District() can resolve the same three
            # `_V_ALIASES` entries that mapping.v() does.  If District were left as
            # the bare `district` column, the three aliased clusters would contain
            # households whose raw district strings disagree and reduce_to_agreed
            # would blank District for all three.
            District:
                - district
                - s1aq04a
    merge_on: [i]
    final_index: [t, i]
