Country: Uganda

Data Scheme:
  people_last7days:
    index: (i, t)
    Men : int
    Women : int
    Boys : int
    Girls : int

  sample:
    index: (i, t)
    v: str
    weight: float
    panel_weight: float
    strata: str
    Rural: str

  cluster_features:
    index: (t,v)
    Region: str
    Rural: str
    District: str
    Latitude: float
    Longitude: float
  
  household_roster:
    index: (t, i, pid)
    Sex: str
    Age: int
    Relationship: str
    Generation: int
    Distance: int
    Affinity: str

  individual_education:
    index: (t, i, pid)
    Educational Attainment: str

  shocks: !make
  earnings:
    materialize: make
    index: (t, i)
    Earnings: float
  food_acquired:
    # Canonical post-2026-05-05 (GH #169): s in {purchased, produced, inkind}.
    # Wave scripts call uganda.food_acquired (wide form, source-suffixed
    # columns) then uganda.food_acquired_to_canonical (suffix melt with
    # home/away -> purchased; preserves market Price for s=purchased and
    # farmgate Price for s=produced).  Unblocks the Uganda piece of GH #218
    # (food_expenditures derivation chain previously failed because Uganda's
    # food_acquired lacked a single Expenditure column).  See
    # slurm_logs/DESIGN_food_acquired_canonical_2026-05-05.org.
    index: (t, i, j, u, s)
    Quantity: float
    Expenditure: float
    Price: float
    materialize: make
  fct: !make
  nutrition: !make
  interview_date: !make
  # food_expenditures, food_prices, food_quantities are derived at
  # runtime from food_acquired — see _FOOD_DERIVED in country.py.
  panel_ids: !make
  income:
    materialize: make
    index: (t, i)
    income: float
  enterprise_income:
    materialize: make
    index: (t, i)
  assets: !make
  months_food_inadequate:
    # Family C (non-FIES food security): months in the last 12 the HH
    # could not meet its food needs.  Source GSEC17 'Welfare and Food
    # Security' food-deprivation item (h17q9 / h17q09) + which-months
    # follow-up.  Present in 2009-10, 2010-11, 2011-12, 2013-14,
    # 2015-16.  MonthsInadequate is <NA> for 2010-11 (no which-months
    # follow-up that wave; only the binary item was asked).
    index: (t, i)
    MonthsInadequate: int
    AnyInadequate: bool
    materialize: make
  housing:
    index: (t, i)
    Roof: str
    Floor: str
  plot_features:
    # Lasting parcel-level characteristics for the Uganda UNPS waves
    # (GH #167 Phase 1 pilot).  Uganda terminology: a "parcel" is the
    # lasting land unit; what UNPS calls a "plot" is the within-parcel
    # cropping subdivision (varies by season).  Our canonical plot_id
    # is Uganda's parcelID suffixed with '_A' (AGSEC2A: owned) or '_B'
    # (AGSEC2B: use-rights/rented) so the two source files can be
    # concatenated without ID collision.  See
    # slurm_logs/DESIGN_erhs_plot_features_2026-05-20.org.
    # Latitude / Longitude are reserved in the canonical Columns block
    # but NOT declared here — Uganda's parcel-level GPS in AGSEC2A is
    # in a non-standard DMS encoding (Latitude_Minutes range 0-99 etc.)
    # and is mostly NaN.  Adding GPS is a documented follow-up; for v1
    # Uganda emits the six lasting-attribute columns only.
    #
    # GAP-6 parity audit (2026-06-14): added the REPORTED per-parcel
    # item attributes the WB LSMS-ISA harmonised Plot_dataset carries
    # (self_reported_area / plot_owned / plot_certificate /
    # erosion_protection; UGA_UNPS1.do:396-650).  SelfReportedArea is
    # the farmer estimate kept distinct from Area (which prefers GPS).
    # PlotOwned / PlotCertificate / ErosionProtection are reported
    # booleans.  The WB aggregates farm_size / nb_plots / nb_fallow_plots
    # (sums/counts) and soil_fertility_index (PCA over geospatial
    # soil-quality rasters) are transformations, NOT stored here; the WB
    # plot_slope / soil-quality tags come from the GPS geovars raster
    # keyed on the household, not the parcel questionnaire, so they are
    # not survey-reported plot attributes and are excluded.
    index: (t, i, plot_id)
    Area: float
    AreaUnit: str
    Tenure: str
    TenureSystem: str
    SoilType: str
    Irrigated: bool
    SelfReportedArea: float
    PlotOwned: bool
    PlotCertificate: bool
    ErosionProtection: bool
    materialize: make
  crop_production:
    # Item-level post-harvest crop module (GAP 1 parity build).  One row
    # per REPORTED harvest record for a crop on a plot.  Source: AGSEC5A
    # (season 1) + AGSEC5B (season 2) of the UNPS post-harvest
    # questionnaire, joined to AGSEC4A for the intercropped flag.
    #
    # Grain (t, i, plot_id, j, u, condition, season):
    #   plot   — hhid-parcel-plot, mirroring the WB harmonised plot_id;
    #            its parcel component is the parcel plot_features keys on.
    #   j      — crop, on the shared 'harmonize_crop' Preferred Labels,
    #            which REUSE the harmonize_food Aggregate Label strings
    #            for food crops (Maize, Beans, Rice, ...) so a crop j
    #            joins food_acquired(labels='Aggregate').j.
    #   u      — reported native harvest unit ('harvest_units' table);
    #            'Unknown' where a wave-season records no harvest unit
    #            column.  Since GH #842 that is 2018-19 season A ONLY
    #            (7 153 rows): AGSEC5A ships two columns both titled
    #            "6c. Condition / state" and no unit at all, while season
    #            B's unit (a5bq6b) IS wired and serves 30 distinct labels.
    #            Season A's kilograms are still recoverable through
    #            KgFactor below.
    #   condition — physical state of the crop when the Quantity was
    #            measured ('harvest_conditions' table): green / fresh /
    #            dry-at-harvest / dried, crossed with the form (on the
    #            stalk, with shell, in the cob, in pods, as grain).  UNPS
    #            asks quantity, unit AND condition together, so the same
    #            plot-crop-season carries one record PER CONDITION; before
    #            this level existed (GH #323/#637) those records collided
    #            and their Quantity was summed — dry weight added to fresh
    #            weight.  'unknown_condition' where the wave records no
    #            condition code or an off-scheme one: 7 994 of 133 683 rows
    #            = 6.0% panel-wide, and 23.2% in 2009-10 (then 4.4 / 3.5 /
    #            2.3 / 0.1 / 0.1 / 0.1% for 2010-11 … 2019-20).  A NULL
    #            condition column is the bulk of that; only ~490 rows in the
    #            whole panel carry a code OUTSIDE the 20-code scheme (1.1%
    #            of 2009-10, 0.9% of 2010-11 — the two waves that ship no
    #            value labels).  Measured cold 2026-07-21; the per-wave
    #            breakdown is in _/CONTENTS.org.
    #            Quantities in different conditions are NOT commensurable;
    #            do not sum across this level without a drying/shelling
    #            conversion.
    #   season — 'A' (first season) / 'B' (second season).
    #
    # Columns are REPORTED values only — no harvest_kg / yield /
    # main_crop / value-share (those are transformations).  Missing in a
    # wave -> NaN.  2005-06 is excluded: its AGSEC5A is a crop-area
    # allocation matrix with no crop-level harvest quantities, and the
    # WB LSMS-ISA panel itself starts at wave 1 (2009-10).
    index: (t, i, plot_id, j, u, condition, season)
    Quantity: float
    Quantity_sold: float
    Value_sold: float
    # THE SALE HAS ITS OWN UNIT AND ITS OWN CONDITION (GH #824).  UNPS
    # question 7 is compound -- "how much of the harvest was SOLD, in what
    # CONDITION and in what UNIT" -- so Quantity_sold is denominated in
    # `Unit_sold` (q7c) and NOT in the row's `u`, which is the HARVEST unit
    # (q6c).  Measured on the built table (2026-09-10, isolated
    # LSMS_DATA_DIR): they disagree on 3.9% of the 40 083 rows with a
    # positive Quantity_sold that know both units -- 2.0-8.0% by wave-season.
    #
    # WHERE THEY DISAGREE THE ROW IS A FLAG, NOT AN IDENTIFICATION, and this
    # is the part that bites.  Unit_sold is the honest label for
    # Quantity_sold AS REPORTED, but a row whose two unit reports contradict
    # each other does not tell you which report is sound: Unit_sold is the
    # CLOSER denominator on only 40.5% of the disagreeing priced rows under a
    # price test (n=1 021) and 42.7% under the household's own reported
    # sold-kg factor q7d (n=468) -- so `u` is closer MORE often.  The largest
    # cell is u='Sack (100 kgs)' with Unit_sold='Kg' (162 priced rows), whose
    # median Value_sold/Quantity_sold is 34 167 UShs -- a SACK price; read as
    # a kilogram price it overstates maize by ~70x, an error in the OPPOSITE
    # direction from the one this column exists to prevent.  A consumer
    # forming a per-unit or per-kg price must treat these rows as AMBIGUOUS
    # (exclude them, or resolve them with a reported per-row sold kg factor)
    # and report how many were excluded.
    #
    # Not carrying the column was still worse: it stamped the harvest unit on
    # a sale reported in something else with no signal at all.  On the 565
    # disagreeing priced rows whose two labels both name a weight in
    # kilograms, the two readings differ by a median factor of 50 and by
    # >= 100x on 47.4% of them.  Same 'harvest_units' vocabulary as `u`; same
    # 'harvest_conditions' vocabulary as the `condition` index level.
    #
    # NA-bearing, never sentinel-filled -- unlike `u` and `condition`, which
    # are INDEX levels and must carry 'Unknown' / 'unknown_condition'
    # because a null index key is deleted outright by groupby(dropna=True).
    # These are plain columns, so NA is safe AND more informative: it says
    # "no sold unit recorded on this row", which is a different fact from
    # any unit.
    #
    # `optional` for both, for two independent reasons: 2011-12 ships no 7b
    # column at all (asked on the questionnaire, dropped from the extract),
    # so Condition_sold is legitimately 100% null in that wave; and a row
    # with no sale has no sold unit, so neither column is ever fully
    # populated.  The null-content guard must not fire on either.
    Unit_sold:
      type: str
      optional: true
    Condition_sold:
      type: str
      optional: true
    harvest_month: int
    intercropped: bool
    # SURVEY-REPORTED kilograms per ONE unit of the row's `u` -- UNPS
    # question 6d, "Record the conversion factor into kg", asked beside
    # every harvest record.  A RATE, not a weight: the row's kilograms are
    # Quantity * KgFactor.  Reported 0 is read as "not recorded" and stored
    # NaN (0 kg per unit is not a weight).
    #
    # Why it earns a column when the library can already infer kg from the
    # unit label: it is INDEPENDENT of that label, so it survives a wave
    # whose unit column the extract dropped.  2018-19 season A is exactly
    # that wave -- no unit code at all, u='Unknown' on all 7 153 rows (GH
    # #842) -- and 6d is populated on 7 123 of them, which is the only kg
    # basis that cell has.  It is also non-circular, unlike the
    # Expenditure/Quantity ratio inference in `_get_kg_factors`.
    #
    # `optional` because it is wired for 2018-19 ONLY.  The other six waves
    # ship a 6d column too, but their kilograms already resolve through the
    # unit label, so wiring them MOVES numbers and needs its own
    # before/after; until then KgFactor is legitimately all-NaN in those
    # waves and the all-null sanity check must not fire.
    KgFactor:
      type: float
      optional: true
    materialize: make
  plot_inputs:
    # Item-level agricultural-input module (GAP 2 parity build).  One row
    # per REPORTED input applied to a plot.  Source: AGSEC3A (season 1) +
    # AGSEC3B (season 2) plot-input modules for the fertilizer / pesticide
    # blocks, and AGSEC4A (plot-crop roster) for the seed block.
    #
    # Grain (t, i, plot_id, input, j, season):
    #   plot   — hhid-parcel-plot, mirroring the WB harmonised plot_id and
    #            the crop_production plot key (join on (t, i, plot_id)); its
    #            parcel component is the parcel plot_features keys on.
    #   input  — the input identity on the shared 'harmonize_input'
    #            Preferred Labels: Seed; Organic Fertilizer; Inorganic
    #            Fertilizer refined by nutrient class (Nitrate / Phosphate /
    #            Potash / Mixed Fertilizer); Pesticide refined by type
    #            (Insecticide / Fungicide / Growth Regulator / ...).  These
    #            are the finest identities the UNPS questionnaire records
    #            (it asks nutrient class, not urea/DAP/NPK product names).
    #   j      — the seed's crop, on harmonize_crop labels, for seed rows;
    #            the sentinel 'n/a' for fertilizer/pesticide rows (no crop
    #            linkage).  In the index so per-crop seed rows on a
    #            multi-crop plot stay distinct (plot-crop seed grain) — ~38%
    #            of seeded plots carry >1 crop.
    #   season — 'A' (first season) / 'B' (second season).  Carried in the
    #            grain for exactly the reason plot_labor states for the SAME
    #            two source files: AGSEC3A and AGSEC3B are distinct plot-SEASON
    #            questionnaires and the same plot id appears in both, so
    #            collapsing them into one (plot, input, j) row would mean
    #            summing quantities across seasons (a transformation) and
    #            picking one native unit at random.  Added by the GH #637
    #            key-soundness review, which measured (cold; re-derived
    #            2026-07-21) that 1,196 of the 1,342 colliding tuples on the
    #            old 5-level key — 89%, not the "~95%" first written here —
    #            were season-A/season-B pairs (2009-10: 230 of 242 tuples
    #            present in BOTH seasons; 2013-14: 112 of 112, i.e. all of
    #            them).  In 33 of those groups the two seasons reported the
    #            same input in DIFFERENT units (Kg vs Litre), so kilograms
    #            were summed with litres: 5 / 6 / 0 / 5 / 4 / 3 / 10 over
    #            2009-10 … 2019-20 — NOT "6 per wave", and none at all in
    #            2011-12.  crop_production and plot_labor
    #            already carried season; plot_inputs was the outlier.
    #            Seed rows are season 'A': they come from AGSEC4A, the first-
    #            season plot-crop roster.  AGSEC4B (second season) is not read,
    #            so there are no season-B seed rows — a pre-existing coverage
    #            gap that the level now makes visible rather than hiding.
    #
    # This grain is still NOT complete, and saying so here is the point of the
    # comment.  With `season` the builder returns 84,216 of the 84,489 rows it
    # constructs; the other 273 are still discarded by its de-dup step — 135
    # DELETED outright by `groupby(dropna=True)` because `plot_id` is NaN (130 in
    # 2009-10, 5 in 2011-12), and 138 merged away by collapsing 135 duplicate
    # groups.  Every one of those 135 groups is `input='Seed'`: two AGSEC4A
    # plot-crop rows for the same (plot, crop), i.e. a missing "which AGSEC4A
    # row" identifier — the same defect one level down.  8 of them (all
    # 2011-12) sum two or three reported quantities.  Measured cold
    # 2026-07-21; tracked on GH #637, deliberately not fixed in that PR.
    #
    # Columns are REPORTED values only — NO seed_kg / nitrogen_kg / any-use
    # flags / fertilizer totals (those are transformations).  Missing in a
    # wave -> NaN.  Improved is non-null only on seed rows (1=Improved seed
    # type, 0=Traditional).  Quantity is NaN on 2009-10/2010-11 seed rows
    # (those waves record no seed quantity, only purchased y/n + seed type).
    index: (t, i, plot_id, input, j, season)
    Quantity: float
    u: str
    Purchased: bool
    Quantity_purchased: float
    Improved: bool
    materialize: make
  livestock:
    # Item-level livestock roster (GAP 4 parity build).  One row per
    # REPORTED species/herd a household owns.  Source: the UNPS livestock
    # roster (AGSEC6A large ruminants / AGSEC6B small ruminants / AGSEC6C
    # poultry & other) that the WB code (UGA_UNPS1.do:710-720) reads only
    # to collapse to a single engaged-livestock y/n binary.  We keep the
    # PRE-collapse roster -- strictly richer than the WB construct.
    #
    # Grain (t, i, animal):
    #   animal — canonical SPECIES on the 'harmonize_species' Preferred
    #            Labels: Cattle, Goats, Sheep, Pigs, Donkeys, Horses,
    #            Chicken, Other Poultry, Rabbits, Bees.  The roster's
    #            exotic/indigenous and age/sex splits collapse to species
    #            here (sub-species detail recoverable from raw codes).
    #
    # Columns are REPORTED values only (missing-in-wave -> NaN):
    #   HeadCount     — head owned now
    #   HeadAcquired  — head bought to raise (last reference period)
    #   HeadSold      — head sold alive
    #   ValuePerAnimal — reported PER-HEAD animal value, so NOT additive.
    #                   Two instrument variants, both per head: 'If you
    #                   would sell one of the [...] today, how much would
    #                   you receive?' (a6aq6) in 2009-10/2010-11, and 'What
    #                   was, on average, the value of each sold?' (a6aq14b /
    #                   s6aq14b) for 2011-12+, which dropped the sell-today
    #                   question.  The switch is within-concept but changes
    #                   COVERAGE: the later variant is defined only where the
    #                   household sold, so the non-null rate falls from ~96%
    #                   to ~21% at 2011-12.  See `Columns: livestock` in
    #                   lsms_library/data_info.yml.
    # The WB engaged-livestock binary = groupby(['t','i']).any() over these
    # rows; herd value = ValuePerAnimal * HeadCount; TLU = sum(head * TLU-factor).
    # All three are TRANSFORMATIONS -- never stored here.
    #
    # No v level: livestock is in the framework _no_v_join set
    # (country.py), so the (t, i, animal) grain is final.  2005-06 is
    # excluded (no canonical AGSEC6 roster; the WB panel starts at 2009-10).
    index: (t, i, animal)
    HeadCount: float
    HeadAcquired: float
    HeadSold: float
    ValuePerAnimal: float
    materialize: make
  anthropometry:
    # Item-level anthropometry module (GAP 5 parity build).  One row per
    # MEASURED individual.  Source: the GSEC6 anthropometry module of the
    # UNPS questionnaire, the raw weight/height the WB code
    # (UGA_UNPS{1..8}.do anthro section) feeds into ``zscore06`` — we keep
    # ONLY the reported measures, never the z-scores / wasting flags.
    #
    # NEW feature, distinct from ``nutrition`` (which is nutrient INTAKE,
    # consumption x food-composition tables).  anthropometry is body
    # measurement.
    #
    # Grain (t, i, pid) [individual]:
    #   pid — the individual key, matching household_roster's pid so the
    #         child's Sex (and integer Age) join from the roster.  v auto-
    #         joins from sample() at API time (anthropometry is NOT in the
    #         framework _no_v_join set).
    #
    # Columns are REPORTED values ONLY (missing-in-wave -> NaN):
    #   Weight     — kg
    #   Height     — cm (lying-down length preferred, else standing height)
    #   MUAC       — mid-upper-arm circumference, cm.  NaN throughout: no
    #                UNPS wave records arm circumference (declared for
    #                cross-country schema parity only).
    #   Age_months — child age in months as recorded by the survey.  <NA>
    #                in 2018-19 / 2019-20 (those waves dropped the in-module
    #                age-in-months question; the WB code derives child age
    #                from the roster there).
    #
    # NO haz06 / waz06 / whz06 / bmiz06 / wasting / stunting — all of those
    # are WHO-2006 reference-population TRANSFORMS, computed at query time
    # over (Weight, Height, child Age/Sex), never stored.
    #
    # Wired for 2009-10 .. 2019-20 (every wave with a GSEC6 anthro module).
    # 2005-06 has no anthropometry module (the UNPS panel starts at 2009-10).
    index: (t, i, pid)
    Weight: float
    Height: float
    # No UNPS wave records mid-upper-arm circumference, so MUAC is
    # legitimately all-NaN for Uganda.  Mark optional so the all-null
    # sanity check exempts it while the canonical column stays declared
    # for cross-country alignment (other countries — e.g. Ethiopia ESS —
    # do record MUAC).
    MUAC:
      type: float
      optional: true
    Age_months: float
    materialize: make
  plot_labor:
    # Item-level plot-labor module (GAP 3 parity build).  One row per
    # REPORTED labor source on a plot-season.  Source: AGSEC3A (season 1) +
    # AGSEC3B (season 2) plot-input modules -- the SAME files plot_inputs
    # reads, whose labor block the WB code (UGA_UNPS1.do:467-509, and the
    # corresponding block in UNPS2..8) reads only to build the per-parcel
    # SUM columns total_labor_days / total_family_labor_days /
    # total_hired_labor_days and the median-wage hired_labor_value.  We keep
    # the PRE-collapse REPORTED person-days -- strictly richer than the WB
    # construct, and those sums / the wage valuation are TRANSFORMATIONS,
    # never stored here.
    #
    # Grain (t, i, plot_id, source, season):
    #   plot   — hhid-parcel-plot, mirroring the WB harmonised plot_id and
    #            the crop_production / plot_inputs / plot_features plot key
    #            (join on (t, i, plot_id)); its parcel component is the parcel
    #            plot_features keys on.
    #   source — the labor identity, a tiny controlled vocabulary emitted
    #            directly by the builder (uganda.LABOR_SOURCES): 'family'
    #            (household labor), 'hired' (paid labor), 'other' (exchange /
    #            communal labor — only recorded in 2011-12).  NOT a
    #            categorical_mapping table: the label is assigned by the
    #            builder, not decoded from a raw survey code.
    #   season — 'A' (first season) / 'B' (second season).  Carried in the
    #            grain (as in crop_production) because the same plot id
    #            appears in BOTH AGSEC3A and AGSEC3B for ~64% of plots and the
    #            labor question is per plot-season; collapsing the two seasons
    #            into one (plot, source) row would require summing across
    #            seasons (a transformation).
    #
    # Columns are REPORTED values only (missing-in-wave -> NaN):
    #   PersonDays — reported person-days of that source on the plot-season.
    #                For 'hired' / 'other' this is the row-sum of the survey's
    #                own man/woman/child day cells of ONE labor question (the
    #                reported quantity that question measures); for 'family' in
    #                2013-14/2015-16 it is the row-sum of the per-family-worker
    #                day cells of one question.  It is NOT a cross-plot /
    #                cross-source aggregate (total_*_labor_days are those, and
    #                stay in transformations).
    #   Wage       — reported cash paid to HIRED labor (the survey's q43/q36
    #                wage cell).  NaN on family / other rows.
    #
    # Coverage (family / hired availability per wave):
    #   2009-10, 2010-11  family (q39) + hired (q42a-c) + wage (q43)
    #   2011-12           family (q32) + hired (q35a-c) + wage (q36) + OTHER
    #                     (exchange q47-q49) — the only wave with 'other'
    #   2013-14, 2015-16  family (q33a_1..e_1) + hired (q35a-c) + wage (q36)
    #   2018-19           hired (s3aq35a-c) + wage (s3aq36) ONLY — the WB code
    #                     sets family to missing; AGSEC3B labor block absent so
    #                     no season-B rows
    #   2019-20           hired (s3aq35a-c) + wage (s3aq36) for BOTH seasons;
    #                     NO family rows (family roster is in a separate
    #                     AGSEC3A_1 file not in-repo) — documented partial
    #
    # No v level baked in: v auto-joins from sample() at API time (plot_labor
    # is NOT in the framework _no_v_join set).  2005-06 is excluded (no
    # plot-input/labor module; the UNPS panel starts at 2009-10).
    index: (t, i, plot_id, source, season)
    PersonDays: float
    Wage: float
    materialize: make
  nonfood_expenditures:
    # Item-level household non-food expenditure, GSEC14B (2005-06) / GSEC15C
    # (all later waves).  `j` is the `nonfood_items.org` Preferred Label.
    #
    # LONG since GH #817.  It used to be declared bare `!make` and delivered a
    # WIDE item-by-household matrix with `m = 'Uganda'` in the index; with no
    # `index:` and no columns here, `_assert_built_required_columns`, the
    # `dfs:` guard and the coverage grader had nothing to check, so every cell
    # graded `sane` while the table could not be stacked with Togo's.
    #
    # Expenditure sums the survey's separate purchased / produced / given
    # (in-kind) columns, which is what the pre-#817 code did too -- the reshape
    # changed the SHAPE, not the arithmetic, and every wave's total is
    # unchanged.  Rows exist only where a household reported the item
    # (sparsity convention); the old `fillna(0)` is gone.
    #
    # NO RecallWindow, and that is a KNOWN GAP rather than a statement about
    # the survey.  The .dta's own variable labels carry a CAPI fill: "How much
    # came from purchases in the past [RECALL]? VALUE" (h15cq5, 2013-14 and
    # 2011-12), so the recall period VARIES BY ITEM, exactly as in Togo's
    # section 9 -- and this table sums across it.  No wave ships a recall
    # variable and nonfood_items.org has no recall column, so populating it
    # needs the questionnaire read per wave.  See _/CONTENTS.org
