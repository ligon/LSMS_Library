      rotation: |-
        From this wave, one third of the original sample is refreshed each
        wave; households participate for three consecutive waves then rotate
        out.  The `rotate` variable in GSEC1 distinguishes continuing panel
        (rotate=1) from refreshment (rotate=0) in the waves that carry it
        (2013-14, 2015-16).  Continuing households receive a longitudinal
        (panel) weight; refreshment households receive a cross-sectional
        weight and no panel weight.
      household_continuity: rotating-panel
      cluster_id_continuity: redefined
      cluster_id_note: |-
        `v` changes KIND here: the EA code `comm` through 2011-12, the parish code
        `h1aq4a` from 2013-14 (CONTENTS.org, "Cluster (PSU) identifier").  A parish
        is not an EA, so no crosswalk can exist.  Measured: 0 of 1,717 linked
        households keep `v`.
      source_type: derived-from-data
      confidence: high
      source_file: null
      locator: 'slurm_logs/2026-09-18_gh942_cluster_identity/DESIGN.org §2 (Uganda rows); re-measured 2026-10-19 through Country("Uganda").sample()'
    oversamples:
      - what: 'rural portions of ten districts oversampled by the UNHS 2005/06'
        status: attested-not-identifiable
        treatment: deflated-in-selection-probability
      - what: 'the 20% "target tracking" sub-sample -- two households per EA designated for tracking (waves 1-4)'
        status: attested
        treatment: null
        _status: 'see CONTENTS.org "Oversamples and sub-samples inside a wave" item 2; recorded here because it is a within-wave sub-population, not a stratum'
    source_file: 'lsms_library/countries/Uganda/2013-14/Documentation/ (BID sec. 1.2, PDF p. 6)'
    locator: 'BID section 1.2, PDF page 6'
    design_statement: |-
      Within each stratum, the UNPS EAs were selected from the UNHS 2005/06 EAs with equal probability, and with implicit stratification by urban/rural and district (in this order), except for the rural portions of the ten districts that were oversampled by the UNHS 2005/06. In these districts, the probabilities were deflated, to bring them back to the levels originally intended.
    documentation_status: carried-forward
    notes: |-
      The wave's own population.yml notes repeat "3,123 households in 322 EAs
      selected from the 783 EAs of UNHS 2005/06" -- the 2009-10 design, not
      this wave's sample.  Treat the household/EA counts in that sentence as
