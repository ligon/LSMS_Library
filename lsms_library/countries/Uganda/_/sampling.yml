# Sampling design record -- HOW this survey's sample was drawn.
#
#   *** EXEMPLAR (GH #793).  Vocabulary FROZEN as-is, @ligon 2026-10-18. ***
#
# Read by `lsms_library/sampling.py` (`Country('Uganda').sampling`, and
# `df.attrs['sampling']` on every Uganda table).  Every field name and every
# controlled value in this file IS the vocabulary: the loader refuses a field
# or a `design_tag` / `source_type` / `confidence` / `documentation_status` /
# `oversamples[].status` value it does not already use.  Widening it is a
# decision, made in sampling.py, not by typing a new word here.
#
# Sibling of `population.yml`, and deliberately separate from it: that file
# records what a sample REPRESENTS (its universe), this one records how it was
# SELECTED.  Two different facts, from two different parts of a document, with
# different failure modes -- Uganda 2005-06's population.yml already carries
# design detail in `notes` prefixed "Design detail (not universe)", which is
# exactly the material this file is for.
#
# One entry per wave, keyed by the API wave label (an element of
# `Country(...).waves`).
#
# ---------------------------------------------------------------------------
# THE TAG IS AN EDITORIAL READING.  IT IS NOT A QUOTE.  NO DOCUMENT USES IT.
# ---------------------------------------------------------------------------
#
# `design_tag` therefore NEVER travels alone, for the same reason
# `universe_tag` does not:
#
#   source_type  where the statement came from
#                  local-documentation  a document the repo holds
#                  wb-catalog           WB catalog / DDI metadata only
#                  derived-from-data    inferred from `sample()`; NOT a claim
#                                       about the design (see below)
#                  not-found            looked, found nothing
#   confidence   how strongly the source states a DESIGN
#                  high    the document describes the selection procedure
#                  medium  a design mentioned in passing, or partially stated
#                  low     inference, or text that should not be read as design
#
# A reader who quotes `design_tag` without those two has turned an editorial
# reading into a fact.
#
# ---------------------------------------------------------------------------
# DERIVED QUANTITIES DO NOT BELONG IN THIS FILE.
# ---------------------------------------------------------------------------
#
# PSU counts, strata counts and weight dispersion computed from `sample()`
# live in `.coder/sampling/fingerprint.csv` and are regenerated by
# `scripts/sampling_fingerprint.py`.  Keeping them out avoids a second source
# of truth that silently rots, and keeps the distinction that matters: what a
# document CLAIMS versus what the delivered data SHOWS.  They are not the same
# measurement even when they agree -- Uganda's `v` is a DISTRICT/PARISH
# composite in 2018-19 and 2019-20 and carries split-off codes in 2009-10, so
# the derived PSU count is NOT the design's EA count and must not be compared
# to it naively.
#
# `documentation_status: carried-forward` marks a wave whose statement is
# boilerplate repeated from an earlier wave rather than a description of that
# wave's own sample.  Uganda waves 2013-14 onward all repeat "3,123 households
# over 322 EAs", which was the 2009-10 design; the fingerprint reports 706 /
# 875 / 781 / 824 PSUs for those waves.  Nigeria's CONTENTS.org already names
# this pattern ("Boilerplate warning (W3, W4, W5)").  The flag is a factual
# observation about the DOCUMENT, not an inference about the design.
#
# Absent information is written `null` with a `_status` note, never guessed
# and never silently omitted.

Sampling:

  '2005-06':
    design_tag: two-stage-stratified-cluster
    source_type: local-documentation
    confidence: high
    survey: 'Uganda National Household Survey 2005/06 (UNHS 2005/06) — the baseline frame from which the UNPS panel was later drawn'
    stages: 2
    stages_note: |-
      Three-stage in IDP-camp districts of Northern Uganda: IDP camp, then
      'block' within camp, then household.  A single `stages: 2` is therefore
      incomplete for this wave and the exception is recorded rather than
      averaged away.
    stage_units: [enumeration-area, household]
    psu: enumeration-area
    frame: '2002 Population and Housing Census list of Enumeration Areas'
    stratification:
      variable: stratum
      basis: region-x-urban-rural
      explicit_labels: [Kampala, Central Rural, East Rural, North Rural, West Rural, Other Urban]
      implicit: null
      n_stated_in_document: null
      _status: 'label list and count are from the library''s own strata table in CONTENTS.org, harmonized via categorical_mapping.org; no document searched states a stratum count'
    selection:
      psu: null
      ssu: simple-random
      pps: null
      _status: 'the manual states households were "selected randomly" within EA; it does not state the EA selection probability for this wave'
    take_per_psu: 10
    panel:
      role: baseline
      rotation: null
    oversamples: []
    source_file: 'lsms_library/countries/Uganda/2005-06/Documentation/UNHS.2005-06.Interviewer.Manual.FINAL.pdf'
    locator: "Chapter One, section 'SURVEY DESIGN' (PDF page 4; printed page 2)"
    design_statement: |-
      The UNHS 2005/06 will use the 2002 Population and Housing Census list of Enumeration Areas (EAs) as its sampling frame. ... A sample of about 750 Enumeration Areas (EAs) has been selected. The selected areas will be visited by UBOS field workers who will list all households living in the EAs. 10 households will be selected randomly from each EA.
    documentation_status: wave-specific
    notes: |-
      "about 750 EAs" is the UNHS baseline, not the UNPS panel: the UNPS drew
      322 EAs from the 783 EAs the UNHS visited.  Do not read the 750 as this
      wave's realized cluster count.
    record_source: 'population.yml notes ("Design detail (not universe)") + CONTENTS.org "Sampling Design"'

  '2009-10':
    design_tag: two-stage-stratified-cluster
    source_type: local-documentation
    confidence: high
    survey: 'Uganda National Panel Survey (UNPS) wave 1'
    stages: 2
    stages_note: null
    stage_units: [enumeration-area, household]
    psu: enumeration-area
    frame: 'the 783 EAs visited by UNHS 2005/06'
    stratification:
      variable: stratum
      basis: region-x-urban-rural
      explicit_labels: [Kampala, Central Rural, East Rural, North Rural, West Rural, Other Urban]
      implicit: [urban-rural, district]
      n_stated_in_document: null
      _status: 'implicit stratification is quoted in the 2011-12 / 2013-14 BIDs and describes the UNPS panel as drawn, i.e. this wave'
    selection:
      psu: equal-probability-within-stratum
      ssu: null
      pps: false
      _status: 'quoted below; the BID is explicit that EA selection was equal-probability, not PPS'
    take_per_psu: null
    allocation: |-
      3,123 households in 322 EAs drawn from the 783 EAs of UNHS 2005/06; all
      34 Kampala EAs plus 72 EAs (58 rural, 14 urban) in each of
      Central-excl.-Kampala, Eastern, Western and Northern.
    panel:
      role: panel-baseline
      rotation: null
      household_continuity: panel
      cluster_id_continuity: mixed
      cluster_id_note: |-
        339 of this wave's 656 `v` values are synthetic 0.05-degree GPS bins
        ('@lat,lon'), not clusters: movers and split-offs whose `comm` is blank get a
        `coalesce_coord_bin` label (CONTENTS.org, "Hybrid v in 2009-10").  The rest
        are the 2005-06 frame EA, but the survey files render `comm` as a 7-character
        string here and as an int32 8-digit code in 2005-06, and the library serves
        both un-harmonised -- a harmonisation gap, not a redraw (the Uganda `comm`
        rendering issue, to be filed; DESIGN.org Q5).  Measured: 0 of 2,607 linked
        households keep `v`.
      source_type: derived-from-data
      confidence: high
      source_file: null
      locator: 'slurm_logs/2026-09-18_gh942_cluster_identity/DESIGN.org §2 (Uganda rows); re-measured 2026-10-19 through Country("Uganda").sample()'
    oversamples:
      - what: 'rural portions of ten districts oversampled by the UNHS 2005/06'
        status: attested-not-identifiable
        treatment: deflated-in-selection-probability
        _status: |-
          The ten districts are NEVER NAMED in any document searched (all eight
          waves' BIDs/DDIs plus the 2005/06 interviewer manual, grepped for
          "oversampl").  Attested but not reconstructible from what the repo
          holds; absorbed into the weights and not identifiable in the data.
    source_file: 'lsms_library/countries/Uganda/2011-12/Documentation/ (BID sec. 1.2, PDF p. 6); identical wording in the 2013-14 BID sec. 1.2, PDF p. 6'
    locator: 'BID section 1.2, PDF page 6'
    design_statement: |-
      Within each stratum, the UNPS EAs were selected from the UNHS 2005/06 EAs with equal probability, and with implicit stratification by urban/rural and district (in this order), except for the rural portions of the ten districts that were oversampled by the UNHS 2005/06. In these districts, the probabilities were deflated, to bring them back to the levels originally intended.
    documentation_status: wave-specific
    notes: |-
      IDP-camp EAs are excluded from the UNPS subsample from this wave on:
      "Since IDP camps are now mostly unoccupied, the extra EAs in IDP camps
      are not a part of the UNPS subsample."  The derived PSU count for this
      wave (656) exceeds the design's 322 EAs because `v` carries split-off
      and mover codes -- see CONTENTS.org, "Hybrid `v` in 2009-10".
    record_source: 'population.yml notes + CONTENTS.org "Sampling Design" > oversamples'

