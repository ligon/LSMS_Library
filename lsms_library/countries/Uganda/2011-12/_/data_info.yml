Country: Uganda
Wave: 2011-12

household_roster:
    file: ../Data/GSEC2.dta
    idxvars:
        i: HHID
        pid: PID
    myvars:
        Sex: h2q3
        Relationship: h2q4
        # Age list = [age, day, month, year] -> ../_/2011-12.py reduces
        # to a scalar via tools.age_handler() (GH #177).
        Age:
            - h2q8
            - h2q9a
            - h2q9b
            - h2q9c
        MonthsSpent: h2q5

individual_education:
    file: ../Data/GSEC4.dta
    idxvars:
        i: HHID
        pid: PID
    myvars:
        # GH #171: highest grade/class completed (h4q7).  Raw labels
        # ('Completed P.7', ...) map onto the canonical ordinal levels via the
        # row-additive harmonize_education table.
        Educational Attainment:
            - h4q7
            - mappings: ['harmonize_education', 'Original Label', 'Preferred Label']

housing:
    file: ../Data/GSEC9A.dta
    idxvars:
        i: HHID
    myvars:
        Roof: h9q4
        Floor: h9q6

sample:
    # GH #1120 D2 (@ligon 2026-10-23): AGSEC1, the agriculture cover, records
    # 57 households that GSEC1 does not, and it carries no location or weight
    # for them (no geographic column at all in this wave).  `df_ag` puts them
    # into the frame (the `_frame` marker; `i` only) so the plot tables'
    # households have a `sample` row; the country hook `uganda.sample` gives
    # each a SINGLETON `v` (`moved-{hhid}`, Nigeria's convention), never NaN.
    # Their weight, strata, Rural and Region are NaN: no file states them.
    dfs:
        - df_main
        - df_ag
    df_main:
        file: ../Data/GSEC1.dta
        idxvars:
            i: HHID
        myvars:
            v: comm
            weight: mult
            panel_weight: mult  # pre-refreshment — same as cross-sectional
            strata: sregion
            Rural: urban
            Region: region
    df_ag:
        file: ../Data/AGSEC1.dta
        idxvars:
            i: HHID
        myvars:
            _frame: HHID
    merge_on:
        - i
    final_index:
        - t
        - i

cluster_features:
    dfs:
        - df_main
        - df_geo
    df_main:
        file: ../Data/GSEC1.dta
        idxvars:
            i: HHID
            v: comm
        myvars:
            Region: region
            Rural: urban
            District: h1aq1
    df_geo:
        file: ../Data/UNPS_Geovars_1112.dta
        idxvars:
            i: HHID
        myvars:
            Latitude: lat_mod
            Longitude: lon_mod
    merge_on:
        - i
    final_index:
        - t
        - v
