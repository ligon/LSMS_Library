# Derivations -- served numbers in this country's tables that are NOT survey
# answers but CONSTRUCTIONS from raw answers.  One entry per registry key,
# `country::table::name`; the same key sits in the served table's
# `Derivation` column on every row it produced.  Loader and field contract:
# lsms_library/derivations.py.  Design: SkunkWorks/derived_values.org.
#
# Sibling of population.yml and recall.yml: a .yml here moves no cache hash.

Niger::food_acquired::7day-purchase-at-last-purchase-unit-value:
  waves: ['2018-19', '2021-22']
  columns: [Expenditure]
  rows: {s: purchased}
  rule: >-
    Expenditure = Quantity * (s07bq08 / s07bq07a), where Quantity is the row's
    own served purchased quantity, (s07bq03a - s07bq04 - s07bq05).clip(lower=0)
    -- the 7-day consumption net of own production AND of gifts received, which
    is the survey's own accounting identity -- and s07bq08 / s07bq07a is the
    unit value of the household's LAST PURCHASE of the item.  NaN where
    s07bq07a is missing or not positive, and NaN where the last purchase was
    made in a different unit from the consumption unit (s07bq07b/s07bq07c vs
    s07bq03b/s07bq03c): this construction converts nothing between units, and
    NA is the honest answer.  (This entry used to say no EHCVM wave ships a
    unit-conversion table; 2021-22 does, GH #1452, and it is not used here.)
    Units are compared on
    the EHCVM numeric code where the label carries one, else on the label with
    case, accents, padding and punctuation folded -- the two variables carry
    DIFFERENT value-label sets inside the same .dta.  Before GH #876 the served
    Expenditure was s07bq08 itself: the value of one purchase of unrecorded
    size made up to 30 days earlier, beside a 7-day quantity.
  function: lsms_library.ehcvm:derive_ehcvm_purchase_value
  inputs: lsms_library.countries.Niger.2018-19._.mapping:inputs_food_acquired
  raw_variables: [s07bq03a, s07bq03b, s07bq03c, s07bq04, s07bq05, s07bq07a,
                  s07bq07b, s07bq07c, s07bq08]
  assumptions:
    - text: >-
        the unit value of the last purchase is the price the household paid
        over the 7-day consumption window.  s07bq08 is the value of ONE
        purchase, which s07bq06 places up to 30 days back, while s07bq03a is
        the quantity consumed over 7 days -- one row, two clocks.
      basis: variable-label
      evidence: >-
        Stata labels in s07b_me_ner2018.dta, s07b_me_ner2021.dta: s07bq08 "7B.08. Valeur (en FCFA) du [PRODUIT]
        achete la derniere fois"; s07bq03a "7B.03a. Qtite tot du [PRODUIT]
        conso par le MEN au cours des 7 derniers jours"; s07bq07a "7B.07a.
        Quelle est la quantite du [PRODUIT] achete la derniere fois?"
    - text: >-
        a last purchase reported in a different unit from the consumption is
        NOT converted, and a row with no last purchase has no unit value to
        apply: the row is served with Expenditure NA. Counts are on the SERVED
        denominator -- purchased rows of the delivered table, after the
        canonical reshape and the (t, v, i, j, u, s) collapse -- because that
        is the number a user sees; the source-row counts are smaller and were
        what an earlier version of this entry quoted. 2018-19: 23,036 of the
        89,819 SERVED purchased rows (25.6%) -- 5,070 because no last purchase
        was reported at all (s07bq08 or s07bq07a missing / not positive),
        6,463 because the last purchase used a different unit CODE, 11,503
        because it used the same code in a different SIZE (Petit / Moyen /
        Grand / Taille unique), which is a different container and so a
        different price per unit. 2021-22: 18,384 of the 116,633 SERVED
        purchased rows (15.8%) -- 4,714 because no last purchase was reported
        at all (s07bq08 or s07bq07a missing / not positive), 5,975 because the
        last purchase used a different unit CODE, 7,695 because it used the
        same code in a different SIZE (Petit / Moyen / Grand / Taille unique),
        which is a different container and so a different price per unit.
      basis: variable-label
      evidence: >-
        the 2018-19 waves distribute no unit-conversion table, and 2021-22's
        ehcvm_nsu is not applied to a price;
        lsms_library/categorical_mapping/ehcvm_units.org is a code->label
        codebook with no factors
    - text: >-
        the quantity multiplied is the SURVEY'S OWN accounting identity,
        (s07bq03a - s07bq04 - s07bq05).clip(0) -- construction "C", chosen by
        @ligon on 2026-09-12 because it is the only one of the three candidates
        ehcvm_conso reproduces.  The alternatives, measured, are A = the gross
        7-day consumption s07bq03a (which would put the value of own-produced
        and gifted food into Expenditure) and B = net of own production only.
        2018-19: A 55,185,511, B 54,463,268, C (served) 53,351,991 FCFA, against a raw s07bq08 total of 84,069,922.  2021-22: A 68,483,668, B 68,004,724, C (served) 67,358,383 FCFA, against a raw s07bq08 total of 99,448,402.
      basis: modelling-choice
      evidence: SkunkWorks/derived_values.org; GH #876; measured 2026-09-12
    - text: >-
        the gift quantity s07bq05 is served as its own s = 'inkind' row, in the
        consumption unit s07bq03b, with Expenditure NA.  EHCVM asks no value for
        a gift.  UEMOA's depan(Don) is s07bq05 priced at this same last-purchase
        unit value -- verified, and therefore demonstrably an imputation by the
        people who built the aggregate rather than an answer anybody gave -- so
        it is checked and not served.  Own production keeps the identical
        treatment it already had (s = 'produced' from s07bq04, Expenditure NA).
        2018-19: 8,141 inkind rows carrying 26,531 units, 0 with an Expenditure.  2021-22: 7,112 inkind rows carrying 21,111 units, 0 with an Expenditure.
      basis: modelling-choice
      evidence: SkunkWorks/derived_values.org; GH #876; measured 2026-09-12
  validated_against: >-
    the product-level check against ehcvm_conso does not run for this wave: its
    conso codpr does not share a keyspace with s07bq01 here, and CotedIvoire
    2018-19 distributes no conso file at all.  The construction is validated on
    the two waves where the join works -- Togo 2018 and Guinea-Bissau 2018-19 --
    in which it reproduces depan(Achat) within 1% for 99.5% / 100% of the rows
    where the candidates differ, against 13.1% / 48.6% for the
    own-production-only residual and 0.0% / 0.0% for the gross 7-day quantity;
    s07bq05 * uv reproduces depan(Don) for 99.7% / 100%, which is why the gift
    rows are served with Expenditure NA rather than with that imputation.  The
    instrument is the same in all twelve waves (identical s07bq0* Stata
    labels), so the reading carries by inference, not by measurement here.
  contents: 'Niger/_/CONTENTS.org, "food_acquired: one row, two windows (GH #876)"'
  since: '2026-09-12'

Niger::community_prices::one-item-per-price:
  waves: ['2018-19']
  columns: [Quantity]
  rule: >-
    Quantity = 1 on every served 2018-19 community_prices row, in the row's
    own unit-size `u`.  s05_co_ner2018.dta records, per (grappe, product
    s05q01, unit-size s05q02), two prices -- s05q03 "5.03. Relevé 1-Prix (en
    FCFA)" -> obs 1 and s05q04 "5.04. Relevé 2-Prix (en FCFA)" -> obs 2 (a
    key's second record -> obs 3 / 4) -- and NO quantity.  The instrument
    prices one item of the selected unit-size, so the quantity a price was
    recorded for is one `u` by construction of the form, not by any answer.
    Price is served as recorded; nothing is divided, rescaled or converted,
    and no size is collapsed (`Tas (Petit)` is its own unit).
  function: lsms_library.countries.Niger.2018-19._.mapping:derive_s05_one_item_per_price
  inputs: lsms_library.countries.Niger.2018-19._.mapping:inputs_community_prices
  raw_variables: [grappe, vague, Existe, s05q01, s05q02, s05q03, s05q04]
  assumptions:
    - text: >-
        each recorded price is the price of ONE item of the selected
        unit-size.  The Niger CAPI price questionnaire ("Qx Communautaire
        Prix- NIGER_V1_VF", cover REPUBLIQUE DU NIGER / INSTITUT NATIONAL DE
        LA STATISTIQUE) has, per product present in the market, a multiple
        choice of at most six unit-sizes (5.02, "Veuillez selectionner les
        unités tailles qui existent pour ce produit sur ce marché") and, per
        selected unit-size, "5.03. Relevé 1 Prix (en FCFA)" and "5.04. Relevé
        2 Prix (en FCFA)", both NUMÉRIQUE: ENTIER with the validations "must
        be a multiple of 5" and "> 0".  There is no quantity question.
      basis: questionnaire
      evidence: >-
        UEMOA regional catalogue entry 48 "EHCVM Edition 1 au Niger",
        https://phmecv.uemoa.int/nada/index.php/catalog/48/download/199
        (vague 1) and /download/200 (vague 2); the s05 Stata variable labels
        "5.03. Relevé 1-Prix (en FCFA)" / "5.04. Relevé 2-Prix (en FCFA)"
        match.  NOT the Excel files World Bank catalog 4296 ships as
        ner_ehcvm1_qnr_community_excel_vague{1,2}.xls: those are Chad's
        template (cover REPUBLIQUE DU TCHAD, three relevés of Quantité + Prix).
    - text: >-
        the distributed prices are served as recorded, including the 3,973
        s05q03 and 4,272 s05q04 values (9.4% / 10.1%) that are not integers
        (denominators 2, 3, 4, 8, 6).  The instrument accepted only integers
        that are multiples of 5, so those values were produced after
        collection, by a mechanism no held document describes; they are taken
        to be per one item like the rest and are not reversed or flagged.
      basis: modelling-choice
      evidence: >-
        Niger/_/CONTENTS.org, "2018-19 community prices are wired (GH #823)";
        slurm_logs/isa_backlog_2026-10-21/823-niger-s05/measure_823.json
  validated_against: >-
    the instrument only.  No held file records the quantity behind a price,
    so the one-item reading cannot be checked against data; the unit-size
    labels (5.02) and the two price questions (5.03 / 5.04) are the only
    fields the form collects.
  contents: 'Niger/_/CONTENTS.org, "2018-19 community prices are wired (GH #823)"'
  since: '2026-10-22'

Niger::sample::region-milieu-stratum:
  waves: ['2018-19', '2021-22']
  columns: [strata]
  rows: {}
  rule: >-
    strata = '<s00q01 label> <s00q04 label>', the region and area of residence the
    household cover page records, for example 'Maradi Rural'.  Labels and never
    codes.  NA where either is missing.  No household file of these waves records a
    stratum.  The region part is then spelled through this country's `strata` table
    in categorical_mapping.org, at read time, which is the `Region` table crossed
    with the two milieu labels.
  function: lsms_library.ehcvm:derive_region_milieu_stratum
  inputs: lsms_library.countries.Niger.2018-19._.mapping:inputs_strata
  raw_variables: [s00q01, s00q04]
  assumptions:
    - text: >-
        the stratum of the 2018/19 design is the combination of region and locality.
      basis: questionnaire
      evidence: >-
        ner_ehcvm2_information_de_base.pdf (held, 2021-22/Documentation), p.12: "La strate
        est la combinaison région/milieu."  The English version, p.9, writes "region/locality",
        which is ambiguous.  A Basic Information Document, not the instrument.  DDI 4296
        says only "2-stage".
    - text: >-
        the survey's own coding is the same cross.
      basis: variable-label
      evidence: >-
        ehcvm_nsu_ner2021.dta, a unit table: `strate`, value labels AgadezUrbain,
        AgadezRural, ...; its 16 values are 2018-19's 16 cells, NiameyRural among them.
    - text: >-
        the 79 grappes new in 2021-22 (75 urban, 4 rural) belong to the stratum of the
        region and milieu their cover records.  The BID describes only the 2018/19
        plan and says the second edition revisits the same clusters, which these are
        not.
      basis: modelling-choice
      evidence: Niger/_/CONTENTS.org, "the NPK slot's label, and strata by wave" (GH #812).
    - text: >-
        a cluster takes the cover page's label in each wave rather than carrying a
        2018-19 label forward.  Of 5,055 households in both waves 35 (3 clusters)
        change stratum: Niamey Rural to Niamey Urbain, Diffa Rural to Diffa Urbain.  The
        files are not unanimous on this.  The 2021-22 cover and welfare files write those 2
        Niamey clusters Urbain, while ehcvm_ponderations_ner2021.dta still codes them Rural
        (24 households, exactly 2018-19's two Niamey Rural clusters).  Their weights do not
        settle it: log weight 5.82 and 6.11, against 5.73 (sd 0.42) for the other 59 Niamey
        clusters.
      basis: modelling-choice
      evidence: Niger/_/CONTENTS.org, GH #812 ruling option W2, 2026-11-04.
  validated_against: >-
    the BID's sentence above and, in 2021-22, the weights: share of var(log cluster
    weight) between these cells 67.3%, against 23.4% between regions alone.  In 2018-19
    it is 58.3% against 57.1%, so there the label rests on the documents.  BID Table 1,
    households by region, wave and milieu, p.9, equals 2021-22 in 15 of 15 cells once one
    misprint is read: it prints Tillaberi urban wave 1 as 106, where the file holds 96, and
    so do that row's own total of 336 (96 + 240), that column's total of 1,177 and the
    BID's second table, p.11.  tests/test_gh812_ehcvm_strata.py transcribes the table.
    That does not corroborate that the cells are strata: titled "initial sample", it
    totals to the delivered file (6,622 households), so it tabulates the same two cover
    variables, and the match checks this reading of the cover.  Table 1 has a second
    misprint, a total: Tahoua wave 1 prints 453, where 106 + 348 is 454.  Table 2's
    one-household differences in Diffa and Maradi equal the weight file's `milieu`.
  contents: 'Niger/_/CONTENTS.org, "EHCVM strata are region x milieu labels (GH #812)"'
  since: '2026-11-04'

# A DELETION: a dropped row has nowhere to carry a Derivation key, so this entry
# is the disclosure (`rows: 0`), `derivation_inputs` returns the dropped slots,
# and the served rows of those records carry `second_entry_disagrees`.
Niger::community_prices::first-entry-of-duplicate:
  waves: ['2011-12', '2014-15']
  columns: [Price, Quantity]
  rows: 0
  rule: >-
    A CS07 (grappe, variety, passage) entered twice is served from its FIRST
    entry: file order in 2011-12 passage 2, numquest in 2014-15.  A slot of the
    second entry that repeats a first-entry row in every served column is a copy
    (134 rows).  A slot that repeats none (30 rows: 2011-12 15, 2014-15 15) is
    not served, and every served row of that record carries
    second_entry_disagrees = True.  A second entry that only blanks a price, with a
    0 or a sentinel, leaves no slot and does not flag: 5 served slots, 3 of them in
    2 records otherwise unflagged.  2018-19 s05 records two readings per key and its
    second records stay obs 3 / 4: a different mechanism, not this rule.
  function: lsms_library.countries.Niger._.niger:derive_cs07_first_entry
  inputs: lsms_library.countries.Niger._.niger:inputs_cs07_second_entries
  raw_variables: [grappe, numquest, cs07q01, cs07q02, cs07q03, cs07q04, cs07q05,
                  cs07q06, cs07q07, cs07q08, cs07q09, cs07q10, cs07q11]
  assumptions:
    - text: >-
        a second source record of one (grappe, variety, passage) is a duplicate
        entry of one questionnaire, not a second reading.  2011-12 passage 2
        ships 150 of its 232 grappes as two contiguous 90-row blocks, 13,478 of
        the second block's 13,500 rows byte-identical to the first; 2014-15
        grappe 212 has two numquest that agree on the obs-1 Price of all 67
        varieties both price.
      basis: modelling-choice
      evidence: >-
        Niger/_/CONTENTS.org, "The second records are duplicate ENTRIES" (GH
        #840 red team r1); measured on the held files.
    - text: >-
        the first entry is the one served, by position and not by quality; no
        rule in the files says which of two conflicting entries is right.  12 of
        the 30 slots are the same price and quantity under another unit code, 12
        another quantity, 2 another price, and 4 price a slot the first entry
        left empty.  One of those 4 is the only price of its record (2011-12
        passage 2, variety 7311, first entry at the 99999 sentinel), so that
        record is no longer served at all and no row can carry the flag.
      basis: modelling-choice
      evidence: >-
        ruling @ligon 2026-11-04 on GH #1087, option (c).  The per-kind option
        (d), a correction, was not taken.
  validated_against: >-
    the raw CS07 grids, read independently of the build
    (tests/test_gh1087_niger_second_entries.py): the served rows of every record
    are its first entry's, and the slots returned here are the ones the first
    entry does not hold.
  contents: 'Niger/_/CONTENTS.org, "community_prices: a record entered twice serves its first entry (GH #1087)"'
  since: '2026-11-04'

Niger::crop_production::dry-season-cycle-total:
  waves: ['2011-12']
  columns: [Quantity, Quantity_kg]
  rows: {plot_id: Farm-level}
  rule: >-
    On a dry-season row (2011-12 section 3E, ecvmaas3e_p1), Quantity is 3E.9a
    as03eq09a x 3E.6 as03eq06, the harvest per cycle times the cycles, in the
    recorded unit u, and Quantity_kg is 3E.9c as03eq09c x as03eq06, the same product
    of the survey's kilograms (GH #1436).  as03eq09a == 99999 (1 row) and as03eq09c ==
    99999 (42 rows) are masked before the product.  A zero answer is zero; the function
    does that, and _finish_crop_production then masks a 0 kg beside a positive quantity
    (74 rows), which is no answer, so Quantity_kg is NA there.  On the
    526 served one-cycle rows the product is the answer; it differs on the 49
    multi-cycle rows, 48 of them with a harvest.  Quantity_sold and Value_sold are
    served as recorded under dry-season-sale-window, not multiplied.
  function: lsms_library.countries.Niger._.niger:derive_dry_season_cycle_total
  inputs: lsms_library.countries.Niger._.niger:inputs_dry_season_cycle_total
  raw_variables: [hid, as03eq01, as03eq03, as03eq06, as03eq09a, as03eq09b, as03eq09c]
  assumptions:
    - text: >-
        every cycle of a crop yields what as03eq09a records.  The English
        questionnaire says the first cycle: 3E.9 "How much of this produce did you
        harvest during the first cycle of production?", likewise 3E.8 and 3E.11, and
        3E.19-22 "on average for the first cycle"; the DDI's English file agrees.
        On that wording the product extrapolates the first cycle over the later
        ones.  The Stata label, "quantite en uml de ce produit avez-vous recolte en
        moyenne pour chaque cycle", would make it the season's harvest, but it is not
        independent evidence for an average: the rainy as02eq07a carries the same
        label in a module with no cycle question, whose English label says "on this
        plot", so it is a template, and which way the copy ran is unknown.  The French
        instrument is not held.  The ruled product stands, on 48 rows and 43,204 kg:
        6.3% of section 3E's kilograms and 3.4% of the wave's.
      basis: modelling-choice
      evidence: >-
        ecvmaas3e_p1.dta and ecvmaas2e_p2.dta variable labels;
        ECVMA_Quest_AGR_P1_V10_eng.pdf, Section 3E, printed pp. 27-29;
        ddi-documentation-english_microdata-2050.pdf; ruling @ligon 2026-11-04 on GH
        #1462.
    - text: >-
        as03eq09a == 99999 is a "don't know", masked before the product, never on
        the total.  It is unlabelled, and a different width from the rainy module's
        999999.  Its sibling kg columns as03eq09c and as03eq11c carry 99999 on 42
        and 39 rows, and the one row has a stated kilogram and sale beside it.
      basis: modelling-choice
      evidence: >-
        measured on the held file; the GH #865 reading of the rainy codes
        (Niger/_/CONTENTS.org, "The VALUE sentinel").
  validated_against: >-
    the survey's own dispositions, which test the footing and not the reading: on
    the 23 multi-cycle rows whose five disposition units equal the harvest unit, the
    sum sold + consumed + seed + feed + gift equals as03eq09a on 18 and the product
    on none (single-cycle rows, 130 of 227).  So the answers of 3E are all per
    cycle; whether first or average, the file cannot say.
  contents: 'Niger/_/CONTENTS.org, "the dry season: read in 2011-12, not asked in 2014-15 (GH #1462)"'
  since: '2026-11-04'

Niger::crop_production::dry-season-sale-window:
  waves: ['2011-12']
  columns: [Quantity_sold, Value_sold]
  rule: >-
    Identity on dry-season rows with a positive sale: Quantity_sold is as03eq11a and
    Value_sold as03eq12, as recorded after their exact codes (as03eq12 == 9999999, 1
    row).  Nothing is multiplied by as03eq06.  The quantity is asked per cycle, and
    the value states no window.  Quantity remains a total over cycles, so on a
    multi-cycle row Quantity_sold / Quantity is not a sold share.  A zero sale
    carries no key.  Joined to dry-season-cycle-total with sorted '+'.
  function: lsms_library.countries.Niger._.niger:derive_dry_season_sale_window
  inputs: lsms_library.countries.Niger._.niger:inputs_dry_season_sale_window
  raw_variables: [hid, as03eq01, as03eq03, as03eq06, as03eq10, as03eq11a, as03eq11b,
                  as03eq12]
  assumptions:
    - text: >-
        preserve the reported sale without choosing a window for the value.  Stata
        labels as03eq11a "vendu en moyenne pour chaque cycle" (the template of the
        harvest assumption) and as03eq12 "montant tire de la vente de ce produit";
        the English instrument asks 3E.11 "during the first cycle of production" and
        3E.12 "the amount received from the sale of this product".  Over the 19 crop-unit cells priced on both kinds of row
        (39 multi-cycle rows, thin), the median cell's multi-cycle unit value is 1.17
        times its one-cycle unit value, which does not look like a total over cycles
        and does not settle it.
      basis: modelling-choice
      evidence: >-
        ecvmaas3e_p1.dta variable labels; ECVMA_Quest_AGR_P1_V10_eng.pdf, Section
        3E; the Mali::crop_production::tree-sale-window ruling, whose shape this
        follows; measured on the held file.
  validated_against: >-
    the raw 3E rows, read independently of the build
    (tests/test_gh1462_niger_dry_season.py).
  contents: 'Niger/_/CONTENTS.org, "the dry season: read in 2011-12, not asked in 2014-15 (GH #1462)"'
  since: '2026-11-04'

Niger::crop_production::survey-kg-estimate:
  waves: ['2021-22']
  columns: [Quantity_kg]
  rule: >-
    Identity on a 2021-22 row with a Quantity_kg: 16C.16c s16cq16c, served as recorded
    and read first by the crop ladder (survey_kg).  The key says what the number is.
    The instrument calls it an estimate, so a row's kilograms are the survey's
    conversion of its local unit and not a weighing.  2011-12 and 2014-15 ask "quantite
    en kgs recoltee", without that word, and carry no key.
  function: lsms_library.countries.Niger._.niger:derive_survey_kg_estimate
  inputs: lsms_library.countries.Niger._.niger:inputs_survey_kg_estimate
  raw_variables: [s16cq04, s16cq16a, s16cq16b, s16cq16c, s16cq16d]
  assumptions:
    - text: >-
        s16cq16c is the total for the line in kilograms, as estimated, and not a factor
        per unit.  Within a unit it scales with s16cq16a; kg / q is exactly 2.5 on 2,881
        of 4,402 Tiya rows, 12.5 on 853 of 4,773 Botte rows, 100 on 893 of 1,233 Sac de
        100kg rows.  Whether the interviewer or the form did the conversion is not
        stated.  The state of the product does not move it: the median per Tiya is 2.5
        in grain and on the ear, and the median per 100 kg sack is 100 in both.
      basis: questionnaire
      evidence: >-
        ner_ehcvm2_qnr_men_excel_vague1.pdf, PDF p. 82, section 16C, header "Estimation
        Quantite totale UML en kg", a NOMBRE field; s16c_me_ner2021.dta s16cq16c "16C.16c.
        Estimation Quantite totale UML en kg".
  validated_against: >-
    tests/test_niger_crop_survey_kg.py, whose oracle reads s16c directly.  An identity has
    nothing to validate but its rows.
  contents: 'Niger/_/CONTENTS.org, "2026-11-04 -- crop_production: the survey harvest kilograms are served (GH #1436)"'
# GH #1457 (bulk ruling 2026-11-04, extending #843 option (d)).
Niger::crop_production::hh-crop-sale-single-row:
  waves: ['2014-15', '2021-22']
  columns: [Quantity_sold, Value_sold, Unit_sold, Condition_sold]
  rule: >-
    2014-15 AS2E2 and 2021-22 s16d record a sale for the household and crop, with no
    plot.  A sale is a record with a positive quantity or value.  Where the crop has
    exactly one served harvest line -- one served row, not merely one plot (GH #1360),
    and a line with no quantity, month or stand does not count where another does, since
    the API removes it -- the sale is served on it as recorded, in its own Unit_sold, and
    that row carries this key.  What is derived is the ATTACHMENT, not the numbers.  Any other sale is served
    on ONE row of that household and crop with plot_id = 'Farm-level', u = 'Unknown',
    condition = 'unknown_condition', production_obs = 'unresolved_observation', no
    Quantity and no key, because its index value discloses it.  No sale is split, summed
    or dropped.  A recorded 0 on a one-line crop stays, with no key: it is not a sale.
  function: lsms_library.countries.Niger._.niger:derive_hh_crop_sale_attachment
  inputs: lsms_library.countries.Niger._.niger:inputs_hh_crop_sale_single_row
  raw_variables: [CULTURE, AS02EQ110B, AS02EQ12A, AS02EQ12B, AS02EQ13, s16cq04, s16dq01,
                  s16dq05a, s16dq05b, s16dq05d, s16dq06]
  assumptions:
    - text: >-
        the crop module asks the sale once per crop, with no plot.  Where the crop has one
        harvest line no other row can hold it.  The sale is not thereby a share of that
        line's Quantity.
      basis: variable-label
      evidence: >-
        ECVMA2_AS2E2P2.dta and s16d_me_ner2021.dta have no field or parcel variable; s16d's
        lines repeat once per harvest line (Niger/_/CONTENTS.org, GH #824), and exact
        repeats are dropped before anything here.
    - text: >-
        a sale of a crop on two or more lines is not allocated among them, since any split
        would be invented, and that includes two lines of one crop on ONE plot (144 sales,
        4,585,225 FCFA in 2021-22), whose plot is knowable and lost here.
      basis: modelling-choice
      evidence: >-
        rulings @ligon 2026-11-03 and 2026-11-04, GH #843 option (d), GH #1457.  Nigeria's
        further ruling A, the one row that STATES a harvest, is not extended here; 12 sales
        (260,550 FCFA, 2014-15) and 12 (696,200 FCFA, 2021-22) sit on Farm-level under it,
        with one line stating a harvest among several served lines.
  validated_against: >-
    tests/test_gh1457_niger_multi_plot_sales.py, whose oracle reads the two files directly.
    Cold builds: 2014-15 583 keyed rows and 498 Farm-level rows hold the 1,081 sales, 78,919,660
    + 34,249,850 = 113,169,510 FCFA; 2021-22 1,265 and 553 hold the 1,818, 68,629,070 + 36,330,475 =
    104,959,545 FCFA, each the raw sum (exact s16d repeats dropped first).  Not validated against
    an external total: no document here reports one.
  contents: 'Niger/_/CONTENTS.org, "2026-11-04 -- multi-plot sales (GH #1457)"'
  since: '2026-11-04'

Niger::food_acquired::nsu-national-unit-weight:
  waves: ['2018-19', '2021-22']
  columns: [Quantity_kg]
  rule: >-
    Quantity_kg = Quantity x kg_factor, per acquisition source, where kg_factor is the
    median over ehcvm_nsu_ner2021.dta's rows of the row's (product, unit, size), in grams over 1000.
    Unit and size are the row's s07bq03b and s07bq03c codes in both waves.  The product
    is the s07bq01 code in 2021-22, whose numbering the table uses; in 2018-19, whose
    numbering is a different one, it is found by LABEL, never by code (ehcvm.
    nsu_product_crosswalk): the same label up to spelling, else through the country's
    harmonize_food, else the parts of a label listing goods the instrument later split,
    else the label's stem.  A product reading several table products takes the median of
    their weights.  Each row's tier is nsu_join in derivation_inputs.  NA, with no key,
    where no weight is found; where the served unit is Kg or Litre, whose kilograms the
    label states; and where the row's canonical key is duplicated at the build, because
    core sums Quantity on such a key and selects any other column.  Those rows stay on the
    inferred ladder.  No Quantity or u changes.
  function: lsms_library.ehcvm:derive_nsu_kg_factor
  inputs: lsms_library.countries.Niger.2021-22._.mapping:inputs_food_acquired_unit_weight
  raw_variables: [s07bq01, s07bq03a, s07bq03b, s07bq03c, s07bq04, s07bq05, annee, strate, produit, unite, taille, p50, mu]
  assumptions:
    - text: >-
        a key's weight in the table is the weight of that unit of that product in
        that size, for any row of the wave.  The survey ships the table; the served
        row's own quantity is untouched.
      basis: variable-label
      evidence: >-
        ehcvm_nsu_ner2021.dta, read by code; unit and size codes agree with s07b_me's on
        every code both files label, up to spelling.
    - text: >-
        national, not by stratum.  Against an independent implied weight, a household's
        last-purchase unit value over the same stratum's median Kg price with 5+ reports each,
        the national weight's median absolute log error is 0.22 against the stratum cell's 0.24,
        within 2x 92.2% against 85.9%.  Row by row this reverses, 0.31 against 0.24, though
        national stays ahead within 2x (87.8% against 81.8%).  Market Tiya weighings by stratum
        settle it: national 0.170 / 95.2%, stratum 0.186 / 92.0%, and a stratum's departure from
        the national weight predicts nothing (slope 0.014).  Over the whole file 99.9% of
        consumed rows find a weight, 77% a stratum cell; stratum weights would add 7.3% to the
        kilograms on rows both serve.
      basis: modelling-choice
      evidence: >-
        GH #1452, 2026-11-04.  The check is noisy: a small lot's price per kg runs
        above a kilogram's, so the implied weight runs high, and it compares the
        two rules, not either with the truth.
    - text: >-
        the file is cumulative, not two annual tables: annee 2021 holds the keys of
        43% of 2021-22's consumed rows and the whole file 99.9%, and the two years
        share only 98 of 1,578 keys.  A key's weight comes from its latest annee, so
        a 2018 weighing serves a 2021-22 row where 2021 did not weigh that key.  The
        file says nothing about its design and this wave's folder holds no documentation.
        Mali's BID (s.2.3, Mali's document, not Niger's) describes one that fits: NSU factors
        collected in 2018/19 "remain valid", with a supplementary collection in 2021 to complete
        missing units.  Both years use 2021-22's product codes.  On the 98 shared keys, 24
        disagree by more than 1.5x; they carry 10,673 rows and 31,699 kg.  Of the 119,315
        consumed rows with a table weight, 65,127 (115,462 kg) read a 2018 weighing and
        54,188 (62,363 kg) a 2021 one; a row's year is nsu_year in derivation_inputs.
      basis: modelling-choice
      evidence: >-
        ehcvm_nsu_ner2021.dta, s07b_me_ner2021.dta.  (Sel, Sachet, Petit) is the
        commonest consumed key and exists only in the 2018 rows.  The household
        check below reads the 2018 rows as well as the 2021 rows on 2021-22 prices:
        within 2x 92.1% (126 cells) and 96.2% (79 cells).
    - text: >-
        mu, the column labelled mean, not p50.  p50 reads 985.6 g on Kg rows: it is
        a constant 0.9856 on a median (p50 / 0.9856 is an integer on 71% of rows, p50
        itself on 4%; p50 / mu is exactly 0.9856 on 3,772 of 9,518 rows), and mu reads
        1000.  Nothing is corrected: mu is a column the survey ships.  A mean is the
        more exposed to a bad weighing, which the national median then damps.
      basis: modelling-choice
      evidence: >-
        stated-mass rows of the file, mean absolute log error of the national p50 /
        mu: Kg 0.031 / 0.021, Sac (50 Kg) 0.032 / 0.023, Sac (25 Kg) 0.016 / 0.005,
        Sac (100 Kg) 0.278 / 0.274.
    - text: >-
        2018-19 reads the same weight per key as 2021-22, with the product found by label,
        because this file's product codes are 2021-22's (126 of the 138 codes the two
        household files share name different foods).  Of 2018-19's consumed rows 91,411 join
        on the label, 1,889 as the parts of a bundle, 621 through harmonize_food and 401 on
        the stem; 98.3% of non-metric served rows read a weight, 60,526 consumed rows from a
        2018 weighing and 33,796 from a 2021 one.
      basis: modelling-choice
      evidence: >-
        Ruling @ligon 2026-11-04.  Matched items, 2021-22 over 2018-19, median / row-weighted:
        Kg rows 1.04 / 0.98, inference 1.00 / 1.08, both waves on the table 1.05 / 1.04.
        Staple cereals among consumers, g per person per day: inference 262 -> 281, table
        440 -> 442.
    - text: >-
        Kg and Litre keep their labels.  Their table rows are not read: a kilogram is
        a kilogram, and a table litre is not a density (in these tables most oils
        read exactly 1000 g).
      basis: modelling-choice
      evidence: GH #1452, 2026-11-04.  Those rows are the check on the join instead.
  validated_against: >-
    the rows whose label states the mass, which the table was not fitted to: the
    national weight of a Kg row is 1000 g at the median, and the delivered factor
    reproduces the table read directly from the two files
    (tests/test_ehcvm_unit_weights.py).  Outside the survey's households: ehcvm_prix_ner2021.dta weighs market
    lots.  National weight against market grams over 112 (product, unit) keys, at the size
    nearest the market weight: median abs. log error 0.144, within 2x 94.6%, signed -0.001; 26
    Tiya keys 0.116 / 96.2%.  Outliers: Poivron frais x2.04, Sorgho x1.28 (Tiya Entier 3,168 g
    in the table, 2,469 g at market, 2018 rows only), Piment seche x0.60.  Table rows against
    market per-kg go from 0.735 / 47.6% under the inference to 0.295 / 75.2%, and item medians'
    correlation with the market from 0.25 to 0.84.
    Measured kilograms are in Niger/_/CONTENTS.org.
  contents: 'Niger/_/CONTENTS.org, "EHCVM unit-weight table wired (GH #1452)"'
  since: '2026-11-04'

# A FLAG, not our construction (GH #1708): the producers' file carries a computed
# s07bq07a on these records.  The rows are served unchanged and say so.
Niger::food_acquired::computed-last-purchase-quantity:
  waves: ['2018-19']
  columns: [Expenditure]
  rows: {s: purchased}
  rule: >-
    A purchased row built from a record of s07b_me_ner2018.dta whose s07bq07a (the
    quantity of the last purchase) is positive and off the quarter grid, i.e. not a
    multiple of 0.25, carries this key beside its 7day-purchase-at-last-purchase-unit-value
    key.  Nothing is changed: the row's Expenditure is still Quantity x s07bq08 /
    s07bq07a, and it passes through that s07bq07a.  A purchased row that shares its
    key with an unflagged record's (core sums the two) carries it too.  15,264 of the
    107,263 positive s07bq07a are flagged (14.2%); 15,014 of those records become a
    served purchased row.
  function: lsms_library.countries.Niger.2018-19._.mapping:computed_last_purchase_rows
  inputs: lsms_library.countries.Niger.2018-19._.mapping:inputs_computed_last_purchase
  raw_variables: [s07bq03a, s07bq03b, s07bq03c, s07bq04, s07bq05, s07bq06, s07bq07a,
                  s07bq07b, s07bq07c, s07bq08]
  assumptions:
    - text: >-
        an off-grid s07bq07a in this file was computed after collection, not entered.
        14,908 of the 15,264 carry 13 to 18 decimals, which is double-precision
        arithmetic; the same instrument in 2021-22 has 15 off-grid values in 112,923.
        The unit value s07bq08 / s07bq07a on these records is one value per (product,
        unit, size, region) on 13,735 of them, and on 3,013 s07bq08 is not an integer
        either, though the CAPI field is "NUMERIQUE: ENTIER".
      basis: questionnaire
      evidence: >-
        Niger EHCVM-1 CAPI household questionnaires, vague 1 and 2 (UEMOA NADA catalog
        48, download 191 / 192): s07Bq07a "NUMERIQUE: DECIMAL", s07Bq08 "NUMERIQUE:
        ENTIER", both enabled under s07Bq06 in (1, 2, 3).  Data checks of 2026-11-12
        (reports/ehcvm2-live-s07bq03a-check, reports/served-corrections).
    - text: >-
        the rows are flagged and served, not dropped or set NA: the drop decision is
        the maintainer's, and comes after the diagnosis.  How the values were built is
        not documented anywhere found; Niger/_/CONTENTS.org has the diagnosis.
      basis: modelling-choice
      evidence: Ruling @ligon 2026-11-12, "Flag now, diagnose".
  validated_against: >-
    the served table: the candidate build equals the base build in every row and every
    column but Derivation, and derivation_inputs joins every flagged row.
  contents: 'Niger/_/CONTENTS.org, "2018-19 s07bq07a computed on 14.2% of records (GH #1708)"'
  since: '2026-11-12'
