# Derivations -- served numbers in this country's tables that are NOT survey
# answers but CONSTRUCTIONS from raw answers.  One entry per registry key,
# `country::table::name`; the same key sits in the served table's
# `Derivation` column on every row it produced.  Loader and field contract:
# lsms_library/derivations.py.  Design: SkunkWorks/derived_values.org.
#
# Sibling of population.yml and recall.yml: a .yml here moves no cache hash.

Guinea-Bissau::food_acquired::7day-purchase-at-last-purchase-unit-value:
  waves: ['2018-19', '2021-22']
  columns: [Expenditure]
  rows: {s: purchased}
  rule: >-
    Expenditure = Quantity * (s07bq08 / s07bq07a), where Quantity is the row's
    own served purchased quantity, (s07bq03a - s07bq04 - s07bq05).clip(lower=0)
    -- the 7-day consumption net of own production AND of gifts received, which
    is the survey's own accounting identity -- and s07bq08 / s07bq07a is the
    unit value of the household's LAST PURCHASE of the item.  NaN where
    s07bq07a is missing or not positive, and NaN where the last purchase was
    made in a different unit from the consumption unit (s07bq07b/s07bq07c vs
    s07bq03b/s07bq03c): no EHCVM wave ships a unit-conversion table, so there
    is no exact conversion and NA is the honest answer.  Units are compared on
    the EHCVM numeric code where the label carries one, else on the label with
    case, accents, padding and punctuation folded -- the two variables carry
    DIFFERENT value-label sets inside the same .dta.  Before GH #876 the served
    Expenditure was s07bq08 itself: the value of one purchase of unrecorded
    size made up to 30 days earlier, beside a 7-day quantity.
  function: lsms_library.ehcvm:derive_ehcvm_purchase_value
  inputs: lsms_library.countries.Guinea-Bissau.2018-19._.mapping:inputs_food_acquired
  raw_variables: [s07bq03a, s07bq03b, s07bq03c, s07bq04, s07bq05, s07bq07a,
                  s07bq07b, s07bq07c, s07bq08]
  assumptions:
    - text: >-
        the unit value of the last purchase is the price the household paid
        over the 7-day consumption window.  s07bq08 is the value of ONE
        purchase, which s07bq06 places up to 30 days back, while s07bq03a is
        the quantity consumed over 7 days -- one row, two clocks.
      basis: variable-label
      evidence: >-
        Stata labels in s07b_me_gnb2018.dta: s07bq08 "7B.08. Valeur (en FCFA) du [PRODUIT]
        achete la derniere fois"; s07bq03a "7B.03a. Qtite tot du [PRODUIT]
        conso par le MEN au cours des 7 derniers jours"; s07bq07a "7B.07a.
        Quelle est la quantite du [PRODUIT] achete la derniere fois?"
    - text: >-
        a last purchase reported in a different unit from the consumption is
        NOT converted, and a row with no last purchase has no unit value to
        apply: the row is served with Expenditure NA. Counts are on the SERVED
        denominator -- purchased rows of the delivered table, after the
        canonical reshape and the (t, v, i, j, u, s) collapse -- because that
        is the number a user sees; the source-row counts are smaller and were
        what an earlier version of this entry quoted. 2018-19: 13,226 of the
        90,381 SERVED purchased rows (14.6%) -- 3,314 because no last purchase
        was reported at all (s07bq08 or s07bq07a missing / not positive),
        6,218 because the last purchase used a different unit CODE, 3,694
        because it used the same code in a different SIZE (Petit / Moyen /
        Grand / Taille unique), which is a different container and so a
        different price per unit.
      basis: variable-label
      evidence: >-
        no EHCVM wave distributes a unit-conversion table;
        lsms_library/categorical_mapping/ehcvm_units.org is a code->label
        codebook with no factors
    - text: >-
        the quantity multiplied is the SURVEY'S OWN accounting identity,
        (s07bq03a - s07bq04 - s07bq05).clip(0) -- construction "C", chosen by
        @ligon on 2026-09-12 because it is the only one of the three candidates
        ehcvm_conso reproduces.  The alternatives, measured, are A = the gross
        7-day consumption s07bq03a (which would put the value of own-produced
        and gifted food into Expenditure) and B = net of own production only.
        2018-19: A 60,051,736, B 59,225,643, C (served) 57,552,943 FCFA, against a raw s07bq08 total of 91,353,380.
      basis: modelling-choice
      evidence: SkunkWorks/derived_values.org; GH #876; measured 2026-09-12
    - text: >-
        the gift quantity s07bq05 is served as its own s = 'inkind' row, in the
        consumption unit s07bq03b, with Expenditure NA.  EHCVM asks no value for
        a gift.  UEMOA's depan(Don) is s07bq05 priced at this same last-purchase
        unit value -- verified, and therefore demonstrably an imputation by the
        people who built the aggregate rather than an answer anybody gave -- so
        it is checked and not served.  Own production keeps the identical
        treatment it already had (s = 'produced' from s07bq04, Expenditure NA).
        2018-19: 13,818 inkind rows carrying 55,995 units, 0 with an Expenditure.
      basis: modelling-choice
      evidence: SkunkWorks/derived_values.org; GH #876; measured 2026-09-12
  validated_against: >-
    ehcvm_conso_gnb2018.dta, the survey's OWN aggregate (UEMOA).  On the 35
    unique (household, product) rows where an Achat row exists, the units match
    and the candidates differ, this rule x 365/7 reproduces depan(Achat) within
    1% for 100% of rows, against 48.6% for the own-production-only residual and
    0.0% for the gross 7-day quantity.  s07bq05 * uv reproduces depan(Don)
    within 1% for 100% of 149 rows -- an imputation at the same unit value,
    checked and deliberately not served.  (Togo 2018, the same way: 99.5% /
    13.1% / 0.0%, Don 99.7% of 1,255.)  2021-22 (wired 2026-11-13): the rule
    x 365/7 reproduces depan(Compra) within 1% for 91.3% of the rows that join
    one to one -- arithmetic only, since the rule is invariant to q3 and q7a
    moving TOGETHER, and this wave's quantities are rounded (separately); see
    Guinea-Bissau::food_acquired::s07b-quantities-rounded-to-even.
  contents: 'Guinea-Bissau/_/CONTENTS.org, "food_acquired: one row, two windows (GH #876)"'
  since: '2026-09-12'

Guinea-Bissau::community_prices::one-item-per-price:
  waves: ['2018-19']
  columns: [Quantity]
  rule: >-
    Quantity = 1 on every served community_prices row, in the row's own
    unit-size `u`.  s05_co_gnb2018.dta records, per (grappe, product s05q01,
    unit-size s05q02), two prices -- s05q03 -> obs 1 and s05q04 -> obs 2 -- and
    NO quantity.  The form prices one item of the selected unit-size, so the
    quantity a price was recorded for is one `u` by construction of the form,
    not by any answer.  Price is served as recorded; nothing is divided,
    rescaled or converted, and no size is collapsed.
  function: lsms_library.countries.Guinea-Bissau.2018-19._.mapping:derive_s05_one_item_per_price
  inputs: lsms_library.countries.Guinea-Bissau.2018-19._.mapping:inputs_community_prices
  raw_variables: [grappe, vague, Existe, s05q01, s05q02, s05q03, s05q04]
  assumptions:
    - text: >-
        each recorded price is the price of ONE item of the selected unit-size.
        Guinea-Bissau's CAPI price form ("QUESTIONÁRIO COMUNITÁRIO- PARTE DO
        PREÇO", cover REPÚBLICA DA GUINÉ-BISSAU / INSTITUTO NACIONAL DE
        ESTATÍSTICA) has, per product present in the market, a multiple choice
        of at most six unit-sizes (5.02) and, per selected unit-size,
        "5.03. Levantamento 1 Preços (CFAC)" and "5.04. Levantamento 2 Preços
        (CFAC)", both NUMERIC: INTEGER, validated as multiples of 5 and above 0.
        There is no quantity question.  No questionnaire is held for this
        country; only the DDI report is.
      basis: questionnaire
      evidence: >-
        UEMOA regional catalogue entry 46,
        https://phmecv.uemoa.int/nada/index.php/catalog/46/download/161 and
        /download/162 (GNB-EHCVM1-QNR-PRIX-CAPI-VAGUE1 / VAGUE2; not held).
    - text: >-
        the distributed prices are served as recorded, including the 68 s05q03
        and 83 s05q04 values that are not integers.  The instrument accepted
        only integers that are multiples of 5, so those values were produced
        after collection, by a mechanism no held document describes; they are
        taken to be per one item like the rest and are neither reversed nor
        flagged.
      basis: modelling-choice
      evidence: Guinea-Bissau/_/CONTENTS.org, "2018-19 community prices are wired (GH #1226)"
  validated_against: >-
    the instrument only.  No held file records the quantity behind a price, so
    the one-item reading cannot be checked against data.
  contents: 'Guinea-Bissau/_/CONTENTS.org, "2018-19 community prices are wired (GH #1226)"'
  since: '2026-11-04'

Guinea-Bissau::sample::region-milieu-stratum:
  waves: ['2018-19', '2021-22']
  columns: [strata]
  rows: {}
  rule: >-
    strata = '<s00q01 label> <s00q04 label>', the cover page's own region
    and residence milieu, stripped and separated by one space. Labels, never
    numeric codes; NA where either component is missing or blank. The region
    part is spelled through this country's strata aliases at read time,
    preserving the native Portuguese Urbano/Rural suffix.
  function: lsms_library.ehcvm:derive_region_milieu_stratum
  inputs: lsms_library.countries.Guinea-Bissau.2018-19._.mapping:inputs_strata
  raw_variables: [s00q01, s00q04]
  assumptions:
    - text: >-
        the original 2018/19 design defines a stratum as region combined with
        residence milieu. The later survey revisits the original clusters, so
        its households carry their clusters' strata. 2018-19 was wired on
        2026-11-10; 2021-22 on 2026-11-13 (gnb stream), by the rule of the
        2026-11-12 ruling "EHCVM-2 2021-22 strata, GH1575 extension: Same rule
        as #1575", which names Togo, Benin and Cote d'Ivoire; the 2021-22
        weights file's own `strate` (17 codes) is recorded as a comparison,
        not served (Guinea-Bissau/_/CONTENTS.org).
      basis: questionnaire
      evidence: >-
        Own INE Basic Information Document (survey design documentation, not a
        questionnaire question), 2021-22/Documentation/gnb_ehcvm2_information_de_base.pdf,
        section 4.1, PDF p.16 (English edition p.13): "La strate est la
        combinaison région/milieu de résidence." Catalog 6274/download/100359;
        retrospective description of the original 2018/19 design.
    - text: >-
        SAB is documented as urban-only. The later allocation table is labeled
        2021/22 while surrounding prose describes the original design; its
        nonzero-cell arithmetic is not a formally quoted stratum count and
        imposes no observed-count requirement or row exclusion.
      basis: questionnaire
      evidence: >-
        Own 2018 DDI p.4 / basicinformationdocument_gnb.pdf p.10, and own
        second-edition BID Table 1a; Guinea-Bissau/_/CONTENTS.org, "documented
        planned region/milieu strata (GH #1575)". No allocation is inferred
        from sampling weights.
  validated_against: >-
    Documentary definition and static wiring only. Actual-row validation,
    missingness, cluster consistency, non-strata conservation, normal cold/warm
    sample and Feature acceptance are UNRUN in this source/pure worker. (That
    sentence is the 2026-11-10 construction stage; CONTENTS.org records its completed
    2018-19 validation.) 2021-22, extended 2026-11-13: the weights file's own `strate`
    (17 codes) is one-to-one with this construction on all 5,351 households (measured,
    gnb stream); a cold sample() serves it on every household with the key, and
    tests/test_gnb_2021_wave.py re-derives the served value from the inputs.
  contents: 'Guinea-Bissau/_/CONTENTS.org, "Selected 2018-19 region/milieu strata (GH #1575)"'
  since: '2026-11-10'

Guinea-Bissau::food_acquired::s07b-quantities-rounded-to-even:
  waves: ['2021-22']
  columns: [Quantity, Expenditure]
  rows: {}
  rule: >-
    Every food_acquired row of 2021-22 with a quantity (purchased, produced, in kind) is
    served from the release's s07b quantities AS RELEASED (ruling 2026-11-13, "Serve, registered key"),
    and those quantities are not the households' answers: they are rounded to even
    integers by a step no document records.  Quantity is the released s07bq03a net of
    s07bq04 and s07bq05 (purchased), s07bq04 (produced) or s07bq05 (in kind); the
    purchased Expenditure is the 7-day key's Quantity x s07bq08 / s07bq07a, so it is
    derived from rounded quantities too.  Nothing is recovered: the identity is applied.
    The consumed rows the release rounds to 0 are not served as released: they carry
    Guinea-Bissau::food_acquired::s07bq03a-rounded-to-zero-withheld instead.
  function: lsms_library.countries.Guinea-Bissau.2021-22._.mapping:quantity_as_released
  inputs: lsms_library.countries.Guinea-Bissau.2021-22._.mapping:inputs_quantities_rounded
  raw_variables: [s07bq03a, s07bq03b, s07bq03c, s07bq04, s07bq05, s07bq07a, s07bq07b,
                  s07bq07c, s07bq08]
  assumptions:
    - text: >-
        the release rounds every 7-day quantity to an even integer.  Every positive
        s07bq03a (128,229) and s07bq07a (96,262) is even, in every unit (Unidade
        counts included); s07bq04 / s07bq05 are even but for 23 rows each, the same 23,
        where s07bq03a = s07bq04 + s07bq05.  2018-19 has 70,949 odd and 6,119
        fractional values of 125,483, and Benin, Togo, Cote d'Ivoire, Senegal, Niger and
        Mali 2021-22 have odd and fractional values everywhere; the same 2021-22 GNB
        release holds halves in s16b and s16c, so the CAPI took decimals.  The quantities
        are stored as Stata byte (int8; 2018-19: double).  s07bq08, the value, carries no
        rounding signature (6.5% odd against 7.3% in 2018-19).
      basis: derived-from-data
      evidence: >-
        gnb stream, isa-sm-20261113 (burst jobs 41271796, 41271889, 41272010, 41272061,
        reports/gnb/out/{integer,even,w21f-180307740}.json); red team
        reports/gnb-redteam/VERDICT.md, which repeated the counts and the cross-country
        comparison.
    - text: >-
        the rounding is 2 x round-half-up(x / 2), the nearest even integer, halves up
        (Stata's round(x, 2) gives exactly this, which would make it a processing slip
        rather than an imputation: unverified).  Applied to 2018-19's answers it
        reproduces 2021-22's distribution, notably the Kg and Litro zeros (0 / 2 / 4
        shares 12.6 / 44.9 / 10.9% against 13.8 / 45.4 / 8.8% for Kg).  A FIT, not a
        proof: ceiling to even fits Unidade and Monte as well, and only the Kg / Litro
        zeros tell them apart.  It maps 1, 2 and 2.5 all to 2 and 0.5 to 0, so it
        CANNOT be inverted, and the served quantities are the rounded ones.
      basis: derived-from-data
      evidence: >-
        the fitted-rule comparison (reports/gnb/out/w21f-180307740.json F2, four candidate
        rules); red team F3 (total variation distances by unit).
    - text: >-
        the purchased Expenditure inherits the rounding.  The 7-day rule is invariant
        only to q3 and q7a moving together, and the rounding moves them separately; 1,760
        rows carry s07bq07a = 0 beside a positive s07bq08 and serve Expenditure NA (no
        positive last-purchase quantity).  That ehcvm_conso_gnb2021 reproduces the rule
        on 91.3% of joined rows shows UEMOA built its aggregate from these same rounded
        quantities, not that they are raw.
      basis: derived-from-data
      evidence: >-
        reports/gnb/out/even.json (E5) and the red team's food follow-up (job 41274097).
    - text: >-
        no document records the rounding: the English BID (section 2.2 on 7B, section 7
        on processing), the EHCVM-2 enumerator manual (Q7B.03-Q7B.08 ask the quantity
        actually consumed, in its unit), and the World Bank DDI (dataProcessing empty).
        Served anyway, as the user ruled, under this key.
      basis: modelling-choice
      evidence: >-
        ruling @ligon 2026-11-13, "Wave-1 stream rulings after red team"
        (.sucoder/isa-decisions.org); documentation search in
        burst/isa-sm-20261112/reports/ehcvm2-s07bq03a-docsearch and this stream.
  validated_against: >-
    The key is on every served 2021-22 row but the withheld ones, which carry the
    withheld key, and on no 2018-19 row (tests/test_gnb_2021_wave.py); its inputs, the
    positive-quantity rows, join the
    served rows at (t, i, j).
  contents: 'Guinea-Bissau/_/CONTENTS.org, "food_acquired 2021-22: served as released, the rounding registered"'
  since: '2026-11-13'

# A WITHHELD QUANTITY (GH #1519's rule; ruling 2026-11-13, "Serve NA, as Togo"): the
# rows stay, their quantity is NA, so no reported item disappears.  It replaces the
# registered deletion `...::s07b-consumed-quantity-rounded-to-zero` (rows: 0) of the same
# day.  Togo 2021-22's `s07bq03a-floored-count-withheld` is the template.
Guinea-Bissau::food_acquired::s07bq03a-rounded-to-zero-withheld:
  waves: ['2021-22']
  columns: [Quantity, Expenditure]
  rows: {s: [purchased, other]}
  rule: >-
    A row of s07b whose household says it consumed the item in the last 7 days
    (s07bq02 = Oui) but whose released s07bq03a is 0 is served one row with Quantity NA
    and Expenditure NA, and this key: a purchased row, or, where the household says it
    never bought the item (s07bq06 = Nunca, 685 rows), a row at s='other' (ruling
    2026-11-13, "GNB 'Nunca' rows").  The other 3,260 are purchased.  The 0 is the release's rounding of a
    small quantity (see Guinea-Bissau::food_acquired::s07b-quantities-rounded-to-even),
    which cannot be inverted, so the quantity is withheld rather than served as 0 or
    guessed; the purchase value goes with it, because the served Expenditure would be
    derived from the withheld quantity (GH #1519).  A purchased row is served where a
    purchase is implied by Togo's test, the row reporting neither own production nor a
    gift, and every one of the 3,945 passes it.  A purchased row carries the 7-day key too
    (the shared reshape stamps every purchased row); an 'other' row does not.  Neither
    carries the as-released key: nothing on it is served as released.  Downstream, the derived food tables drop an NA before they sum,
    so these rows are absent there, never a zero.
  function: lsms_library.countries.Guinea-Bissau.2021-22._.mapping:zero_quantity_withheld
  inputs: lsms_library.countries.Guinea-Bissau.2021-22._.mapping:inputs_zero_quantity_withheld
  raw_variables: [s07bq02, s07bq03a, s07bq03b, s07bq03c, s07bq04, s07bq05, s07bq06,
                  s07bq07a, s07bq07b, s07bq07c, s07bq08]
  assumptions:
    - text: >-
        a consumed row with s07bq03a = 0 is a small quantity rounded down, not an
        answer: 2018-19 has none, the EHCVM-1 CAPI refused a zero there, and 1,881 of the
        3,945 are Kg and 1,682 Litro (palm oil, lemon vinegar, sugar, ground groundnut).
        q3 = 0 occurs on no other row of the file (836,167 not-consumed rows and 181
        unanswered carry no q3).
      basis: derived-from-data
      evidence: >-
        reports/gnb/out/{integer,w21-180307740,zero_probe}.json (E3, F1); the
        isa-sm-20261112 docsearch on the EHCVM-1 CAPI (self > 0).
    - text: >-
        the source is purchase by Togo's test: s07bq04 is 0 on 3,717 of the rows and NA
        on 228, s07bq05 0 on all 3,945, so none reports own production or a gift.  But
        here s07bq04 and s07bq05 are rounded too, so the test is weaker than in Togo,
        where they were exact.  s07bq06 (when last bought): Ultimos 7 dias 1,897, Ontem
        206, Ultimos 30 dias 636, Ha mais de 30 dias 521, Nunca 685.  The 2,739 rows with
        a purchase value (s07bq08 > 0, median 750 FCFA) are all among the first three;
        the 685 whose household says it never bought the item, and the 521 whose last
        purchase is over 30 days old, carry none.  Togo's precedent covered no row whose
        household says it never bought the item (its 11: 7 derniers jours 6, 30 derniers
        jours 1, Plus de 30 jours 4).  The 685 Nunca rows are served at s='other': the
        source is not a purchase, by the household's own answer, and whether it is own
        production or a gift is not known, both being rounded to 0.
      basis: modelling-choice
      evidence: >-
        rulings @ligon 2026-11-13, "Guinea-Bissau 2021-22 follow-ups and Burkina
        confirmations": "Serve NA, as Togo (Recommended)", and "GNB 'Nunca' rows":
        "s='other' (Recommended)" (.sucoder/isa-decisions.org); probe counts, gnb stream burst job 41279256 (reports/gnb/out/zero_probe.json).
  validated_against: >-
    The inputs are the 3,945 rows, and each is served exactly one row with Quantity and
    Expenditure NA that joins it at (t, i, j): 3,260 purchased, 685 at s='other'; no other row carries the key
    (tests/test_gnb_2021_wave.py).  No household holds both sugar codes in one unit and
    size, so the Togo collision rule withholds no other row.
  contents: 'Guinea-Bissau/_/CONTENTS.org, "food_acquired 2021-22: served as released, the rounding registered"'
  since: '2026-11-13'

# A WITHHELD ANSWER (ruling 2026-11-13, "Exclude from HH size (Recommended)").
Guinea-Bissau::household_roster::departed-monthsspent-withheld:
  waves: ['2021-22']
  columns: [MonthsSpent]
  rule: >-
    A person s01q00aa says has left the household is served in the roster, with
    `Departed` True, and with MonthsSpent NA, so household_characteristics counts the
    household the survey counts.  12 of the 341 leavers answered s01q12 ("lived here 6
    months or more in the last 12?"; all Sim, served 12), in 3 households; their answer
    is withheld and these 12 rows carry this key.  The other 329 have no answer to
    withhold and carry no key.
  function: lsms_library.countries.Guinea-Bissau.2021-22._.mapping:withhold_departed_months
  inputs: lsms_library.countries.Guinea-Bissau.2021-22._.mapping:inputs_departed_monthsspent_withheld
  raw_variables: [s01q00aa, s01q12]
  assumptions:
    - text: >-
        a leaver is not a member of the household the survey describes: ehcvm_individu
        (41,160 people) and ehcvm_welfare.hhsize leave all 341 out.  Before the
        withholding, 9 of the 12, in 2 households, entered household_characteristics
        (+9 persons, Sex x age counts 40,322 -> 40,331); the other 3 carry no sex and no
        age and fell in no bracket.  An s01q12 Sim is a true answer for a recent leaver
        (6 months or more of the last 12), so the answer is withheld, not corrected:
        the recorded value is in derivation_inputs.
      basis: modelling-choice
      evidence: >-
        ruling @ligon 2026-11-13, "Guinea-Bissau 2021-22 follow-ups and Burkina
        confirmations": "Exclude from HH size (Recommended)" (.sucoder/isa-decisions.org);
        gnb stream burst jobs 41275945 and 41278042; red team
        reports/gnb-redteam/VERDICT-delta.md, point 3.
  validated_against: >-
    MonthsSpent is NA on every Departed row; the key is on exactly the 12 rows whose
    s01q12 is answered, and the inputs join them at (t, i, pid)
    (tests/test_gnb_2021_wave.py).
  contents: 'Guinea-Bissau/_/CONTENTS.org, "2021-22 wired", household_roster'
  since: '2026-11-13'
