      source_type: derived-from-data
      confidence: medium
      locator: '_/derivations.yml, Ethiopia::sample::region-rural-stratum; 2021-22/_/sample.py builds it from sect_cover_hh_w5.dta `saq01` and `saq14` through ethiopia.derive_region_rural_stratum and stamps it through ethiopia.stamp_region_rural_stratum; CONTENTS.org, "2026-11-25 -- sample.strata is a registered construction (GH #1741)"'
      note: |-
