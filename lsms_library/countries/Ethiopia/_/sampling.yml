# Sampling design record -- HOW this survey's sample was drawn (GH #793).
#
# NO DESIGN FIELDS (GH #942, ruling 2026-10-18, option A): an entry carries the
# `panel:` block -- does `v` denote the same cluster as in the PRECEDING wave of
# `Country('Ethiopia').waves`? -- and the `served_strata:` block below, each with
# its own provenance.  The design fields are #793's curation and are not written
# yet; their absence here is "not curated", not "not found".
#
# Read by `lsms_library/sampling.py`.  `cluster_id_continuity` in
# {wave-scoped, redefined, mixed} makes a `Country('Ethiopia')` frame that
# carries `v` across that boundary warn (`ClusterIdentityWarning`); nothing is
# ever dropped or rewritten.  The first wave (2011-12) has no preceding wave
# and so no `panel:` block.  Vocabulary and field names: see sampling.py.
#
# SERVED STRATA (GH #1577 ruling 2026-11-12; GH #1741): all five waves serve one
# construction, region x Rural, registered in _/derivations.yml.  It is a tag on the
# served column, not a reading of the design: no document quoted in CONTENTS.org
# states that cross.  `confidence: medium` because the build scripts were read and no
# frame was; tests/test_sampling.py::test_the_tag_agrees_with_the_served_strata checks
# the frame where the data are held.

Sampling:

  '2011-12':
    served_strata:
      holds: constructed
      derivation: 'Ethiopia::sample::region-rural-stratum'
      source_type: derived-from-data
      confidence: medium
      locator: '_/derivations.yml, Ethiopia::sample::region-rural-stratum; 2011-12/_/sample.py builds it from sect_cover_hh_w1.dta `saq01` and `rural` through ethiopia.derive_region_rural_stratum and stamps it through ethiopia.stamp_region_rural_stratum; CONTENTS.org, "2026-11-25 -- sample.strata is a registered construction (GH #1741)"'
      note: |-
        `Urban` is small towns only: ESS1 has no large-town sample (CONTENTS.org,
        GH #683).  18 occupied cells are recorded for 10 regions x 2; CONTENTS.org's
        table names one empty cell (Dire Dawa Urban), not the other.

  '2013-14':
    served_strata:
      holds: constructed
      derivation: 'Ethiopia::sample::region-rural-stratum'
      source_type: derived-from-data
      confidence: medium
      locator: '_/derivations.yml, Ethiopia::sample::region-rural-stratum; 2013-14/_/sample.py builds it from sect_cover_hh_w2.dta `saq01` and `rural` through ethiopia.derive_region_rural_stratum and stamps it through ethiopia.stamp_region_rural_stratum; CONTENTS.org, "2026-11-25 -- sample.strata is a registered construction (GH #1741)"'
      note: |-
        `Urban` pools small towns and large towns, which came from two frames, so
        the served cell is coarser than the draw (the registry entry).
    panel:
      household_continuity: panel
      cluster_id_continuity: wave-scoped
      cluster_id_note: |-
        `v` is `ea_id` in 2011-12 and `ea_id2`, the wave-2 re-identified EA,
        in 2013-14 -- two disjoint code spaces for the same EAs.  Measured: 0
        of 3,776 linked panel households keep `v`, and their 333 cluster pairs
        are a COMPLETE bijection (every W1 EA maps to exactly one W2 EA, zero
        violations), so a crosswalk is derivable; the ESS may ship it directly
        in Pub_ETH_HouseholdGeovars_Y2 (unverified, DESIGN.org Q6).  The 100
        large-town EAs added this wave are new and have no W1 antecedent.
      cluster_id_measurement:
        linked_households: 3776
        households_changed: 3776
        clusters_renumbered: 333
        note: |-
          Historical measurement (2026-10-19): none of the 3,776 linked panel
          households kept `v`; their 333 cluster pairs formed a complete
          bijection (every W1 EA mapped to exactly one W2 EA). No movement
          classification was applied, so the net-of-movers count was not
          measured. Counts retain the scope of that dated measurement.
        source_type: derived-from-data
        confidence: high
        locator: 'Historical 2026-10-19 measurement, recorded in sampling.yml at 79f5979cf8022e64928c5150950dfb00456994da, 2013-14 panel.cluster_id_note, and CONTENTS.org "Cluster (PSU) identifier" (measured through Country("Ethiopia").sample()); GH #1135 H3 table (3,776 linked, 3,776 change)'
      source_type: derived-from-data
      confidence: high
      source_file: null
      locator: 'CONTENTS.org, "Cluster (PSU) identifier" (ea_id vs ea_id2); slurm_logs/2026-09-18_gh942_cluster_identity/DESIGN.org §2.4; re-measured 2026-10-19 through Country("Ethiopia").sample()'

  '2015-16':
    served_strata:
      holds: constructed
      derivation: 'Ethiopia::sample::region-rural-stratum'
      source_type: derived-from-data
      confidence: medium
      locator: '_/derivations.yml, Ethiopia::sample::region-rural-stratum; 2015-16/_/sample.py builds it from sect_cover_hh_w3.dta `saq01` and `rural` through ethiopia.derive_region_rural_stratum and stamps it through ethiopia.stamp_region_rural_stratum; CONTENTS.org, "2026-11-25 -- sample.strata is a registered construction (GH #1741)"'
      note: |-
        `Urban` pools small towns and large towns, which came from two frames, so
        the served cell is coarser than the draw (the registry entry).
    panel:
      household_continuity: panel
      cluster_id_continuity: stable
      cluster_id_note: |-
        `ea_id2` both waves.  Measured: 4,887 of 4,887 linked households keep
        `v` on the roster (432 cluster pairs, all one-to-one).  Through `sample()`,
