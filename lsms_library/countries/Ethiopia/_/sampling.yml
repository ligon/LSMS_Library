        cover, where one small-town household's id carries the rural placeholder
        `888`.  It is not a different EA (GH #1467).
      source_type: derived-from-data
      confidence: high
      source_file: null
      locator: 'slurm_logs/2026-09-18_gh942_cluster_identity/DESIGN.org §2 (Ethiopia rows); re-measured 2026-10-19 through Country("Ethiopia").sample(); sample() figure 2026-11-04, CONTENTS.org "W3 households the survey counts as ESS1"'

  '2018-19':
    served_strata:
      holds: constructed
      derivation: 'Ethiopia::sample::region-rural-stratum'
      source_type: derived-from-data
      confidence: medium
      locator: '_/derivations.yml, Ethiopia::sample::region-rural-stratum; 2018-19/_/sample.py builds it from sect_cover_hh_w4.dta `saq01` and `saq14` through ethiopia.derive_region_rural_stratum and stamps it through ethiopia.stamp_region_rural_stratum; CONTENTS.org, "2026-11-25 -- sample.strata is a registered construction (GH #1741)"'
      note: |-
        A new draw (Panel II): a cell shares its name with a Panel I cell and nothing
        else is claimed.
    panel:
      household_continuity: independent
      cluster_id_continuity: unobservable
      cluster_id_note: |-
        ESS4 is a NEW panel ("Panel II"), "not a follow-up of the previous ESS
        waves": no household links to 2015-16 (0 shared `i`), so `v` cannot be
