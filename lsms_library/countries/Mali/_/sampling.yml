# Sampling design record -- HOW this survey's sample was drawn (GH #793).
#
# NO DESIGN FIELDS (GH #942, ruling 2026-10-18, option A): each entry carries the
# `panel:` block -- does `v` denote the same cluster as in the PRECEDING wave of
# `Country('Mali').waves`? -- and the `served_strata:` block described below, each
# with its own provenance.  The design fields are #793's curation and are not
# written yet; their absence here is "not curated", not "not found".
#
# Read by `lsms_library/sampling.py`.  `cluster_id_continuity` in {wave-scoped,
# redefined, mixed} makes a `Country('Mali')` frame that carries `v` across that
# boundary warn (`ClusterIdentityWarning`); nothing is ever dropped or rewritten.
# The first wave (2014-15) has no preceding wave and so no `panel:` block.
# Vocabulary and field names: see sampling.py.
#
# The idiosyncrasy (GH #1494): two programmes, EAC-I (2014-15, 2017-18) and EHCVM
# (2018-19, 2021-22), each numbering its clusters from 1 and its households within
# them from 1, so serials recur with no relation.  `v` is continuous inside each
# programme and not across the switch.
#
# Do NOT measure the EAC-I -> EHCVM boundary by shared `i`: 0 is shared by
# construction, because the EAC-I ids carry 'EACI14_' and 'EACI17_' prefixes
# (mali.eaci14_i, mali.eaci17_i, GH #1494).  That says nothing about `v`, exactly
# as Burkina Faso's 'EMC_' and Niger's 'E_' do not.  Before the prefix, 3,613 ids
# were shared with 2017-18.
#
# SERVED STRATA (GH #1577, ruling 2026-11-12, "Registry + sampling.yml tag"): each
# wave also says what `sample().strata` holds, in `served_strata` -- nothing
# (2014-15), EAC-I's stratum code (2017-18), and the library's region x milieu
# construction, registered in _/derivations.yml (2018-19, 2021-22).  The three are
# not comparable across waves.  2014-15 has no boundary, so its entry is
# `served_strata` alone.  These are Mali's first `served_strata` records and the
# first record of every `holds` value but `native-label` (sampling.py).

Sampling:

  '2014-15':
    served_strata:
      holds: absent
      source_type: derived-from-data
      confidence: high
      locator: 'CONTENTS.org, "2026-11-04 -- the NPK slot, the EHCVM input files, and strata by wave (GH #1445, #812)", "Strata, measured": no variable in the 55 files of 2014-15 is named or labelled a stratum; and "2026-11-04 -- EHCVM strata are region x milieu labels (GH #812)", where 2014-15 `strata` is "empty, by the ruling"; 2014-15/_/data_info.yml `sample` declares no `strata`'
      note: |-
        The EAC-I 2014 BID (catalog 2583) states "51 explicit sample strata", so
        the design was stratified; what is absent is a stratum variable in the
        files.  The one candidate, `deflator` of eaci2014_agregatconso.dta
        ("Strata deflator"), is one-to-one with region x milieu, 15 cells, not the
        design's 51, and is not read.  Carrying 2017-18's `strate` back by
        `grappe` is an inference that would leave 69 of 989 clusters empty, and is
        not done.  An own-wave stratum field or assignment rule is what would
        change this (GH #1574; .coder/ledger/1577-mali-current-served-strata.md).

  '2017-18':
    served_strata:
      holds: native-code
      variable: 'strate (EACI17_ECHANTILLON.dta)'
      source_type: derived-from-data
      confidence: high
      locator: 'CONTENTS.org, "2026-11-09 -- GH #1574: held BID visual and sampling-header checks": a metadata-only read of EACI17_ECHANTILLON.dta found `strate` labelled `codestrate`, an empty value-label-set reference and no value-label dictionaries; served through 2017-18/_/mapping.py `strata` (format_id), per "2026-11-10 -- current served-strata source trace (GH #1577)"'
      note: |-
        The weights file names it the stratum code (`codestrate`), and the BID
        (2017-18/Documentation/bid_eaci17.pdf) states 51 explicit strata (PDF
        p.10) and names this file as the sampling file (PDF p.16).  Measured
        2026-11-04 (CONTENTS.org, "Strata, measured"): codes 1-45 nest in one
        region each, 50 is "other urban" across 7 regions, 51 is Bamako; 47 of
        51 codes are occupied.  No held document names the 51 codes or binds
        them to `strate`, so no label is served (GH #1574, open).
    panel:
      household_continuity: independent
      cluster_id_continuity: stable
      cluster_id_note: |-
        `grappe` in both waves: "The EAC-I 2017 replicates the same sampling
        design as the first edition, visiting the same EAs" (BID, Section 4).
        920 ids recur, of 989 and 953, their displaced coordinates are
        identical on all 920, and Region and Rural agree once `Tomboctou` is
        spelled.  The 2017-18 cover and sample files carry no pointer to a
        2014 household, and the design selects 9 households per EA, so
        `independent`, with one thing a
        re-measurement will trip on: both waves spell `i` from the same serials,
        and before their prefixes 3,560 `i` recurred between them.  They were
        not households: on those ids 0.214 of a household's members find a same-sex member
        three years older in the other wave, against 0.219 for two different
        households of one grappe; the EHCVM panel scores 0.528 against 0.172
        on the same test (CONTENTS.org, GH #1494).  All 3,560 are 2017-18
        Lourd households and none Leger, because both waves number their rural
        households 3, 6 and 9 on that form, which is why so many recur.
      source_type: derived-from-data
      confidence: high
      source_file: null
      locator: 'measured 2026-11-04 from eaci_geovariables_2014.dta, eaci_geovariables_2017.dta, EACIIND_p1.dta and eaci17_s01p1.dta through get_dataframe; design: EAC-I 2017 BID (WB 3409), Section 4, quoted in CONTENTS.org, "2017-18 -- EAC-I 2017"'

  '2018-19':
    served_strata:
      holds: constructed
      derivation: 'Mali::sample::region-milieu-stratum'
      source_type: derived-from-data
      confidence: high
      locator: '_/derivations.yml, Mali::sample::region-milieu-stratum (waves 2018-19, 2021-22); 2018-19/_/data_info.yml `sample.df_cover.strata` = [s00q01, s00q04, {mapping: strata_label}], stamped by 2018-19/_/mapping.py; CONTENTS.org, "2026-11-04 -- EHCVM strata are region x milieu labels (GH #812)": 20 region x milieu labels'
      note: |-
        No EHCVM household file records a stratum; the BID's "The stratum is the
        combination of region and residence area" is what the construction rests
        on (the registry entry quotes it).  The region part is spelled through the
        country's `strata` table, so it equals `cluster_features.Region`.
    panel:
      household_continuity: independent
      cluster_id_continuity: redefined
      cluster_id_note: |-
        EAC-I (`grappe` 1-1070) and EHCVM-1 (`grappe` 1-1256) number their
        clusters independently, so 410 ids recur with 2017-18 and name
        unrelated EAs: the displaced coordinates of one id lie a median 100 km
        apart in the two waves, 5.2% of 405 within 10 km.  Two programmes and
        two draws: EAC-I from the 2009 census, EHCVM-1 from the 6th edition of
        the EMOP frame, 500 EAs plus 51 added in vague 2.  No household links
        across this boundary (panel_ids.py).  On the 3,613 `i` the two waves
        spelled alike before the EAC-I prefixes, 0.167 of a household's members
        find their match against 0.163 for two different households of one
        grappe.  `redefined`, not `unobservable`: the keyspaces OVERLAP, so a
        cross-wave groupby('v') merges 410 pairs of unrelated clusters, which is
        the hazard the warning exists for.  The unit KIND is the same (an EA);
        what changes is the sample list the serial indexes, as in Burkina Faso
        2018-19 and Niger 2018-19.
      source_type: derived-from-data
      confidence: high
      source_file: null
      locator: 'measured 2026-11-04 from eaci_geovariables_2017.dta, grappe_gps_mli2018.dta, eaci17_s01p1.dta and s01_me_mli2018.dta through get_dataframe; draws quoted in CONTENTS.org, "2017-18 -- EAC-I 2017" and "2018-19 -- EHCVM-1 2018/19"; no linkage: Mali/_/panel_ids.py docstring'

  '2021-22':
    served_strata:
      holds: constructed
      derivation: 'Mali::sample::region-milieu-stratum'
      source_type: derived-from-data
      confidence: high
      locator: '_/derivations.yml, Mali::sample::region-milieu-stratum (waves 2018-19, 2021-22); 2021-22/_/data_info.yml `sample.df_cover.strata` = [s00q01, s00q04, {mapping: strata_label}], stamped by 2021-22/_/mapping.py; CONTENTS.org, "2026-11-04 -- EHCVM strata are region x milieu labels (GH #812)": 17 region x milieu labels, equal to BID Table 1'
      note: |-
        Each wave's label is its own cover's: 2021-22 writes Menaka and Taoudenit
        under Gao and Tombouctou, so 429 households in both waves change stratum
        on the label alone (CONTENTS.org, "Why 20 then 17").
    panel:
      household_continuity: rotating-panel
      cluster_id_continuity: stable
      cluster_id_note: |-
        `grappe` in both waves: all 513 of 2021-22's grappes are among
        2018-19's 551, and their coordinates are identical on all 507 with a fix
        on both sides.  Region differs on 36 of the 513 once Segou is spelled
        alike (raw labels differ on 97): 23 read Menaka in 2018-19 and Gao in
        2021-22, 13 Taoudenit and Tombouctou, a recode on an unchanged EA rather
        than a renumbering.  The revisit found the 2018-19
        households where it could and enumerated replacements up to 12 per
        cluster: PanelHH is 'Oui' on 5,023 and 'Non' on 1,120.  One thing a
        re-measurement will trip on: 1,111 of the 1,120 'Non' households spell
        the same `i` as a 2018-19 household and are not it (0.151 of members
        match, against 0.157 for two different households of one grappe, and
        0.528 for the 'Oui' households).  Neither panel_ids nor updated_ids
        links them.
      source_type: derived-from-data
      confidence: high
      source_file: 'lsms_library/countries/Mali/2021-22/Data/s00_me_mli2021.dta'
      locator: 'grappe, PanelHH, GPS__Latitude, GPS__Longitude in that file, grappe_gps_mli2018.dta and s00_me_mli2018.dta, read via get_dataframe 2026-11-04; revisit strategy quoted in CONTENTS.org, "2021-22 -- EHCVM-2 2021/22"'
