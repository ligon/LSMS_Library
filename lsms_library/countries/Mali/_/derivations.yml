# Derivations -- served numbers in this country's tables that are NOT survey
# answers but CONSTRUCTIONS from raw answers.  One entry per registry key,
# `country::table::name`; the same key sits in the served table's
# `Derivation` column on every row it produced.  Loader and field contract:
# lsms_library/derivations.py.  Design: SkunkWorks/derived_values.org.
#
# Sibling of population.yml and recall.yml: a .yml here moves no cache hash.

Mali::food_acquired::7day-purchase-at-last-purchase-unit-value:
  waves: ['2018-19', '2021-22']
  columns: [Expenditure]
  rows: {s: purchased}
  rule: >-
    Expenditure = Quantity * (s07bq08 / s07bq07a), where Quantity is the row's
    own served purchased quantity, (s07bq03a - s07bq04 - s07bq05).clip(lower=0)
    -- the 7-day consumption net of own production AND of gifts received, which
    is the survey's own accounting identity -- and s07bq08 / s07bq07a is the
    unit value of the household's LAST PURCHASE of the item.  NaN where
    s07bq07a is missing or not positive, and NaN where the last purchase was
    made in a different unit from the consumption unit (s07bq07b/s07bq07c vs
    s07bq03b/s07bq03c): this construction converts nothing between units, and
    NA is the honest answer.  (This entry used to say no EHCVM wave ships a
    unit-conversion table; 2021-22 does, GH #1452, and it is not used here.)
    Units are compared on
    the EHCVM numeric code where the label carries one, else on the label with
    case, accents, padding and punctuation folded -- the two variables carry
    DIFFERENT value-label sets inside the same .dta.  Before GH #876 the served
    Expenditure was s07bq08 itself: the value of one purchase of unrecorded
    size made up to 30 days earlier, beside a 7-day quantity.
  function: lsms_library.ehcvm:derive_ehcvm_purchase_value
  inputs: lsms_library.countries.Mali.2018-19._.mapping:inputs_food_acquired
  raw_variables: [s07bq03a, s07bq03b, s07bq03c, s07bq04, s07bq05, s07bq07a,
                  s07bq07b, s07bq07c, s07bq08]
  assumptions:
    - text: >-
        the unit value of the last purchase is the price the household paid
        over the 7-day consumption window.  s07bq08 is the value of ONE
        purchase, which s07bq06 places up to 30 days back, while s07bq03a is
        the quantity consumed over 7 days -- one row, two clocks.
      basis: variable-label
      evidence: >-
        Stata labels in s07b_me_mli2018.dta, s07b_me_mli2021.dta: s07bq08 "7B.08. Valeur (en FCFA) du [PRODUIT]
        achete la derniere fois"; s07bq03a "7B.03a. Qtite tot du [PRODUIT]
        conso par le MEN au cours des 7 derniers jours"; s07bq07a "7B.07a.
        Quelle est la quantite du [PRODUIT] achete la derniere fois?"
    - text: >-
        a last purchase reported in a different unit from the consumption is
        NOT converted, and a row with no last purchase has no unit value to
        apply: the row is served with Expenditure NA. Counts are on the SERVED
        denominator -- purchased rows of the delivered table, after the
        canonical reshape and the (t, v, i, j, u, s) collapse -- because that
        is the number a user sees; the source-row counts are smaller and were
        what an earlier version of this entry quoted. 2018-19: 22,216 of the
        125,729 SERVED purchased rows (17.7%), since GH #1707 withheld the 3,356
        rice-ration rows, every one of them NA here; 25,572 of 129,085 (19.8%)
        from GH #1513, which folded its food labels, until then;
        before that 25,667 of 129,598 -- 10,771 because no last
        purchase was reported at all (s07bq08 or s07bq07a missing / not
        positive), 6,731 because the last purchase used a different unit CODE,
        8,165 because it used the same code in a different SIZE (Petit / Moyen
        / Grand / Taille unique), which is a different container and so a
        different price per unit. 2021-22: 13,243 of the 117,493 SERVED
        purchased rows (11.3%) -- 9,100 because no last purchase was reported
        at all (s07bq08 or s07bq07a missing / not positive), 2,983 because the
        last purchase used a different unit CODE, 1,160 because it used the
        same code in a different SIZE (Petit / Moyen / Grand / Taille unique),
        which is a different container and so a different price per unit.
      basis: variable-label
      evidence: >-
        the 2018-19 waves distribute no unit-conversion table, and 2021-22's
        ehcvm_nsu is not applied to a price;
        lsms_library/categorical_mapping/ehcvm_units.org is a code->label
        codebook with no factors
    - text: >-
        the quantity multiplied is the SURVEY'S OWN accounting identity,
        (s07bq03a - s07bq04 - s07bq05).clip(0) -- construction "C", chosen by
        @ligon on 2026-09-12 because it is the only one of the three candidates
        ehcvm_conso reproduces.  The alternatives, measured, are A = the gross
        7-day consumption s07bq03a (which would put the value of own-produced
        and gifted food into Expenditure) and B = net of own production only.
        2018-19: A 95,505,280, B 94,226,529, C (served) 89,614,679 FCFA, against a raw s07bq08 total of 134,798,354.  2021-22: A 104,253,106, B 103,414,014, C (served) 97,178,692 FCFA, against a raw s07bq08 total of 134,405,775.
      basis: modelling-choice
      evidence: SkunkWorks/derived_values.org; GH #876; measured 2026-09-12
    - text: >-
        the gift quantity s07bq05 is served as its own s = 'inkind' row, in the
        consumption unit s07bq03b, with Expenditure NA.  EHCVM asks no value for
        a gift.  UEMOA's depan(Don) is s07bq05 priced at this same last-purchase
        unit value -- verified, and therefore demonstrably an imputation by the
        people who built the aggregate rather than an answer anybody gave -- so
        it is checked and not served.  Own production keeps the identical
        treatment it already had (s = 'produced' from s07bq04, Expenditure NA).
        2018-19: 16,413 inkind rows carrying 58,639 units, 0 with an Expenditure.  2021-22: 16,869 inkind rows carrying 59,567 units, 0 with an Expenditure.
      basis: modelling-choice
      evidence: SkunkWorks/derived_values.org; GH #876; measured 2026-09-12
  validated_against: >-
    the product-level check against ehcvm_conso does not run for this wave: its
    conso codpr does not share a keyspace with s07bq01 here, and CotedIvoire
    2018-19 distributes no conso file at all.  The construction is validated on
    the two waves where the join works -- Togo 2018 and Guinea-Bissau 2018-19 --
    in which it reproduces depan(Achat) within 1% for 99.5% / 100% of the rows
    where the candidates differ, against 13.1% / 48.6% for the
    own-production-only residual and 0.0% / 0.0% for the gross 7-day quantity;
    s07bq05 * uv reproduces depan(Don) for 99.7% / 100%, which is why the gift
    rows are served with Expenditure NA rather than with that imputation.  The
    instrument is the same in all twelve waves (identical s07bq0* Stata
    labels), so the reading carries by inference, not by measurement here.
  contents: 'Mali/_/CONTENTS.org, "food_acquired: one row, two windows (GH #876)"'
  since: '2026-09-12'

Mali::crop_production::tree-twelve-month-total:
  waves: ['2014-15', '2017-18']
  columns: [Quantity]
  rows: {perennial: true}
  rule: >-
    On a tree-crop row, Quantity is the harvest per harvest month times
    months_harvested: 2014-15 s3bq10a x s3bq09; 2017-18 s11fq11a x s11fq10.
    This is the 12-month harvest, in the recorded unit u. Quantity_sold and
    Value_sold are served as recorded under tree-sale-window, not multiplied.
    Quantity codes 99 / 9999 / 9999.9 are masked before the product; a zero
    answer gives zero whatever the month count. Missing months, or zero
    months beside a positive harvest, give NA; a missing answer stays NA.
    The revised sale ruling supersedes rounds 1-3's sale multipliers; the
    harvest calculation and its edge rules are unchanged.
  function: lsms_library.countries.Mali._.mali:derive_tree_twelve_month_total
  inputs: lsms_library.countries.Mali._.mali:inputs_tree_twelve_month_total
  raw_variables: [s3bq01, s3bq03, s3bq09, s3bq10a, s3bq10b,
                  s11fq01, s11fq03, s11fq10, s11fq11a, s11fq11b]
  assumptions:
    - text: >-
        the harvest is asked as a MONTHLY AVERAGE over the harvest months, and
        the month count is the number of those months in the last 12, so
        average x months is the 12-month harvest.
      basis: questionnaire
      evidence: >-
        2014-15 EACI2014_AGR_LOURD_P2_11082014.pdf, Section 3B
        "Arboriculture", pp. 26-27: 3B.09 "Pendant combien de mois au cours des
        12 derniers mois avez-vous recolte [Nom du produit]?"; 3B.10 "Durant
        ces mois, quelle quantite a ete recoltee en moyenne chaque mois?";
        3B.13 "Durant ces mois, quelle quantite avez-vous vendue en moyenne
        chaque mois? Si 0 > ligne suivante".  2017-18 eaci17_p1_french.pdf,
        Section 11F, pp. 44-45 (printed 43-44): 11F.10 "Pendant combien de
        mois au cours des 12 derniers mois avez-vous recolte [ARBRES]?";
        11F.11 "Durant ces mois, quelle quantite a ete recoltee en moyenne
        chaque mois?"; 11F.14 "Durant ces mois, quelle quantite avez-vous
        vendue en moyenne chaque mois?"; eaci17_p1_eng.pdf pp. 42-43: "How
        many months out of the last 12 months did you harvest?", "During those
        months, what quantity did you harvest in average each month ?",
        "During those months, what quantity did you sell in average each
        month?".  Stata labels agree (s3bq10a "Quantite en UML recoltee en
        moyenne chaque mois", s11fq14a "Quantite vendue chaque mois de recolte
        les 12 derniers mois").
    - text: >-
        a month count of 0 beside a positive per-month harvest is a
        contradiction: no total is formed and Quantity is NA. The producing
        rosters contain three such 2014-15 rows and one 2017-18 row. The
        sale is independently served as recorded under tree-sale-window.
      basis: modelling-choice
      evidence: >-
        ruling @ligon 2026-10-23 on PR #1272 ("decide from the data"; round 3:
        "a month count of 0 or missing beside a positive value is NA");
        Mali/_/CONTENTS.org, crop_production section
    - text: >-
        missing months leave the harvest window unknown, so a positive
        per-month harvest gives NA; a zero answer gives zero. Quantity
        codes 99 / 9999 / 9999.9 are masked before multiplication, never on
        the total: a genuine harvest total may equal 99.
      basis: modelling-choice
      evidence: >-
        s3bq09 value label 99 "Manquant"; GH #1267 (the 9999.9 code on 3B's
        float columns); s3aq24 / s3bq14 maximum 999999, no value above it
        (2017-18 s7gq22 / s11fq15 reach 4,000,000 / 4,500,000, none 999999)
  validated_against: >-
    the independent raw-source oracle and unchanged native fold: every
    served perennial harvest and month count is preserved in both waves.
    The current ordinary comparison covers 628 pre-fold and 627 final tree
    rows. This function no longer derives the sale columns; see tree-sale-window.
  contents: 'Mali/_/CONTENTS.org, "crop_production: the sold unit, and tree rows per harvest month (GH #824, #1267)"'
  since: '2026-10-23'

Mali::crop_production::tree-sale-window:
  waves: ['2014-15', '2017-18']
  columns: [Quantity_sold, Value_sold]
  rule: >-
    Identity on tree rows with a positive sale: Quantity_sold and Value_sold
    are the recorded answers after the existing missing-code masks. Nothing
    is multiplied by months_harvested, including sales beside zero or missing
    months. The quantity is asked per harvest month; the value's printed total
    wording conflicts with the monthly Stata label. The window remains
    disclosed rather than inferred. Harvest Quantity remains a 12-month total,
    so Quantity_sold / Quantity is not automatically a campaign sold share.
    Zero sales carry no sale-window key. Positive sales join this key to
    tree-twelve-month-total with sorted '+', preserving the harvest key.
  function: lsms_library.countries.Mali._.mali:derive_tree_sale_window
  inputs: lsms_library.countries.Mali._.mali:inputs_tree_sale_window
  raw_variables: [s3bq01, s3bq03, s3bq09, s3bq13a, s3bq13b, s3bq14,
                  s11fq01, s11fq03, s11fq10, s11fq14a, s11fq14b, s11fq15]
  assumptions:
    - text: >-
        preserve reported tree sales without choosing a monthly or seasonal
        value window. The harvest still uses its existing month multiplier.
      basis: modelling-choice
      evidence: >-
        revised owner ruling on PR #1272:
        https://github.com/ligon/LSMS_Library/pull/1272#issuecomment-6375506358;
        CONTENTS.org retains the superseded x-months history and the printed
        total versus monthly-label contradiction.
    - text: >-
        retain quantity codes 99 / 9999 / 9999.9 and the baseline tree-only
        value code 999999. Do not infer a 999998 mask or a field-value mask;
        recorded 999998 and field values retain their existing treatment.
      basis: modelling-choice
      evidence: >-
        baseline public d65/57d255585 mask and the scoped recovery ruling;
        ordinary raw oracle verifies the retained 999998 tree value.
  validated_against: >-
    independent pre-fold numeric/membership checks and the existing native
    duplicate fold on cached sources; 627 final tree rows, unchanged field
    and harvest operands. Strict extension-array/NumPy checks preserve all
    unaffected values, types and missingness; 331 positive-sale rows carry
    the window key. Country cold/warm evidence is separately qualified in
    the task ledger; this entry supplies no whole-issue acceptance.
  contents: 'Mali/_/CONTENTS.org, "Revised ruling: tree sales as recorded"'
  since: '2026-10-23'

Mali::crop_production::hh-crop-sale-single-row:
  waves: ['2017-18', '2021-22']
  columns: [Quantity_sold, Unit_sold, KgFactor_sold, Value_sold, Condition_sold, condition_sold_native]
  rule: >-
    s16d records a sale for the household and crop, with no plot.  A sale is a
    record with a positive s16dq05a or s16dq06.  Where the household has exactly
    one s16c row for the crop -- one served row, not merely one plot -- the sale
    is served on that row: Quantity_sold = s16dq05a, Unit_sold = s16dq05b,
    Value_sold = s16dq06, as recorded, and that row carries this key. The own
    s16dq05d sold state accompanies that same sale as Condition_sold and
    condition_sold_native (GH1528), without supplying a harvest state. What is
    derived is the ATTACHMENT, not the numbers.  Any other sale is served on one
    row of that household and crop with plot_id = 'Farm-level' and no key for the
    sale, because its index value already discloses it.  No sale is split, summed,
    scaled or dropped, and a record that is not a sale serves nothing: no zero is
    written.  This key shares a row with harvest-to-date, harvest-from-dispositions or
    survey-kg-estimate through derivations.MULTI_SEP, in sorted order.
    written.  This key shares a row with harvest-to-date or harvest-from-dispositions
    through derivations.MULTI_SEP, in sorted order.  2017-18 is the same rule on s7g
    and s7f (GH #1457): s7gq21a, s7gq21b, s7gq21d (kg per sold unit) and s7gq22, a
    quantity code 99 / 9999 masked as on every field row.  One difference, from the
    ruling of 2026-10-23: a 2017-18 record that is not a sale still serves a crop on
    one plot, s7gq20 = 'Non' as Quantity_sold = Value_sold = 0, with no key.
  function: lsms_library.countries.Mali._.mali:derive_hh_crop_sale_attachment
  inputs: lsms_library.countries.Mali._.mali:inputs_hh_crop_sale_single_row
  raw_variables: [s16cq02, s16cq03, s16cq04, s16dq01, s16dq04, s16dq05a, s16dq05b, s16dq05d,
                  s16dq06, s7fq01, s7fq02, s7fq03, s7gq01, s7gq20, s7gq21a, s7gq21b,
                  s7gq21d, s7gq22]
  assumptions:
    - text: >-
        s16d asks the sale once per crop, with no plot, and s16c records no sale.
        Where the household has one harvest row for the crop, no other row can
        hold the sale, so the row is its only candidate.  The sale is NOT thereby
        a share of that row's Quantity: s16cq16a is empty on most of these rows.
      basis: variable-label
      evidence: >-
        s16d_me_mli2021.dta has no field or parcel variable; s16dq05a "16D.05a.
        Quelle est la quantite de ce produit qui a deja ete vendue ?"; s16dq06
        "16D.06. Quel a ete le montant tire de la vente de ce produit?".
        s16c_me_mli2021.dta carries s16cq02 / s16cq03 and no sale variable.
    - text: >-
        a sale of a crop on two or more rows is not allocated among them, since
        any split would be invented.  It stays with the household and crop on a
        Farm-level row, where gross_crop_revenue and median_price_valuation can
        read it.  That row has no harvest Quantity unless harvest-from-dispositions
        put one there, so harvest_kg reads such a row only then.
      basis: modelling-choice
      evidence: >-
        ruling @ligon 2026-11-03, option (d), GH #824; extended to 2017-18 by the bulk
        ruling of 2026-11-04, GH #1457; the rule of Niger 2021-22 after GH #1360 for
        the single row; the Farm-level convention in lsms_library/data_info.yml, top of
        file.
    - text: >-
        s16dq05c, "Estimation Quantite totale UML en kg", is not served.  It is a
        total (it equals s16dq05a on 495 of 495 rows sold in Kg, and 100 x
        s16dq05a on 299 of 465 sold in 100 kg sacks), not kg per sold unit.
      basis: variable-label
      evidence: >-
        the Stata label of s16dq05c; the same shape as the EAC-I tree equivalents,
        Mali/_/CONTENTS.org, "crop_production: the sold unit".
  validated_against: >-
    tests/test_gh824_mali_ehcvm_crop_production.py, whose oracle reads s16c and s16d
    directly.  Cold build of 2021-22: 1,070 keyed rows and 70 Farm-level rows (58 of
    crops on two rows, 12 on three or more, 0 on none) hold the 1,140 sale records, no
    sale on two rows; Value_sold 394,396,600 + 24,301,375 = 418,697,975 FCFA, the raw sum.
    tests/test_gh1457_mali_multi_plot_sales.py, the same for 2017-18: 459 keyed rows and
    202 Farm-level rows hold the 661 sale records; Value_sold 132,259,405 + 48,469,050 =
    180,728,455 FCFA, the raw s7gq22 sum (the build lost the 48,469,050 before GH #1457).
    Not validated against an external total: no document here reports one.
  contents: 'Mali/_/CONTENTS.org, "2026-11-03 -- EHCVM crop_production wired (GH #824)"; "2026-11-04 -- 2017-18 multi-plot sales (GH #1457)"'
  since: '2026-11-03'

Mali::crop_production::harvest-to-date:
  waves: ['2018-19', '2021-22']
  columns: [Quantity, Quantity_kg]
  rule: >-
    Identity on a row whose harvest is not finished and which records a quantity:
    2018-19 s16cq10 = Non with s16cq12a, 2021-22 s16cq11 = Non with s16cq16a.  The value
    is served as recorded.  The key names its WINDOW: the question asks the quantity
    ALREADY harvested, so the row covers a part of the season under a column that
    otherwise means all of it, and so does the row's Quantity_kg in 2021-22 (s16cq16c,
    GH #1436).  A row with no recorded quantity carries no key.  This
    key shares a row with hh-crop-sale-single-row and survey-kg-estimate through
    derivations.MULTI_SEP, in sorted order, and never with harvest-from-dispositions,
    which needs a finished crop and no recorded quantity.
  function: lsms_library.countries.Mali._.mali:derive_harvest_to_date
  inputs: lsms_library.countries.Mali._.mali:inputs_harvest_to_date
  raw_variables: [s16cq10, s16cq11, s16cq12, s16cq12a, s16cq12b, s16cq16a, s16cq16b, s16cq16c]
  assumptions:
    - text: >-
        the recorded quantity on an unfinished row is what has been harvested so far,
        and not the season.  2021-22: 287 rows, a median 50% of the area still to harvest.
        2018-19: 265 rows, a median 30%.
      basis: variable-label
      evidence: >-
        s16c_me_mli2021.dta s16cq16a "16C.16a. Quantite deja recoltee pour la presente
        campagne 2021/22?", s16cq11 "16C.11. Avez vous fini la recolte de cette culture?",
        s16cq12 "16C.12. Quel pourcentage de la superficie vous reste-t-il a recolter?";
        s16c_me_mli2018.dta s16cq12a, s16cq10, s16cq11, the same questions under other
        numbers.
  validated_against: >-
    tests/test_gh1437_mali_harvest_total.py, whose oracle reads s16c directly.  An identity
    has nothing to validate but its rows.
  contents: 'Mali/_/CONTENTS.org, "2026-11-04 -- the 2021-22 harvest total, and the window key (GH #1437)"'
  since: '2026-11-04'

Mali::crop_production::harvest-from-dispositions:
  waves: ['2021-22']
  columns: [Quantity, u]
  rule: >-
    Where every s16c row of a household's crop answers s16cq11 = Oui, none records
    s16cq16a, and the positive s16d quantities s16dq02a (consumed), s16dq03a (given),
    s16dq05a (sold) and s16dq13a (in stock) all state one unit, Quantity is their sum and
    u that unit.  It goes on the crop's single s16c row, or for two or more rows on the
    crop's one plot_id = 'Farm-level' row, created if no sale made it, and is never split
    among plots.  A crop whose dispositions span units, a crop with none, a crop with a
    recorded quantity and a crop with an unfinished row all stay as recorded.  This key
    shares a row with hh-crop-sale-single-row through derivations.MULTI_SEP, in sorted order.
  function: lsms_library.countries.Mali._.mali:derive_hh_crop_harvest_total
  inputs: lsms_library.countries.Mali._.mali:inputs_harvest_from_dispositions
  raw_variables: [s16cq04, s16cq11, s16cq16a, s16dq01, s16dq02a, s16dq02b, s16dq03a, s16dq03b,
                  s16dq05a, s16dq05b, s16dq13a, s16dq13b]
  assumptions:
    - text: >-
        a finished harvest was consumed, given, sold or stored, so the four dispositions
        add up to it.  The instrument asks the quantity of a finished harvest and the file
        lacks it on 5,215 of 5,237 finished rows, a fielded skip or a release loss.
      basis: questionnaire
      evidence: >-
        mli_ehcvm2_qnr_men_excel_vague1.pdf, printed p. 86: "(16C.11) Avez vous fini la
        recolte de cette culture? 1 = Oui >(16C.16)".  Mali 2018-19 holds the harvest and all
        four dispositions on one row (s16cq12a; s16cq13a, s16cq14a, s16cq16a, s16cq22a).  On its
        5,583 finished rows with the dispositions in the harvest's unit the sum equals the
        harvest exactly on 77.9%, within 10% on 82.1%, median ratio 1.000, 8.3% over 1.1 and 9.6%
        under 0.9; over the 4,438 metric rows the kg totals differ by a ratio of 1.006.  This is
        consistency within a row, and a respondent may anchor on the harvest just stated.  On
        Niger 2021-22, where both sides exist, the sum equals the harvest exactly on 91.1% of
        7,686 finished one-unit pairs (93.1% of 7,508 on the review's definition).
    - text: >-
        not all of a harvest need appear: s16d asks no quantity for seed kept, loss after
        harvest or animal feed, so the sum can fall short of what was cut.  Not sized.
      basis: modelling-choice
      evidence: Niger's 91.1% is the only available check; s16d_me_mli2021.dta variable labels
    - text: >-
        units are not converted: no factor exists.  1,169 finished crops span two or more
        units and stay NA.  Quantities in one unit are added across states: 208 of the 3,360
        derived crops state two of Grain, Epis, Decortique, Non-decortique in that unit.
        On 166 of the 208 the two states fold to different `condition` tokens, so those totals
        are sums across states, 467,038 of the 6,713,380 kg on metric-named units, 7.0%.  They
        are served under `unknown_condition`, and nothing is held out (GH #1436).
        8 are in the unit Autre, whose free text is empty, 4 of them across two or more
        dispositions, so they may hide two units.
      basis: modelling-choice
      evidence: ruling @ligon 2026-11-04, MORNING.org, option (b) of GH #1437; variables s16dq02c, s16dq03c, s16dq05d, s16dq13c
    - text: >-
        the sum is as good as its lines, and it inherits the file's large values.  It is not
        trimmed and no pair is held out for this.  13 derived pairs have a sold line priced
        under 1/10 of the crop's median over derived pairs' sold lines (14 over every metric
        sold line), and carry 1,185,854 kg, 17.7% of derived kg.  On 4 of those the file's own
        s16dq05c equals the sold quantity on a sack unit, so that line reads as kilograms keyed
        as sacks: 1,136,700 kg, 16.9%, about 1.1M kg of it removed if read that way.  One of the
        4 is the 7,502 Sac (100 Kg) row, 10.8% of the wave's kg alone and the only one Site Q
        names.  26 pairs hold a non-sale disposition of 100 sacks or more, 820,100 kg, 12.2%,
        with no price to test.  This is inherited from the same class in recorded data, not
        created by the derivation: on 2018-19's recorded rows the same two tests flag 43 rows,
        3,052,036 kg, 20.5%, and 39 rows, 549,450 kg, 3.7%.  Medians are not sensitive to it.
      basis: modelling-choice
      evidence: >-
        measured 2026-11-04 from s16c and s16d of both waves.  The label of s16dq05c says a total
        and the questionnaire says per unit; any rule for these lines belongs in its own issue
        covering both waves.
    - text: >-
        a crop with an unfinished row is held out (76 pairs, 48 of them one-unit), because
        its dispositions cover what is harvested so far.  A crop with a recorded quantity is
        held out (11 of the finished one-unit pairs), because a recorded harvest is not
        overridden and a Farm-level total beside it would count it twice.
      basis: modelling-choice
      evidence: GH #1437; the reconcile memo's 3,419 finished one-unit pairs are these 3,360 plus the 48 and the 11
  validated_against: >-
    tests/test_gh1437_mali_harvest_total.py, whose oracle reads s16c and s16d directly.  Cold build
    of 2021-22: 3,360 keyed rows, 3,139 on the single s16c row and 221 Farm-level.  Median pure-stand
    yields run 1% to 18% below 2018-19's recorded ones, crop by crop (Mali/_/CONTENTS.org).  Not
    validated against an external total: no document here reports one.
  contents: 'Mali/_/CONTENTS.org, "2026-11-04 -- the 2021-22 harvest total, and the window key (GH #1437)"'
  since: '2026-11-04'

Mali::crop_production::survey-kg-estimate:
  waves: ['2021-22']
  columns: [Quantity_kg]
  rule: >-
    Identity on a 2021-22 row with a Quantity_kg: 16C.16c s16cq16c, served as recorded and
    read first by the crop ladder (survey_kg).  The key says what the number is.  The
    instrument calls it an estimate, so a row's kilograms are the survey's conversion of
    its local unit and not a weighing.  A 0 beside a positive quantity (3 rows) is no
    answer and is NA.  A row whose Quantity is harvest-from-dispositions
    has none: s16d's other "c" columns are the state of the product, and s16dq05c, the
    sale's kilograms, is not served.  Shares a row with harvest-to-date and
    hh-crop-sale-single-row through derivations.MULTI_SEP, in sorted order.
  function: lsms_library.countries.Mali._.mali:derive_survey_kg_estimate
  inputs: lsms_library.countries.Mali._.mali:inputs_survey_kg_estimate
  raw_variables: [s16cq16a, s16cq16b, s16cq16c, s16cq16d]
  assumptions:
    - text: >-
        s16cq16c is the total for the line in kilograms, as estimated, and not a factor per
        unit.  On the 129 Kg rows it equals s16cq16a on all 129; on 81 rows in 100 kg sacks
        it is 100 x s16cq16a on 35, equals s16cq16a on 9, and otherwise neither.  Whether
        the interviewer or the form did the conversion is not stated.
      basis: variable-label
      evidence: >-
        s16c_me_mli2021.dta s16cq16c "16C.16c. Estimation Quantite totale UML en kg".
  validated_against: >-
    tests/test_mali_crop_survey_kg.py, whose oracle reads s16c directly.  An identity has
    nothing to validate but its rows.
  contents: 'Mali/_/CONTENTS.org, "2026-11-04 -- the survey harvest kilograms, 2021-22 (GH #1436)"'
  since: '2026-11-04'

Mali::community_prices::gram-centilitre-poids:
  waves: ['2014-15']
  columns: [Quantity]
  rows: {u: [Gramme, Centilitre]}
  rule: >-
    On a Gramme row a recorded Poids of 5 or more is divided by 1,000, and on a Centilitre
    row by 100, in either passage, so Quantity is the lot in kg or litres, as on the Kg and
    Litre rows.  u stays the recorded unit and Price is untouched.  On these rows a Poids
    below 1 is already kg or litres, and from 1 up to 5 as recorded is the better reading
    and not an established one: both stay as recorded, carry no key and are counted in
    CONTENTS.org.  So does every other unit: a
    Boite, Sachet, Tas, Unite, Paquet, Verre, Bidon, Kg or Litre row is served as recorded,
    whatever it holds.
  function: lsms_library.countries.Mali._.mali:derive_poids_base_unit
  inputs: lsms_library.countries.Mali._.mali:inputs_gram_centilitre_poids
  raw_variables: [s04q01, s04q02, s04q03, s04q04, s04q05, s04q06, s04q07, s04q08,
                  s04q09, s04q10, s04q11]
  assumptions:
    - text: >-
        the weight column is in the unit entered beside it, whatever its head says.
      basis: questionnaire
      evidence: >-
        EACI_MANUEL_P1_V5_Redacted.pdf PDF pp. 103-104 and EACI_MANUEL_P2_V3.pdf PDF p. 88,
        both "Attention. Le poids et l'unite correspondante sont lies", with a banana the agent
        finds "fait 2,250 kilogramme" entered Poids 2250, Unite 2, code 2 being Gramme in the
        community questionnaire's list.  Against it, the column head "Poids (KG)" of
        EACI2014_COM_P2_11082014.pdf, which this file used to follow.
    - text: >-
        5 is where the readings separate, and it is the same in both passages.  Against the
        size a variety's own label states (tea "environ 20g", the 60 g and 220 g tins, the
        50-100 g and 200-250 g loaves, the 30 cl and 33 cl bottles), the share of rows within
        2x of that size, recorded / divided.  Poids >= 5: Gramme p1 0.00 / 0.92 (n=255), p2 0.00
        / 0.88 (227); Centilitre p1 0.00 / 1.00 (949), p2 0.00 / 0.89 (445).  Poids < 1:
        Gramme p1 0.76 / 0.00 (29), p2 0.86 / 0.00 (175); Centilitre p1 0.56 / 0.00 (25), p2
        0.91 / 0.00 (980).  1 <= Poids < 5: 0.00 / 0.00 in all four cells (6, 63, 5, 39).  Against a
        price reference over all products, broader and weaker, because small packets cost more per
        kg: at 5 or more the recorded reading fits better on 3.7% of 1,533 Gramme rows and 0.2% of
        1,555 Centilitre rows; from 1 up to 5 it falls within 2x on 41% and 44%, and dividing on 0%.
      basis: modelling-choice
      evidence: >-
        measured 2026-11-04 on EACIS04_p1.dta and EACIS04_p2.dta; a passage-only rule fails this
        test: dividing all of passage 1 leaves its Poids < 1 rows 100x to 1000x too small, and
        leaving passage 2 alone misses 1,110 rows.
    - text: >-
        passage 2 follows the manual only in part, and that is why the rule reads the value:
        passage 1 holds 909 of 1,054 Gramme and 1,071 of 1,102 Centilitre rows at 5 or more;
        passage 2 holds 624 of 1,891 and 486 of 1,781, the rest mostly already in kg or
        litres, and 608 entries of 999.
      basis: modelling-choice
      evidence: Mali/_/CONTENTS.org table, cold build of the served rows
    - text: >-
        the rule mis-reads about 43 of the 3,090 rows it converts, and no other threshold fixes
        them: 22 Gramme rows fit as recorded and not divided (16 passage-2 salt at Poids 25), and 21
        Centilitre rows at 250 or more look like millilitres (15 Huile de coton at 250, 6 Lait frais).
        38 Boissons gazeuses rows at Centilitre 90 in passage 2, on the bottle labelled 33 cl, are
        served 0.9 L.
      basis: modelling-choice
      evidence: Mali/_/CONTENTS.org, measured 2026-11-04 on EACIS04_p1.dta and EACIS04_p2.dta
  validated_against: >-
    tests/test_gh1179_mali_community_quantity.py, whose oracle reads EACIS04_p1/p2 directly.  The
    per-kg price on a stated-size variety is not validated against any external price.
  contents: 'Mali/_/CONTENTS.org, "2026-11-04 -- community_prices.Quantity is kilograms by rule (GH #1179 memo)"'
  since: '2026-11-04'

Mali::sample::region-milieu-stratum:
  waves: ['2018-19', '2021-22']
  columns: [strata]
  rows: {}
  rule: >-
    strata = '<s00q01 label> <s00q04 label>', the region and area of residence the
    household cover page records, for example 'Sikasso Rural'.  Labels and never
    codes.  NA where either is missing.  No household file of these waves records a
    stratum.  The region part is then spelled through this country's `strata` table
    in categorical_mapping.org, at read time, which is the `Region` table crossed
    with the two milieu labels.
  function: lsms_library.ehcvm:derive_region_milieu_stratum
  inputs: lsms_library.countries.Mali.2018-19._.mapping:inputs_strata
  raw_variables: [s00q01, s00q04]
  assumptions:
    - text: >-
        the stratum of the design is the combination of region and area of
        residence, and 2021-22 keeps the 2018-19 plan.
      basis: questionnaire
      evidence: >-
        mli_ehcvm2_information_de_base_eng.pdf (held, 2021-22/Documentation), section
        4.1, p.10: "The survey is a panel cluster survey, and the sampling plan is
        based on that of the 2018/2019 survey ... The stratum is the combination of
        region and residence area."  A Basic Information Document, not the instrument.
    - text: >-
        the survey's own coding is the same cross.
      basis: variable-label
      evidence: >-
        ehcvm_nsu_mli2021.dta, a unit table: `strate`, labelled "Strate
        (Region*10+Milieu)".  Its 20 values are 2018-19's 20 cells.
    - text: >-
        Menaka and Taoudenit are served as the 2018-19 cover records them, and as the
        2021-22 cover records the same clusters, under Gao and Tombouctou: a label is
        the cover's own in each wave and is not carried across.  Of 6,133 households
        in both waves 429 (36 clusters) change stratum on this account, Menaka to Gao
        and Taoudenit to Tombouctou.  So 2018-19 has 20 cells and 2021-22 has 17.
      basis: modelling-choice
      evidence: Mali/_/CONTENTS.org, GH #812 ruling option W2, 2026-11-04.
  validated_against: >-
    the BID's sentence above and the weights: share of var(log cluster weight) between
    these cells 72.5% (2018-19) and 71.9% (2021-22), against 56.2% and 34.4% between
    regions alone.  BID Tables 1 and 2 equal 2021-22 in all 17 cells
    (tests/test_gh812_ehcvm_strata.py transcribes Table 1), but they do not corroborate
    that the cells are strata: titled "initial sample", they total to the delivered file
    (513 clusters, 6,143 households), so they tabulate the same two cover variables.  The
    match checks this reading of the cover.  No held table states 2018-19's allocation.
  contents: 'Mali/_/CONTENTS.org, "EHCVM strata are region x milieu labels (GH #812)"'
  since: '2026-11-04'

Mali::food_acquired::nsu-national-unit-weight:
  waves: ['2018-19', '2021-22']
  columns: [Quantity_kg]
  rule: >-
    Quantity_kg = Quantity x kg_factor, per acquisition source, where kg_factor is the
    median over ehcvm_nsu_mli2021.dta's rows of the row's (product, unit, size), in grams over 1000.
    Unit and size are the row's s07bq03b and s07bq03c codes in both waves.  The product
    is the s07bq01 code in 2021-22, whose numbering the table uses; in 2018-19, whose
    numbering is a different one, it is found by LABEL, never by code (ehcvm.
    nsu_product_crosswalk): the same label up to spelling, else through the country's
    harmonize_food, else the parts of a label listing goods the instrument later split,
    else the label's stem.  A product reading several table products takes the median of
    their weights.  Each row's tier is nsu_join in derivation_inputs.  NA, with no key,
    where no weight is found; where the served unit is Kg or Litre, whose kilograms the
    label states; and where the row's canonical key is duplicated at the build, because
    core sums Quantity on such a key and selects any other column.  Those rows stay on the
    inferred ladder.  No Quantity or u changes.
  function: lsms_library.ehcvm:derive_nsu_kg_factor
  inputs: lsms_library.countries.Mali.2021-22._.mapping:inputs_food_acquired_unit_weight
  raw_variables: [s07bq01, s07bq03a, s07bq03b, s07bq03c, s07bq04, s07bq05, produitID, uniteID, tailleID, strate, poids]
  assumptions:
    - text: >-
        a key's weight in the table is the weight of that unit of that product in
        that size, for any row of the wave.  The survey ships the table; the served
        row's own quantity is untouched.
      basis: variable-label
      evidence: >-
        ehcvm_nsu_mli2021.dta, read by code; unit and size codes agree with s07b_me's on
        every code both files label, up to spelling.  Mali's BID: s.3.4, each product-unit-size
        is weighed at market; s.4.2, markets by reasoned choice, up to 3 urban and 3 rural per
        region; s.2.3 and s.5, NSU factors collected in 2018/19 "remain valid", supplemented in
        June-July 2021 (the two sections give different dates); s.7.3, "collected in 2018 and
        updated in 2021".
    - text: >-
        national, not by stratum.  Against an independent implied weight, a household's
        last-purchase unit value over the same stratum's median Kg price with 5+ reports each,
        the national weight's median absolute log error is 0.49 against the stratum cell's 0.51,
        within 2x 64.5% against 59.2%; row by row 0.55 against 0.59.  The closest of the
        countries: the slope of the household's deviation on the stratum's is +0.29, or +0.08
        with key effects, and the stratum weight wins within-(stratum, product) dispersion,
        0.187 against 0.198.  87.5% of consumed rows find a stratum cell, 100% a national
        weight; stratum weights would add 1.6% to the kilograms on rows both serve.
      basis: modelling-choice
      evidence: >-
        GH #1452, 2026-11-04.  The check is noisy: a small lot's price per kg runs
        above a kilogram's, so the implied weight runs high, and it compares the
        two rules, not either with the truth.
    - text: >-
        2018-19 reads the same weight per key as 2021-22, with the product found by label.
        The table was largely collected in that round, by this country's own BID.  Of
        2018-19's consumed rows 91,633 join on the label, 15,468 through harmonize_food and
        3,732 as the parts of a bundle; 94.8% of non-metric served rows read a weight.
        Weakest join result of the four: sugar in a sachet industriel reads about 1 kg
        against households' 0.10-0.20, a table cell in both waves, disclosed and not patched.
      basis: modelling-choice
      evidence: >-
        Ruling @ligon 2026-11-04.  Matched items, 2021-22 over 2018-19, median / row-weighted:
        Kg rows 1.19 / 1.15, inference 1.09 / 1.25, both waves on the table 1.13 / 1.20.
    - text: >-
        Kg and Litre keep their labels.  Their table rows are not read: a kilogram is
        a kilogram, and a table litre is not a density (in these tables most oils
        read exactly 1000 g).
      basis: modelling-choice
      evidence: GH #1452, 2026-11-04.  Those rows are the check on the join instead.
  validated_against: >-
    the rows whose label states the mass, which the table was not fitted to: the
    national weight of a Kg row is 1000 g at the median, and the delivered factor
    reproduces the table read directly from the two files
    (tests/test_ehcvm_unit_weights.py).  Outside the survey's households: ehcvm_prix_mli2021.dta has no
    usable unit weights, so it checks per-Kg prices only.  Table rows against market per-kg,
    median abs. log error / within 2x, go from 0.592 / 55.0% under the inference to 0.507 /
    69.7% under the table (signed -0.46 to +0.39), and item medians' correlation with the
    market from 0.49 to 0.58.  Table against 2018-19 community price ratios: 0.141 / 89.8%.
    Measured kilograms are in Mali/_/CONTENTS.org.
  contents: 'Mali/_/CONTENTS.org, "EHCVM unit-weight table wired (GH #1452)"'
  since: '2026-11-04'

# A DELETION (GH #1707): the rows are not served, so none can carry a key.  This
# entry is the disclosure (`rows: 0`), and `derivation_inputs` returns the records.
Mali::food_acquired::rice-ration-block-withheld:
  waves: ['2018-19']
  columns: [Quantity]
  rows: 0
  rule: >-
    The records of s07b_me_mli2018.dta with no vague are not served.  There are 3,357,
    one per household, every one `Riz local Gambiaka` in kg (size-free), answered
    `Plus de 30 jours`, with nothing produced, given or bought (s07bq04, s07bq05,
    s07bq07a and s07bq08 empty) and s07bq03a a whole multiple of 1.4 kg; every other
    record of the file has a vague.  The build checks that fingerprint on every
    record with no vague and raises if one lacks it.  Before GH #1707 each was served
    as a purchased row with Expenditure NA, 32,313.4 kg in all.
  function: lsms_library.countries.Mali.2018-19._.mapping:rice_ration_rows
  inputs: lsms_library.countries.Mali.2018-19._.mapping:inputs_rice_ration_block
  raw_variables: [vague, s07bq01, s07bq03a, s07bq03b, s07bq03c, s07bq04, s07bq05,
                  s07bq06, s07bq07a, s07bq07b, s07bq07c, s07bq08]
  assumptions:
    - text: >-
        the block is a construction by the file's producers, not a household's answer:
        a ration of 0.2 kg a person a day for 7 days (s07bq03a = 1.4 x the welfare
        file's hhsize on 3,348 of the 3,357; on the other 9 a whole multiple of 1.4,
        of another integer, and 3 of those households are on no cover), on a record
        with no passage and no purchase.
      basis: modelling-choice
      evidence: >-
        Ruling @ligon 2026-11-12, "Remove, registered", on the maintainer's principle
        that undocumented imputations are not served without a very good reason.
        No document explains the block: the World Bank DDI (catalog 4295,
        Documentation.pdf p.487) counts the 3,357 missing vague without comment, the
        CAPI questionnaires list Riz local Gambiaka only as an ordinary roster item,
        and neither copy of the 2018-19 poverty profile mentions it (documentation
        search of 2026-11-12, reports/ehcvm2-s07bq03a-docsearch).
    - text: >-
        the missing vague selects the block; the 1.4 x hhsize equality does not.  On
        records WITH a vague it holds by coincidence for 284 rice-kg answers.
      basis: modelling-choice
      evidence: measured on s07b_me_mli2018.dta and ehcvm_welfare_mli2018.dta, 2026-11-12
  validated_against: >-
    the base build: each withheld record had become one purchased row, and 3,356 of
    those rows disappear from the served table.  The 3,357th shared its key with the
    household's own rice-kg purchase, which core summed with it; that row now serves
    the household's answer alone.  No other row of the table changes
    (Mali/_/CONTENTS.org).
  contents: 'Mali/_/CONTENTS.org, "2018-19 rice-ration block withheld (GH #1707)"'
  since: '2026-11-12'
