# Derivations -- served numbers in this country's tables that are NOT survey
# answers but CONSTRUCTIONS from raw answers.  One entry per registry key,
# `country::table::name`; the same key sits in the served table's
# `Derivation` column on every row it produced.  Loader and field contract:
# lsms_library/derivations.py.  Design: SkunkWorks/derived_values.org.
#
# Sibling of population.yml and recall.yml: a .yml here moves no cache hash.

Mali::food_acquired::7day-purchase-at-last-purchase-unit-value:
  waves: ['2018-19', '2021-22']
  columns: [Expenditure]
  rows: {s: purchased}
  rule: >-
    Expenditure = Quantity * (s07bq08 / s07bq07a), where Quantity is the row's
    own served purchased quantity, (s07bq03a - s07bq04 - s07bq05).clip(lower=0)
    -- the 7-day consumption net of own production AND of gifts received, which
    is the survey's own accounting identity -- and s07bq08 / s07bq07a is the
    unit value of the household's LAST PURCHASE of the item.  NaN where
    s07bq07a is missing or not positive, and NaN where the last purchase was
    made in a different unit from the consumption unit (s07bq07b/s07bq07c vs
    s07bq03b/s07bq03c): no EHCVM wave ships a unit-conversion table, so there
    is no exact conversion and NA is the honest answer.  Units are compared on
    the EHCVM numeric code where the label carries one, else on the label with
    case, accents, padding and punctuation folded -- the two variables carry
    DIFFERENT value-label sets inside the same .dta.  Before GH #876 the served
    Expenditure was s07bq08 itself: the value of one purchase of unrecorded
    size made up to 30 days earlier, beside a 7-day quantity.
  function: lsms_library.ehcvm:derive_ehcvm_purchase_value
  inputs: lsms_library.countries.Mali.2018-19._.mapping:inputs_food_acquired
  raw_variables: [s07bq03a, s07bq03b, s07bq03c, s07bq04, s07bq05, s07bq07a,
                  s07bq07b, s07bq07c, s07bq08]
  assumptions:
    - text: >-
        the unit value of the last purchase is the price the household paid
        over the 7-day consumption window.  s07bq08 is the value of ONE
        purchase, which s07bq06 places up to 30 days back, while s07bq03a is
        the quantity consumed over 7 days -- one row, two clocks.
      basis: variable-label
      evidence: >-
        Stata labels in s07b_me_mli2018.dta, s07b_me_mli2021.dta: s07bq08 "7B.08. Valeur (en FCFA) du [PRODUIT]
        achete la derniere fois"; s07bq03a "7B.03a. Qtite tot du [PRODUIT]
        conso par le MEN au cours des 7 derniers jours"; s07bq07a "7B.07a.
        Quelle est la quantite du [PRODUIT] achete la derniere fois?"
    - text: >-
        a last purchase reported in a different unit from the consumption is
        NOT converted, and a row with no last purchase has no unit value to
        apply: the row is served with Expenditure NA. Counts are on the SERVED
        denominator -- purchased rows of the delivered table, after the
        canonical reshape and the (t, v, i, j, u, s) collapse -- because that
        is the number a user sees; the source-row counts are smaller and were
        what an earlier version of this entry quoted. 2018-19: 25,667 of the
        129,598 SERVED purchased rows (19.8%) -- 10,771 because no last
        purchase was reported at all (s07bq08 or s07bq07a missing / not
        positive), 6,731 because the last purchase used a different unit CODE,
        8,165 because it used the same code in a different SIZE (Petit / Moyen
        / Grand / Taille unique), which is a different container and so a
        different price per unit. 2021-22: 13,243 of the 117,493 SERVED
        purchased rows (11.3%) -- 9,100 because no last purchase was reported
        at all (s07bq08 or s07bq07a missing / not positive), 2,983 because the
        last purchase used a different unit CODE, 1,160 because it used the
        same code in a different SIZE (Petit / Moyen / Grand / Taille unique),
        which is a different container and so a different price per unit.
      basis: variable-label
      evidence: >-
        no EHCVM wave distributes a unit-conversion table;
        lsms_library/categorical_mapping/ehcvm_units.org is a code->label
        codebook with no factors
    - text: >-
        the quantity multiplied is the SURVEY'S OWN accounting identity,
        (s07bq03a - s07bq04 - s07bq05).clip(0) -- construction "C", chosen by
        @ligon on 2026-09-12 because it is the only one of the three candidates
        ehcvm_conso reproduces.  The alternatives, measured, are A = the gross
        7-day consumption s07bq03a (which would put the value of own-produced
        and gifted food into Expenditure) and B = net of own production only.
        2018-19: A 95,505,280, B 94,226,529, C (served) 89,614,679 FCFA, against a raw s07bq08 total of 134,798,354.  2021-22: A 104,253,106, B 103,414,014, C (served) 97,178,692 FCFA, against a raw s07bq08 total of 134,405,775.
      basis: modelling-choice
      evidence: SkunkWorks/derived_values.org; GH #876; measured 2026-09-12
    - text: >-
        the gift quantity s07bq05 is served as its own s = 'inkind' row, in the
        consumption unit s07bq03b, with Expenditure NA.  EHCVM asks no value for
        a gift.  UEMOA's depan(Don) is s07bq05 priced at this same last-purchase
        unit value -- verified, and therefore demonstrably an imputation by the
        people who built the aggregate rather than an answer anybody gave -- so
        it is checked and not served.  Own production keeps the identical
        treatment it already had (s = 'produced' from s07bq04, Expenditure NA).
        2018-19: 16,459 inkind rows carrying 58,639 units, 0 with an Expenditure.  2021-22: 16,869 inkind rows carrying 59,567 units, 0 with an Expenditure.
      basis: modelling-choice
      evidence: SkunkWorks/derived_values.org; GH #876; measured 2026-09-12
  validated_against: >-
    the product-level check against ehcvm_conso does not run for this wave: its
    conso codpr does not share a keyspace with s07bq01 here, and CotedIvoire
    2018-19 distributes no conso file at all.  The construction is validated on
    the two waves where the join works -- Togo 2018 and Guinea-Bissau 2018-19 --
    in which it reproduces depan(Achat) within 1% for 99.5% / 100% of the rows
    where the candidates differ, against 13.1% / 48.6% for the
    own-production-only residual and 0.0% / 0.0% for the gross 7-day quantity;
    s07bq05 * uv reproduces depan(Don) for 99.7% / 100%, which is why the gift
    rows are served with Expenditure NA rather than with that imputation.  The
    instrument is the same in all twelve waves (identical s07bq0* Stata
    labels), so the reading carries by inference, not by measurement here.
  contents: 'Mali/_/CONTENTS.org, "food_acquired: one row, two windows (GH #876)"'
  since: '2026-09-12'

Mali::crop_production::tree-twelve-month-total:
  waves: ['2014-15', '2017-18']
  columns: [Quantity, Quantity_sold, Value_sold]
  rows: {perennial: true}
  rule: >-
    On a tree-crop row, each of the three sale-and-harvest answers is the
    per-harvest-month figure times months_harvested: Quantity = harvest per
    month x months, Quantity_sold = quantity sold per month x months, and
    Value_sold = the sale value x months.  2014-15 (module 3B): s3bq10a,
    s3bq13a and s3bq14, each x s3bq09.  2017-18 (module 11F): s11fq11a,
    s11fq14a and s11fq15, each x s11fq10.  The rosters ask the two quantities
    "en moyenne chaque mois" over the months harvested in the last 12, so the
    products are the 12-month totals a field-crop row serves, and the value
    is read on the same per-month footing (assumption 2), so Value_sold /
    Quantity_sold is the per-month ratio: a price per Unit_sold.  Units are the
    recorded ones (u = s3bq10b / s11fq11b, Unit_sold = s3bq13b / s11fq14b), and
    months_harvested (s3bq09 / s11fq10) is served beside them.  One rule for
    the edges, the same for all three columns: the missing codes are masked
    BEFORE the product -- 99 / 9999 / 9999.9 on the two QUANTITY answers, and
    999999 on the VALUE (2014-15's six-digit field maximum, a code: x 2 it
    would pass as 1,999,998 FCFA; the quantity codes are not applied to the
    value, as 9,999 FCFA is an amount); a per-month answer of 0 gives 0 whatever
    the month count; a missing month count (2014-15's 99 code) gives NA; a
    month count of 0 beside a POSITIVE answer gives NA (the two answers
    contradict and no total is formed); a missing answer stays NA.  History:
    until GH #1267 the 2014-15 Quantity was s3bq09, the month count; between
    GH #1267 and these rulings both waves served the per-month answers as
    recorded under two identity keys (3b-per-harvest-month,
    11f-per-harvest-month), which this key replaces; between rounds 1 and 3
    Value_sold was served as recorded.
  function: lsms_library.countries.Mali._.mali:derive_tree_twelve_month_total
  inputs: lsms_library.countries.Mali._.mali:inputs_tree_twelve_month_total
  raw_variables: [s3bq01, s3bq03, s3bq09, s3bq10a, s3bq10b, s3bq13a, s3bq13b,
                  s3bq14, s11fq01, s11fq03, s11fq10, s11fq11a, s11fq11b,
                  s11fq14a, s11fq14b, s11fq15]
  assumptions:
    - text: >-
        the harvest and the quantity sold are asked as a MONTHLY AVERAGE over
        the harvest months, and the month count is the number of those months
        in the last 12, so average x months is the 12-month quantity.
      basis: questionnaire
      evidence: >-
        2014-15 EACI2014_AGR_LOURD_P2_11082014.pdf, Section 3B
        "Arboriculture", pp. 26-27: 3B.09 "Pendant combien de mois au cours des
        12 derniers mois avez-vous recolte [Nom du produit]?"; 3B.10 "Durant
        ces mois, quelle quantite a ete recoltee en moyenne chaque mois?";
        3B.13 "Durant ces mois, quelle quantite avez-vous vendue en moyenne
        chaque mois? Si 0 > ligne suivante".  2017-18 eaci17_p1_french.pdf,
        Section 11F, pp. 44-45 (printed 43-44): 11F.10 "Pendant combien de
        mois au cours des 12 derniers mois avez-vous recolte [ARBRES]?";
        11F.11 "Durant ces mois, quelle quantite a ete recoltee en moyenne
        chaque mois?"; 11F.14 "Durant ces mois, quelle quantite avez-vous
        vendue en moyenne chaque mois?"; eaci17_p1_eng.pdf pp. 42-43: "How
        many months out of the last 12 months did you harvest?", "During those
        months, what quantity did you harvest in average each month ?",
        "During those months, what quantity did you sell in average each
        month?".  Stata labels agree (s3bq10a "Quantite en UML recoltee en
        moyenne chaque mois", s11fq14a "Quantite vendue chaque mois de recolte
        les 12 derniers mois").
    - text: >-
        the sale VALUE was answered on the same per-month footing as the
        quantity sold, in both waves, so it too is multiplied by the month
        count -- AGAINST the printed form, which asks 3B.14 / 11F.15 as "le
        montant total de cette vente" directly after the monthly quantity
        question.  The data put the value on the per-month footing: value /
        per-month quantity sold does not rise with the month count; cashew
        sold in Kg prices at 275 FCFA/kg (2014-15) and 500 (2017-18) on this
        reading -- the Cote d'Ivoire / Benin farm-gate prices of those years --
        and at about half that on the total reading; on the total reading
        rows harvested 6 months or more price at 2-3% of retail, and 2017-18
        bananas yield 0.4 kg per plant per year.  The 2017-18 Stata label says
        the same, and the WB harmonised MLI_EACI2.do multiplies the value by
        the month count.  Confidence high for 2017-18, moderate for 2014-15:
        the slope test bounds the share of respondents who reported a total at
        roughly 55% (2014-15) and 40% (2017-18).
      basis: modelling-choice
      evidence: >-
        ruling @ligon 2026-10-23 on PR #1272 (round 3), on an order-of-
        magnitude check whose aggregates are in Mali/_/CONTENTS.org,
        crop_production section; printed forms 3B.14 "Quel a ete le montant
        total de cette vente ? (En FCFA)" (EACI2014_AGR_LOURD_P2_11082014.pdf
        p. 27) and 11F.15 the same (eaci17_p1_french.pdf p. 45;
        eaci17_p1_eng.pdf p. 43, "What is the total amount of this sale?");
        Stata labels s3bq14 "Montant de la vente", s11fq15 "Montant de la vente
        mensuelle moyenne des produits issus de ces arbres"; MLI_EACI2.do:353
        (harvest_sold_value_per = s11fq10 * s11fq15).  Would settle it: the
        EAC-I enumerator manual on 3B.14 / 11F.15, the 2017-18 CAPI/CSPro
        dictionary, the INSTAT/CPS EAC-I report tables, FAOSTAT producer
        prices.
    - text: >-
        a month count of 0 beside a positive per-month answer is a
        contradiction, not a zero: no total is formed and the column is NA.
        Measured on the producing rosters: 2014-15, 3 rows carry 0 months
        beside a positive per-month harvest, 3 beside a positive per-month
        sale and 3 beside a positive sale value; 2017-18, 1 row beside a
        positive harvest and none beside a sale.  Serving 0 there, as the WB
        MLI_EACI2.do does for 11F (`replace harvest_sold_kg_per = 0 if
        s11fq10==0`), would put a manufactured zero on a recorded sale.
      basis: modelling-choice
      evidence: >-
        ruling @ligon 2026-10-23 on PR #1272 ("decide from the data"; round 3:
        "a month count of 0 or missing beside a positive value is NA");
        Mali/_/CONTENTS.org, crop_production section
    - text: >-
        a missing month count (2014-15 s3bq09 = 99, Manquant) leaves the window
        unknown, so a positive per-month answer gives NA (3 harvest, 3 sale and
        3 value rows); a per-month answer of 0 gives 0 whatever the count.  The
        missing codes are masked on the per-month answer before the product,
        never on the total: 99 / 9999 / 9999.9 on the quantities, and 999999 on
        the value -- 2014-15's six-digit field maximum, carried by 3 tree rows
        (2, 2 and 1 months) and 12 field rows, 7 of them beside a zero quantity
        sold; served NA on the tree rows (x 2 it would read 1,999,998 FCFA),
        while the field rows keep it as recorded (pre-existing).
      basis: modelling-choice
      evidence: >-
        s3bq09 value label 99 "Manquant"; GH #1267 (the 9999.9 code on 3B's
        float columns); s3aq24 / s3bq14 maximum 999999, no value above it
        (2017-18 s7gq22 / s11fq15 reach 4,000,000 / 4,500,000, none 999999)
  validated_against: >-
    the raw oracle: on every served perennial row of both waves, Quantity,
    Quantity_sold and Value_sold equal the per-month answer times the month
    count under the rule above, and months_harvested, u and Unit_sold equal
    the raw roster (tests/test_gh1267_mali_tree_quantity.py, joined on (t, i,
    crop) through Country.derivation_inputs).  The value's footing rests on
    the order-of-magnitude evidence of assumption 2, consistent with the
    within-cell slope of log(value / per-month quantity sold) on log(months):
    -0.05 (se 0.30, n = 156) in 2014-15 and -0.52 (se 0.47, n = 104) in
    2017-18, where a total value predicts 1
    (slurm_logs/isa_backlog_2026-10-21/824-mali-unit-sold/scripts/r2/probe_value_window.py).
    The WB harmonised MLI_EACI1.do does not form these products for 3B: its
    line 259 multiplies s3bq09 by the unit CODE, and its lines 348 / 397 use
    the sold quantity and value unscaled.
  contents: 'Mali/_/CONTENTS.org, "crop_production: the sold unit, and tree rows per harvest month (GH #824, #1267)"'
  since: '2026-10-23'
