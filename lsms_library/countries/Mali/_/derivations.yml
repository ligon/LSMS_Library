# Derivations -- served numbers in this country's tables that are NOT survey
# answers but CONSTRUCTIONS from raw answers.  One entry per registry key,
# `country::table::name`; the same key sits in the served table's
# `Derivation` column on every row it produced.  Loader and field contract:
# lsms_library/derivations.py.  Design: SkunkWorks/derived_values.org.
#
# Sibling of population.yml and recall.yml: a .yml here moves no cache hash.

Mali::food_acquired::7day-purchase-at-last-purchase-unit-value:
  waves: ['2018-19', '2021-22']
  columns: [Expenditure]
  rows: {s: purchased}
  rule: >-
    Expenditure = Quantity * (s07bq08 / s07bq07a), where Quantity is the row's
    own served purchased quantity, (s07bq03a - s07bq04 - s07bq05).clip(lower=0)
    -- the 7-day consumption net of own production AND of gifts received, which
    is the survey's own accounting identity -- and s07bq08 / s07bq07a is the
    unit value of the household's LAST PURCHASE of the item.  NaN where
    s07bq07a is missing or not positive, and NaN where the last purchase was
    made in a different unit from the consumption unit (s07bq07b/s07bq07c vs
    s07bq03b/s07bq03c): no EHCVM wave ships a unit-conversion table, so there
    is no exact conversion and NA is the honest answer.  Units are compared on
    the EHCVM numeric code where the label carries one, else on the label with
    case, accents, padding and punctuation folded -- the two variables carry
    DIFFERENT value-label sets inside the same .dta.  Before GH #876 the served
    Expenditure was s07bq08 itself: the value of one purchase of unrecorded
    size made up to 30 days earlier, beside a 7-day quantity.
  function: lsms_library.ehcvm:derive_ehcvm_purchase_value
  inputs: lsms_library.countries.Mali.2018-19._.mapping:inputs_food_acquired
  raw_variables: [s07bq03a, s07bq03b, s07bq03c, s07bq04, s07bq05, s07bq07a,
                  s07bq07b, s07bq07c, s07bq08]
  assumptions:
    - text: >-
        the unit value of the last purchase is the price the household paid
        over the 7-day consumption window.  s07bq08 is the value of ONE
        purchase, which s07bq06 places up to 30 days back, while s07bq03a is
        the quantity consumed over 7 days -- one row, two clocks.
      basis: variable-label
      evidence: >-
        Stata labels in s07b_me_mli2018.dta, s07b_me_mli2021.dta: s07bq08 "7B.08. Valeur (en FCFA) du [PRODUIT]
        achete la derniere fois"; s07bq03a "7B.03a. Qtite tot du [PRODUIT]
        conso par le MEN au cours des 7 derniers jours"; s07bq07a "7B.07a.
        Quelle est la quantite du [PRODUIT] achete la derniere fois?"
    - text: >-
        a last purchase reported in a different unit from the consumption is
        NOT converted, and a row with no last purchase has no unit value to
        apply: the row is served with Expenditure NA. Counts are on the SERVED
        denominator -- purchased rows of the delivered table, after the
        canonical reshape and the (t, v, i, j, u, s) collapse -- because that
        is the number a user sees; the source-row counts are smaller and were
        what an earlier version of this entry quoted. 2018-19: 25,667 of the
        129,598 SERVED purchased rows (19.8%) -- 10,771 because no last
        purchase was reported at all (s07bq08 or s07bq07a missing / not
        positive), 6,731 because the last purchase used a different unit CODE,
        8,165 because it used the same code in a different SIZE (Petit / Moyen
        / Grand / Taille unique), which is a different container and so a
        different price per unit. 2021-22: 13,243 of the 117,493 SERVED
        purchased rows (11.3%) -- 9,100 because no last purchase was reported
        at all (s07bq08 or s07bq07a missing / not positive), 2,983 because the
        last purchase used a different unit CODE, 1,160 because it used the
        same code in a different SIZE (Petit / Moyen / Grand / Taille unique),
        which is a different container and so a different price per unit.
      basis: variable-label
      evidence: >-
        no EHCVM wave distributes a unit-conversion table;
        lsms_library/categorical_mapping/ehcvm_units.org is a code->label
        codebook with no factors
    - text: >-
        the quantity multiplied is the SURVEY'S OWN accounting identity,
        (s07bq03a - s07bq04 - s07bq05).clip(0) -- construction "C", chosen by
        @ligon on 2026-09-12 because it is the only one of the three candidates
        ehcvm_conso reproduces.  The alternatives, measured, are A = the gross
        7-day consumption s07bq03a (which would put the value of own-produced
        and gifted food into Expenditure) and B = net of own production only.
        2018-19: A 95,505,280, B 94,226,529, C (served) 89,614,679 FCFA, against a raw s07bq08 total of 134,798,354.  2021-22: A 104,253,106, B 103,414,014, C (served) 97,178,692 FCFA, against a raw s07bq08 total of 134,405,775.
      basis: modelling-choice
      evidence: SkunkWorks/derived_values.org; GH #876; measured 2026-09-12
    - text: >-
        the gift quantity s07bq05 is served as its own s = 'inkind' row, in the
        consumption unit s07bq03b, with Expenditure NA.  EHCVM asks no value for
        a gift.  UEMOA's depan(Don) is s07bq05 priced at this same last-purchase
        unit value -- verified, and therefore demonstrably an imputation by the
        people who built the aggregate rather than an answer anybody gave -- so
        it is checked and not served.  Own production keeps the identical
        treatment it already had (s = 'produced' from s07bq04, Expenditure NA).
        2018-19: 16,459 inkind rows carrying 58,639 units, 0 with an Expenditure.  2021-22: 16,869 inkind rows carrying 59,567 units, 0 with an Expenditure.
      basis: modelling-choice
      evidence: SkunkWorks/derived_values.org; GH #876; measured 2026-09-12
  validated_against: >-
    the product-level check against ehcvm_conso does not run for this wave: its
    conso codpr does not share a keyspace with s07bq01 here, and CotedIvoire
    2018-19 distributes no conso file at all.  The construction is validated on
    the two waves where the join works -- Togo 2018 and Guinea-Bissau 2018-19 --
    in which it reproduces depan(Achat) within 1% for 99.5% / 100% of the rows
    where the candidates differ, against 13.1% / 48.6% for the
    own-production-only residual and 0.0% / 0.0% for the gross 7-day quantity;
    s07bq05 * uv reproduces depan(Don) for 99.7% / 100%, which is why the gift
    rows are served with Expenditure NA rather than with that imputation.  The
    instrument is the same in all twelve waves (identical s07bq0* Stata
    labels), so the reading carries by inference, not by measurement here.
  contents: 'Mali/_/CONTENTS.org, "food_acquired: one row, two windows (GH #876)"'
  since: '2026-09-12'

Mali::crop_production::tree-twelve-month-total:
  waves: ['2014-15', '2017-18']
  columns: [Quantity]
  rows: {perennial: true}
  rule: >-
    On a tree-crop row, Quantity = the harvest per harvest month x
    months_harvested: 2014-15 (module 3B) s3bq10a x s3bq09; 2017-18 (module
    11F) s11fq11a x s11fq10.  The rosters ask the harvest "en moyenne chaque
    mois" over the months harvested in the last 12, so the product is the
    12-month harvest a field-crop row serves.  The unit is the recorded one
    (u = s3bq10b / s11fq11b), and months_harvested (s3bq09 / s11fq10) is
    served beside it.  The edges: the missing codes 99 / 9999 / 9999.9 are
    masked on the per-month answer BEFORE the product (9999 x 2 would
    otherwise pass as a harvest); a per-month answer of 0 gives 0 whatever
    the month count; a missing month count (2014-15's 99 code) gives NA; a
    month count of 0 beside a POSITIVE answer gives NA (the two answers
    contradict and no total is formed); a missing answer stays NA.  The tree
    SALE (Quantity_sold, Value_sold) is not multiplied: it is served as
    recorded under tree-sale-window.  History: until GH #1267 the 2014-15
    Quantity was s3bq09, the month count; between GH #1267 and the PR #1272
    rulings both waves served the per-month harvest as recorded under two
    identity keys (3b-per-harvest-month, 11f-per-harvest-month), which this
    key replaces; rounds 1-3 of the 2026-10-23 rulings also multiplied
    Quantity_sold (rounds 1-3) and Value_sold (round 3) by the month count,
    which the revised ruling withdrew (tree-sale-window).
  function: lsms_library.countries.Mali._.mali:derive_tree_twelve_month_total
  inputs: lsms_library.countries.Mali._.mali:inputs_tree_twelve_month_total
  raw_variables: [s3bq01, s3bq03, s3bq09, s3bq10a, s3bq10b,
                  s11fq01, s11fq03, s11fq10, s11fq11a, s11fq11b]
  assumptions:
    - text: >-
        the harvest is asked as a MONTHLY AVERAGE over the harvest months,
        and the month count is the number of those months in the last 12, so
        average x months is the 12-month harvest.
      basis: questionnaire
      evidence: >-
        2014-15 EACI2014_AGR_LOURD_P2_11082014.pdf, Section 3B
        "Arboriculture", pp. 26-27: 3B.09 "Pendant combien de mois au cours des
        12 derniers mois avez-vous recolte [Nom du produit]?"; 3B.10 "Durant
        ces mois, quelle quantite a ete recoltee en moyenne chaque mois?".
        2017-18 eaci17_p1_french.pdf, Section 11F, pp. 44-45 (printed 43-44):
        11F.10 "Pendant combien de mois au cours des 12 derniers mois
        avez-vous recolte [ARBRES]?"; 11F.11 "Durant ces mois, quelle quantite
        a ete recoltee en moyenne chaque mois?"; eaci17_p1_eng.pdf pp. 42-43:
        "How many months out of the last 12 months did you harvest?", "During
        those months, what quantity did you harvest in average each month ?".
        The 2017-18 enumerator manual (WB catalog 3409, resource 47786) PDF
        p. 75: 11F.10 "la duree de la recolte en nombre de mois sur les 12
        derniers mois"; 11F.11 "Quantite moyenne recoltee par mois : ... la
        quantite moyenne de fruits recoltes par mois durant la periode
        indiquee en (11F.10)".  The 2014-15 manual (catalog 2583, resource
        47800) PDF p. 67 names no window for 3B.10; it tells the enumerator
        to build the figure up from daily or weekly quantities: "3B.10.
        Quantites produites. La quantite produite est inscrite dans la
        colonne Quantite selon l'unite de mesure locale dans la colonne UML.
        On ecrira l'equivalence en Kg de l'unite de mesure locale notee. Il
        peut etre difficile de determiner ces quantites produites.
        L'enqueteur utilisera des questions subsidiaires en demandant la
        quantite produite par jour ou par semaine selon la periode la plus
        appropriee, avant d'estimer la quantite"; and it illustrates 3B.09
        with "Un manguier va par exemple donner des mangues pendant 3 a 4
        mois dans l'annee".  The per-month window comes from the printed form
        in 2014-15.  Stata label s3bq10a "Quantite en UML recoltee en moyenne
        chaque mois".
    - text: >-
        a month count of 0 beside a positive per-month harvest is a
        contradiction, not a zero: no total is formed and Quantity is NA.
        Measured on the producing rosters: 2014-15, 3 rows; 2017-18, 1 row
        (11F.10 code 0 is "Aucune recolte (Arbre fruitier n'a pas commence a
        produire)").  Serving 0 there, as the WB MLI_EACI2.do does for 11F,
        would put a manufactured zero beside a recorded harvest.
      basis: modelling-choice
      evidence: >-
        ruling @ligon 2026-10-23 on PR #1272 ("decide from the data"; "a
        month count of 0 or missing beside a positive value is NA");
        Mali/_/CONTENTS.org, crop_production section
    - text: >-
        a missing month count (2014-15 s3bq09 = 99, Manquant) leaves the window
        unknown, so a positive per-month harvest gives NA (3 rows); a
        per-month answer of 0 gives 0 whatever the count.  The missing codes
        99 / 9999 / 9999.9 are masked on the per-month answer before the
        product, never on the total (a genuine total can be 99).
      basis: modelling-choice
      evidence: >-
        s3bq09 value label 99 "Manquant"; GH #1267 (the 9999.9 code on 3B's
        float columns)
  validated_against: >-
    the raw oracle: on every served perennial row of both waves, Quantity
    equals the per-month harvest times the month count under the rule
    above, and months_harvested and u equal the raw roster
    (tests/test_gh1267_mali_tree_quantity.py, joined on (t, i, crop) through
    Country.derivation_inputs).  The WB harmonised MLI_EACI1.do does not form
    this product for 3B: its line 259 multiplies s3bq09 by the unit CODE.
    MLI_EACI2.do:242 forms it for 11F on the kg equivalent
    (harvest_kg_per = s11fq10 * s11fq11c).
  contents: 'Mali/_/CONTENTS.org, "crop_production: the sold unit, and tree rows per harvest month (GH #824, #1267)"'
  since: '2026-10-23'

Mali::crop_production::tree-sale-window:
  waves: ['2014-15', '2017-18']
  columns: [Quantity_sold, Value_sold]
  rule: >-
    THE IDENTITY, on every tree-crop row whose served Quantity_sold or
    Value_sold is positive: Quantity_sold = the quantity sold per harvest
    month as recorded (2014-15 s3bq13a; 2017-18 s11fq14a) and Value_sold = the
    sale value as recorded (s3bq14; s11fq15), in Unit_sold (s3bq13b /
    s11fq14b) and FCFA.  Nothing is multiplied by months_harvested.  What is
    derived is the WINDOW, not the number: on a field-crop row the two
    columns are the campaign's sale, while here the quantity is asked as a
    monthly average over the harvest months, both enumerator manuals ask the
    value as a TOTAL, and the price levels put the value on the same footing
    as the per-month quantity.  Served as recorded, Value_sold /
    Quantity_sold is a price per Unit_sold; whether the pair is a monthly or
    a seasonal figure the instrument cannot settle, and a user who wants the
    12-month reading multiplies both by months_harvested.  The edges: the
    missing codes are masked on the recorded answer -- 99 / 9999 / 9999.9 on
    the quantity, and 999998 / 999999 on the value (the "ne sait pas" /
    "non declare" values of 2014-15's six-digit amount field); the month
    count does not touch the sale, so a sale beside a month count of 0 or a
    missing one (2014-15's 99 code) is served as recorded, and the 12-month
    rescaling is 0 / NA there.  A zero sale is zero in any window and carries
    no key.  On the row the key is joined to tree-twelve-month-total, which
    every tree row carries ('+', sorted).  THE ROW MIXES TWO WINDOWS: its
    Quantity is the 12-month harvest and its Quantity_sold the sale per
    harvest month, so Quantity_sold / Quantity is NOT a sold share; the
    share is Quantity_sold x months_harvested / Quantity.  Measured on the
    258 tree rows whose sold and harvest units agree (positive harvest,
    recorded sale): the plain ratio's median is 0.375 and it exceeds 1 on 16
    rows; the rescaled share's median is 0.917 and it exceeds 1 on 28 (at
    development 57d255585, where both quantities were x months, the plain
    ratio was the share: 0.917 and 28).
    History: rounds 1-3 of the 2026-10-23 rulings on PR #1272 served the sold
    quantity (and, in round 3, the value) times months_harvested, under
    tree-twelve-month-total; this key replaces that.
  function: lsms_library.countries.Mali._.mali:derive_tree_sale_window
  inputs: lsms_library.countries.Mali._.mali:inputs_tree_sale_window
  raw_variables: [s3bq01, s3bq03, s3bq09, s3bq13a, s3bq13b, s3bq14,
                  s11fq01, s11fq03, s11fq10, s11fq14a, s11fq14b, s11fq15]
  assumptions:
    - text: >-
        the quantity sold is asked as a MONTHLY AVERAGE over the harvest
        months, so on its own it is not the campaign's sale a field-crop row
        serves.
      basis: questionnaire
      evidence: >-
        printed forms: 2014-15 EACI2014_AGR_LOURD_P2_11082014.pdf p. 27, 3B.13
        "Durant ces mois, quelle quantite avez-vous vendue en moyenne chaque
        mois? Si 0 > ligne suivante"; 2017-18 eaci17_p1_french.pdf p. 45,
        11F.14 the same; eaci17_p1_eng.pdf p. 43, "During those months, what
        quantity did you sell in average each month?".  The WB catalog's
        literal questions read the same (2583 s3bq13a; 3409 s11fq14a).  The
        2017-18 enumerator manual (catalog 3409, resource 47786) PDF p. 75,
        11F.11-14: "en moyenne par mois durant la periode indiquee en
        (11F.10)"; 11F.14 "la quantite des recoltes vendue en moyenne par
        mois".  The 2014-15 manual (catalog 2583, resource 47800) PDF p. 68
        names no window for 3B.13; like 3B.10 it has the enumerator build the
        figure up from the individual sales: "3B.13. Quantite du produit
        vendue. La quantite vendue est inscrite dans la colonne Quantite,
        selon la meme unite qu'en 3B.08. Si la quantite est nulle, inscrire
        0. De meme que precedemment, la quantite vendue peut ne pas etre
        facile a evaluer. On essaye la meme approche de determiner la
        frequence des ventes et les quantites vendues a chaque fois."  The
        per-month window comes from the printed form in 2014-15.
    - text: >-
        both enumerator manuals instruct the enumerator to record the sale
        value as a TOTAL, and the printed forms ask "le montant total de
        cette vente" directly after the monthly quantity question.  "Cette
        vente" can be read as the monthly sale just described; the manuals
        do not say which.
      basis: questionnaire
      evidence: >-
        2014-15 manual (WB catalog 2583, resource 47800), PDF p. 68, 3B.14:
        "Montant tire de la vente de ce produit. L'enqueteur essaie de
        determiner le montant total de la vente et d'inscrire le montant
        correspondant en FCFA. ... L'enqueteur essaye de determiner la
        frequence des ventes et le montant de chaque vente afin d'en deduire
        le montant total."  2017-18 manual (catalog 3409, resource 47786),
        PDF p. 76, 11F.15: "Montant de la vente : Pour chaque type d'arbres,
        demander a l'enquete la valeur en F CFA de la quantite totale
        vendue."  Printed forms 3B.14 "Quel a ete le montant total de cette
        vente ? (En FCFA)" (EACI2014_AGR_LOURD_P2_11082014.pdf p. 27) and
        11F.15 the same (eaci17_p1_french.pdf p. 45; eaci17_p1_eng.pdf p. 43,
        "What is the total amount of this sale?"); the catalog's literal
        questions for s3bq14 (2583) and s11fq15 (3409) read "Quel a ete le
        montant total de cette vente ?".
    - text: >-
        the 2017-18 data file labels the value monthly, against its own form
        and manual; the 2014-15 label is neutral.
      basis: variable-label
      evidence: >-
        Stata labels s11fq15 "Montant de la vente mensuelle moyenne des
        produits issus de ces arbres"; s3bq14 "Montant de la vente".  The WB
        harmonised MLI_EACI2.do:313/353 follows the 2017-18 label and
        multiplies both the sold kg equivalent and the value by s11fq10
        (harvest_sold_kg_per = s11fq10 * s11fq14c; harvest_sold_value_per =
        s11fq10 * s11fq15); MLI_EACI1.do:348/397 uses both unscaled for 3B.
    - text: >-
        the pair is SERVED as recorded -- not rescaled to 12 months, not
        dropped -- and labelled instead.  The price levels put the value on
        the same footing as the per-month quantity, so Value_sold /
        Quantity_sold is a price per Unit_sold whichever level the pair sits
        at; what no document settles is whether that level is the month or
        the season, which is what the key names.  A user who wants the
        12-month reading multiplies both columns by months_harvested; the
        raw answers are one derivation_inputs call away.
      basis: modelling-choice
      evidence: >-
        revised ruling @ligon 2026-10-23 on PR #1272 ("Mali tree-crop sales
        follow the Ethiopia #1257 precedent"), after the document search;
        precedent Ethiopia::crop_production::sect12-sale-period and
        permanent-crop-12-month-window, under CLAUDE.md "Derived Values" fit
        rule ("a value served under a name implying a different window -- the
        function is the identity and the registry is the point").  The price
        evidence is in validated_against.
    - text: >-
        the month count does not touch the sale.  A positive sale beside a
        month count of 0 (2014-15: 3 sale and 3 value rows on the producing
        roster) or a missing one (s3bq09 = 99: 3 and 3) is served as
        recorded, as an answer beside a contradicting flag is in Ethiopia's
        section 11 / 12 (kept as reported).  Rounds 1-3 served the sold
        quantity NA there (and round 3 the value too), because no 12-month
        total could be formed.
      basis: modelling-choice
      evidence: >-
        revised ruling @ligon 2026-10-23 on PR #1272; Ethiopia/_/ethiopia.py
        _no_sale_reading ("a value recorded beside the 'No' ... is returned
        exactly as reported")
    - text: >-
        the missing codes are masked on the recorded answer: 99 / 9999 /
        9999.9 on the quantity sold, and 999998 / 999999 on the value -- the
        "ne sait pas" / "non declare" values of 2014-15's six-digit amount
        fields s3aq24 (field crops) and s3bq14 (trees), masked on both.  The
        data dictionary declares no code for either field ("Width: 6 ...
        Range: 0-999999"), but the instrument's convention reserves them: the
        agriculture P1 form, p. 8, "inscrire 9998 si la personne ne connait
        pas l'annee, inscrire 9999 pour Non Declare", and the household forms'
        6-digit amounts "Si NSP INSCRIRE 999998" (section 4).  The data
        agree: nothing exceeds 999999; s3aq24 carries it on 12 rows, 7 beside
        a zero quantity sold; s3bq14 carries 999999 on 3 rows and 999998 on
        1, a cashew sale of 55 Kg beside a missing month count that as an
        amount prices at 18,182 FCFA/kg against its cell's median of 275.
        The quantity codes are not applied to the value (9,999 FCFA is an
        amount).
      basis: questionnaire
      evidence: >-
        2014-15 EACI2014_AGR_LOURD_P1_17062014.pdf p. 8;
        EACI2014_MEN_LOURD_P1_17062014.pdf pp. 18, 22 and
        EACI2014_MEN_LOURD_P2_11082014.pdf p. 11 ("Si NSP INSCRIRE 999998");
        data dictionary (2014-15 Documentation.pdf) s3aq24 / s3bq14;
        precedents: the WB harmonised MLI_EACI1.do:645 (2014-15 seed value
        masked at ">= 999998"), and Mali/_/mali.py's own _LIVESTOCK_SENTINELS
        and _LABOR_SENTINELS (999999 masked on SalesValue and the wage);
        GH #1267 (the 9999.9 code on 3B's float columns)
  validated_against: >-
    The window is a stated conflict, not a calibrated one: nothing rescales
    the sale, so there is no target for the level.  The raw oracle: on every
    served perennial row of both waves, Quantity_sold and Value_sold equal the
    recorded answers under the code rule, Unit_sold the recorded sold unit,
    and the key sits on exactly the rows with a positive sale
    (tests/test_gh1267_mali_tree_quantity.py, joined on (t, i, crop) through
    Country.derivation_inputs).  The footing of the value, measured on the
    served table (tree rows sold in Kg and priced; median FCFA/kg of
    Value_sold / Quantity_sold, the value on the per-month quantity's
    footing, vs Value_sold / (Quantity_sold x months_harvested), the value
    read as a total over the harvest months; n is the cell): 2017-18 cashew
    500 vs 250 (n = 21), mango 125 vs 41.7 (n = 9), banana 150 vs 12.5
    (n = 4, thin), orange 370 vs 143.3 (n = 2, thin); 2014-15 cashew 275 vs
    137.5 (n = 12), mango 300 vs 100 (n = 9), orange 500 vs 500 (n = 5),
    banana 1,352 vs 1,229 (n = 4, thin).  FAOSTAT producer prices, quoted
    from the ruling and not re-derived here: cashew 461 (Senegal), mango
    196, banana 124-437, orange 347.  The aggregates, with every cell's n:
    slurm_logs/isa_backlog_2026-10-21/824-mali-unit-sold/out/r5/price_table_r5.txt.
    Within crop x sold-unit cells, the slope of
    log(value / per-month quantity sold) on log(months) is -0.05 (se 0.30,
    n = 156) in 2014-15 and -0.52 (se 0.47, n = 104) in 2017-18, where a
    total value beside a per-month quantity predicts 1 -- rejected at about
    3 se in both waves; the test bounds the share of respondents who
    reported a total at roughly 55% (2014-15) and 40% (2017-18).  Aggregates:
    the ruling's order-of-magnitude check (PR #1272), and
    slurm_logs/isa_backlog_2026-10-21/824-mali-unit-sold/scripts/r2/probe_value_window.py.
  contents: 'Mali/_/CONTENTS.org, "crop_production: the sold unit, and tree rows per harvest month (GH #824, #1267)"'
  since: '2026-10-23'
