sample:
    # 01a_consent.dta is the wave-2 household-level file: 4,774 rows, 4,774
    # distinct FPrimary -- exactly one row per interviewed household.
    #
    # NO WEIGHT EXISTS for this wave, and that is a producer-side fact, not a
    # gap in our extract.  All 89 shipped .dta files were swept: the only
    # "weight" variables are anthropometric body weight.  Positive documentary
    # evidence: Documentation/Variable Lists/key_hhinfo_panel.xlsx rows 17-18
    # assign hhweight/ppweight to WAVE 1 ONLY, with every wave-2 cell blank.
    #
    # No Rural and no strata either: this wave ships no geography.  CONTENTS.org
    # records the same ("'2013-14' has no regions or urban/rural data"), and
    # 01ea_employmentscreener.dta DECLARES regioncode/eacode/communitycode but
    # populates 0 of 13,643 rows.  The acquisition target that would fix this is
    # `w2_hh_geodata_w3preloads`, named in that xlsx and absent from Data/.
    file: 01a_consent.dta
    idxvars:
        i: FPrimary
    myvars:
        v: FPrimary

household_roster:
    # TWO-SOURCE table: the roster and its residence-duration variable live in
    # different files, so this needs a `dfs:` merge.
    #
    #   01b2_roster.dta   16,356 rows, 4,774 households -- Sex/Age/Relationship
    #   01d_background.dta 16,354 rows              -- MonthsAway (awaylast12)
    #
    # CARTESIAN CHECK (GH #323 site 4), measured on THIS wave, not in aggregate:
    # (FPrimary, hhmid) is unique in BOTH frames -- 16,356 distinct keys in
    # 16,356 roster rows and 16,354 in 16,354 background rows -- so the number
    # of key values duplicated in both frames is 0 and the merge is exactly
    # 1:1.  The background keys are a strict SUBSET of the roster keys
    # (intersection 16,354; 0 background-only rows), and the 2 roster-only
    # members simply take a NaN MonthsAway.
    #
    # `merge_how: left` with the roster as the primary sub-df: the roster is
    # authoritative for which persons exist, background is a strict enrichment.
    # (Here it is also output-identical to the `outer` default, since
    # background contributes no rows of its own -- but that is a fact about
    # this wave's extract, not a guarantee, and wave 3 is checked separately.)
    #
    # SOURCING NOTE -- 01b2_preroster.dta is NOT merged in, deliberately.  It is
    # the wave-1 preload used to track attrition (22,613 rows carrying
    # `currentmember`, `whynotmember`, `howlongnotmember`, `joinedwhy`), i.e. an
    # EVENT table about joiners and leavers, not a roster.  Its
    # `currentmember == 'Yes'` rows number exactly 16,356 -- the roster row
    # count -- which is the check that 01b2_roster.dta is the complete set of
    # current members and not a subset of it.  Its `currentmember == 'No'` rows
    # (6,257) are people who LEFT and correctly do not belong in the roster.
    # Note preroster.hhmid is float64 and mostly null; comparing it to the
    # roster's int8 hhmid via astype(str) gives '1.0' vs '1' and a spurious
    # zero overlap.
    #
    # `v` is NOT declared -- _join_v_from_sample() attaches it at API time.
    # This wave ships no geography at all (see the `sample` note above), so
    # every household's `v` comes from the FPrimary[-6:-3] EA slice.
    dfs:
        - df_roster
        - df_background
    df_roster:
        file: 01b2_roster.dta
        idxvars:
            i: FPrimary
            pid: hhmid
        myvars:
            Sex: gender
            Age: ageyears
            Relationship: relationship
    df_background:
        file: 01d_background.dta
        idxvars:
            i: FPrimary
            pid: hhmid
        myvars:
            # "s01d_27 - Away in last 12" -- the same Q27 wave 1 asks, and
            # here it is CLEAN: 16,353 of 16,354 non-null, values 0-12 with
            # no out-of-range value and no sentinel.
            MonthsAway: awaylast12
    merge_on:
        - i
        - pid
    merge_how: left
    final_index:
        - t
        - i
        - pid

housing:
    # 12a_housingcharacteristics1iii_structure.dta is the wave-2 dwelling-
    # structure file: 4,772 rows, `FPrimary` unique (0 duplicates, 0 nulls).
    # Single file, single extraction -- no `dfs:` merge, so no cartesian risk.
    #
    # THE MODULE IS THE SAME ONE WAVE 1 USES, verified by content and not by
    # the filename.  The source's own variable labels name the wave-1
    # variables: `materialroof` is labelled "s12a_32 - Roof material" and
    # `materialfloor` "s12a_31 - Floor material".  That matters here because
    # GhanaSPS module letters do move between waves -- 01f is education in
    # this wave and EMPLOYMENT in 2017-18 -- so filename continuity alone
    # would not have been evidence.
    #
    # The other three 12* files were checked and are not candidates:
    # …1i_rent (rent/construction cost), …1ii_utilities (water, lighting,
    # cooking fuel), 12b_housingcharacteristics2 (dwelling type, rooms,
    # occupancy, electricity).  None carries a roof or floor material.
    # `materialouterwall` is here too and is deliberately not wired.
    #
    # COVERAGE: 4,772 of the wave's 4,774 households.  The two missing are
    # 106199032 and 205163009, absent from this file but present in
    # 01a_consent.dta.  Housing households are a strict SUBSET of the sample
    # households, so the v-join is total.
    #
    # NULLS: none.  Roof and Floor are both 4,772/4,772 non-null.  This wave
    # declares no Don't-know / Refuse sentinel on either variable (codes
    # 1-8 plus 95 'Other - specify').
    #
    # `InstanceNumber` is a per-interview counter, not part of the key --
    # FPrimary alone is unique, so it is not declared.
    #
    # `v` is NOT declared -- _join_v_from_sample() attaches it at API time.
    #
    # Label harmonisation is done once for all three waves by the `Roof` /
    # `Floor` tables in ../../_/categorical_mapping.org.  This wave's
    # distinctive spellings are `Corrugated iron sheets` (plural; wave 1 says
    # `Corrugate`, wave 3 says `sheet`) and `Other - specify` (code 95).
    file: 12a_housingcharacteristics1iii_structure.dta
    idxvars:
        i: FPrimary
    myvars:
        Roof: materialroof
        Floor: materialfloor
individual_education:
    # 01fi_generaleducation.dta -- Section 1F(i) "General Education".  IN THIS
    # WAVE module `f` is education and `e` is employment; in 2017-18 both shift
    # one letter (`f` becomes employment, `g` education) while keeping the same
    # variable names.  See the country data_scheme.yml comment.
    #
    # 15,316 rows, 4,774 households, (FPrimary, hhmid) unique, every key in the
    # roster.  The roster has 16,356 people: the 1,040 with no education record
    # are children aged 0-2 (1,019 of the 1,022 with a recorded age; the module
    # has an age floor of 3).  That is the whole of the shortfall -- a
    # module-eligibility rule, not attrition.
    #
    # This wave's screener is EXACT: `attended == 'No'` <-> null grade, 3,779
    # rows on both sides, 0 exceptions.  So the hook's step 2 recovers exactly
    # the never-schooled and invents nothing.
    #
    # `highestgrade` here has NO tertiary rung -- its code list stops at S5 and
    # sends every tertiary respondent to 95 'Other - Specify' (501 rows, all
    # 501 with a non-null `highestqual`, overwhelmingly Bachelors / diploma /
    # HND).  That is what the `_qual` fallback exists for.
    #
    # NOTE: this file triggers a UnicodeWarning (latin-1 fallback) on read --
    # some strings in it are not valid UTF-8.  The decoded value labels were
    # checked and are sane.  `pyreadstat` refuses the file outright
    # (UnicodeDecodeError) where pandas falls back, so inspect it through
    # `get_dataframe` / pandas, not pyreadstat.
    #
    # `_attended` / `_qual` are temporary and are dropped by
    # ghanasps.individual_education().  `v` is NOT declared --
    # _join_v_from_sample() attaches it at API time.
    file: 01fi_generaleducation.dta
    idxvars:
        i: FPrimary
        pid: hhmid
    myvars:
        Educational Attainment:
            - highestgrade
            - mappings: ['harmonize_education', 'Original Label', 'Preferred Label']
        _qual:
            - highestqual
            - mappings: ['harmonize_education', 'Original Label', 'Preferred Label']
        _attended: attended

plot_features:
    # TWO-SOURCE table: plot size and plot tenure live in different files.
    #
    #   04h_agsection.dta   4,694 x 228 -- plot size: totalsize, plotsizeunit
    #   04i_landtenure.dta  4,694 x 103 -- tenure: obtainhow
    #
    # Module 04 is agriculture BY CONTENT (the files carry plot size, soil,
    # water and "How did you obtain this plot..." variables), checked rather
    # than assumed because GhanaSPS module letters move between waves (01f is
    # education here and EMPLOYMENT in 2017-18).
    #
    # KEY: (FPrimary, plotid), plotid a within-household counter 1..10.
    # InstanceNumber is 1:1 with plotid and is not declared.  FPrimary is the
    # same 9-character id 01a_consent.dta uses, so the sample v-join needs no
    # transformation and is TOTAL (all 2,678 plot households are in the
    # consent file); v itself is the FPrimary[-6:-3] EA slice (mapping.py).
    #
    # CARTESIAN CHECK (GH #323 site 4), measured on THIS wave: (FPrimary,
    # plotid) is unique in BOTH frames -- 4,694 distinct keys in 4,694 rows
    # on each side, intersection 4,694, 0 size-only, 0 tenure-only, 0 key
    # values duplicated in either frame, 0 null keys.  Exactly 1:1.
    #
    # AREA.  No producer area_ha in this wave.  totalsize is 4,694/4,694
    # non-null (min 0, median 3, max 800 in native units); plotsizeunit is
    # Acres 3,775 / Poles 570 / Ropes 208 / Plot 131 / 'Other - Specify' 10.
    # The ghanasps.plot_features hook multiplies `_size` by wave 1's producer
    # factor for the unit (country data_scheme.yml).  The 10 'Other' plots
    # have no factor and get a NaN Area -- their plotsizeunitother free text
    # is '1 bedroom', '25 BY 30 FEET', '18 sq', '16 Squares', '16 sqaures',
    # '16 squares', '24 sq', '36 square', 'do not know', 'No plot please' --
    # so Area is 99.79% populated here, not 100%.  10 plots report a
    # totalsize of 0 (5 Acres, 2 Poles, 1 Plot, 2 Other); kept as reported.
    #
    # plotsizeunit is the RESOLVED unit for every plot in THIS wave -- unlike
    # 2017-18, where the same column name is a skip-pattern remnant and the
    # resolved unit is `plotunit` (GH #732).  Note that this wave's INSTRUMENT
    # prints the rope unit as "Robes" (Part A, H: "1---Acre 2----Poles
    # 3----Robes 4-----Plots 95----Other"); the data label was corrected to
    # 'Ropes'.  The `AreaUnit` table in ../../_/categorical_mapping.org maps
    # every spelling at extraction time.
    #
    # Tenure: obtainhow (7 categories, 4,694/4,694 non-null) -> canonical
    # vocabulary via the `Tenure` table in the same file.  The instrument
    # (Part A, I1: "How did you obtain this plot, or gain the right to farm
    # this plot?") offers 1 Purchased / 2 Inherited from deceased family
    # member / 3 Rented (for cash or kind), or sharecropped / 4 Allocated
    # free of charge / 5 Begged / 6 Borrowed / 95 Other.  Rent and sharecrop
    # are ONE option here (702 plots) where wave 1 has three; the country
    # data_scheme.yml has the mapping and its consequences.  The 'Other'
    # free text (obtainother, 73 rows) is not decoded.
    #
    # `merge_how: left`, size file primary (also output-identical to `outer`
    # here: the key sets coincide).  `v` is NOT declared --
    # _join_v_from_sample() attaches it at API time.
    dfs:
        - df_size
        - df_tenure
    df_size:
        file: 04h_agsection.dta
        idxvars:
            i: FPrimary
            plot_id: plotid
        myvars:
            # `_size` is TEMPORARY: consumed and dropped by
            # ghanasps.plot_features, which writes `Area`.
            _size: totalsize
            AreaUnit:
                - plotsizeunit
                - mappings: ['AreaUnit', 'Alternate Spelling', 'Preferred Label']
    df_tenure:
        file: 04i_landtenure.dta
        idxvars:
            i: FPrimary
            plot_id: plotid
        myvars:
            Tenure:
                - obtainhow
                - mappings: ['Tenure', 'Alternate Spelling', 'Preferred Label']
    merge_on:
        - i
        - plot_id
    merge_how: left
    final_index:
        - t
        - i
        - plot_id
