sample:
    # 00_hh_info.dta is the wave-3 household-level file: 5,669 rows, 5,669
    # distinct FPrimary -- one row per household -- and it carries `region`.
    #
    # NO WEIGHT EXISTS for this wave either (all 100 shipped .dta files swept;
    # only anthropometric body weight).  Wave-3 documentation is silent on
    # weighting -- the wave ships a questionnaire and nothing else.
    #
    # Rural is NOT wired.  The only urban/rural source is rural-urban.dta, a
    # 528-row COMMUNITY lookup keyed by communitycode (with -666 sentinels)
    # that would have to be joined via 00_hh_info.comm_code, and it covers only
    # ~70.5% of households.  Left out rather than shipped partial and unexplained.
    file: 00_hh_info.dta
    idxvars:
        i: FPrimary
    myvars:
        v: FPrimary
        strata: region

household_roster:
    # TWO-SOURCE table, same shape as 2013-14: roster + background for
    # MonthsAway.
    #
    #   01b2_roster.dta    19,006 rows, 5,669 households
    #   01d_background.dta 19,006 rows -- MonthsAway (awaylast12)
    #
    # CARTESIAN CHECK (GH #323 site 4), measured on THIS wave SEPARATELY -- a
    # rule verified on 2013-14 does not transfer, which is the whole point of
    # re-checking.  (FPrimary, hhmid) is unique in BOTH frames: 19,006 distinct
    # keys in 19,006 rows on each side, 0 key values duplicated in both, and
    # the intersection is all 19,006.  The merge is exactly 1:1 with no
    # roster-only and no background-only rows.
    #
    # `merge_how: left`, roster authoritative -- see the 2013-14 note.
    #
    # SOURCING NOTE -- neither 01b2_newroster.dta nor 01b2_preroster.dta is
    # merged in, and 01b2_roster.dta is NOT silently incomplete.  Checked:
    #   - the roster carries its own `new_mem` flag: 14,168 'No' + 4,838 'Yes'
    #     = 19,006, i.e. continuing members plus joiners, ALREADY UNIONED;
    #   - 01b2_newroster.dta (4,839 rows, 2,449 households) is the JOINER
    #     event table -- `joinedwhy_*`, `joinedhowlong`, `joinedfromwhere`.
    #     4,782 of its keys match a roster row flagged new_mem='Yes';
    #   - 01b2_preroster.dta (18,242 rows) is the LEAVER event table --
    #     `stillmember`, `whynotmember`, `notmember_died`, `howlongnotmember`.
    #     Its 4,070 `stillmember == 'No'` rows have a NULL hhmid and are
    #     absent from the roster, which is correct: they left.  Its 13,098
    #     `stillmember == 'Yes'` rows are in the roster on all but 55 keys.
    # So the roster IS the current-member table and the other two are event
    # tables about transitions.  Merging them in would add leavers, which the
    # survey's own 6-month membership rule excludes.
    #
    # RESIDUAL, recorded rather than hidden: 53 of the 4,839 newroster keys
    # have no roster counterpart, and 56 roster rows flagged new_mem='Yes' are
    # absent from newroster.  The two counts nearly balance, so this looks like
    # hhmid renumbering for a handful of joiners rather than missing people
    # (0.28% of persons either way).  NOT reconciled here; do not "fix" it by
    # unioning the frames without first establishing the correct key.
    #
    # `v` is NOT declared -- _join_v_from_sample() attaches it at API time.
    dfs:
        - df_roster
        - df_background
    df_roster:
        file: 01b2_roster.dta
        idxvars:
            i: FPrimary
            pid: hhmid
        myvars:
            # 'relationship' spells the head 'Head' in this wave and
            # 'Household Head' in waves 1-2; both are in kinship.yml.
            Sex: gender
            Age: ageyears
            Relationship: relationship
    df_background:
        file: 01d_background.dta
        idxvars:
            i: FPrimary
            pid: hhmid
        myvars:
            # 18,980 of 19,006 non-null, values 0-12, no out-of-range value.
            MonthsAway: awaylast12
    merge_on:
        - i
        - pid
    merge_how: left
    final_index:
        - t
        - i
        - pid

housing:
    # 12a_housingcharacteristics1iii_structure.dta is the wave-3 dwelling-
    # structure file: 5,669 rows, `FPrimary` unique (0 duplicates, 0 nulls) --
    # complete coverage of the wave's 5,669 households, the only one of the
    # three waves where housing is not short of the household count.
    # Single file, single extraction -- no `dfs:` merge.
    #
    # SAME MODULE AS WAVES 1 AND 2, verified by content: `materialroof` is
    # labelled "s12a_32 - Roof material" and `materialfloor` "s12a_31 - Floor
    # material", i.e. the file carries wave 1's variable names in its own
    # labels.  Checking the filename would NOT have been sufficient in this
    # wave of all waves -- 01f is education in 2013-14 but EMPLOYMENT here
    # (01fi_employmentmain / 01fii_employmentsecondary / 01fiii_unemployed),
    # education having shifted to 01g.  Housing did not move; that is a fact
    # established from the labels, not assumed from the name.
    #
    # `interviewedid` (wave 2 spells it `InstanceNumber`) is a per-interview
    # counter, not part of the key.  Not declared.
    #
    # DELIVERED ROWS: 5,645, not 5,669.  The 24 missing rows are the ones
    # with BOTH Roof and Floor null; _finalize_result's dropna(how='all')
    # (country.py, GH #645) removes them.  Framework behaviour, not a filter
    # written here; no material datum is lost, since a row survives if either
    # column is populated.
    #
    # NULLS: in the source, Roof is 5,635/5,669 non-null (34 missing) and
    # Floor 5,642/5,669 (27 missing); 24 of those overlap, so the delivered
    # table carries 34-24 = 10 null Roof and 27-24 = 3 null Floor.
    # These are Stata missings.  This wave DOES declare sentinels that the
    # earlier waves do not -- -999 "Don't know", -888 "Refuse to answer",
    # -777 "Not applicable", -666 "Other (please specify)" -- but only -666
    # actually occurs (5 roof rows, 11 floor rows), and it is just this
    # wave's spelling of "Other".  The three genuine non-response sentinels
    # are absent from the shipped data, so no mapping row exists for them;
    # if a future extract carries one it will survive unmapped and show up
    # as a non-canonical value, which is the correct loud outcome.
    #
    # `v` is NOT declared -- _join_v_from_sample() attaches it at API time.
    # Wave-3 `v` comes from the FPrimary[-6:-3] EA slice (see the `sample`
    # note above and mapping.py); housing households are a strict subset of
    # the sample households, so the join is total.
    #
    # MIXED-VINTAGE DIRECTORY NOTE (see CONTENTS.org): 2017-18/Data/ holds
    # both our pre-anonymization copies and files acquired from Harvard
    # Dataverse.  This file is one of the pre-existing ones; it carries
    # `materialroof`/`materialfloor` either way, so nothing here depends on
    # the extra variables our copy retains.
    #
    # Label harmonisation is done once for all three waves by the `Roof` /
    # `Floor` tables in ../../_/categorical_mapping.org.  This wave's
    # distinctive spellings are `Corrugated iron sheet` (SINGULAR -- wave 2
    # says `sheets`, wave 1 `Corrugate iron sheets`), `Ceramic/marble tiles`
    # (no slash before `tiles`, unlike waves 1-2) and `Other (please
    # specify)`.
    file: 12a_housingcharacteristics1iii_structure.dta
    idxvars:
        i: FPrimary
    myvars:
        Roof: materialroof
        Floor: materialfloor
individual_education:
    # 01gi_generaleducation.dta -- Section 1G(i) "General Education".  READ THE
    # FILENAME TWICE.  In 2013-14 education is module `f`; in THIS wave every
    # module letter shifted by one, so `f` is EMPLOYMENT
    # (01fi_employmentmain.dta) and education is `g`.  The three variables are
    # spelled IDENTICALLY in both waves -- `attended`, `highestgrade`,
    # `highestqual` -- so wiring this wave to `01fi_employmentmain.dta` (the
    # name that matches wave 2's education file) produces a plausible, silently
    # wrong table rather than an error.
    #
    # Two tells, both measured:
    #   - row count.  Education is 19,006 here (exactly the roster);
    #     01fi_employmentmain.dta is 1,481 x 66 and carries `paidemployed` /
    #     `maintasks` / `jobhoursperday`, no education variable at all.
    #   - the variable LABELS DO NOT HELP -- they make it worse.  This file's
    #     own labels still read `s01fi_02 - Ever Attended School`,
    #     `s01fi_03 - Highest Grade`, `s01fi_04 - Highest Qualification`: the
    #     instrument was renumbered but the labels were not, so a search for
    #     `s01fi_` corroborates the WRONG file.  Trust the module content, not
    #     the label prefix.
    #
    # 19,006 rows = the roster exactly, 5,669 households, (FPrimary, hhmid)
    # unique, no roster-only and no file-only person.  Unlike wave 2, the
    # under-3s ARE present here -- as rows with `attended`, `highestgrade` and
    # `highestqual` all null (1,075 rows; 1,072 are aged 0-2).  Same age floor
    # of 3, different shipping convention.  They resolve to NA and are dropped
    # downstream, so both waves deliver the same population.
    #
    # This wave's code list is the one that DIVERGES from waves 1-2: it inserts
    # SSS4 at 27 and shifts everything above it by one (27 = 'S1' in waves 1-2,
    # 'SSS4' here), and adds L6 / U6 at 33 / 34.  Harmless because the mapping
    # keys on the DECODED LABEL -- but fatal to any mapping written on codes.
    # It also adds the explicit -999 "Don't know" / -888 "Refuse to answer"
    # sentinels, both mapped to `Unknown`; neither occurs in the shipped data.
    #
    # `highestgrade` has no tertiary rung (it stops at U6), so all 775 tertiary
    # respondents sit in -666 'Other (please specify)'; 774 of them have a
    # non-null `highestqual` and the `_qual` fallback recovers them.
    #
    # `_attended` / `_qual` are temporary and are dropped by
    # ghanasps.individual_education().  `v` is NOT declared --
    # _join_v_from_sample() attaches it at API time.
    file: 01gi_generaleducation.dta
    idxvars:
        i: FPrimary
        pid: hhmid
    myvars:
        Educational Attainment:
            - highestgrade
            - mappings: ['harmonize_education', 'Original Label', 'Preferred Label']
        _qual:
            - highestqual
            - mappings: ['harmonize_education', 'Original Label', 'Preferred Label']
        _attended: attended

plot_features:
    # TWO-SOURCE table, same shape as 2013-14: size + tenure.
    #
    #   04h_agsection.dta   5,366 x 176 -- plot size: totalsize, PLOTUNIT
    #   04i_landtenure.dta  5,366 x 139 -- tenure: obtainhow
    #
    # Module 04 is agriculture BY CONTENT here too -- checked, because this
    # is the wave in which 01f silently became employment.
    #
    # THE UNIT TRAP (GH #732) -- READ `plotunit`, NOT `plotsizeunit`.  This
    # wave's instrument asks H8 "Can [Name] provide the size of plot [#] in
    # acres?  1-Yes >> H9 / 5-No" and asks the unit list ("1-Poles 2-Robes
    # 3-Plots -666-Other (please specify)") ONLY of the No's.  So
    # `plotsizeunit` -- the column wave 2 uses, and the natural name -- is
    # populated for 575 of 5,366 plots (10.7%): Poles 262 / Plots 154 /
    # Robes 153 / Other 6.  The producer-resolved unit for EVERY plot is
    # `plotunit` (5,366/5,366): Acres 4,791 / Poles 262 / Plots 154 /
    # Robes 153 / free text 6.  Reading plotsizeunit leaves 4,791 plots
    # (89.3%) with no unit and no Area, and NEITHER framework guard fires
    # (Site B needs 100% null; _assert_built_required_columns checks
    # presence).  Measured: where plotsizeacres == 'No', plotunit equals
    # plotsizeunit on 569 of 575 rows; the 6 exceptions are the 'Other
    # (please specify)' rows, for which plotunit carries the
    # plotsizeunitother free text instead:
    #   '2 miles squared'; 'It has never been measured before. It is a
    #   family land that belongs to forsfathers'; '-999' (x3); "Don't know".
    # The `AreaUnit` table in ../../_/categorical_mapping.org maps all six to
    # 'Other' -- the closed-question answer the respondent actually gave --
    # and they get no factor, hence a NaN Area (5 of the 6 also have a null
    # totalsize).  '-999' is this wave's "Don't know" sentinel typed into the
    # specify box.
    #
    # "ROBES" is this wave's spelling of Rope in BOTH the instrument and the
    # data label (wave 2's instrument also prints Robes; its data label was
    # corrected).  Folded onto 'Ropes' by the same table.
    #
    # KEY: (FPrimary, plotid), plotid 1..9.  FPrimary is the same id
    # 00_hh_info.dta uses; 5 of the 5,366 rows carry the 10-character split
    # form, and v = FPrimary[-6:-3] slices from the RIGHT so it is unaffected
    # (mapping.py).  The sample v-join needs no transformation and is TOTAL
    # (all 3,041 plot households are in 00_hh_info.dta).
    #
    # CARTESIAN CHECK (GH #323 site 4), measured on THIS wave SEPARATELY --
    # a rule verified on 2013-14 does not transfer: (FPrimary, plotid) is
    # unique in BOTH frames -- 5,366 distinct keys in 5,366 rows on each
    # side, intersection 5,366, 0 size-only, 0 tenure-only, 0 key values
    # duplicated in either frame, 0 null keys.  Exactly 1:1.
    #
    # AREA.  No producer area_ha.  totalsize is 5,347/5,366 non-null (the 19
    # missing: 10 Acres, 2 Plots, 1 Robes, 1 Poles and 5 of the 6 free-text
    # rows); the hook multiplies `_size` by wave 1's producer factor for the
    # unit.  Delivered Area is ~99.6% populated, median ~0.8 ha, 99th
    # percentile ~12 ha.  TWO PLOTS REPORT 70,000 POLES = 28,669 ha EACH (the
    # next largest is 800 acres); left exactly as reported -- core does not
    # edit data -- and flagged here for anyone using the wave-3 tail.
    #
    # Tenure: obtainhow (5,364/5,366 non-null; the 2 nulls are FPrimary
    # 107241063 plot 1 and 107272008 plot 2, left NA) -> canonical vocabulary
    # via the `Tenure` table.  Instrument I1 "How did [Name] obtain plot [#],
    # or gain the right to farm plot [#]?": 1 Purchased / 2 Inherited from
    # family member / 3 Rented (for cash or kind), or sharecropped /
    # 4 Allocated free of charge / 5 Begged / 6 Borrowed / -666 Other.  The
    # data label of option 3 drops the comma ("Rented (for cash or kind) or
    # sharecropped") -- a third spelling of the merged rent/sharecrop option,
    # so it has its own row.  The country data_scheme.yml has every target.
    # The 'Other' free text (obtainother, 67 rows) is not decoded.
    #
    # `merge_how: left`, size file primary.  `v` is NOT declared --
    # _join_v_from_sample() attaches it at API time.
    #
    # MIXED-VINTAGE DIRECTORY NOTE (CONTENTS.org): totalsize, plotunit and
    # obtainhow are questionnaire variables, not members of the free-text
    # `*other` / sub-district geography / consent families the public
    # Dataverse release strips, so nothing here depends on the extra columns
    # our pre-anonymization copies retain.
    dfs:
        - df_size
        - df_tenure
    df_size:
        file: 04h_agsection.dta
        idxvars:
            i: FPrimary
            plot_id: plotid
        myvars:
            # `_size` is TEMPORARY: consumed and dropped by
            # ghanasps.plot_features, which writes `Area`.
            _size: totalsize
            # plotunit, NOT plotsizeunit -- GH #732, see above.
            AreaUnit:
                - plotunit
                - mappings: ['AreaUnit', 'Alternate Spelling', 'Preferred Label']
    df_tenure:
        file: 04i_landtenure.dta
        idxvars:
            i: FPrimary
            plot_id: plotid
        myvars:
            Tenure:
                - obtainhow
                - mappings: ['Tenure', 'Alternate Spelling', 'Preferred Label']
    merge_on:
        - i
        - plot_id
    merge_how: left
    final_index:
        - t
        - i
        - plot_id

livestock:
    # TWO SOURCE FILES, ROW-CONCATENATED (not merged): the wave-3 livestock
    # roster and its "other -- specify" tail.
    #
    #   03ai_animalquestions.dta      4,203 x 44 -- eight closed labels
    #                                 (Cattle, Sheep, Goats, Pigs, Rabbits,
    #                                 Chickens/roosters, Draught animal
    #                                 (donkey, horse, bullock), Fish), owned
    #                                 only, 2,358 households
    #   03ai_animalquestions_osp.dta     91 x 43 -- the `_osp` free-text
    #                                 tail (eleven title-case species, 78
    #                                 households), SAME column names
    #
    # `_osp` means "other -- specify" (the suffix recurs on 03aii_tool-,
    # 03aiii_durablegood- and 05aii_assetquestions_osp).  The main file has
    # NO "Other" placeholder row for those households (its animal column
    # takes only the eight labels above; `xmoreanimals == 'Yes'` is what
    # routed them to the second file), so listing both under `file:`
    # concatenates without double counting.  Livestock BY CONTENT in both,
    # checked because this is the wave in which 01f silently became
    # employment.
    #
    #   animal        "Animal" / "Other animal"                 -> animal
    #   quantity      "s03ai_01 - Quantity"                     -> HeadCount
    #   quantitysold  "s03ai_11 - Quantity of animal sold in last 12
    #                 months"                                   -> HeadSold
    #   currentvalue  "s03ai_03 - Current Value"                -> HerdValue
    #
    # THE VALUE IS A HERD TOTAL, and this instrument is the most explicit
    # of the three (Documentation/Questionnaire/HH_Questionnaire_23_10.docx):
    # "What is the current value of the [animal type], if you sold all of
    # them?  Indicate amount as a decimal value (in Ghana cedis and
    # pesewas).  For example, enter 2.50 for 2 Ghana cedis and 50
    # pesewas."  Decimal cedis; nothing to recombine.
    #
    # HeadSold exists in THIS WAVE ONLY (quantitysold, 4,195/4,203 + 90/91
    # non-null, 2,978 + 62 zeros).  It is a 12-month flow against a
    # current stock, so quantitysold > quantity on 72 main-file rows (76
    # delivered, with _osp) is not an error;
    # two outliers are left exactly as reported (FPrimary 107258039,
    # chickens, 1,000 head / 40,000 sold; 101025002, cattle, 10 head /
    # 3,300 sold).  HeadAcquired is not asked.
    #
    # quantity is null on 23 main-file rows; 14 of them carry a value (11)
    # or only a sale (3) and are KEPT with HeadCount NaN, the other 9 carry
    # nothing and are dropped by the keep-rule (two households, 107240011
    # and 107250028, lose their only row that way).  quantity has no zeros
    # (owned-only roster, min 1).  DELIVERED: 4,284 rows, 2,361 households
    # (4,203 + 91 - 9 - 1).
    #
    # ONE DUPLICATE after the species mapping: FPrimary 106183008 reports
    # `Chickens/roosters` in the main file and `Chickens` in `_osp`; both
    # map to `Chicken` and the hook sums them (HeadCount, HeadSold and
    # HerdValue are all additive at this grain).  Pinned by the test.
    #
    # All 2,363 households (2,358 main, 78 _osp, union 2,363) are in
    # 00_hh_info.dta (100.0%); `v` is not attached by canonical design.
    # MIXED-VINTAGE DIRECTORY NOTE (CONTENTS.org): both files are among the
    # pre-existing copies; quantity / currentvalue / quantitysold are
    # questionnaire variables, not members of the families the public
    # Dataverse release strips.
    file:
        - 03ai_animalquestions.dta
        - 03ai_animalquestions_osp.dta
    idxvars:
        i: FPrimary
        animal:
            - animal
            - mappings: ['harmonize_species', 'Alternate Spelling', 'Preferred Label']
    myvars:
        HeadCount: quantity
        HeadSold: quantitysold
        HerdValue: currentvalue
