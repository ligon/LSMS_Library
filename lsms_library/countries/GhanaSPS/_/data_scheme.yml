Country: GhanaSPS

Data Scheme:
  food_acquired:
    # Built by {wave}/_/food_acquired.py -> canonical (t, i, j, u, s) with
    # [Quantity, Expenditure].  Bespoke 3-source melt: purchased / produced /
    # received-gift (s in {purchased, produced, inkind}) each carry their own
    # Quantity AND Expenditure (GhanaSPS records value on all three sources).
    # The country-level _/food_acquired.py concatenates the waves.
    #
    # NOTE (2026-08-19): this block previously asserted that GhanaSPS has no
    # `sample` table because "cluster identity [is] unavailable: no cluster var
    # in the food files".  THAT WAS FALSE and is now corrected.  2009-10's food
    # source S11A.dta itself carries id1..id4, with `id3` populated in all
    # 425,255 rows and taking exactly 334 distinct values -- the documented EA
    # count.  A `sample` table is now declared below, so `v` IS joined and the
    # index is (t, v, i, j, u, s).
    #
    # Price is api-derived; food_prices / food_quantities / food_expenditures
    # auto-derive at runtime (_FOOD_DERIVED) -- do NOT register them here.
    index: (t, i, j, u, s)
    Quantity: float
    Expenditure: float
    materialize: make

  sample:
    # Cluster identity, wave by wave.  The EA is `id3` in 2009-10 and a
    # right-anchored slice of the household id in 2013-14 / 2017-18; each
    # wave's _/data_info.yml carries the evidence and the traps.
    #
    # `weight` exists ONLY for 2009-10 (hhweight3, an expansion weight summing
    # to 7.11M households).  Waves 2 and 3 genuinely have none -- swept all 189
    # of their .dta files, and 2013-14's own key_hhinfo_panel.xlsx assigns the
    # weight variables to wave 1 only.  That is a producer-side gap, not a
    # config gap, so it cannot be closed here.
    #
    # No panel weight exists in any wave.  2009-10 is the pre-refreshment
    # baseline, so panel_weight repeats weight there (CLAUDE.md convention);
    # waves 2 and 3 are NaN.
    #
    # `Rural` is 2009-10 only (urbrur); `strata` is loc7 in 2009-10 and region
    # in 2017-18.  2013-14 ships no geography at all.
    index: (i, t)
    v: str
    weight: float
    panel_weight: float
    strata: str
    Rural: str
