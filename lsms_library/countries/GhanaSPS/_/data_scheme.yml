Country: GhanaSPS

Data Scheme:
  food_acquired:
    # Built by {wave}/_/food_acquired.py -> canonical (t, i, j, u, s) with
    # [Quantity, Expenditure].  Bespoke 3-source melt: purchased / produced /
    # received-gift (s in {purchased, produced, inkind}) each carry their own
    # Quantity AND Expenditure (GhanaSPS records value on all three sources).
    # The country-level _/food_acquired.py concatenates the waves.
    #
    # NOTE (2026-08-19): this block previously asserted that GhanaSPS has no
    # `sample` table because "cluster identity [is] unavailable: no cluster var
    # in the food files".  THAT WAS FALSE and is now corrected.  2009-10's food
    # source S11A.dta itself carries id1..id4, with `id3` populated in all
    # 425,255 rows and taking exactly 334 distinct values -- the documented EA
    # count.  A `sample` table is now declared below, so `v` IS joined and the
    # index is (t, v, i, j, u, s).
    #
    # Price is api-derived; food_prices / food_quantities / food_expenditures
    # auto-derive at runtime (_FOOD_DERIVED) -- do NOT register them here.
    index: (t, i, j, u, s)
    Quantity: float
    Expenditure: float
    materialize: make

  household_roster:
    # Person-level roster, all three waves.  Index is (t, i, pid) -- `v` is NOT
    # declared and must NOT be: `sample` is wired for every wave, so
    # _join_v_from_sample() attaches `v` at API time.
    #
    # Sources: 2009-10 S1D.dta (one file); 2013-14 / 2017-18 01b2_roster.dta
    # merged (left, roster authoritative) with 01d_background.dta for
    # MonthsAway.  Each wave's _/data_info.yml carries the evidence.
    #
    # Generation / Distance / Affinity are NOT declared here: _expand_kinship()
    # derives them from `Relationship` at API time via
    # lsms_library/categorical_mapping/kinship.yml.  Five GSPS spellings were
    # added to that file (the vocabulary drifts wave to wave -- W1
    # 'Adopted/Foster/Stepchild', W2 'Adopted, foster, or stepchild',
    # W3 'Adopted, foster/stepchild', and W2's 'Parent or parent-in-law' /
    # 'Son or daughter in-law').
    #
    # MonthsAway is declared for ALL THREE waves.  2009-10 reads s1d_27 with
    # BLANK TREATED AS ZERO, applied by that wave's `household_roster` df_edit
    # hook: Q27-Q33 is a skip block, and the per-EA pattern shows the blanks
    # are a recording convention (the EAs that recorded fewest people recorded
    # 95.9% non-zero values; those that recorded everyone, ~6%).  The full
    # evidence, and the two documented residuals, are in
    # 2009-10/_/data_info.yml.  It stays `optional` because the fill is a
    # reading of the blanks rather than a value the file states.
    #
    # Do NOT register household_characteristics -- it auto-derives from this
    # table via _ROSTER_DERIVED.
    index: (t, i, pid)
    Sex: str
    Age: float
    Relationship: str
    # Generation / Distance / Affinity are api_derived -- _expand_kinship()
    # fills them from Relationship at query time, nothing extracts them from
    # source.  They are declared anyway because the canonical schema marks
    # them required and tests/test_schema_consistency.py checks the
    # declaration, matching Ethiopia / Togo / every other roster country.
    Generation: int
    Distance: int
    Affinity: str
    MonthsAway:
        type: float
        optional: true

  individual_education:
    # Person-level educational attainment, all three waves.  Index is
    # (t, i, pid) -- `v` is NOT declared and must NOT be: `sample` is wired for
    # every wave, so _join_v_from_sample() attaches `v` at API time.
    #
    # Sources -- AND THE MODULE LETTER SHIFTS BETWEEN WAVES:
    #   2009-10  S1FI.dta                    (s1fi_2 / s1fi_3 / s1fi_4)
    #   2013-14  01fi_generaleducation.dta   (attended / highestgrade /
    #                                         highestqual)
    #   2017-18  01gi_generaleducation.dta   (SAME three variable names)
    #
    # In 2013-14 module `f` is education and `e` is employment; in 2017-18 both
    # shifted one letter, so `f` is EMPLOYMENT and education is `g`.  The
    # variable names are IDENTICAL in both waves, so pointing wave 3 at
    # `01fi_employmentmain.dta` -- the name that matches wave 2's education
    # file -- yields a plausible, silently wrong table.  Row count is the tell:
    # wave-3 education is 19,006 (= the roster), employment is 1,481.  Worse,
    # `01gi_generaleducation.dta`'s own VARIABLE LABELS still read `s01fi_02`,
    # `s01fi_03`, `s01fi_04`, so the labels corroborate the wrong file.  See
    # CONTENTS.org.
    #
    # WHY THE `df_edit` HOOK (ghanasps.individual_education).  A YAML `mapping:`
    # maps one source column onto one target; the attainment answer here is
    # split across three.  `_attended` and `_qual` are extracted as temporary
    # columns and consumed -- and dropped -- by the hook.  Measured cost of
    # NOT combining them, i.e. of wiring `highestgrade` alone:
    #   - 12,827 people the survey POSITIVELY RECORDS as never having attended
    #     school carry a null grade and would be deleted by `dropna(how='all')`.
    #     Wave 2 would then report `No education` for 9.6% of its rows where
    #     the survey says 24.7%.
    #   - 501 (W2) + 775 (W3) people would come back `Unknown` although the
    #     survey records a Bachelors / HND / diploma for them: waves 2 and 3
    #     have NO tertiary rung in `highestgrade` at all and put every tertiary
    #     respondent in the survey's own 'Other' bucket.
    # The fallback is deliberately NARROW (only where the grade is absent or
    # `Unknown`), not a max() over both ladders -- below the 'Other' bucket the
    # qualification is essentially a function of the grade and substituting it
    # would override an explicit grade with an exam result.  The hook's
    # docstring carries the resolution order and its justification.
    #
    # Vocabulary: `lsms_library/categorical_mapping/canonical_education_labels.org`,
    # via the row-additive `harmonize_education` table in this directory's
    # `categorical_mapping.org` (which also records the two mapping rulings --
    # university Levels 100-400, and Sixth Form L6/U6).  Map on the DECODED
    # LABEL, never the numeric code: code 27 is 'S1' in waves 1-2 but 'SSS4' in
    # wave 3.
    #
    # Age floor of 3: the module is not administered to children under 3.  Wave
    # 2 omits them from the file entirely (1,040 roster people, ages 0-2); wave
    # 3 keeps the rows with every education variable null (1,075, ages 0-2).
    # Either way they have no attainment datum and are dropped.
    #
    # Delivered rows and roster coverage (measured on a cold build):
    #   2009-10  16,955 of 18,889 roster people   89.8%
    #   2013-14  15,314 of 16,356                 93.6%
    #   2017-18  17,910 of 19,006                 94.2%
    # 0 people appear here who are not in `household_roster`, in any wave.
    # Waves 2 and 3 lose essentially only the under-3s; WAVE 1 ALSO LOSES 287
    # people aged 6+ whose module row is simply blank -- a wave-1 recording
    # defect, documented in 2009-10/_/data_info.yml, deliberately left NA
    # rather than filled.
    index: (t, i, pid)
    Educational Attainment: str

  sample:
    # Cluster identity, wave by wave.  The EA is `id3` in 2009-10 and a
    # right-anchored slice of the household id in 2013-14 / 2017-18; each
    # wave's _/data_info.yml carries the evidence and the traps.
    #
    # `weight` exists ONLY for 2009-10 (hhweight3, an expansion weight summing
    # to 7.11M households).  Waves 2 and 3 genuinely have none -- swept all 189
    # of their .dta files, and 2013-14's own key_hhinfo_panel.xlsx assigns the
    # weight variables to wave 1 only.  That is a producer-side gap, not a
    # config gap, so it cannot be closed here.
    #
    # No panel weight exists in any wave.  2009-10 is the pre-refreshment
    # baseline, so panel_weight repeats weight there (CLAUDE.md convention);
    # waves 2 and 3 are NaN.
    #
    # `Rural` is 2009-10 only (urbrur); `strata` is loc7 in 2009-10 and region
    # in 2017-18.  2013-14 ships no geography at all.
    index: (i, t)
    v: str
    weight: float
    panel_weight: float
    strata: str
    Rural: str

  housing:
    # Dwelling roof / floor material, all three waves, YAML path (no script:
    # one source file per wave, a straight column extraction, and the label
    # harmonisation lives in _/categorical_mapping.org rather than in code).
    #
    # Sources -- the module is stable at 12/12a across waves, CONFIRMED BY
    # CONTENT rather than by filename (GhanaSPS module letters are not
    # reliable -- verified on the shipped file lists, 01f is EDUCATION in
    # 2013-14 (01fi_generaleducation, 01fii_edcareer, 01fiii_literacy) and
    # EMPLOYMENT in 2017-18 (01fi_employmentmain, 01fii_employmentsecondary,
    # 01fiii_unemployed), education having moved to 01g).  The wave-2/3
    # variables carry the WAVE-1 variable name in their own Stata labels:
    # `materialroof` is labelled
    # "s12a_32 - Roof material" and `materialfloor` "s12a_31 - Floor
    # material" -- which is the producers themselves asserting the
    # continuity:
    #
    #   2009-10  S12AI.dta                                  s12a_32 / s12a_31
    #   2013-14  12a_housingcharacteristics1iii_structure.dta  materialroof /
    #   2017-18  12a_housingcharacteristics1iii_structure.dta  materialfloor
    #
    # Wave 1 keeps in ONE file (S12AI, Q1-Q36) what waves 2 and 3 split into
    # four (…1i_rent, …1ii_utilities, …1iii_structure, 12b_…2).  Roof/floor
    # are Q30-Q32 of S12AI; S12AII is the wave-1 twin of 12b and carries no
    # material variable, so there is nothing to merge and no `dfs:` block.
    #
    # `v` is NOT declared and must NOT be: `sample` is wired for every wave,
    # so _join_v_from_sample() attaches it at API time.  The join is total --
    # the housing households are a strict SUBSET of the sample households in
    # all three waves (0 housing-only ids anywhere), so `v` is 0% null.
    #
    # ROW COUNTS ARE BELOW THE HOUSEHOLD COUNTS IN EVERY WAVE, from two
    # independent causes.  Both are benign; neither is a config defect.
    #
    #   wave     households  source rows  delivered  absent  all-null
    #   2009-10       5,009        4,972      4,899      37        73
    #   2013-14       4,774        4,772      4,772       2         0
    #   2017-18       5,669        5,669      5,645       0        24
    #
    # (a) ABSENT -- households with no housing record at all in the shipped
    #     extract.  Wave 1's 37 are absent from S12AI entirely (they ARE in
    #     key_hhld_info.dta and S1D.dta, both 5,009); S12AII covers 30 of
    #     them but has no material variable, so they are not recoverable.
    #     Wave 2's 2 are 106199032 and 205163009.
    # (b) ALL-NULL -- rows present in the source with BOTH Roof and Floor
    #     missing, removed by _finalize_result's dropna(how='all')
    #     (country.py, GH #645).  This is framework behaviour, not a filter
    #     written here, and it costs no material data: a row survives if
    #     EITHER column is populated, which is why 9 Roof-nulls and 2
    #     Floor-nulls remain in wave 1 and 10 / 3 in wave 3.
    #
    # Checked arithmetic, wave 1: 82 Roof-null and 75 Floor-null source rows,
    # of which 73 are null in both -> 4,972 - 73 = 4,899 delivered, with
    # 82 - 73 = 9 and 75 - 73 = 2 nulls left.  Wave 3: 34 / 27 / 24 -> 5,645
    # delivered with 10 and 3 nulls.  Wave 2 has no nulls at all.
    #
    # Roof / Floor are harmonised at API time by the `Roof` and `Floor`
    # tables in _/categorical_mapping.org, auto-discovered by column name.
    # Every Preferred Label is drawn from the shared vocabulary in
    # lsms_library/categorical_mapping/canonical_housing_labels.org; the
    # per-judgement reasoning, including the one genuine merge
    # (GSPS separates Bamboo from Wood; the canon does not), is in that file.
    # Wall material exists in every wave and is deliberately not wired.
    index: (t, i)
    Roof: str
    Floor: str

  plot_features:
    # Lasting plot characteristics, all three waves, YAML path: one `dfs:`
    # merge per wave (size file primary, tenure file secondary,
    # `merge_how: left`) on the plot key, plus ONE country-level df_edit hook
    # (ghanasps.plot_features) that turns the native size into hectares and
    # drops the null-plot rows.  Index (t, i, plot_id); `v` is NOT declared
    # and must NOT be -- `sample` is wired for every wave and
    # _join_v_from_sample() attaches it at API time.  The join is TOTAL: every
    # plot household is in its wave's sample key file (2,812 / 2,678 / 3,041).
    #
    # SOURCES -- module 4 is agriculture BY CONTENT in every wave (variable
    # and value labels checked, CONTENTS.org), never assumed from the number:
    #
    #   wave     size / unit                                   tenure
    #   2009-10  S4AII.dta  area_ha, s4aii_a10, s4aii_a11      S4AIV.dta  s4aiv_a45
    #   2013-14  04h_agsection.dta  totalsize, plotsizeunit    04i_landtenure.dta  obtainhow
    #   2017-18  04h_agsection.dta  totalsize, PLOTUNIT        04i_landtenure.dta  obtainhow
    #
    # THE 2017-18 UNIT TRAP (GH #732).  Wave 3 first asks "Can [Name] provide
    # the size of plot in acres?" (plotsizeacres: 4,791 Yes / 575 No) and asks
    # `plotsizeunit` ONLY of the 575 who said No.  The resolved unit for every
    # plot is `plotunit` (5,366/5,366 non-null).  Reading the natural-looking
    # `plotsizeunit` -- the column wave 2 uses -- leaves 4,791 of 5,366 plots
    # (89.3%) with no unit and therefore no Area, and NEITHER framework guard
    # fires: the Site B null-read guard needs 100% null, and
    # _assert_built_required_columns checks presence, not content.
    # tests/test_ghanasps_plot_features.py pins Area >= 95% non-null per wave.
    #
    # "ROBES".  The unit list is spelled Acre/Pole/Rope/Plot in 2009-10,
    # Acres/Poles/Ropes/Plot in 2013-14 and Acres/Poles/ROBES/Plots in
    # 2017-18.  Both the wave-2 and the wave-3 INSTRUMENT print "Robes"; wave
    # 2's data label was corrected to "Ropes", wave 3's was not.  The
    # `AreaUnit` table in _/categorical_mapping.org folds every spelling onto
    # GhanaLSS's vocabulary (Acres / Poles / Ropes / Plot / Other) at
    # extraction time.
    #
    # HECTARES.  2009-10 ships a producer-computed `area_ha`; dividing it by
    # the reported native size recovers the factors to float precision
    # (within-unit sd ~1e-8; slurm_logs/ghanasps/FINDINGS_agriculture.org):
    #     Acre 0.404694   Pole 0.409551   Rope 0.236342   Plot 0.102388  ha
    # Waves 2 and 3 ship no area_ha, so the hook applies WAVE 1's OWN factors
    # to their native sizes -- chosen for internal consistency with the
    # shipped wave-1 numbers rather than the standard acre (0.404686 ha, a
    # 2e-5 relative difference; seen, noted, not used).  Wave 1 prefers the
    # shipped area_ha where present and derives from size x factor otherwise;
    # measured, that fallback takes 0 rows: area_ha equals size x factor
    # wherever both exist (0 of 5,553 rows differ by > 1e-4 ha) and is null
    # exactly where the unit or the size is missing (133 of 5,686 plots, 2 of
    # which report the unit 'Other').  Area is NaN wherever the unit has no
    # factor: 10 wave-2 'Other - Specify' plots ('1 bedroom', '25 BY 30 FEET',
    # '16 Squares', ...) and 6 wave-3 free-text plots (see 2017-18).
    #
    # Two wave-3 plots report 70,000 Poles (28,669 ha each; the next largest
    # is 800 acres).  Left exactly as reported -- core does not edit data --
    # and the wave-3 99th percentile (~12 ha, median ~0.8) shows the factor,
    # not the tail, is right.
    #
    # `plot_id` IS a panel id from wave 1 to wave 2 (4,916 of 5,082 wave-1
    # plots, 96.7%, reappear under the same number in 04h_preroster, an
    # explicit carry-forward list) but NOT from wave 2 to wave 3: tested
    # against a permutation null, the true (i, plotid) pairing does not beat
    # chance on area, soil colour or distance (CONTENTS.org, FINDINGS).  Do
    # NOT join plot-level GhanaSPS data across waves 2 and 3 on (i, plot_id);
    # the `t` level already scopes every row, so nothing has to be prevented
    # -- it only has to be known.
    #
    # TENURE -- every source label and its target.  The same table lives in
    # _/categorical_mapping.org and is applied at EXTRACTION (unlike
    # housing's Roof/Floor, which are API-time), because
    # tests/test_table_structure.py runs the declared-spellings check on the
    # CACHED parquet and Tenure has a declared vocabulary:
    #
    #   2009-10 s4aiv_a45               2013-14 / 2017-18 obtainhow                 -> Tenure
    #   Purchase                        Purchased                                   owned
    #   Inherit                         Inherited from deceased family member       inherited
    #                                   Inherited from family member                inherited
    #   Rent for cash or kind           Rented (for cash or kind), or sharecrop(ped) rented_in
    #   Sharecrop                       --                                          sharecropped_in
    #   Sharecrop with initial payment  --                                          sharecropped_in
    #   Allocated free                  Allocated free of charge                    communal
    #   --                              Begged                                      use_right
    #   --                              Borrowed                                    use_right
    #   --                              Other - specify / Other (please specify)    other_tenure
    #
    # Judgements, and what each rests on:
    #  * 'Allocated free (of charge)' -> communal, NOT use_right.  The
    #    waves-2/3 follow-up "What qualifies you to be allocated this plot
    #    free of charge?" answers Lineage or Member-of-the-community for 456
    #    of 648 (70%) and 474 of 637 (74%) such plots, and the grantor is a
    #    relative or the chief for 69% / 75%; the friend-/employee-of-owner
    #    minority (~20%) would read as use_right.  GhanaLSS maps its
    #    equivalent 'Distributed by village/family' to communal.  In WAVE 1
    #    the category is BROADER: that instrument has no Begged / Borrowed
    #    option, so those plots land here too (2,091 plots against
    #    648 + 225 + 80 in wave 2).
    #  * Begged / Borrowed -> use_right ("held under agreement with a
    #    use-rights owner, often non-cash", data_info.yml).
    #  * Waves 2 and 3 MERGE rent and sharecrop into one option; it goes to
    #    rented_in (sharecropping is rent paid in kind), because the canonical
    #    vocabulary cannot be extended from a country config.  Wave 1 keeps
    #    the distinction (387 rented_in + 626 sharecropped_in).  Consequence:
    #    sharecropped_in exists ONLY in 2009-10, and waves 2-3 rented_in
    #    includes sharecropping -- a cross-wave comparison of those two values
    #    is an instrument artefact, not a trend.
    #  * 'Other' free text (73 / 67 rows: "no man's land", "I just saw it and
    #    started farming on it", "Caretaker", ...) is NOT decoded ->
    #    other_tenure.
    #
    # NOT declared, deliberately: Irrigated (the source is "has a non-rain
    # water source", weaker than the canonical meaning -- FINDINGS risk b);
    # SoilType (not a straight extraction in any wave: a multi-variable
    # S4AIII block in 2009-10, 12- and 15-way multi-select soil flags in
    # 2013-14 / 2017-18); TenureSystem (no freehold/leasehold/customary
    # question found); Latitude/Longitude (absent).
    index: (t, i, plot_id)
    Area: float
    AreaUnit: str
    Tenure: str

  livestock:
    # Household-animal roster, all three waves, YAML path: one source file
    # per wave (wave 3 lists its `_osp` "other -- specify" tail as a second
    # file, row-concatenated), the `animal` label harmonised at EXTRACTION
    # through the `harmonize_species` table in _/categorical_mapping.org,
    # plus ONE country-level df_edit hook (ghanasps.livestock) for what YAML
    # cannot do -- see below.  Index (t, i, animal), the canonical grain in
    # lsms_library/data_info.yml `index_info`.  `v` is NOT declared and is
    # NOT joined: livestock's canonical index omits v and the table is in
    # data_info.yml's `Join v from sample > skip_extra`, exactly as Uganda /
    # Nigeria / Malawi document ("No v level").  Every livestock household
    # is nonetheless in its wave's sample() -- 2,142 / 2,098 / 2,363, 100.0%.
    #
    # SOURCES -- module 03ai is livestock BY CONTENT in every wave (quantity
    # possessed, sale value, per-species expenses, revenue), never assumed
    # from the number, because GhanaSPS module letters move (01f is
    # education in 2013-14 and EMPLOYMENT in 2017-18):
    #
    #   wave     file                                   HeadCount  HeadSold      HerdValue
    #   2009-10  S3AI.dta                               s3ai_1     --            s3ai_3i (cedis) + s3ai_3ii (pesewas)/100
    #   2013-14  03ai_animalquestions.dta               quantity   --            currentvalue
    #   2017-18  03ai_animalquestions.dta + _osp.dta    quantity   quantitysold  currentvalue
    #
    # THE VALUE COLUMN IS HerdValue, NOT ValuePerAnimal.  data_info.yml splits
    # the livestock value columns by ADDITIVITY and says the wording settles
    # it.  All three GhanaSPS instruments ask for the HERD TOTAL, verbatim:
    #
    #   2009-10  S3AI variable label: "Q3.1 What is the current value of
    #            these animals if you sold all of them (cedis)" / "Q3.2 ...
    #            (pessewa[s])".
    #   2013-14  ISSER_Yale_Part A_WAVE II.docx: "What is the current value
    #            of these animals, if you sold all of them?  Gh Cedis and
    #            pesewas".
    #   2017-18  HH_Questionnaire_23_10.docx: "What is the current value of
    #            the [animal type], if you sold all of them?  Indicate amount
    #            as a decimal value (in Ghana cedis and pesewas).  For
    #            example, enter 2.50 for 2 Ghana cedis and 50 pesewas."
    #
    # Uganda, Nigeria and Malawi ask "If you sold ONE of the [ANIMAL] today,
    # how much would you receive?" -- a per-head reservation price.  These
    # are NOT the same quantity: the GhanaSPS number sums over `animal` to a
    # household's livestock wealth; theirs does not.  Corroborated by the
    # conditional test data_info.yml prescribes: in the wave-2 grid, 0 of
    # the 10,884 zero-head rows carry a value -- a herd total vanishes with
    # the herd, a per-head price would not.  Per-head sanity (median
    # HerdValue / HeadCount, GHS): cattle 300 / 700 / 1,155, goats 30 / 71 /
    # 133, chicken 5 / 10 / 20 across the three waves -- cattle >> goats >>
    # chicken in every wave, and the wave-1 numbers are on the same scale as
    # the later decimal-cedis waves (a pesewas-as-cedis error would be x100).
    #
    # COLUMNS.  Only what the instruments record:
    #   HeadCount  head possessed now.  A stock.  Wave 1 and wave 3 are
    #              owned-only rosters (no zeros); wave 2 is a fixed
    #              seven-species GRID asked of every household, whose
    #              10,884 zero rows the hook drops (below).
    #   HeadSold   head sold in the last 12 months -- ASKED IN 2017-18 ONLY
    #              (quantitysold), hence `optional` so the Site B null-read
    #              guard does not fire on the two waves that never ask it.
    #              A flow against a stock: quantitysold > quantity on 72
    #              wave-3 rows is not an error.
    #   HerdValue  the herd total above, decimal GHS in every wave (wave 1
    #              recombined from the cedis / pesewas pair by the hook).
    # NOT declared, deliberately: ValuePerAnimal (never asked -- a per-head
    # figure would be HerdValue / HeadCount, an analyst's transformation);
    # SalesValue (the revenue questions -- s3ai_12, animalrevenue /
    # productrevenue -- are animals AND products together, so they are not
    # the canonical sales-of-animals total); HeadAcquired (never asked);
    # TLU (a transformation).  The per-species EXPENSES (feed bought, feed
    # home-produced, veterinary, shelter, labour, water, other) and REVENUE
    # exist in every wave and have no canonical home -- left unwired,
    # recorded in CONTENTS.org.
    #
    # `animal` VOCABULARY.  A precedent label wins wherever one exists so
    # that Feature('livestock') agrees across countries: Uganda's
    # species-level Cattle / Sheep / Goats / Pigs / Rabbits / Chicken /
    # Donkeys / Other Poultry; Nigeria's and Malawi's Guinea Fowl / Duck /
    # Turkey / Fish / Dove/Pigeon / Other Livestock.  Coinages where none
    # exists (plural): Draught Animals, Dogs, Cats, Grasscutters, Guinea
    # Pigs, Peacocks, Quails.  Spelling is harmonised, a named species is
    # NEVER folded; only labels naming no species go to a catch-all (BIRDS /
    # Bird -> Other Poultry; wave 1's `Other Farm Animals` -> Other
    # Livestock).  Three wave-2 free-text spellings are genuinely
    # unmappable and pass through as their own labels: '50', 'cut', 'dake'.
    # Cross-wave caveats, all instrument artefacts: `Other Livestock` exists
    # only in 2009-10 (that instrument offers no slot to name a guinea fowl
    # or a duck, so they live in the catch-all); `Donkeys` (named in the
    # free text) overlaps with `Draught Animals` (the grid row that includes
    # donkeys).  The full table, its rule and every judgement are in
    # _/categorical_mapping.org.
    #
    # THE HOOK (ghanasps.livestock), and why each step is there:
    #   1. HerdValue = cedis + pesewas/100 for 2009-10 (YAML maps one column
    #      to one column).  NaN only where cedis is null AND pesewas is 0.
    #   2. Drops 2009-10's 8 null-animal rows (181 head, a REAL loss that no
    #      column can identify; format_id would otherwise hand the collapse
    #      a null index level to delete with a GrainCollapseWarning).
    #   3. Keep-rule: a row survives iff ANY of HeadCount / HeadSold /
    #      HerdValue is non-null and > 0 -- Nigeria's inclusive form of the
    #      convention all three precedent countries apply to roster-grid
    #      filler.  Inclusive because HerdValue is a stock valuation, so a
    #      value alone IS evidence of a holding (9 wave-1 and 11 wave-3 rows
    #      have a null head and a positive value; Uganda's value-excluding
    #      form is about per-head prices and does not transfer).  Drops
    #      10,884 + 13 wave-2 rows, 2 wave-1 rows and 9 wave-3 rows.
    #   4. Sums duplicate (t, i, animal) lines with min_count=1: 2009-10's 20
    #      households with 2-3 `Other Farm Animals` lines (42 rows -> 20;
    #      DIFFERENT unnamed species added into one Other Livestock row --
    #      the level that instrument never recorded) and 2017-18's one
    #      household with Chickens/roosters in the main file and Chickens in
    #      _osp.  Legal because every declared column is additive at this
    #      grain; the Malawi / Uganda precedent.  It is a reducer and it is
    #      kept bounded -- the test pins the per-wave counts so a NEW
    #      duplicate turns red instead of being summed.
    #
    # Delivered on a cold build under LSMS_GRAIN_STRICT=1: 4,248 / 3,963 /
    # 4,284 rows in 2,137 / 2,081 / 2,361 households, index unique, 0
    # GrainCollapseWarning, 0 null-read reports, is_this_feature_sane().ok
    # True.  See CONTENTS.org "Livestock" and
    # slurm_logs/ghanasps/livestock_verify_cold.log.
    index: (t, i, animal)
    HeadCount: float
    HeadSold:
        type: float
        optional: true
    HerdValue: float

  crop_production:
    # Plot-crop harvest records, all three waves, at the grain
    # (t, i, plot_id, j, u, season) -- Nigeria's shape (no `condition`: the
    # instruments never ask the physical state of the harvest, so the
    # canonical `unknown_condition` sentinel -- "a record whose condition
    # code is missing or outside the source's labelled scheme" -- does not
    # apply; there is no scheme to be outside of) plus Uganda's `season`
    # level.  `v` is NOT declared and must NOT be -- `sample` is wired for
    # every wave and _join_v_from_sample() attaches it.  `plot_id` is
    # derived EXACTLY as plot_features derives it (2009-10 plot_no; 2013-14
    # / 2017-18 plotid, via format_id) and every harvest plot is in that
    # wave's plot_features key file (5,034 / 3,826 / 3,440 = 100.0%).
    #
    # MIXED BUILD PATH, declared `materialize: make`:
    #   2009-10  a wave SCRIPT (2009-10/_/crop_production.py).  The
    #            instrument is a plot-by-crop MATRIX -- S4AV1.dta (last MAJOR
    #            season) and S4AV2.dta (last MINOR season), five harvest
    #            slots per plot each -- and YAML cannot melt it.
    #   2013-14  YAML (04n_harvestquestions) + the ghanasps.crop_production
    #   2017-18  df_edit hook; 2017-18 `dfs:`-merges 04o_cropsalesstores-
    #            questions for the plot-crop sales.
    # Under the default build backend Country.load_from_waves dispatches
    # per wave (YAML block -> grab_data; no block -> the wave script), which
    # is how Tanzania's 2008-15 tables and Iraq's assets already build.
    # Under LSMS_BUILD_BACKEND=make the flag routes to a COUNTRY-level make
    # target, which a mixed table has no honest way to supply (a country
    # concatenator would have to re-run the YAML waves itself), so that
    # backend cannot build this table; nothing in tests/ uses it.  Recorded
    # rather than hidden.
    #
    # THE S4AV2 LABEL ERROR (2009-10).  Every quantity / value label in
    # S4AV2 says "harvested in the last major season".  The questionnaire
    # (Documentation/Household_questionnaire_Part_A.pdf) heads the block
    # "LAST MINOR SEASON: CROP (HARVESTS) 1" and asks "A122. What is the
    # quantity harvested in the last minor season?"; S4AVI2's own chemical
    # label agrees ("In the past minor season ...").  `season` is assigned
    # from the FILE -- S4AV1 -> major, S4AV2 -> minor -- and the
    # discriminating check is that the minor set is the SMALLER one (crop-1
    # quantity on 4,825 vs 1,412 plots).  2013-14 / 2017-18 ask for "the
    # total quantity which has been harvested over the last 12 months", so
    # their `season` is the constant `annual` -- a recall period, not a
    # season -- kept as a level so the waves share one shape.
    #
    # COLUMNS -- reported values only, native units, no kg conversion:
    #   Quantity       harvested quantity in unit `u`.  2009-10 A81/A122;
    #                  later `harvestquantity`.
    #   Quantity_sold  2017-18 ONLY: the summed sale-channel quantity where
    #                  every selling channel used the row's harvest unit
    #                  (3,062 rows).  2009-10 never asks a sold quantity
    #                  (S4BI and A83 are revenue only); 2013-14's sales file
    #                  has no plotid.  `optional`, or the Site B null-read
    #                  guard fires on the two waves that never have it.
    #   Value_sold     2009-10 A83/A124 "What was the total revenue from this
    #                  crop harvest (sold)?", cedis + pesewas/100, per season
    #                  harvest record (S4BI's B71 is a season-less 12-month
    #                  sales roster and is NOT used -- its crop rows match a
    #                  major harvest slot for only 2,976 of 4,752 rows, and
    #                  where both exist B71 == A83 for 891 of 2,156).
    #                  2017-18: sum over the nine buyer channels of quantity x
    #                  per-unit price ("the price for which [Name] sold one
    #                  [unit]"), money being additive whatever the units.
    #                  2013-14: NaN (no plotid).  `optional` for the 2013-14
    #                  slice.  Decimal GHS in every wave.
    #   harvest_month  str: sorted zero-padded month tokens, space-separated
    #                  ('10 11'), because the later waves are multi-select.
    #                  2009-10 is a PROXY -- the ending month of the major /
    #                  minor season of the plot's DOMINANT crop (S4AIX1
    #                  A289.2 / S4AIX5 A326.2) stamped on every harvest
    #                  record of that plot-season; read it as the season's
    #                  end, not the crop's own harvest date.
    #
    # `j` VOCABULARY: the `harmonize_crop` table in _/categorical_mapping.org,
    # mapped on the DECODED label (codes are not stable: 2017-18 introduces
    # -666 for Other; 2013-14 ships blank codes).  Preferred Label = the
    # GhanaSPS food_items.org label where the harvested crop IS that food
    # (Maize, Cocoyam, Groundnuts, Onions, Palm Nuts, Pepper (fresh or
    # dried), Tomatoes (fresh) ...) so a crop `j` joins food_acquired.j --
    # Uganda's stated purpose for its table; else Uganda's crop label (Beans,
    # Cocoa, Coffee, Cotton, Rice, Other Crop); else a title-case coinage.
    # Spelling harmonised, no crop folded.  2009-10 crop codes 0 / 44-47 /
    # 90 (12 records) are defined nowhere in that instrument and are dropped.
    #
    # THE HARVESTED PART (2009-10 only) IS NOT `condition`.  A80.2 / A121.2
    # "ID of part of crop harvested (e.g. Cocoa, Cocoa Leaves)": Leaves /
    # Branches / Bark / Sap / Stem / Roots-tuber / Fruit-Seeds-Nuts / Bulb.
    # That is WHICH product of the plant was taken, not the physical state
    # of one product, and it is not force-fitted into the canonical level.
    # But it cannot simply be dropped: 47 (plot, crop, unit, season) keys
    # carry two records, and in 18 of them the parts DIFFER (cocoyam
    # roots/tuber and cocoyam leaves, both in baskets) -- summing those adds
    # tubers to leaves.  So, following the instrument's own example, a
    # record whose part is a different PRODUCT (Leaves / Branches / Bark /
    # Sap / Stem, except where that is the crop's principal product) gets a
    # qualified `j`: `Cocoyam Leaves` (an existing food_items label, 88
    # records) or `Crop (part)` for the rare rest.  Roots-tuber /
    # Fruit-Seeds-Nuts / Bulb never qualify (yam "seeds" and cassava "fruit"
    # are the main harvest with an odd code).  These labels exist ONLY in
    # 2009-10, because only that instrument records the part -- a
    # cross-wave instrument artefact like Tenure's sharecropped_in.  The
    # remaining same-product duplicates (two harvest events of one product
    # in one unit) are SUMMED, a bounded reducer whose per-wave group count
    # tests/test_ghanasps_crop_production.py pins.
    #
    # `u` VOCABULARY: the harmonizedunit Preferred Labels of _/units.org --
    # what food_acquired.u already delivers (Maxi bag, Tuber, Kilogram,
    # Single ...).  2009-10 stores a unit CODE with no labels, decoded
    # through the same unit09 -> harmonizedunit chain as its food_acquired
    # script; 2013-14 / 2017-18 spellings are folded by the `harvest_units`
    # table (NOT a table named `u`, which would be auto-dispatched onto
    # every `u` level at API time).  `Unknown` where a quantity has no unit
    # (194 2009-10 records) or the code is 0 / -1; a positive 2009-10 code
    # the codebook does not define (1, 46, 50, 51, 53, 57, 58, 61, 80, 94;
    # ~25 records) stays as the code string -- an accepted residual, never a
    # guessed label.  `Other` where the respondent chose it, with the
    # specify text folded only on an exact match to a vocabulary unit.
    #
    # NOT declared, deliberately: condition (never asked); intercropped
    # (2013-14 / 2017-18 record a plot-level multi-select list of which crops
    # were intercropped, not a per-crop flag); planting_month; perennial;
    # market value of the harvest (A82 / A123, no canonical home); damage
    # and expected-still-to-harvest quantities; the harvested part as a
    # level.
    index: (t, i, plot_id, j, u, season)
    Quantity: float
    Quantity_sold:
        type: float
        optional: true
    Value_sold:
        type: float
        optional: true
    harvest_month: str
    materialize: make

  plot_labor:
    # Plot-stage labour, all three waves, at the survey's own grain
    # (t, i, plot_id, season, stage, source).  `v` is NOT declared and must
    # NOT be -- `sample` is wired for every wave and _join_v_from_sample()
    # attaches it at API time (plot_labor is in neither exclusion list of
    # lsms_library/data_info.yml: it is absent from `index_info`, whose
    # comment says the plot-level ag features are held back until their
    # per-country index NAMES converge, and absent from `skip_extra`).
    #
    # ALL THREE WAVES ARE WAVE SCRIPTS ({wave}/_/plot_labor.py).  The `source`
    # axis is a melt across column GROUPS -- five (workers, days-per-worker)
    # column pairs in the later waves, nine (days, hours, workers) cells in
    # 2009-10 -- which df_data_grabber cannot express.  Shared vocabulary and
    # arithmetic live in _/ghanasps.py as plain helpers; there is no
    # country-level df_edit hook, because there is no YAML wave to hook.  As
    # with crop_production, `materialize: make` means LSMS_BUILD_BACKEND=make
    # would route to a country-level target that does not exist; nothing in
    # tests/ uses that backend.
    #
    # SOURCES -- module 4 is agriculture BY CONTENT in every wave:
    #
    #   2009-10  S4AIX1..8      8 files: 4 stages x 2 seasons, 5,686 plots each
    #   2013-14  04m_aglabourquestions (32,851 = 7 stages x 4,693 plots)
    #            + 04m_aglabour        ( 4,693, the PLOT-level hired-pay block)
    #   2017-18  04m_aglabourquestions (20,663; done stages only, pay folded in)
    #
    # STAGE.  Nine values, and the count is the honest one.  2009-10 asks the
    # battery FOUR times per season; the later waves ask it SEVEN times, and
    # the later seven are not a refinement of the same four -- 2009-10's
    # blocks are strictly COARSER (land_preparation covers clearing +
    # ploughing + planting; field_management covers chemical_application +
    # weeding; harvesting and post_harvest coincide).  Folding the later waves
    # onto four would throw away grain the survey collected, and 2009-10
    # cannot be split into seven without inventing data.  Both vocabularies
    # are kept and the containment is tabulated in _/categorical_mapping.org
    # (harmonize_stage) so a consumer can fold 7 -> 4 by summing PersonDays.
    # Same shape as this country's Tenure.sharecropped_in and
    # crop_production's `Cocoyam Leaves` -- an instrument artefact, recorded
    # rather than smoothed.
    #
    # THE 2009-10 STAGE ASSIGNMENT IS THE RISKIEST THING IN THIS TABLE, and
    # it is asserted rather than assumed.  The four stage files' variable
    # label TEXT is identical ("Number of days casual labor provided by men",
    # ...), but each label is PREFIXED WITH ITS QUESTION NUMBER -- S4AIX1
    # carries A290..A298, S4AIX2 A299..A307, S4AIX3 A308..A316, S4AIX4
    # A317..A325, and A327..A362 for the minor-season four -- and the
    # questionnaire's eight section headers name the stage of each A-range
    # (quoted verbatim in _/categorical_mapping.org).  2009-10/_/plot_labor.py
    # reads each file's own labels and FAILS THE BUILD if the A-numbers are
    # not the ones its stage claims.  Season is anchored twice over: S4AIX1's
    # A289 label says "MAJOR season of dominant crop" and S4AIX5's A326 says
    # "MINOR", and the month distributions agree (A289.1 clusters Feb-Jun,
    # A326.1 Jul-Oct).
    #
    # THE 2017-18 `stageid` TRAP.  It looks like 2013-14's `stagenum` and is
    # not: `stagenum` IS the stage (a full 7 x 4,693 grid, 4,693 rows per
    # value), while `stageid` is the ORDINAL POSITION of the stage in the
    # plot's list of stages actually done -- stageid == 1 is Clearing on
    # 2,285 rows, Planting on 1,130, Chemical application on 460, Harvesting
    # on 42, ...  Reading it as a stage code would mislabel ~60% of wave-3
    # rows with NOTHING to catch it: both are small integers, the index stays
    # unique and every sanity check passes.  Both scripts key on the stage
    # NAME and each asserts its own file's shape.
    #
    # SEASON.  2009-10 is genuinely two-season: major (S4AIX1..4) and minor
    # (S4AIX5..8).  2013-14 and 2017-18 ask about "the last farming season"
    # ("the last farming season (2017)" in wave 3) and never name which, so
    # their constant is `last` -- deliberately NOT `major` (unnamed by the
    # instrument) and deliberately NOT crop_production's `annual`, which is
    # that table's own explicit 12-month recall (N5, "give the total quantity
    # which has been harvested over the last 12 months") and a different
    # question in the same interview.
    #
    # SOURCE.  Five later-wave values (self / family / communal / hired /
    # other, the Part M "Who worked on this plot ...?" options) and three
    # 2009-10 values (casual / permanent / family).  Not folded, for the
    # stage reason: casual + permanent = the later waves' `hired` (both are
    # non-household paid labour; 2009-10 splits by contract length and the
    # later waves do not ask), and 2009-10's `family` is BROADER than the
    # later waves' -- that instrument has no "yourself" question, so the
    # respondent's own days have nowhere else to go, and A362's own wording
    # is "How much family labor is worked by children? (including exchanged
    # labor)", i.e. it also absorbs what the later waves call communal.  Both
    # containments are tabulated in harmonize_labor_source.
    #
    # PERSONDAYS is within-question arithmetic (Uganda's convention), and the
    # multiplication differs by wave because the instruments do:
    #   2009-10  sum over men / women / children of (A29x.1 "# of days") x
    #            (A29x.3 "Average # of workers") -- the .1 and .3 cells of ONE
    #            question.  A group needs both cells; the row is NaN only if
    #            no group has both.
    #   later    sum over women / men of (M5/M6-style "Number of people") x
    #            ("how many days ON AVERAGE did EACH OF ... Number of days").
    #            THE `*days` COLUMNS ARE PER-WORKER DURATIONS: reading them as
    #            person-days undercounts by the worker count (mean 3.4 hired
    #            men per plot-stage in 2013-14).  `personaldays` is the
    #            respondent alone and is already person-days -> the `self` row.
    # The worker totals corroborate the reading: familyworkers ==
    # familywomen + familymen on all 8,954 / 11,463 rows that report them,
    # and likewise for communal, hired and other.
    #
    # HOURS is 2009-10 ONLY (A29x.2 "Average hours per day worked by ...").
    # Delivered as the person-day-weighted mean of the three sex groups'
    # hours cells -- the number that multiplies PersonDays to give
    # person-hours.  A group whose hours cell is null is excluded from BOTH
    # the numerator and the denominator.  The later waves never ask it.
    #
    # WAGE IS A RATE HERE, NOT CASH PAID -- so there is deliberately NO
    # `Wage` column.  Uganda's and Nigeria's plot_labor.Wage is the cash
    # actually paid to hired labour (Nigeria: "sum over man/woman/child of
    # (reported daily wage x hired days)"); GhanaSPS asks "How much on
    # average did [Name] pay each man as hired labor during the last farming
    # season?" plus "Does [Name] pay those amounts per day or per acre?".
    # Those are not the same quantity and must not share a column name.
    #   * THREE rate columns, not one.  The man / woman / child rates are
    #     three separately reported cells, and no weight exists that could
    #     combine them -- least of all for the 235 + 415 `Per acre` and
    #     84 + 187 `Per plot` rows, where the rate is a piece rate for the
    #     job and not a price of a person-day at all.  Combining them is a
    #     transformation; core does not aggregate.
    #   * 2017-18 DROPS the child rate -> WageRateChildren is null in that
    #     wave.  Hence `optional: true` on all three (and on Hours, WageUnit)
    #     -- the Site B null-read guard fires on a REQUIRED column that is
    #     100% null in any wave's t slice.
    #   * A rate of <= 0 is not a rate.  2013-14 fills all three cells for
    #     every cash-paying plot and uses -1 / 0 for "no such worker" (591 -1
    #     and 701 zeros among 1,811 woman cells, against 449 plots that hired
    #     any woman); 2017-18 has no -1 but 38 man and 4 woman zeros.  Read as
    #     missing, counted on stdout (81 / 1,292 / 1,764 cells in 2013-14,
    #     38 / 4 in 2017-18).
    #   * GRAIN DIFFERS BETWEEN THE LATER WAVES, and that is the data, not a
    #     choice: 2013-14's block is asked and stored once per PLOT (M190-M196
    #     under "IF M2=4 OR M29=4 OR ..."), so its rate is stamped on all
    #     seven of the plot's stage rows; 2017-18's instrument also prints it
    #     once per plot but the shipped file stores it per stage row and it
    #     genuinely varies -- 620 of 5,366 plots carry two or more distinct
    #     man rates -- so it is delivered at stage grain.
    #   * WageUnit reuses plot_features' AreaUnit spellings for its four area
    #     members (Acres / Poles / Ropes / Plot), so a per-area rate can be
    #     converted with plot_features().Area without a second vocabulary.
    #     The `Other` free text is not decoded (some of it is a period, some
    #     an area, some neither: "per tank of spraying machine", "per 3
    #     hours", "Per bottle", "the whole farm").
    #   * `monetary: true` on the three rates is what makes currency.py
    #     attach GHS: _monetary_columns() unions _DEFAULT_MONETARY, the
    #     canonical Columns block AND this file (currency.py docstring names
    #     a country's data_scheme.yml as the extension point), and
    #     attach_currency is table-level.  NOTE a real gap, reported not
    #     fixed: _all_monetary_columns() -- used only by the standalone
    #     lsms_library.conversion.convert, which sees a frame but not a table
    #     name -- does NOT read country schemes, so it would not scale these
    #     columns.  Closing it means editing lsms_library/currency.py or the
    #     canonical data_info.yml.
    #
    # KEEP RULE: PersonDays > 0.  Forced by the two later waves' incompatible
    # fill patterns for a stage nobody worked -- 2013-14 ships a full
    # 7-stages-x-every-plot grid with an `any` Yes/No screener, 2017-18 ships
    # only the stages actually done (mean 3.85 rows per plot).  Keeping zero
    # or null rows would emit 2013-14's "No" rows with no 2017-18 equivalent,
    # a pure artefact of how the two extracts were exported.  Counted on
    # stdout: 515 / 85 / 43 zero cells and 105,085 / 136,296 / 68,923
    # never-reported cells dropped.
    #
    # KEY: (hhno, plot_no) in 2009-10, (FPrimary, plotid) later -- exactly as
    # plot_features and crop_production key it, so (t, i, plot_id) joins those
    # tables.  2009-10's eight files share ONE key set: 5,686 non-null keys,
    # identical across all eight, with 15-17 null-plot rows in S4AIX2..8 (none
    # in S4AIX1) dropped.  As recorded for plot_features, plot_id tracks the
    # same land 2009-10 -> 2013-14 but NOT 2013-14 -> 2017-18.
    #
    # NOT declared, deliberately: the supervision block (communalsupervision /
    # hiredsupervision and the who-supervised person ids -- a household-member
    # reference, not labour input); the food provided to communal and hired
    # labour (commlabfoodcost / hiredfoodcost / howmanyfed -- an in-kind cost
    # at plot grain with no canonical home); hiredhowpay (cash / in-kind /
    # both) and hiredinkindpay; the whoworked multi-select flags (redundant
    # with which source rows carry person-days); 2009-10's A289 / A326 season
    # months (crop_production already delivers the ending month as
    # harvest_month).
    index: (t, i, plot_id, season, stage, source)
    PersonDays: float
    Hours:
        type: float
        optional: true
    WageRateMen:
        type: float
        optional: true
        monetary: true
    WageRateWomen:
        type: float
        optional: true
        monetary: true
    WageRateChildren:
        type: float
        optional: true
        monetary: true
    WageUnit:
        type: str
        optional: true
    materialize: make
