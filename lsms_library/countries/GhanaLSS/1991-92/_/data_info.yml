Country: GhanaLSS
Wave: 1991-92

cluster_features:
    file: POV_GH.DTA
    idxvars:
        v: clust
    myvars:
        Region: region
        Rural: loc2


sample:
    # GH #713: `weight` / `panel_weight` were 100% NULL here.  POV_GH.DTA has a
    # `weight` column that is EXACTLY 1.0 for all 4,523 rows, and an earlier
    # pass on this issue called that a placeholder and left it unwired.
    #
    # THAT WAS WRONG.  GLSS3 is a self-weighting sample, and GSS says so --
    # `Documentation/GHA_1991_GLSS_Data_User_Guide_EN.pdf`:
    #
    #     The sample designed used for the GLSS3, and with the very high
    #     response rate achieved, the sample can be considered as being
    #     self-weighting
    #
    # So 1.0 is the producer's own, correct value, not a fill.  Serving NULL
    # instead made the wave needlessly unusable for weighted analysis.
    #
    # Note GSS's hedge -- "can be CONSIDERED AS being self-weighting" -- and
    # that the claim rests on two conditions, the design AND the high response
    # rate.  Treat the constant as GSS licensing equal weighting in practice,
    # not as a proof of exact EPSEM.
    #
    # The varying take is EXPLAINED, and not the way an earlier draft of this
    # comment guessed.  `clust` IS the EA; the unit mismatch is between EA and
    # *workload*: 407 workloads across 366 EAs.  Takes are fixed per workload
    # per stratum -- 15 urban / 10 rural -- and a second PPS stage on the
    # listed/census growth ratio gives some EAs two workloads, producing 30 and
    # 20.  Report Appendix 1 states it: "an EA, for example, which received two
    # workloads provided 32 households for the sample."  The decisive check is
    # in the data: take-15 clusters are 100% urban and take-20 clusters 100%
    # rural, which no EA-bundling story can produce.  (An earlier guess here --
    # that a `clust` code bundles EAs, on the analogy of GLSS1/GLSS2's 32=2x16
    # -- was wrong; 10 and 15 are both multiples of 5 by coincidence.)
    #
    # GSS documents the compensation that makes it EPSEM: "rural EAs had to be
    # oversampled and urban EAs undersampled, to counterbalance the fact that
    # at the second stage of selection 15 households were to be taken in
    # selected urban EA but only 10 households in each rural EA."
    #
    # And the self-weighting property was RESTORED deliberately -- Poverty
    # Profile Appendix 4 (`Documentation/pdf/PovProf.pdf`, printed p.57):
    # "The latter [restoring a self-weighting sample] was done for GLSS 3
    # following a procedure devised by Scott and Amenuvegbe (1991).  The same
    # procedure though was not applied for GLSS 4."  That is the documented
    # GLSS3 -> GLSS4 design change, and it is why GLSS4 ships a real weight
    # DISTRIBUTION while GLSS3 ships a constant.  Response rate 99.72%
    # (4,552/4,565).
    #
    # CAUTION on the User Guide sentence: its "weighting ... is required"
    # carve-out refers to a monthly CPI DEFLATOR (to March 1992, keyed on
    # interview date; Sept 1991 = 1.0503), NOT to a sampling weight.  Do not
    # read it as contradicting the constant weight.
    file: POV_GH.DTA
    idxvars:
        v: clust
    myvars:
        Region: region
        Rural: loc2


sample:
    # GH #713: `weight` / `panel_weight` were 100% NULL here.  POV_GH.DTA has a
    # `weight` column that is EXACTLY 1.0 for all 4,523 rows, and an earlier
    # pass on this issue called that a placeholder and left it unwired.
    #
    # THAT WAS WRONG.  GLSS3 is a self-weighting sample, and GSS says so --
    # `Documentation/GHA_1991_GLSS_Data_User_Guide_EN.pdf`:
    #
    #     The sample designed used for the GLSS3, and with the very high
    #     response rate achieved, the sample can be considered as being
    #     self-weighting
    #
    # So 1.0 is the producer's own, correct value, not a fill.  Serving NULL
    # instead made the wave needlessly unusable for weighted analysis.
    #
    # Note GSS's hedge -- "can be CONSIDERED AS being self-weighting" -- and
    # that the claim rests on two conditions, the design AND the high response
    # rate.  Treat the constant as GSS licensing equal weighting in practice,
    # not as a proof of exact EPSEM.
    #
    # One thing the User Guide does NOT explain, recorded so nobody thinks it
    # was overlooked: households per cluster are NOT uniform.  Of 365 clusters,
    # 234 hold exactly 10 households, 73 hold 15, 31 hold 20, with ragged
    # values (6, 8, 9, 14, 24, 27, 29, 30) besides.  Under textbook PPS the
    # inclusion probability tracks the take, so 10-vs-20 would be a factor of
    # two -- which is not self-weighting.  Possible readings: the take was
    # fixed and the round 15s/20s are structural (replicates? two EAs per
    # `clust` code?); or the takes vary and GSS's claim is a practical
    # approximation.  Unresolved from anything shipped; see the "main report"
    # the User Guide refers to.  GH #713.
    file: POV_GH.DTA
    idxvars:
        i:
            - clust
            - nh
    myvars:
        v: clust
        weight: weight
        panel_weight: weight
        strata: region
        Rural: loc2

interview_date:
    file: S0A.DTA
    idxvars:
        i:
            - clust
            - nh
    myvars:
        Int_t:
            - dd
            - mm
            - yy

household_roster:
    file: S1.DTA
    idxvars:
        v: clust
        i:
            - clust
            - nh
        pid: pid
    myvars:
        Sex: sex
        Age: agey
        Birthplace: s1q10
        Relationship: rel
        MonthsAway: s1q22

plot_features:
    # Section 8B (Agricultural land) -- clean per-plot roster, one row per
    # (household, farm).  farmcd = farm number -> plot_id.  i = [clust, nh],
    # matching household_roster's i.  This wave has no variable/value labels:
    # s8bq4 = farm size, s8bq4c = unit code (decoded with the GLSS area-unit
    # codes 1=Acres,2=Poles,3=Ropes,4=Hectare; verified against the GLSS7
    # value labels and the code-frequency distribution).  s8bq8 in this wave
    # is a value field (not a tenure code), and the GLSS3 tenure code is not
    # recoverable, so Tenure is omitted.  Section 10 is non-farm ENTERPRISES.
    file: S8B.DTA
    idxvars:
        i:
            - clust
            - nh
        plot_id: farmcd
    myvars:
        Area: s8bq4
        AreaUnit:
            - s8bq4c
            - mapping:
                1: Acres
                2: Poles
                3: Ropes
                4: Hectare

housing:
    # GLSS3 Section 7 dwelling characteristics (S7.DTA).  This wave's .dta has
    # neither variable nor value labels (missing = ~1.75e100 sentinel), so all
    # codes are decoded from the GLSS3 Part-A household questionnaire (Section 7):
    # walls = Part E q35 (s7q35), floor = Part E q36 (s7q36), roof = Part D q37
    # (s7q37), water source = Part D q22 (s7q22), lighting = Part D q29 (s7q29),
    # toilet = Part D q34 (s7q34), occupancy = Part B q11 (s7q11; s7q5 is the
    # FORMER dwelling type, not occupancy), rooms = Part A q2 (s7q2).  Code lists
    # and code ranges verified against the questionnaire text and the data.
    # i = [clust, nh] to match household_roster.
    file: S7.DTA
    idxvars:
        i:
            - clust
            - nh
    myvars:
        Walls:
            - s7q35
            - mapping:
                1: Mud/Earth
                2: Wood
                3: Metal Sheet
                4: Stone/Burnt Bricks
                5: Cement/Concrete
                6: Other
        Floor:
            - s7q36
            - mapping:
                1: Earth/Mud
                2: Wood
                3: Stone/Brick
                4: Fibre-glass
                5: Cement/Concrete
                6: Other
        Roof:
            - s7q37
            - mapping:
                1: Thatch
                2: Wood
                3: Metal Sheet
                4: Cement/Concrete
                5: Slate/Asbestos
                6: Other
        Water:
            - s7q22
            - mapping:
                1: Indoor plumbing
                2: Inside standpipe
                3: Water vendor
                4: Water truck/tanker service
                5: Neighbouring household
                6: Private outside standpipe/tap
                7: Public standpipe
                8: Well with pump
                9: Well without pump
                10: River/lake/spring/pond
                11: Rainwater
                12: Other
        Toilet:
            - s7q34
            - mapping:
                1: Flush toilet
                2: Pit latrine
                3: Pan/Bucket
                4: KVIP
                5: No toilet
                6: Other
        Rooms: s7q2
        Tenure:
            - s7q11
            - mapping:
                1: Own
                2: Rent
                3: Rent-free
                4: Perching
        Electricity:
            - s7q29
            - mapping:
                1: Electricity (mains)
                2: Generator
                3: Kerosene/Gas lamp
                4: Candles/Torches

individual_education:
    file: S2.DTA
    idxvars:
        v: clust
        i:
            - clust
            - nh
        pid: pid
    myvars:
        # GH #171: s2q2 = highest class/form completed (letter ladder P/M/JSS/S/A/T/PS/U,
        # same coding as GLSS1/2); blanks = never-attended (s2q1=2), dropped via mapping.py.
        Educational Attainment:
            - s2q2
            - mappings: ['harmonize_education', 'Original Label', 'Preferred Label']
