Country: GhanaLSS
Wave: 1988-89

cluster_features:
    # Region and Ecological_zone come from BID Appendix I, NOT from this file.
    # GLSS1/GLSS2 ship no cluster-location variable at all, so `Region` used to
    # be INFERRED from Y01A.DAT:REGION -- the person's region of BIRTH -- as the
    # modal value among a cluster's under-12s.  That was ~98% right and wrong
    # for five clusters.  The Appendix is the survey's own cluster list and is
    # authoritative (decision 2026-08-21); see `_/appendix_i_clusters.org`.
    #
    # `myvars` is intentionally EMPTY: this extraction exists only to enumerate
    # the wave's cluster universe (170 clusters) from the microdata.  The
    # attributes are attached by mapping.py::cluster_features.  Taking the
    # universe from the data rather than the Appendix matters -- the Appendix
    # lists 178 SAMPLING AREAS for 1987-88, which is not the same unit as a
    # cluster.
    #
    # `Age: AGEY` was removed with the hook it fed (an `Age<12` filter).
    file: Y01A.DAT
    idxvars:
        v: CLUST
    myvars: {}

sample:
    # `Rural` is NOT read from a source column -- GLSS1/GLSS2 ship none.  The
    # `sample` df_edit hook in mapping.py broadcasts the cluster's BID
    # Appendix I classification onto its households.  The Appendix is three-way
    # (U / R / SU); `SU` is folded onto `Rural` by decision (@ligon,
    # 2026-08-21), so the delivered vocabulary is the canonical binary.
    # GH #685.
    file: Y00A.DAT
    idxvars:
        i: HID
    myvars:
        v: CLUST
    # `weight` / `panel_weight` are SYNTHESISED as 1.0 by the `sample` df_edit
    # hook in mapping.py -- this wave ships no weight column at all.  See that
    # docstring for the evidence tier and the 1984-population qualifier.

interview_date:
    file: Y00A.DAT
    idxvars:
        i: HID
    myvars:
        Int_t:
            - DAY1
            - MO1
            - YR1
        # Round Two is a second contact, not food's single-occasion visit=1.
        Int_t_v2:
            - DAY2
            - MO2
            - YR2
            - mapping: Int_t


household_roster:
    file: Y01A.DAT
    idxvars:
        v: CLUST
        i: HID
        pid: PID
    myvars:
        Sex: SEX
        Age: AGEY
        Birthplace: REGION
        Relationship: REL
        MonthsAway: MON

individual_education:
    file: Y03I.DAT
    idxvars:
        v: CLUST
        i: HID
        pid: PID
    myvars:
        # GH #171: GLSS R1/R2 Section 3 Q7 "highest grade completed" (letter codes;
        # K=Koranic, B=never-attended skip-code) -> canonical via harmonize_education.
        Educational Attainment:
            - GRADE
            - mappings: ['harmonize_education', 'Original Label', 'Preferred Label']

crop_production:
    # GLSS1/GLSS2 Section 9 Part B "CROPS" -- household-crop grain, no plot
    # roster anywhere in Section 9 (plot_features is a C4-validated `not-asked`
    # for these two waves).  Index (t, i, j) on the EthiopiaRHS precedent, the
    # corpus's other plot-less country; `u` is deliberately ABSENT because the
    # form asks no harvest quantity for a unit to describe -- see
    # `_/CONTENTS.org` and slurm_logs/2026-09-16_panel_estimation/.
    file: Y09B.DAT
    idxvars:
        i: HID
        j:
            - CROP
            - mappings: ['agric_crop', 'Code', 'Label']
    myvars:
        # Q4: quantity SOLD, in `Unit_sold` -- NOT kilograms, and NOT the
        # harvest.  The form never asks how much was harvested.
        Quantity_sold: CROPS
        Unit_sold:
            - CROPSU
            - mappings: ['agric_unit', 'Code', 'Label']
        # Q5, asked only for unstarred (container) units: kilograms per ONE
        # `Unit_sold`.  Carried for the analyst; `harvest_kg` cannot reach it,
        # since that keys the factor to `u` and needs `Quantity`.
        KgFactor: CROPSUK
        # Q8 / Q10 / Q12: the market REPLACEMENT value of the part kept for
        # seed, given to labourers / landowner / as gifts, and lost.  A
        # different valuation basis from Value_sold, which is what the
        # household RECEIVED.
        Value_seed: CROPKV
        Value_given: CROPPV
        Value_lost: CROPLV
        LossCause:
            - CROPL
            - mappings: ['agric_loss_cause', 'Code', 'Label']
        # Q2: acres harvested.  Converted to hectares by the df_edit hook.
        Area_ha: CROPH
        intercropped: CROPD
        # Helpers for the `crop_production` df_edit hook, which builds
        # Value_sold from them and drops all three.
        SaleAmount: CROPSP
        SaleAmountUnit:
            - CROPSPU
            - mappings: ['agric_unit', 'Code', 'Label']
        SoldUnitRaw:
            - CROPSU
            - mappings: ['agric_unit', 'Code', 'Label']

livestock:
    # Section 9 Part F, PDF p.53 block 9F.  See `_/data_scheme.yml` for why
    # ValuePerAnimal is read and HerdValue derived, and not the reverse.
    file: Y09F.DAT
    idxvars:
        i: HID
        animal:
            - LIVSTCD
            - mappings: ['agric_animal', 'Code', 'Label']
    myvars:
        # Q4 "How many of all ages are owned by your household at present?"
        HeadCount: LIVSTN
        # Q5, per head -- NOT the herd (measured; see data_scheme.yml).
        ValuePerAnimal: LIVSTNV
        # Q7 / Q8 "How many have they sold?" / "How much altogether have they
        # received from sales ... during the past 12 months?" -- a TOTAL.
        HeadSold: LIVSTSN
        SalesValue: LIVSTSV
        # Q10 / Q11 "How many did they buy?" / "How much did they pay
        # altogether for all the ... they bought?" -- also a total.
        HeadAcquired: LIVSTBN
        PurchaseValue: LIVSTBV
        # Q12 born or received as gifts; Q13 eaten by the household;
        # Q14 lost, stolen, given as gifts, sacrificed or died.
        HeadBornOrReceived: LIVSTAD
        HeadEaten: LIVSTE
        HeadLostOrDied: LIVSTDI
