    notes: |-
      The GSS NADA catalog id 72 does carry a UNIVERSE field, but it is uselessly terse: 'The survey covered all household members'. The local main report is far more informative and is what I have quoted. The report's Table 2.1 note also states, verbatim, 'Excludes institutional population.' (printed page 5), corroborating the frame exclusion in the survey estimates themselves. Whitespace normalised from PDF line-wrapping (the report is justified, producing multiple spaces between words); wording is unaltered.
    record_source: slurm_logs/POPULATION_STATEMENTS_2026-07-21.org (section 3, 'GhanaLSS 2012-13')
  '2016-17':
    universe_tag: national-claimed
    source_type: local-documentation
    confidence: high
    survey: 'Ghana Living Standard Survey (GLSS 7) 2016/17'
    language: 'English'
    source_file: 'lsms_library/countries/GhanaLSS/2016-17/Documentation/GLSS7 Main Report.pdf ; lsms_library/countries/GhanaLSS/2016-17/Documentation/GLSS7 Final Manual.docx'
    locator: 'Main Report (acquired 2026-09-06; DVC-tracked, md5 5317fdd3e28777f68a158770db57c5c1, 8,234,728 bytes; 344 PDF pages). Institutional-population EXCLUSION and the frame / target-population paragraph: APPENDICES -> ''Survey Methodology'' -> section ''Sampling frame'', printed page 285 (PDF page 307); the exclusion is the sentence beginning ''The institutional population''. ''Nationally representative'' sentence: EXECUTIVE SUMMARY, printed page xvii (PDF page 18). ''Designed to provide indicators at the national and regional levels'': APPENDICES opening paragraph, printed page 281 (PDF page 303). Non-self-weighting statement and the Mhi / Mhi* definitions: ''Computation of Weights'', printed pages 281-282 (PDF pages 303-304). Twenty-stratum design and the ~1,500-per-domain allocation: printed page 289 (PDF page 311). Secondary source, GLSS7 Final Manual.docx: Chapter 1 INTRODUCTION, the paragraph closing section ''1.2 METHODOLOGY OF THE SURVEY'' (immediately after Table 1, ''Regional Distribution of EAs and Households'', and immediately before ''1.3 SURVEY PERIOD''); the .docx has no page numbering in its XML, hence the section locator.'
    population_statement: |-
      [GLSS7 Main Report, EXECUTIVE SUMMARY, printed p. xvii:] The survey is nationally representative with a sample size of 15,000 households selected from 1,000 enumeration areas. In all 14,009 households responded to the survey, resulting in a response rate of 93.3 percent.  [and, APPENDICES opening paragraph, printed p. 281:] Ghana Living Standards Survey seventh round (GLSS7), was designed to provide indicators at the national and regional levels.  [and, section 'Sampling frame', printed p. 285:] The GLSS7 is a household probability sample survey designed to cater for a variety of analyses at the various domains of interest. As in all probability sample surveys, it is important that each sampling unit in the target population has a known, non-zero probability of being included in the sample. To achieve this, an appropriate list or sampling frame of the PSUs is required. A standardized list of EAs together with their respective population and household sizes obtained from the 2010 Population and Housing Census (PHC) was used as the sampling frame for the GLSS7.  [and, from the interviewers' manual, GLSS7 Final Manual.docx, section '1.2 METHODOLOGY OF THE SURVEY':] Basic information on all persons living in private households would be solicited.  In addition, all persons 15 years and older would be eligible for the labour force survey.  For the child labour module, the survey would solicit information from persons between the ages of 5-14 years.
    exclusions: |-
      The institutional population which represents a very small percentage of 2010 Population and Housing Census (PHC), was excluded from the frame.
    notes: |-
      CHANGED 2026-09-06: exclusions NOT FOUND -> the verbatim sentence above, and confidence medium -> high.  THE PREVIOUS VERSION OF THIS NOTE IS FALSE AND HAS BEEN REPLACED, NOT ANNOTATED: it said "The GLSS7 Main Report published by GSS is NOT in this repository's Documentation directory and was not consulted" and named acquiring it as the concrete next step.  It was acquired, and it is now DVC-tracked at lsms_library/countries/GhanaLSS/2016-17/Documentation/GLSS7 Main Report.pdf.  WHAT THE REPORT SUPPLIES.  (1) The institutional-population exclusion quoted above, which is near-verbatim with GLSS6's ('The institutional population (those who were in schools, hospitals, etc.), which represents a very small percentage of the 2010 Population and Housing Census (PHC), was excluded from the frame.') -- so the parenthetical caveat the old note attached to the 'private households' phrasing is no longer needed: GLSS7's own documentation now says it.  (2) A 'Sampling frame' section that is the structural analogue of GLSS6's section 6.2, opening with the same sentence and using the phrase 'target population'.  (3) A declarative, past-tense representativeness statement in an official published GSS statistical report, in place of the future-tense ('would be solicited') pre-fieldwork interviewers' manual this record previously rested on.  WHY THE TAG DOES NOT MOVE TO 'national-all-households'.  GLSS6 earned that tag on one specific sentence in the passage otherwise shared with GLSS7 -- 'However, the unit of measurement was the population living within individual households.' -- and GLSS7's parallel section OMITS it.  The string 'unit of measurement' does not occur anywhere in the 344-page report, and no other sentence names the population; 'r = All household members' (printed p. 289) is a variable in the sample-size formula, not a universe declaration.  The report claims national representativeness and says what was excluded from the frame; it never says whom the survey represents.  That is precisely what 'national-claimed' means, so the tag stays where it was and the confidence carries the new fact, which is that the claim is now well sourced.  WHY CONFIDENCE MOVES, AND THE CALIBRATION IT RESTS ON -- stated because this document is not perfectly self-consistent on this field and a later reader should be able to check the judgement rather than inherit it.  Across the 111 waves, 'national-claimed' splits 7 high / 19 medium / 2 low, so the tag does not force a confidence.  The two nearest 'national-claimed' + 'high' + 'local-documentation' precedents both rest on sampling-methodology prose rather than a DDI Universe field: Tajikistan 2007 (DDI 'Sampling Procedure', corroborated in the BID's 'Sample Design' and Appendix B) and GhanaSPS 2009-10 (BID section 3, 'Sampling and Survey Design').  That is the same venue this record now uses. The nearest 'medium' precedents give their reasons explicitly and both turn on language this report has: Kazakhstan 1996 ('No document uses the words "universe" or "target population"') and Cambodia 2019-20 ('no document states a target population in universe language') -- GLSS7's report does use 'target population', and unlike either of those it states an exclusion.  What has NOT changed: GLSS7 still has no DDI 'Universe' field anywhere -- neither the shipped ddi-documentation-english-97.pdf nor the live GSS NADA catalog page has one, and the catalog's Sampling section still reads 'No content available' -- and that gap is what keeps the tag at 'national-claimed'.  DESIGN FACTS FROM THE SAME APPENDIX, recorded because they bear on comparability and are NOT universe statements: two-stage stratified; 20 sampling strata (the ten administrative regions, each further stratified into urban and rural); 1,000 EAs selected PPS; a complete household listing in each selected EA, then 15 households per EA by systematic selection for a target of 15,000 (14,009 achieved); an allocation computed to give an average 1,500 households per domain, from which the report concludes 'The GLSS7 was not a self-weighting sample design because disproportionately larger samples from regions with smaller populations were drawn.'  The weight formula distinguishes Mhi (2010 census households in the EA) from Mhi* (households LISTED before fieldwork), so the expansion factor carries six years of frame drift; GhanaLSS/_/CONTENTS.org analyses what that costs, and labels that analysis as this repository's, not GSS's.  AN INTERNAL CONTRADICTION IN THE REPORT, recorded so a later reader does not re-derive it: the 'Sampling frame' narrative (printed p. 285) says the EAs 'were further divided into 438 urban and 562 rural localities of residence', while the report's own Table A1 (printed p. 281) and Table A2 (printed p. 283) both give 439 urban / 561 rural.  The data this library serves matches the TABLES, not the narrative.  TRANSCRIPTION: the report is justified text, so pdfminer emits runs of multiple spaces inside phrases; those runs were collapsed to single spaces in the quotes above, and no words were added, removed, reordered or corrected.  The comma in 'percentage of 2010 Population and Housing Census (PHC), was excluded' and the missing article in 'represents a very small percentage of 2010 Population' are as printed.  The PDF was read through data_access.get_data_file(), which materialised it into its (git-ignored) local path; no file under lsms_library/countries/ was modified by the reading.
    record_source: slurm_logs/POPULATION_STATEMENTS_2026-07-21.org (section 3, 'GhanaLSS 2016-17')
