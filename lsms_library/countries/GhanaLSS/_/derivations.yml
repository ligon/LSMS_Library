# Derivations -- served numbers in this country's tables that are NOT survey
# answers but CONSTRUCTIONS from raw answers.  One entry per registry key,
# `country::table::name`; the same key sits in the served table's
# `Derivation` column on every row it produced.  Loader and field contract:
# lsms_library/derivations.py.  Design: SkunkWorks/derived_values.org.
#
# An entry must say what it did (rule, function), to what (inputs,
# raw_variables) and why (assumptions, each with a basis) -- the loader
# refuses one that cannot.  `modelling-choice` is a basis that NAMES a choice
# no document supplies; it is not evidence and is not laundered into one.
#
# Sibling of population.yml and recall.yml: a .yml here moves no cache hash.

GhanaLSS::food_acquired::12b-fortnight:
  waves: ['1987-88', '1988-89']
  columns: [Expenditure, Quantity]
  rows: {s: produced}
  rule: >-
    Expenditure = VFOODCPD * TFOODC * (14 / days_per_unit[UTFOODC]) * MFOODCLY / 12
    with days_per_unit = {3: 1, 4: 7, 5: 30.4, 6: 91.3, 7: 182.6, 8: 365}
    (12B legend: DAY 3, WEEK 4, MONTH 5, QUARTER 6, HALF YEAR 7, YEAR 8);
    Quantity = Expenditure (u = 'Value').  The year-average fortnight, i.e.
    GSS's annual EXPEND.HPFOOD / 26.  Worked example: eaten in 6 of 12 months,
    12 times a month, 10 cedis each time -> 27.6 (in season 55.3; annual 720).
  function: lsms_library.countries.GhanaLSS._.ghanalss:derive_12b_fortnight_value
  inputs: lsms_library.countries.GhanaLSS._.ghanalss:inputs_12b
  raw_variables: [Y12B.MFOODCLY, Y12B.TFOODC, Y12B.UTFOODC, Y12B.VFOODCPD]
  assumptions:
    - text: >-
        the window is the nominal fortnight of the purchase side (12A, "since
        my last visit"): "in theory this period is two weeks"
      basis: questionnaire
      evidence: 1988-89 Interviewer Manual, printed p.70
    - text: >-
        the interview fortnight is a random draw from the year, so the
        in-season fortnight is weighted by MFOODCLY / 12 (the form does not
        record WHICH months were cited; the in-season figure is right for
        some households and zero for the rest, unknowably)
      basis: modelling-choice
      evidence: SkunkWorks/derived_values.org, "First instance" (@ligon, 2026-09-11)
    - text: >-
        days per month / quarter / half-year are 30.4 / 91.3 / 182.6, GSS's
        own lengths (30 per month reproduces HPFOOD at 1.03-1.04, not 1.02)
      basis: config-comment
      evidence: slurm_logs/2026-09-11_ghanalss_visit_dates/FINDINGS.org section 2.2
  validated_against: >-
    EXPEND.HPFOOD (GSS's annual construction, BID printed p.22 "the value of
    home produced food consumed in the last year calculated from Section
    12B"): sum over items of function(...) x 26 per household reproduces it
    with median ratio 1.018 in both rounds (n = 2,253 / 2,437 households).
  contents: GhanaLSS/_/CONTENTS.org, "12B is a value per eating occasion"
  since: '2026-09-11'

GhanaLSS::interview_date::anchored-chronology-glss4:
  waves: ['1998-99']
  columns: [visit]
  rule: >-
    Retain SEC0A's intake at visit 1 and SEC0C's reported visits 2 and 3.
    Treat distinct parseable dates across SEC0A/B/C as distinct scheduled
    contacts, collapsing equal-date reports into one model event while
    preserving every raw report. Enumerate all strictly chronological
    injections into visits 1..7 consistent with those anchors; missing
    ordinals are allowed. Serve a further assignment only when every
    nonempty candidate solution gives that date the same visit. Conflicting
    anchors, excess dates, or no candidate solution add no inferred rows.
    Int_t is unchanged; only the calendar-visit assignment is constructed.
  function: lsms_library.countries.GhanaLSS._.visit_dates:derive_glss4_visit_assignments
  inputs: lsms_library.countries.GhanaLSS._.visit_dates:inputs_glss4
  raw_variables:
    - SEC0A.clust
    - SEC0A.nh
    - SEC0A.dd
    - SEC0A.mm
    - SEC0A.yy
    - SEC0C.visitcd
    - SEC0C.s0vday
    - SEC0C.s0vmonth
    - SEC0C.s0vyear
    - SEC0B.visitcd
    - SEC0B.s0dy_sum
    - SEC0B.s0mt_sum
    - SEC0B.s0yr_sum
  assumptions:
    - text: The survey schedules seven interviewer contacts.
      basis: questionnaire
      evidence: slurm_logs/2026-09-11_ghanalss_visit_dates/1998-99.org, Visit protocol
    - text: >-
        Distinct valid calendar dates denote distinct scheduled contacts;
        equal-date reports denote one model event, not distinct same-day
        scheduled contacts. A unique chronological assignment is accepted
        without an independent corroboration gate. A parseable typo can
        therefore receive an inferred visit; uniqueness does not prove accuracy.
      basis: modelling-choice
      evidence: Explicit user decision, 2026-09-12; CONTENTS.org visit-date notes
    - text: >-
        SEC0A intake and SEC0C visits 2/3 take precedence; a conflicting
        alternative intake blocks further inference and is retained in inputs.
      basis: modelling-choice
      evidence: Preserve existing intake and established Part A assignments, 2026-09-12
  validated_against: >-
    Synthetic chronology, ambiguity, conflict, source-order, and raw-linkage
    regression tests. This checks the fixed model, not external truth of each date.
  contents: GhanaLSS/_/CONTENTS.org, interviewer visit dates
  since: '2026-09-12'

GhanaLSS::interview_date::anchored-chronology-glss5:
  waves: ['2005-06']
  columns: [visit]
  rule: >-
    Retain parta/sec0's intake as visit 1. Treat distinct parseable dates
    across parta/sec0 and partb/secb0, secb1, secb2 as distinct scheduled
    contacts; equal-date reports form one model event but remain separate
    raw inputs. Enumerate all strictly chronological injections into visits
    1..11 consistent with intake, allowing missing ordinals. Serve a further
    assignment only when every nonempty candidate solution agrees. A
    conflicting Part B intake, excess dates, or no candidate solution adds
    no inferred rows. No offset fallback or date repair is applied.
    Int_t is unchanged; only the calendar-visit assignment is constructed.
  function: lsms_library.countries.GhanaLSS._.visit_dates:derive_glss5_visit_assignments
  inputs: lsms_library.countries.GhanaLSS._.visit_dates:inputs_glss5
  raw_variables:
    - parta/sec0.hhid
    - parta/sec0.ddate
    - parta/sec0.mdate
    - parta/sec0.ydate
    - partb/secb0.day
    - partb/secb0.month
    - partb/secb0.year
    - partb/secb1.visitno
    - partb/secb1.intday
    - partb/secb1.intmon
    - partb/secb1.intyr
    - partb/secb2.visitcd
    - partb/secb2.vday
    - partb/secb2.vmon
    - partb/secb2.vyr
  assumptions:
    - text: The survey schedules eleven interviewer contacts.
      basis: questionnaire
      evidence: slurm_logs/2026-09-11_ghanalss_visit_dates/2005-06.org, Visit protocol
    - text: >-
        Distinct valid calendar dates denote distinct scheduled contacts;
        equal-date reports denote one model event. Unique chronological
        assignments are accepted without independent corroboration. Missing
        visits are allowed; a parseable typo or shifted transcription can
        still produce an inferred visit under this model.
      basis: modelling-choice
      evidence: Explicit user decision, 2026-09-12; CONTENTS.org visit-date notes
    - text: >-
        Part A intake takes precedence. A differing Part B intake prevents
        further inference rather than replacing intake or licensing an offset.
      basis: modelling-choice
      evidence: Preserve existing intake; no offset fallback, 2026-09-12
  validated_against: >-
    Synthetic chronology, ambiguity, conflict, source-order, and raw-linkage
    regression tests. This checks the fixed model, not external truth of each date.
  contents: GhanaLSS/_/CONTENTS.org, interviewer visit dates
  since: '2026-09-12'

GhanaLSS::food_acquired::8h-farmgate:
  waves: ['1998-99', '2005-06', '2012-13', '2016-17']
  columns: [Expenditure]
  rows: {s: produced}
  rule: >-
    Expenditure = Quantity * Price, where Quantity is the amount of the
    home-produced food consumed in the recall window (section 8H's per-visit
    quantity questions, in the native unit u) and Price is the farmgate price
    of one such unit that the household itself reports.  Section 8H never asks
    the total value, so the product is a CONSTRUCTION, not an answer.  Computed
    only where BOTH factors are present; a row missing either is served with
    Expenditure NaN and carries no key, so the labelled rows are exactly the
    computed ones.  This valuation is at the PRODUCER price and is therefore
    not comparable with the 12b-fortnight key, which values own consumption at
    what it would cost to BUY.
  function: lsms_library.countries.GhanaLSS._.ghanalss:derive_produced_farmgate_value
  inputs: lsms_library.countries.GhanaLSS._.ghanalss:inputs_produced_farmgate
  raw_variables:
    - SEC8H.s8hq10          # 1998-99 farmgate price
    - sec8h.s8hq14          # 2005-06 farmgate price
    - sec8h.s8hq10          # 2012-13 farmgate price
    - g7sec8h.s8hq{v}p      # 2016-17 farmgate price, asked once per visit
  assumptions:
    - text: >-
        the section-8H price variable is the farmgate (producer) price of one
        native unit of the home-produced item, not a market or purchase price
      basis: config-comment
      evidence: >-
        stated by the wave scripts themselves -- GhanaLSS/2005-06/_/food_acquired.py
        ("a farmgate Price (s8hq14)") and GhanaLSS/2012-13/_/food_acquired.py
        ("a farmgate Price (s8hq10)").  NOT read off the questionnaire or the
        Stata variable label in this session, which is why the basis is
        config-comment and not questionnaire/variable-label: upgrading it is a
        bounded one-RA, one-PDF step.
    - text: >-
        own consumption is valued at the household's OWN reported farmgate
        price rather than at a market price, a wave median, or the purchase
        price of the same item elsewhere in the wave
      basis: modelling-choice
      evidence: >-
        @ligon, 2026-09-13 ("this is a policy change made policy by our new
        derived_values machinery").  No document supplies the choice; section
        8H reports a price per household and the library uses it as reported.
        The alternatives are computable from Country.derivation_inputs.
    - text: >-
        1991-92 is excluded: 80,282 of its 286,922 produced rows (28%) carry
        both factors and its dominant unit is 'All' (93,349 rows), which reads
        as "the whole harvest" rather than a countable quantity
      basis: config-comment
      evidence: >-
        measured 2026-09-13 on the warm corpus; .coder/ledger/ghanalss-produced-qp.md
        section 7.  Serving a 28%-covered wave would look complete and would not be.

GhanaLSS::crop_production::9b-sale-amount-per-unit:
  waves: ['1987-88', '1988-89']
  columns: [Value_sold]
  rule: >-
    Value_sold = CROPSP                  where CROPSPU decodes to 'All'
               = CROPSP * CROPS          where CROPSPU == CROPSU
               = NaN                     otherwise.
    Section 9 Part B column 6 ("How much was the harvest of [...] sold for?")
    has TWO boxes, AMOUNT (CROPSP) and UNIT (CROPSPU), so the amount is
    denominated by its own unit box and is not in general a total.  The 'All'
    branch MUST be tested first: CROPSU is itself 'All' on many rows, so the
    two masks overlap and a same-unit-first test multiplies a whole-lot total
    by a quantity (a 12x error on yam, caught in design).  Measured over sale
    rows: 'All' 9.6% / 16.0%, same-unit 88.0% / 82.8%, neither 2.4% / 1.2%
    (1987-88 / 1988-89).
  function: lsms_library.countries.GhanaLSS._.ghanalss:derive_9b_sale_value
  inputs: lsms_library.countries.GhanaLSS._.ghanalss:inputs_9b
  raw_variables: [Y09B.CROPS, Y09B.CROPSU, Y09B.CROPSP, Y09B.CROPSPU]
  assumptions:
    - text: >-
        the AMOUNT in Q6 is denominated by the UNIT box beside it, rather than
        being a total with a redundant unit -- the box also offers code 22
        'All', which a total would not need
      basis: questionnaire
      evidence: >-
        1988-89 household questionnaire PDF p.44, form block 9B1 column 6
        (image-only CCITT scan; rendered with
        slurm_logs/ghana_audit/glss2_questionnaire/render_pages.py)
    - text: >-
        unit code 22 decodes to 'All', meaning the amount covers the whole
        quantity sold rather than one container
      basis: questionnaire
      evidence: the unit-code legend printed at the foot of the same page
    - text: >-
        a row whose amount unit is neither the sold unit nor 'All' is left NaN
        rather than converted; the survey relates no factor between the two
        containers on that row (130 rows in 1987-88, 69 in 1988-89)
      basis: modelling-choice
      evidence: >-
        slurm_logs/2026-09-16_panel_estimation/GHANALSS_CANONICAL_MAPPING.org,
        "Value_sold is a DERIVATION"
  validated_against: >-
    NOT yet checked against an external series.  What IS established: the rung
    shares above, and a magnitude check against the rows that report 'All'
    (where CROPSP is unambiguously a total) -- on maize, CROPSP * CROPS gives a
    median 11,100 against 10,000 on the 'All' rows, while CROPSP alone gives
    3,550.  Cocoa's apparent 62x gap between the two groups is the
    maxibag-to-kilogram ratio, the groups selling in different units.  The
    check still owed is community_prices (sane in both waves): the implied
    farmgate price, Value_sold / Quantity_sold converted through KgFactor,
    should sit below the cluster market price for the same crop and round.
  contents: GhanaLSS/_/CONTENTS.org, "Section 9 Part B records a sale PRICE, not a sale value"
  since: '2026-09-16'
