Country: GhanaLSS

Waves:
  - '1987-88'
  - '1988-89'
  - '1991-92'
  - '1998-99'
  - '2005-06'
  - '2012-13'
  - '2016-17'

Index Info:
  index_info:
    cluster_features: (t, v)
    household_roster: (t, v, i, pid)
    individual_education: (t, i, pid)
    food_acquired: (t, v, i, j, u, s, visit)
    food_security: (t, i)
    community_prices: (t, v, j, u, obs)

Data Scheme:
  cluster_features:
    index: (t, v)
    Region: str
    Rural: str
  household_roster:
    index: (t, i, pid)
    Sex: str
    Age: int
    Relationship: str
    Birthplace: str
    Generation: int
    Distance: int
    Affinity: str
  individual_education:
    index: (t, i, pid)
    Educational Attainment: str
  plot_features:
    # Section 8B (Agricultural land / farms) is a clean per-plot roster:
    # one row per (household, farm).  The Section 10 module is non-farm
    # ENTERPRISES (entno / "Enterprise name"), NOT agricultural plots --
    # confirmed by reading the variable labels in every wave.  Wired for
    # 1991-92, 1998-99, 2012-13, 2016-17 (the waves whose Section 8B is a
    # genuine per-plot roster with a farm identifier + per-plot area).
    # 1987-88/1988-89 store only household-level land totals (Y09A: ACRFRM
    # etc.), so they are NOT plot_features -- adjudicated `not-asked` on the
    # questionnaire (Section 9 Part A "LAND", form blocks 9A1/9A2, is 29
    # single-answer household questions with no farm-number column); see
    # .coder/coverage/absent_verdicts.csv.
    #
    # 2005-06 is NOT wired but the data IS there -- an earlier comment here
    # claimed "2005-06 lacks Section 8 agriculture (data jumps sec9 -> sec11)"
    # and that was FALSE.  partb/ ships sec8a1..sec8h; the file that is absent
    # is sec10 (non-farm enterprises), which is what the sec9->sec11 jump
    # actually shows.  partb/sec8b.dta is a genuine per-plot roster (11,471
    # rows; s8bq3 farm number, s8bq4a/s8bq4b size+unit, s8bq8 how obtained) --
    # the same variable names 2016-17 already reads from g7sec8b.dta.  Verdict
    # `todo`, 2026-08-20.
    #
    # AreaUnit/Tenure decoded from
    # the GLSS7 value labels; 1=Acres,2=Poles,3=Ropes,4=Hectare in the
    # older 4-code waves (no Plot/Other categories).  Area is converted
    # per-row to HECTARES on AreaUnit by the ghanalss.plot_features
    # df_edit hook (canonical schema, GH #879; the factors are the GSS's
    # own, recovered from GhanaSPS 2009-10's shipped area_ha), so AreaUnit
    # is the PROVENANCE label of the native unit.
    index: (t, i, plot_id)
    Area: float
    AreaUnit: str
    Tenure: str
  food_acquired:
    index: (t, i, j, u, s, visit)
    Expenditure: float
    Quantity: float
    Price: float

  nonfood_expenditures:
    # GLSS Section 9 Part A, "NON-FOOD EXPENSES (LESS FREQUENTLY PURCHASED
    # ITEMS)" -- item-level, long, one row per (wave, household, item) the
    # household actually reported.  Canonical shape (lsms_library/data_info.yml,
    # `Columns > nonfood_expenditures`): `(t, v, i, j)` with `v` joined from
    # sample() at API time, so this declares `(t, i, j)`.
    #
    # THE INSTRUMENT, quoted (2016-17/Documentation/GLSS7_MODULE B _14_10_16.docx
    # and GLSS7 Final Manual.docx, Section 9):
    #   "SECTION 9: HOUSEHOLD EXPENDITURE (FOOD AND NON-FOOD EXPENSES)"
    #   "PART A:  NON-FOOD EXPENSES (LESS FREQUENTLY PURCHASED ITEMS)"
    #   "Responses for these items will be solicited only once during the last
    #    visit to the household ... the reference period for the amount spent on
    #    any of these items will be '... in the last 12 months'."
    # Hence RecallWindow == '12 months' on every row.  It is declared even so,
    # because the GLSS3/GLSS4 form of this module carries a 3-month amount
    # BESIDE the 12-month one (see the scope note below) and those waves will
    # need the column the day they are wired.
    #
    # `Expenditure` = s9aq2 (spent in the past 12 months) + s9aq4 (value used or
    # consumed out of own production, or received as gift), summed with
    # min_count=1.  That is `uganda.nonfood_expenditures`'s composition
    # (purchased + away + produced + given), which Nigeria follows, so the three
    # countries Feature() pools are commensurable.  NOT annualised, NOT rescaled
    # -- and NOT deflated: 2005-06 is in OLD cedi (GHC) and the later waves in
    # GHS, 1 GHS = 10,000 GHC, which is why its median row is 60,000 against 23
    # and 35.  The redenomination is already in this repo's currency config
    # (lsms_library/data_info.yml, Currency); pass currency='index' to see it.
    #
    # SCOPE, and it is an UNDERCOUNT that must not be discovered by surprise:
    # this is the LESS-frequently-purchased module ONLY.  GLSS splits Section 9
    # by purchase FREQUENCY, not by food, so the frequently-purchased non-food --
    # toiletries, transport, prepared meals, haircuts, stationery -- sits inside
    # Section 9B on the per-visit grid, mixed with food, and is NOT here.
    # THE OMITTED BASKET IS ~44% OF NON-FOOD.  Re-measured 2026-09-12 on the
    # 30-day exposure (6 asks x 5 days): 9B non-food 1.931e6 against 9A's
    # 2.457e6 = 44.0%; 2012-13 gives 38.7%.  This comment said "about 7%" until
    # then, dividing by a sentinel-inflated denominator (see above).  The
    # vocabulary of the omitted items is `nonfood_items_9b` in
    # categorical_mapping.org.  Including it would force a grain decision the
    # canonical shape does not cover (9B is visit-grain: 6 visits in GLSS7, 10
    # in GLSS3) and is deliberately deferred -- see _/CONTENTS.org,
    # "nonfood_expenditures is Section 9A only".
    #
    # MISSING-VALUE SENTINELS ARE PER WAVE, AND THEY ARE MEASURED.  2016-17
    # carries a repdigit-9 family in s9aq2/s9aq4 -- 999999, 9999999, 9999996,
    # 99999999 -- each spread across many DISTINCT items, which is what marks
    # them as a field-width missing code rather than a price.  They are masked
    # to NA.  2005-06 and 2012-13 contain NO member of that family at any
    # width, so their sentinel set is EMPTY, and each wave script re-checks
    # that on every build (an unlisted repdigit fails the build).
    #
    # DO NOT REPLACE THIS WITH A THRESHOLD.  This table first shipped with a
    # `>= 99999999` rule and it was wrong in BOTH directions: it still served
    # 2016-17 at 4.51e8 instead of 2.99e7 (93% of the total was the narrower
    # 9999999 tier), and in 2005-06 -- which is in OLD cedi, where 1e8 is an
    # ordinary large purchase -- it DELETED 28 genuine rows carrying 4.17e10,
    # 43% of that wave.  A threshold cannot be right for both denominations.
    #
    # VALIDATED against GSS's own aggregate for 2016-17
    # (Data/15_GHA_2017_E_final.dta, `TOTNFD` = total annual non-food): 9A is
    # 39.7% of it, median 1,011 against a GSS non-food median of 3,437 and a
    # household total of 7,863 -- the right share for a less-frequently-
    # purchased module, which is one component of GSS non-food beside housing,
    # utilities, education, health and transport drawn from other sections.
    #
    # THE TAIL IS SERVED, NOT CLIPPED -- count and name, the `quantity_audit`
    # rule.  Post-sentinel, the ten largest 2005-06 rows still carry 38.9% of
    # that wave, topped by 8,000,008,000 old cedi (~US$890k) for a single item;
    # 2016-17's 9A exceeds GSS's whole non-food total for 645 households
    # (4.7%).  These are almost certainly data-entry errors and they are in the
    # table anyway.  Screen them in analysis; see _/CONTENTS.org.
    #
    # WAVES: 2005-06, 2012-13, 2016-17.  The other four are absent, not broken:
    # GLSS3/GLSS4 ship the module (S9A12/SEC9A12 + S9A2/SEC9A2) but carry NO
    # label layer at all on `nfdex1cd`/`nfdex2cd` -- 0 Stata value labels -- so
    # their item axis needs the questionnaire; GLSS1/GLSS2 put household
    # expenditure in Sections 11+12 (CONTENTS.org:3519), and Section 11 is four
    # heterogeneous .DAT files with no .DCT label layer.
    index: (t, i, j)
    Expenditure: float
    RecallWindow: str
    materialize: make

  community_prices:
    # Item-level REPORTED market prices from each wave's OWN price survey
    # (GH #562 phase 3a; design DESIGN_ghanalss_food_acquired_2026-06-15.org
    # Phase 3).  Every GLSS round fielded a dedicated PRICE questionnaire,
    # separate from the household instrument: 1987-88/1988-89 PRICE.DAT,
    # 1991-92 Prices/G3PRICE.DTA, 1998-99 Prices/G4PRICE.DTA, 2012-13
    # PRICES/price_sec{0,1,2}.dta, 2016-17 g7price.dta.  2005-06 fielded the
    # same questionnaire (G5QPrice.pdf) but distributes NO price dataset --
    # `asked-not-distributed` in .coder/coverage/absent_verdicts.csv; absent
    # here, not imputed.
    #   v   -- the price survey's own cluster id (CLUST/clust), the SAME
    #          keyspace as sample().v, NATIVE in the index (no household i, so
    #          _join_v_from_sample does not apply).  Measured joins (price clusters
    #          in sample().v / household clusters priced): 1987-88 163/165,
    #          163/176; 1988-89 106/112, 106/170; 1991-92 256/256, 256/365;
    #          1998-99 251/253, 251/300; 2012-13 1015/1015, 1015/1200;
    #          2016-17 398/398, 398/1000.  The price clusters outside the
    #          sample are named in CONTENTS.org.
    #   j   -- the priced item on the wave's harmonize_food Preferred-Label
    #          axis (joins food_acquired.j); non-foods, and the few foods a
    #          wave's axis does not name, carry their own label.  Every wave's
    #          price list is its OWN code scheme (none is the Code_9b
    #          consumption scheme) -> decoded by NAME through the per-wave
    #          harmonize_price_item table in <wave>/_/categorical_mapping.org.
    #   u   -- the unit the price refers to, on the shared unit_labels.org
    #          axis: the form's stated basis per item (KG for weighed foods,
    #          tablets, beer bottle, 6 yards ...) or, in 2016-17, the
    #          per-observation unit code.  2012-13 non-foods are priced on a
    #          free-text basis -> u = 'Other Unit', the text in Description.
    #   obs -- the vendor observation.  EVERY GLSS price form records up to
    #          three observations per item ("1ST/2ND/3RD OBSERVATION"; GLSS7
    #          a/b/c; BID §2.3 "prices from up to three vendors"): obs 1-3 is
    #          the form's slot for a single source record; values above 3
    #          arise only where the source
    #          holds more than one record for a (cluster, item, unit) -- a
    #          repeat visit, several brand lines, a mis-keyed cluster, or
    #          several price items folding onto one j label (Nescafe tin +
    #          sachet -> Coffee) -- and are enumerated deterministically;
    #          where records fold, Description identifies the item.  This is the departure from
    #          the Malawi / Nigeria (t, v, j, u) precedent: nothing is
    #          averaged or first()-ed away.
    # Reported columns only (see _/glss_prices.py):
    #   Price          the surveyed price, native cedi of the wave (GHC before
    #                  the 2007 redenomination, GHS after; currency.py labels
    #                  it; NO conversion).  The 1980s files' PRICEnU / DEFL /
    #                  PRICE are calculated fields (BID §6.2) and are NOT stored.
    #   NumberOfUnits  the reported quantity where the file has one (QUANn,
    #                  s1stkg, quantity{a,b,c}), else the form's stated basis
    #                  (GLSS3/4 ship only the per-unit value p = PRICE/KG).
    #                  GLSS7 QTY may report container content weight rather
    #                  than a count of u. Values are preserved as reported;
    #                  Price/NumberOfUnits needs an established quantity basis.
    #                  See CONTENTS.org's GLSS7 price notes and GH #826.
    #   Description    the survey's own free text for the row: the form's
    #                  item label, the 2012-13 non-food basis (s2desc), the
    #                  2016-17 brand line and other-unit text.  Instrument-
    #                  specific by design -> optional.
    # Per-unit price, kg-standardisation, cross-cluster medians and the
    # price->quantity imputation (phase 3b) are transformations, never stored.
    index: (t, v, j, u, obs)
    Price: float
    NumberOfUnits: float
    Description:
      type: str
      optional: true
    materialize: make

  sample:
    index: (i, t)
    v: str
    weight: float
    panel_weight: float
    strata: str
    Rural: str

  interview_date:
    # Calendar contacts; undated/invalid slots are omitted, never imputed.
    index: (t, i, visit)
    Int_t: datetime

  food_security:
    # FAO FIES 8-item battery.  Wired for 2016-17 only (g7sec9c.dta).  In
    # GLSS3-GLSS6 the Section 9 Part C slot is a DIFFERENT module --
    # "Availability of selected consumer items" (availcd / s9cq1 / s9cq2), a
    # market-supply question -- so a "sec9c" filename is NOT evidence of a
    # food-security module.  1991-92 / 1998-99 / 2005-06 / 2012-13 adjudicated
    # `not-asked` on the questionnaire text; 1987-88 / 1988-89 left `unsure`
    # because their questionnaires are image-only scans (C4 unrunnable without
    # OCR).  See .coder/coverage/absent_verdicts.csv, 2026-08-20.
    index: (t, i)
    Worried: bool
    HealthyDiet: bool
    FewFoods: bool
    SkippedMeal: bool
    AteLess: bool
    RanOut: bool
    Hungry: bool
    WholeDay: bool
    FIES_score: int

  housing:
    # GLSS Section 7 "Housing" (dwelling characteristics).  Wired for the five
    # waves whose Section-7 file carries value labels we could verify against
    # the actual questionnaire/codebook: 1991-92 (S7.DTA), 1998-99 (SEC7.DTA),
    # 2005-06 (sec7.dta), 2012-13 (SEC7.dta), 2016-17 (g7sec7.dta).  Codes
    # differ across waves (GLSS3 6-code walls vs GLSS5/6/7 9-10 code walls;
    # question numbering shifts), so each wave maps its own raw variables ->
    # human-readable category strings inline.  Roof/Floor/Walls present in
    # every wired wave; Water/Toilet/Rooms/Tenure/Electricity where available
    # (1998-99 has no Electricity column, only a 'main source of lighting').
    # 1987-88/1988-89 DO field a housing module, in THREE files, not one
    # (corrected 2026-08-20): Y08.DAT is GLSS1/2 Section 8 "Characteristics of
    # housing" (AREA HOWM WALLS FLOOR ROOF WINDOW), and Section 2 carries the
    # rest -- Y02A.DAT (Section 2A "Type of dwelling": DOMICILE COMPOUND NBLDG
    # APT ROOMS YRSRES) and Y02B.DAT (Section 2B "Housing expenses": OWNHH
    # RENTED, DWATER, TOILET, LIGHT/ELECM, FUEL, GARBAGE).  Between them they
    # cover every column this schema declares.  Still NOT wired because the
    # GLSS1/GLSS2 questionnaires are scanned-image PDFs with no text
    # layer (78 CCITT-fax pages, zero font objects) and the DDI/Basic-info docs
    # carry no value codebook, so the numeric
    # codes (WALLS 1-8, FLOOR 1-7, ROOF 1-9) cannot be decoded to labels.
    # This is a DECODING blocker, not an absence: adjudicated `todo`, not
    # `not-asked` -- see .coder/coverage/absent_verdicts.csv.
    index: (t, i)
    Roof: str
    Floor: str
    Walls: str
    Water: str
    Toilet: str
    Rooms: int
    Tenure: str
    Electricity: str

  panel_ids: !make

  # Household nutrient intake: food_quantities(kg) x the FAO/INFOODS West
  # African Food Composition Table 2019 (GH #563).  Registered `!make`, like
  # Uganda's and Ethiopia's -- NOT derived.
  #
  # GRAIN   (i, t) -- one row per household per wave.  No `v`: nutrition is
  #         a household aggregate, and the index declares no cluster level.
  # COLUMNS the `Preferred Label` nutrient axis of
  #         Ethiopia/_/nutrient_labels.org, less `Vitamin K`, which the WAFCT
  #         does not carry.  It is OMITTED, not zero-filled.
  # UNITS   absolute nutrient amount ACQUIRED over the wave's recall period
  #         (kcal for Energy; the WAFCT's own unit otherwise -- see
  #         fct_west_africa.org#wafct_components).  Not per-capita, not
  #         per-day, not per 100 g.  Densities are per-EP and the edible
  #         portion coefficient is NOT applied, matching both precedents.
  #
  # WAVE COVERAGE -- read this before using the numbers:
  #   1987-88, 1988-89  NO ROWS.  100% of these waves' food_acquired rows are
  #                     u='Value' (expenditure, not quantity), so no physical
  #                     quantity survives.  Empty by design.
  #   1991-92, 1998-99, 2012-13
  #                     OWN PRODUCTION ONLY (s='produced' is 100% of the
  #                     surviving kg rows); purchases were elicited by value.
  #                     A biased subset, not scaled-down total intake.
  #   2005-06           NO ROWS.  Its own-production module's 63 item labels
  #                     are absent from categorical_mapping.org#harmonize_food (the
  #                     PURCHASE module's 101/102 are present), so none maps
  #                     to an FCT code.  A harmonisation gap, not an absence.
  #   2016-17           The usable wave: purchases and own production both
  #                     carry physical quantities.  92.5% of its kg maps.
  #
  # FDC FALLBACK: none.  The WAFCT covers the basket; no FoodData Central key
  # is read or embedded (the precedents embed a literal key -- not copied).
  #
  # See nutrition.py's docstring for why it does not call
  # Country.food_quantities(), and slurm_logs/ghana_audit/ISSUE_value_kg_factor.org.
  nutrition: !make

  # GLSS1/GLSS2 Section 9 Part B (Agro-Pastoral Activities -> CROPS).
  # 1987-88 and 1988-89 ONLY: agriculture is Section 9 in GLSS1/GLSS2 and
  # Section 8 from GLSS3 on, and only these two waves form a panel (712
  # households, the GLSS1->GLSS2 rotating half).
  #
  # Index (t, i, j) -- household-crop, no plot and no `u`:
  #   * `plot_id` is 'Farm-level' throughout.  Section 9 has no farm-number
  #     column and no per-farm roster part, and `plot_features` carries a
  #     C4-validated `not-asked` verdict for both waves (`Y09A:IDFARM` is NOT
  #     a plot id -- see `_/CONTENTS.org`).  The LEVEL IS KEPT and marked
  #     rather than dropped: surveys resolve farm quantities at farm / crop /
  #     plot / plot-x-crop grain, none better or worse in general, and marking
  #     the unresolved axis makes the grain readable off the data instead of
  #     inferrable from which levels exist (@ligon, 2026-09-16).  EthiopiaRHS
  #     (GH #512) drops the level instead; that predates this convention.
  #   * no `u` level because the form asks NO HARVEST QUANTITY -- only the
  #     quantity SOLD, whose unit is carried as the `Unit_sold` column.  A `u`
  #     would be NaN on 62-64% of rows (Site I; groupby deletes them) or a
  #     sentinel that says "not applicable" on two thirds of the table.
  #     Mali, Nigeria and Tanzania also declare crop_production without `u`.
  #
  # `Quantity` is declared and is ENTIRELY NaN, by decision (@ligon,
  # 2026-09-16): the canonical column is kept so the cross-country shape is
  # recognisable, and `optional: true` is what stops Site B of the null-read
  # guard raising NullReadError on a required all-null column.  Nothing is
  # imputed into it -- the instrument does not ask it.
  #
  # `Value_sold` is DERIVED (registry key
  # GhanaLSS::crop_production::9b-sale-amount-per-unit); Section 9B records a
  # per-unit sale AMOUNT, not a total.  See _/derivations.yml.
  crop_production:
    index: (t, i, plot_id, j)
    Quantity:
      type: float
      optional: true
    Quantity_sold: float
    Unit_sold:
      type: str
      optional: true
    KgFactor:
      type: float
      optional: true
    Value_sold: float
    Value_seed: float
    Value_given: float
    Value_lost: float
    LossCause:
      type: str
      optional: true
    Area_ha: float
    intercropped:
      type: bool
      optional: true
    # `Derivation` is deliberately NOT declared here.  It is declared in the
    # CANONICAL schema (lsms_library/data_info.yml, Columns > crop_production);
    # a key starting with "derivation" in a data_scheme.yml is banned outright
    # by tests/test_derivations.py::test_nothing_in_a_data_scheme_names_a_derivation,
    # because `_SCHEME_NON_COLUMN_KEYS` would read it as a required column.

  # GLSS1/GLSS2 Section 9 Part F (Livestock).  1987-88 and 1988-89 only.
  # One row per (household, animal); (HID, LIVSTCD) is unique in both waves.
  #
  # `ValuePerAnimal` is the RECORDED value and `HerdValue` the DERIVED one --
  # the opposite way round from most countries, and measured rather than read
  # off Q5's wording ("if they wanted to sell one of these today, how much
  # would they receive altogether?", which is ambiguous).  Within every animal
  # type the reported value does NOT move with herd size: corr(log HeadCount,
  # log LIVSTNV) runs -0.16..+0.08, chickens report 400 at both 4 head and 20,
  # cattle 20,000 at both 2 head and 15.  Q8's SALE value does move with the
  # number sold (corr 0.65-0.80) and is a total, and dividing it by HeadSold
  # recovers ValuePerAnimal almost exactly (chickens 400, cattle 20,000).
  #
  # The last four columns have no canonical counterpart and are carried
  # because the survey asked them; `HeadEaten` in particular is livestock
  # own-consumption, the exact parallel of the crop own-consumption gap.
  livestock:
    index: (t, i, animal)
    HeadCount: float
    ValuePerAnimal: float
    HerdValue: float
    HeadSold: float
    SalesValue: float
    HeadAcquired: float
    PurchaseValue:
      type: float
      optional: true
    HeadBornOrReceived:
      type: float
      optional: true
    HeadEaten:
      type: float
      optional: true
    HeadLostOrDied:
      type: float
      optional: true

  # GLSS1/GLSS2 Section 9 Part D (FARM INPUTS).  1987-88 and 1988-89 only.
  # materialize: make -- seven source files, one per expense block, melted
  # into one long table with a constant `input` label each.  YAML cannot
  # express that; see the wave scripts' docstring for the block-by-block map
  # and for the two things a reader must not misread.  Briefly: Transport /
  # Containers / Storage are the COST OF SELLING the output rather than
  # applied inputs -- they belong here (@ligon, 2026-09-16) but are a quarter
  # of the spend and are not production technology; and the `input` labels are
  # CATEGORIES, not the product names every other country serves.
  #
  # `u` is a COLUMN, not an index level (Uganda / Ethiopia / Nigeria do the
  # same): four of the seven blocks record no quantity and hence no unit, and
  # a NaN on a declared index level is deleted by the first groupby (Site I).
  #
  # `Cost` is the corpus's FIRST input-spend column (@ligon, 2026-09-16).
  # Local currency, per (household, input, crop), 12-month recall.  No country
  # records input spend today -- the canonical vocabulary is Quantity /
  # Purchased / Quantity_purchased -- and four of GLSS's seven blocks record
  # spend and NOTHING else, so dropping it would drop the module.
  #
  # `Purchased` is deliberately NOT declared: the form asks a source code and
  # a credit flag, neither of which is the canonical boolean, and a spend > 0
  # is a different question (Q10 says "IF NOTHING, WRITE ZERO").
  plot_inputs:
    index: (t, i, plot_id, input, j)
    Quantity:
      type: float
      optional: true
    u:
      type: str
      optional: true
    Cost: float
    materialize: make

  # GLSS1/GLSS2 Section 5 (Employment) -- ANNUAL labour supply, per person per
  # job slot.  1987-88 and 1988-89 only.  materialize: make -- four source
  # files, one per job slot, each contributing a constant `job` label.
  #
  # NOT `people_last7days`, which is the corpus's 7-DAY table (canonical,
  # 13 countries).  This is a 12-month measure on the same window as Section
  # 9's agriculture, which is what makes the two joinable.
  #
  # The "past 7 days" Parts B/C are the PRIMARY annual source, despite their
  # title: their Q6 asks weeks worked during the past 12 MONTHS and their Q7
  # usual hours per week during the past 12 MONTHS.  Parts E/G are a
  # SUPPLEMENT -- their Q3 skips the grid when the 12-month job repeats the
  # 7-day one, so their detail is present on only ~20% of rows.
  # `SameAs7DayJob` carries that answer so the pointer rows can be dropped
  # rather than double-counted.  See the wave scripts' docstring.
  #
  # `HoursPerWeek` is REPORTED on the B/C rows and DERIVED on the E/G rows as
  # DaysPerWeek x HoursPerDay (registry key
  # GhanaLSS::labor::5eg-hours-per-week-from-days-and-hours), so that
  # WeeksPerYear x HoursPerWeek is valid on every row.  Both factors are
  # served raw beside it.
  #
  # Own-family farm labour = OwnFarmOrBusiness AND an agricultural Industry.
  # Occupation / Industry are RAW CODES: no code list ships with the data here
  # and none has been verified, so nothing is decoded.  A decode table is a
  # documented gap -- see _/CONTENTS.org.
  labor:
    index: (t, i, pid, job)
    Occupation:
      type: float
      optional: true
    Industry:
      type: float
      optional: true
    WeeksPerYear: float
    HoursPerWeek: float
    DaysPerWeek:
      type: float
      optional: true
    HoursPerDay:
      type: float
      optional: true
    Earnings:
      type: float
      optional: true
    EarningsUnit:
      type: str
      optional: true
    OwnFarmOrBusiness:
      type: bool
      optional: true
    SameAs7DayJob:
      type: str
      optional: true
    materialize: make

  # GLSS1/GLSS2 Section 9 Part D -- hired and exchange labour.  1987-88 and
  # 1988-89 only.  materialize: make.
  #
  # NOT a new table and NOT bespoke.  Every country in the corpus already
  # holds hired labour in plot_labor under source='hired', and GhanaSPS
  # already declares a SIX-level plot_labor (t, i, plot_id, season, stage,
  # source) whose `stage` vocabulary is reused here.  plot_labor has no
  # canonical index_info or Columns entry (GH #569), so the corpus shape is
  # convention -- and that convention already runs from four levels to six.
  #
  # `plot_id` is 'Farm-level' throughout: Section 9 has no farm or plot
  # roster, and plot_features is a C4-validated not-asked for both waves.  The
  # level is KEPT and marked rather than dropped -- see the crop_production
  # note above for the convention.  The EHCVM plot_inputs and EthiopiaRHS
  # crop_production drop it instead; they predate this.
  #
  # `Cost`, not the corpus's usual PersonDays/Wage, for the hired rows: Q42
  # asks how much was SPENT on paid labour, not how many days were worked.
  # PersonDays carries the Q46 exchange-labour total, which is the only
  # person-days figure in Section 9.
  #
  # `worker` is a mixed sex/age classification (male / female / child), as the
  # form asks it.  GhanaSPS splits the same way but as WageRateMen /
  # WageRateWomen / WageRateChildren COLUMNS; an index level is used here
  # because the corpus models categorical dimensions that way everywhere else
  # (source, input, stage), and GhanaSPS's are rates attached to a record.
  #
  # Q46 has neither a stage nor a worker type, so those rows carry the
  # sentinels stage='unspecified' and worker='all' (the landed Niger 'Unknown'
  # pattern, GH #842).  A NaN on a declared index level would be deleted by the
  # first groupby (Site I).  They are sentinels, not measurements.
  #
  # STILL UNWIRED from Part D: Q43-44, other production expenses (renting
  # animals, renting equipment or machinery, maintenance and repair,
  # irrigation charges, fuel) -- 2.5M / 2.8M cedis.  Household-grain with no
  # crop, so it fits neither plot_inputs (which is keyed on j) nor this table.
  plot_labor:
    index: (t, i, plot_id, stage, source, worker)
    Cost:
      type: float
      optional: true
    PersonDays:
      type: float
      optional: true
    materialize: make
