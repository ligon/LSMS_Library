# Sampling design record -- HOW this survey's sample was drawn (GH #793).
#
# PANEL-ONLY (GH #942, ruling 2026-10-18, option A): each entry carries only
# the `panel:` block -- does `v` denote the same cluster as in the PRECEDING
# wave of `Country('Tanzania').waves`?  The design fields are #793's curation
# and are not written yet; their absence here is "not curated", not "not
# found".
#
# Read by `lsms_library/sampling.py`.  `cluster_id_continuity` in
# {wave-scoped, redefined, mixed} makes a `Country('Tanzania')` frame that
# carries `v` across that boundary warn (`ClusterIdentityWarning`); nothing is
# ever dropped or rewritten.  The first wave (2008-09) has no preceding wave
# and so no entry.
#
# Note the two orthogonal facts (DESIGN.org Q2): 2019-20 -> 2020-21 is a
# HOUSEHOLD refresh by design (the Extended and Refresh sub-panels are
# disjoint, .claude/skills/tanzania-panel-design.md), while 2014-15 -> 2019-20
# is a CLUSTER-ID change for households that were tracked.

Sampling:

  '2010-11':
    panel:
      household_continuity: panel
      cluster_id_continuity: stable
      cluster_id_note: |-
        UPD4 `clusterid` both rounds.  Measured: 3,077 of 3,077 linked
        households keep `v` (409 clusters, one-to-one).
      source_type: derived-from-data
      confidence: high
      source_file: null
      locator: 'slurm_logs/2026-09-18_gh942_cluster_identity/DESIGN.org §2 (Tanzania rows); re-measured 2026-10-19 through Country("Tanzania").sample()'

  '2012-13':
    panel:
      household_continuity: panel
      cluster_id_continuity: wave-scoped
      cluster_id_note: |-
        UPD4 round 3 has 82 one-to-one changes in linked cluster IDs.
        Measured 2026-10-19: 591 of 2,904 linked households change `v`.
        The raw upd4_hh_a.dta tracking-line layer shows 1,565 of 7,082
        lines changing across 83 distinct ID pairs, 81 last-digit-only,
        and one earlier cluster ID mapping to multiple later IDs.
        Apart from that split, no affected ID appears on the other side
        (through the API: zero in either direction). The NBS Round 3
        study description says fieldwork clusters included tracked
        households outside the same EA. The ID pairs do not certify
        physical EA equivalence or classify household moves. See
        CONTENTS.org for source and qualification.
      source_type: derived-from-data
      confidence: medium
      source_file: 'lsms_library/countries/Tanzania/2008-15/Data/upd4_hh_a.dta'
      locator: 'clusterid by (UPHI, round), round 2 vs round 3; CONTENTS.org "Cluster id renumbering at round 3 (GH #942)"'
      cluster_id_measurement:
        linked_households: 2904
        households_changed: 591
        clusters_renumbered: 82
        note: |-
          Historical measurement recorded 2026-10-19, ported without
          remeasurement: 591 of 2,904 linked households changed `v`, in
          82 strict one-to-one changes of IDs. This counts linked ID
          pairs, not physically unchanged PSUs. NBS documents fieldwork
          regrouping across EAs, but no household-movement classifier
          has been applied and no net-of-movers count is recorded.
          The raw tracking-line figures (1,565 of 7,082, 83 pairs)
          describe a different layer, not this denominator.
        source_type: derived-from-data
        confidence: high
        locator: >-
          lsms_library/countries/Tanzania/_/sampling.yml@79f5979cf8022e64928c5150950dfb00456994da,
          2012-13 panel.cluster_id_note; same country's CONTENTS.org,
          "Cluster id renumbering at round 3 (GH #942)" (measured 2026-10-19
          through Country("Tanzania").sample()); GH #1135 H3 table
          (2,904 linked, 591 change), preserved in reviewed source
          f1cf7d06f30367cd1e34a4b3db4012f951b2e497.

  '2014-15':
    panel:
      household_continuity: rotating-panel
      cluster_id_continuity: wave-scoped
      cluster_id_note: |-
        Partial, with some earlier IDs appearing again. Of the 82
        one-to-one ID changes in round 3, 12 round-2 IDs reappear for
        linked households (58 households). Six of the 82 round-3 IDs
        still occur in 2014-15, but no linked household keeps one. The
        other non-reverting households (10, in 8 clusters) carry
        new-format IDs. Of 556 linked households, 521 have `v` on both
        sides, and 413 of those keep it. A further 35 link to refresh
        IDs, a linkage itself unverified because rounds 3 and 4 reuse
        1,857 r_hhid strings. This wave pools the Extended Panel
        (tracked) with a newly drawn Refresh sample.
      source_type: derived-from-data
      confidence: medium
      source_file: null
      locator: 're-measured 2026-10-19 through Country("Tanzania").sample(); CONTENTS.org "Cluster id renumbering at round 3 (GH #942)"'
      cluster_id_measurement:
        linked_households: 521
        households_changed: 108
        clusters_renumbered: 35
        note: |-
          Historical counts recorded 2026-10-19, with the strict-ID oracle
          count recorded 2026-10-23; ported without remeasurement. Of 556
          linked households, 521 had `v` on both sides: 413 kept it and
          108 changed. These changes mixed 12 round-3 clusters returning
          to their round-2 id (58 households), 10 households in 8 clusters
          taking new-format ids, and 35 linked to refresh-sample ids.
          That refresh linkage was itself unverified because rounds 3
          and 4 reuse r_hhid strings. The reviewed strict-ID oracle counted
          35 of 57 earlier ids as one-to-one renumberings; the other 22
          split. This partly unverified linkage warrants medium confidence.
          No net-of-movers count is recorded.
        source_type: derived-from-data
        confidence: medium
        locator: >-
          lsms_library/countries/Tanzania/_/sampling.yml@79f5979cf8022e64928c5150950dfb00456994da,
          2014-15 panel.cluster_id_note (re-measured 2026-10-19 through
          Country("Tanzania").sample()); same country's CONTENTS.org,
          "Cluster id renumbering at round 3 (GH #942)"; GH #1135 H3 table
          (521 linked, 108 change); historical clusters_renumbered:
          slurm_logs/isa_backlog_2026-10-21/1135-measurement-record/oracle.json
          (strict_k, Tanzania 2012-13->2014-15, measured 2026-10-23),
          preserved in reviewed source f1cf7d06f30367cd1e34a4b3db4012f951b2e497.

  '2019-20':
    panel:
      household_continuity: panel
      cluster_id_continuity: wave-scoped
      cluster_id_note: |-
        NPS-SDD writes `clusterid` in its own 9-character RR D WWW EEE layout
        (the 2008-15 extended panel uses 8-character RR D WW EEE), so the
        tracked Extended-Panel households keep none of their `v`: 0 of 907
        linked households (849 with `v` on both sides).  NOT a bijection --
        over the 300 cluster pairs those 849 form, 130 cluster ids map to more
        than one id on the other side (310 and 131 before 238 split-offs took
        their parent's cluster, GH #1441), because
        tracked households genuinely moved -- so no crosswalk is recoverable
        here even in principle.
      source_type: derived-from-data
      confidence: high
      source_file: null
      locator: 'CONTENTS.org, "The cluster key of cluster_features" (scheme table); slurm_logs/2026-09-18_gh942_cluster_identity/DESIGN.org §2.5; re-measured 2026-10-19 through Country("Tanzania").sample()'
      cluster_id_measurement:
        linked_households: 849
        households_changed: 849
        not_applicable: [clusters_renumbered]
        note: |-
          Historical measurement recorded 2026-10-19, ported without
          remeasurement: 907 households linked, 849 with `v` on both sides,
          and none kept `v`. NPS-SDD changed every id's layout from 8 to
          9 characters; movement made the old-to-new relation many-to-many.
          The reviewed 2026-10-23 strict-ID oracle's incidental one-to-one
          pairs do not describe this whole-layout change, so the renumbering
          count is not applicable. The historical 849 include movers; no
          net-of-movers count is recorded. These counts are not a new
          measurement after GH #1441; the existing boundary note retains
          its later 300-pair / 130-branching-ID qualification.
        source_type: derived-from-data
        confidence: high
        locator: >-
          lsms_library/countries/Tanzania/_/sampling.yml@79f5979cf8022e64928c5150950dfb00456994da,
          2019-20 panel.cluster_id_note (re-measured 2026-10-19 through
          Country("Tanzania").sample()); same country's CONTENTS.org,
          "The cluster key of cluster_features" (scheme table);
          slurm_logs/2026-09-18_gh942_cluster_identity/DESIGN.org section 2.5;
          GH #1135 H3 table (849 linked, 849 change); historical one-to-one
          qualification: slurm_logs/isa_backlog_2026-10-21/1135-measurement-record/oracle.json
          (strict_k, Tanzania 2014-15->2019-20, measured 2026-10-23),
          preserved in reviewed source f1cf7d06f30367cd1e34a4b3db4012f951b2e497.

  '2020-21':
    panel:
      household_continuity: refresh
      cluster_id_continuity: unobservable
      cluster_id_note: |-
        Zero households in common with 2019-20, by design: 2020-21 follows the
        Refresh Panel drawn in 2014-15 (plus an urban booster), 2019-20 the
        Extended Panel.  With no shared household, `v` cannot be compared
        across this boundary.  (The Refresh households DO link back to
        2014-15, a non-adjacent wave; a frame holding both crosses the
        2019-20 boundary and is warned about it.)
      source_type: derived-from-data
      confidence: high
      source_file: null
      locator: '.claude/skills/tanzania-panel-design.md ("2019-20 and 2020-21 have zero household overlap"); CONTENTS.org "2020-21: Refresh Panel plus an explicit URBAN OVERSAMPLE"'
