# Derivations -- served numbers in this country's tables that are NOT survey
# answers but CONSTRUCTIONS from raw answers.  One entry per registry key,
# `country::table::name`; the same key sits in the served table's
# `Derivation` column on every row it produced.  Loader and field contract:
# lsms_library/derivations.py.  Design: SkunkWorks/derived_values.org.
#
# Sibling of population.yml and recall.yml: a .yml here moves no cache hash.

CotedIvoire::food_acquired::7day-purchase-at-last-purchase-unit-value:
  waves: ['2018-19', '2021-22']
  columns: [Expenditure]
  rows: {s: purchased}
  rule: >-
    Expenditure = Quantity * (s07bq08 / s07bq07a), where Quantity is the row's
    own served purchased quantity, (s07bq03a - s07bq04 - s07bq05).clip(lower=0)
    -- the 7-day consumption net of own production AND of gifts received, which
    is the survey's own accounting identity -- and s07bq08 / s07bq07a is the
    unit value of the household's LAST PURCHASE of the item.  NaN where
    s07bq07a is missing or not positive, and NaN where the last purchase was
    made in a different unit from the consumption unit (s07bq07b/s07bq07c vs
    s07bq03b/s07bq03c): no EHCVM wave ships a unit-conversion table, so there
    is no exact conversion and NA is the honest answer.  Units are compared on
    the EHCVM numeric code where the label carries one, else on the label with
    case, accents, padding and punctuation folded -- the two variables carry
    DIFFERENT value-label sets inside the same .dta.  Before GH #876 the served
    Expenditure was s07bq08 itself: the value of one purchase of unrecorded
    size made up to 30 days earlier, beside a 7-day quantity.  In 2021-22
    (GH #1697) a row whose s07bq03a is H, or which shares its served key with
    such a row, is served Quantity and Expenditure NA under
    CotedIvoire::food_acquired::s07bq03a-outlier-replaced-withheld, and an L
    row is flagged under ...-partial-triplet-conversion; those rules say how.
  function: lsms_library.ehcvm:derive_ehcvm_purchase_value
  inputs: lsms_library.countries.CotedIvoire.2018-19._.mapping:inputs_food_acquired
  raw_variables: [s07bq03a, s07bq03b, s07bq03c, s07bq04, s07bq05, s07bq07a,
                  s07bq07b, s07bq07c, s07bq08]
  assumptions:
    - text: >-
        the unit value of the last purchase is the price the household paid
        over the 7-day consumption window.  s07bq08 is the value of ONE
        purchase, which s07bq06 places up to 30 days back, while s07bq03a is
        the quantity consumed over 7 days -- one row, two clocks.
      basis: variable-label
      evidence: >-
        Stata labels in s07b_me_CIV2018.dta: s07bq08 "7B.08. Valeur (en FCFA) du [PRODUIT]
        achete la derniere fois"; s07bq03a "7B.03a. Qtite tot du [PRODUIT]
        conso par le MEN au cours des 7 derniers jours"; s07bq07a "7B.07a.
        Quelle est la quantite du [PRODUIT] achete la derniere fois?"
    - text: >-
        a last purchase reported in a different unit from the consumption is
        NOT converted, and a row with no last purchase has no unit value to
        apply: the row is served with Expenditure NA. Counts are on the SERVED
        denominator -- purchased rows of the delivered table, after the
        canonical reshape and the (t, v, i, j, u, s) collapse -- because that
        is the number a user sees; the source-row counts are smaller and were
        what an earlier version of this entry quoted. 2018-19: 35,333 of the
        218,224 SERVED purchased rows (16.2%) -- 11,216 because no last
        purchase was reported at all (s07bq08 or s07bq07a missing / not
        positive), 12,182 because the last purchase used a different unit
        CODE, 11,935 because it used the same code in a different SIZE (Petit
        / Moyen / Grand / Taille unique), which is a different container and
        so a different price per unit.  2021-22: 40,847 of the 232,969 SERVED purchased
        rows (17.5%) as filed; 53,914 (23.1%) since 2026-11-12, 15,769 of them H rows
        withheld with no quantity (GH #1697, the s07bq03a-outlier-replaced-withheld key).
      basis: variable-label
      evidence: >-
        no EHCVM wave distributes a unit-conversion table;
        lsms_library/categorical_mapping/ehcvm_units.org is a code->label
        codebook with no factors
    - text: >-
        the quantity multiplied is the SURVEY'S OWN accounting identity,
        (s07bq03a - s07bq04 - s07bq05).clip(0) -- construction "C", chosen by
        @ligon on 2026-09-12 because it is the only one of the three candidates
        ehcvm_conso reproduces.  The alternatives, measured, are A = the gross
        7-day consumption s07bq03a (which would put the value of own-produced
        and gifted food into Expenditure) and B = net of own production only.
        2018-19: A 109,767,959, B 108,747,218, C (served) 105,011,085 FCFA, against a raw s07bq08 total of 119,107,505.
        2021-22, every row as filed: A 124,699,154, B 123,793,766, C 121,393,491 FCFA, against a raw s07bq08 total of 170,793,500; with the H rows withheld (GH #1697) C (served) is 118,357,864.
      basis: modelling-choice
      evidence: SkunkWorks/derived_values.org; GH #876; measured 2026-09-12
    - text: >-
        the gift quantity s07bq05 is served as its own s = 'inkind' row, in the
        consumption unit s07bq03b, with Expenditure NA.  EHCVM asks no value for
        a gift.  UEMOA's depan(Don) is s07bq05 priced at this same last-purchase
        unit value -- verified, and therefore demonstrably an imputation by the
        people who built the aggregate rather than an answer anybody gave -- so
        it is checked and not served.  Own production keeps the identical
        treatment it already had (s = 'produced' from s07bq04, Expenditure NA).
        2018-19: 35,289 inkind rows carrying 106,756 units, 0 with an Expenditure.
        2021-22: 29,050 inkind rows carrying 88,393 units, 0 with an Expenditure; since
        2026-11-12, 2,045 of them are H rows served with no quantity (GH #1697).
      basis: modelling-choice
      evidence: SkunkWorks/derived_values.org; GH #876; measured 2026-09-12
  validated_against: >-
    the product-level check against ehcvm_conso does not run for this wave: its
    conso codpr does not share a keyspace with s07bq01 here, and CotedIvoire
    2018-19 distributes no conso file at all.  The construction is validated on
    the two waves where the join works -- Togo 2018 and Guinea-Bissau 2018-19 --
    in which it reproduces depan(Achat) within 1% for 99.5% / 100% of the rows
    where the candidates differ, against 13.1% / 48.6% for the
    own-production-only residual and 0.0% / 0.0% for the gross 7-day quantity;
    s07bq05 * uv reproduces depan(Don) for 99.7% / 100%, which is why the gift
    rows are served with Expenditure NA rather than with that imputation.  The
    instrument is the same in all twelve waves (identical s07bq0* Stata
    labels), so the reading carries by inference, not by measurement here.
    2021-22 does ship a conso file, and the same test on ehcvm_conso_civ2021.dta gives:
    on the 912 (household, product) rows where the candidates differ, the rule x 365/7 is
    within 1% of depan(Achat) for 90.5%, against 28.7% for the own-production-only residual
    and 1.0% for the gross quantity; median ratio over 192,160 joined rows 1.00000.  This
    shows the arithmetic was carried out, not that s07bq03a is what the household said: 6.7%
    of its positive rows read as high reports replaced by a typical amount per adult
    equivalent and 8.6% look at least partly converted to another unit, inferred, with no
    document saying so, and depan is built on those figures (_/CONTENTS.org, "2021-22 wired").
    The unit value s07bq08 / s07bq07a is clean; the quantity it multiplies is not, on those rows.
    Since 2026-11-12 the H rows are withheld and the L rows flagged (the two s07bq03a-* keys).
  contents: 'CotedIvoire/_/CONTENTS.org, "food_acquired: one row, two windows (GH #876)"'
  since: '2026-09-12'

# GH #1697, ruling @ligon 2026-11-12, "H to NA, flag L (Recommended)".  Two per-row keys
# on 2021-22's s07bq03a.  The first WITHHOLDS a value (Quantity and Expenditure NA on the
# served rows); the second changes nothing and flags.
CotedIvoire::food_acquired::s07bq03a-outlier-replaced-withheld:
  waves: ['2021-22']
  columns: [Quantity, Expenditure]
  rows: {}
  rule: >-
    A positive s07bq03a off the quarter grid with four or more decimals (H) is
    not served: every row the source row serves -- purchased (s07bq03a -
    s07bq04 - s07bq05 positive as filed), produced (s07bq04 positive) and in-kind
    (s07bq05 positive) -- carries Quantity NA and Expenditure NA, and this key.
    The served row set is the filed one; only the values are withheld.  A served
    key (t, v, i, j, u, s) that an H row shares with another row (two file items
    under one served j) is withheld whole, or the core collapse would serve the
    other row's value as the sum; that other row's filed answers are in the
    7-day key's inputs, not this key's.  "Off the grid" and "d decimals" are
    judged at relative tolerance 1e-6.  Downstream,
    food_expenditures, food_quantities and food_prices drop an NA before they
    sum, so an H row is absent there, never a zero; a household-item total that
    also has a non-H row is that row's alone.
  function: lsms_library.countries.CotedIvoire.2021-22._.mapping:classify_s07bq03a
  inputs: lsms_library.countries.CotedIvoire.2021-22._.mapping:inputs_outlier_replaced
  raw_variables: [s07bq03a, s07bq03b, s07bq03c, s07bq04, s07bq05]
  assumptions:
    - text: >-
        an H value is the producer's replacement of the household's answer, not
        the answer: the per-item outlier rule of the harmonised UEMOA / World
        Bank programme replaces a per-capita outlier by "la médiane dans la
        région et le milieu de résidence", and these rows fit that median per
        adult equivalent within item x region x milieu, re-expressed in the
        reported unit.  No document says the rule was written into the
        distributed s07b file, or which rows; the programme's own protocol
        confines such corrections to analysis files and requires a correction
        in a distributed file to be documented.  So the household's answer is
        gone and is not recoverable, and it is not served as an answer.
      basis: derived-from-data
      evidence: >-
        Document de travail no 4, "Mesure de la pauvreté" (UEMOA PHMECV,
        September 2019), §2.2-2.3; doc search
        burst/isa-sm-20261112/reports/ehcvm2-s07bq03a-docsearch/REPORT.md §3
        (T-CIV-1: q3/eqadu1 equals its item x region x milieu cell's mode on
        57.4% of H rows, 29.2% on household size; T-CIV-4b: 32.5% of H rows
        share one kg per adult equivalent across two or more reported units,
        against 0.5% of on-grid rows and 0.0% of L rows; T-CIV-5b: that value
        is the cell median, ratio p50 1.000).  The H share falls from 22.6% of
        rows of one-person households to 1.7% at 13 or more.
    - text: >-
        the row's s07bq04 and s07bq05 are replaced with it, so the produced and
        in-kind rows are withheld too: on H rows s07bq04 is off the grid with
        four or more decimals on 2,721 of the 2,722 where it is positive, and
        s07bq05 off the grid on 2,047 of 2,047.
      basis: derived-from-data
      evidence: measured 2026-11-12, burst job 41248473 (probe.py), s07b_me_civ2021.dta
    - text: >-
        the split is a rule on the value, and a heuristic: 20,507 of the 303,274
        positive s07bq03a are H at the stated tolerance (256,983 on the grid,
        25,784 L); between 1e-7 and 1e-5 the H count moves by 244.  2018-19, the
        control, has 0 H rows at every tolerance.
      basis: modelling-choice
      evidence: >-
        ruling @ligon 2026-11-12 (H to NA); tolerance chosen here; counts
        measured 2026-11-12, burst job 41248473
  validated_against: >-
    The 2018-19 control (0 H of 292,741 positive rows); the doc search's tests
    cited above.  derivation_inputs returns every H source row with its filed
    s07bq03a, s07bq04 and s07bq05, joining the 20,536 keyed served rows (15,769
    purchased, 2,722 produced, 2,045 in-kind) at (t, i, j), every one with
    Quantity and Expenditure NA; they held 3,035,627 FCFA, 2.5% of purchased
    Expenditure (burst job 41249521).  A served key an H row shares with another
    row is withheld whole (12 rows on the first candidate).
  contents: 'CotedIvoire/_/CONTENTS.org, "s07bq03a: H withheld, L flagged (GH #1697)"'
  since: '2026-11-12'

CotedIvoire::food_acquired::s07bq03a-partial-triplet-conversion:
  waves: ['2021-22']
  columns: [Quantity, Expenditure]
  rows: {}
  rule: >-
    A positive s07bq03a off the quarter grid with three decimals or fewer (L) is
    served as filed, and every row its source row serves carries this key.  It
    is a flag: no value is changed.
  function: lsms_library.countries.CotedIvoire.2021-22._.mapping:classify_s07bq03a
  inputs: lsms_library.countries.CotedIvoire.2021-22._.mapping:inputs_partial_triplet_conversion
  raw_variables: [s07bq03a, s07bq03b, s07bq03c, s07bq04, s07bq05]
  assumptions:
    - text: >-
        some L values are the producer's conversion of the row between unit
        triplets (item, unit, size), so the quantity may not be in the unit the
        household named; which rows cannot be identified, and the confidence is
        low to moderate.  The row's s07bq04 is off the grid with it on 8,679 of
        the 8,681 where it is positive, so the flag goes on every row it serves.
        Some L values are ordinary answers: 2018-19, which has no conversion,
        has 2,868 L-shaped rows of its 292,741 positive ones, against 25,784 of
        303,274 here.
      basis: derived-from-data
      evidence: >-
        ANStat, "Profil de pauvreté de la Côte d'Ivoire 2021", §2.7.1, printed
        pp.34-35: "la correction du référentiel des triplets de la section 7B"
        and "la correspondance avec la base des relevés NSU a été analysée";
        doc search REPORT.md §3b T-CIV-7 (an excess of about 8 points, about
        2,000 rows, over a jittered null); the review's mango, honey and salt
        cases in CONTENTS.org.
  validated_against: >-
    None possible: the conversion, where it happened, left no record.  The
    2018-19 control is the baseline for an ordinary off-grid answer.  25,852
    served rows carry the key (12,354 purchased, 8,681 produced, 4,817 in-kind),
    values unchanged, 1.9% of purchased Expenditure (burst job 41249521).
  contents: 'CotedIvoire/_/CONTENTS.org, "s07bq03a: H withheld, L flagged (GH #1697)"'
  since: '2026-11-12'

CotedIvoire::crop_production::hh-crop-sale-single-row:
  waves: ['2021-22']
  columns: [Quantity_sold, Unit_sold, Value_sold]
  rule: >-
    s16d records a sale for the household and crop, with no plot.  A sale is a record with
    a positive s16dq05a or s16dq06.  Where the household has exactly one s16c row for the
    crop, the sale is served on that row: Quantity_sold = s16dq05a, Unit_sold = s16dq05b,
    Value_sold = s16dq06, as recorded, and that row carries this key.  What is derived is
    the ATTACHMENT, not the numbers.  Any other sale is served on one row of that household
    and crop with plot_id = 'Farm-level' and no key, because its index value already
    discloses it.  No sale is split, summed, scaled or dropped.  This key shares a row with
    harvest-to-date or harvest-from-dispositions through derivations.MULTI_SEP, in sorted
    order.
  function: lsms_library.ehcvm:derive_hh_crop_sale_attachment
  inputs: lsms_library.countries.CotedIvoire.2021-22._.mapping:inputs_hh_crop_sale
  raw_variables: [s16cq02, s16cq03, s16cq04, s16dq01, s16dq04, s16dq05a, s16dq05b, s16dq06]
  assumptions:
    - text: >-
        s16d asks the sale once per crop, with no plot, and s16c records no sale.  Where
        the household has one harvest row for the crop, no other row can hold the sale.
        The sale is NOT thereby a share of that row's Quantity, and it may be in another
        unit: Unit_sold says which.
      basis: variable-label
      evidence: >-
        s16d_me_civ2021.dta has no field or parcel variable; s16dq05a "16D.05a. Quelle est
        la quantite de ce produit qui a deja ete vendue ?"; s16dq06 "16D.06. Quel a ete le
        montant tire de la vente de ce produit?".  s16c_me_civ2021.dta carries s16cq02 and
        s16cq03 and no sale variable.
    - text: >-
        a sale of a crop on two or more rows is not allocated among them, since any split
        would be invented.  It stays with the household and crop on a Farm-level row, with
        u = 'Unknown' unless a harvest total shares the row, where gross_crop_revenue and
        median_price_valuation can read it.
      basis: modelling-choice
      evidence: >-
        ruling @ligon 2026-11-03, option (d), GH #824, for Mali 2021-22 and applied here by
        the brief of GH #1697 (split from #552); the Farm-level convention in lsms_library/data_info.yml.
    - text: >-
        s16dq05b labels codes 1 to 7 and holds other codes of section 7B's list with no
        label (339, 340, 316, ...), 183 of the 8,467 sales.  They are read through this
        file's own s07bq03b labels.  Sold in code 339, cocoa prices at 825,000 FCFA against
        825 per kilogram, and s16dq05c / s16dq05a is 1,000: 339 is the Tonne s07bq03b says.
      basis: modelling-choice
      evidence: measured 2026-11-04; 2021-22/_/categorical_mapping.org, harmonize_unit_s16d
  validated_against: >-
    tests/test_civ_2021_wave.py, whose oracle reads s16c and s16d directly.  Not validated
    against an external total: no document here reports one.
  contents: 'CotedIvoire/_/CONTENTS.org, "2021-22 wired"'
  since: '2026-11-04'

CotedIvoire::crop_production::harvest-to-date:
  waves: ['2021-22']
  columns: [Quantity]
  rule: >-
    Identity on a row whose harvest is not finished and which records a quantity: s16cq11 =
    Non with s16cq16a.  The value is served as recorded.  The key names its WINDOW: the
    question asks the quantity ALREADY harvested, so the row covers a part of the season
    under a column that otherwise means all of it.  A row with no recorded quantity carries
    no key.  It never shares a row with harvest-from-dispositions, which needs a finished
    crop and no recorded quantity.
  function: lsms_library.ehcvm:derive_harvest_to_date
  inputs: lsms_library.countries.CotedIvoire.2021-22._.mapping:inputs_harvest_to_date
  raw_variables: [s16cq11, s16cq12, s16cq16a, s16cq16b]
  assumptions:
    - text: >-
        the recorded quantity on an unfinished row is what has been harvested so far, and
        not the season.  3,595 of the 9,473 unfinished rows record one, and no finished row
        does.
      basis: variable-label
      evidence: >-
        s16c_me_civ2021.dta s16cq16a "16C.16a. Quantite deja recoltee pour la presente
        campagne 2021/22?", s16cq11 "16C.11. Avez vous fini la recolte de cette culture?",
        s16cq12 "16C.12. Quel pourcentage de la superficie vous reste-t-il a recolter?"
  validated_against: >-
    tests/test_civ_2021_wave.py, whose oracle reads s16c directly.  An identity has nothing
    to validate but its rows.
  contents: 'CotedIvoire/_/CONTENTS.org, "2021-22 wired"'
  since: '2026-11-04'

CotedIvoire::crop_production::harvest-from-dispositions:
  waves: ['2021-22']
  columns: [Quantity, u]
  rule: >-
    For a household's crop where every s16c row answers s16cq11 = Oui, none records
    s16cq16a, and the positive s16d quantities (consumed s16dq02a, given s16dq03a, sold
    s16dq05a, in stock s16dq13a) state one unit, Quantity is their sum and u that unit.  It
    goes where the sale of that crop goes: the single s16c row, or for two or more rows the
    crop's one Farm-level row.  It is never split among plots.  A crop whose dispositions
    span units stays NA, and so does a crop with a row unfinished, and one with no positive
    disposition.  It extends Mali's ruled derivation,
    Mali::crop_production::harvest-from-dispositions, to this wave (ruling @ligon
    2026-11-12, "Extend Mali's derivation"); GH #1437 stays open.
  function: lsms_library.ehcvm:derive_hh_crop_harvest_total
  inputs: lsms_library.countries.CotedIvoire.2021-22._.mapping:inputs_harvest_from_dispositions
  raw_variables: [s16cq11, s16cq16a, s16dq01, s16dq02a, s16dq02b, s16dq03a, s16dq03b, s16dq05a,
                  s16dq05b, s16dq13a, s16dq13b]
  assumptions:
    - text: >-
        this extends Mali's ruled derivation, Mali::crop_production::harvest-from-dispositions
        (ruling @ligon 2026-11-04, option (b) of GH #1437), to this file, whose shape is
        sharper than Mali's: s16cq16a is on 3,595 of 21,737 crop rows and on none of the 12,263
        finished ones.  The same rule, the same shared function and the same hold-outs.  The
        extension is itself ruled (@ligon 2026-11-12, "Extend Mali's derivation").  Without it
        2021-22 serves no harvest for a finished crop at all.  Why s16cq16a is blank is not
        answered by it: GH #1437 stays open.
      basis: modelling-choice
      evidence: >-
        ruling @ligon 2026-11-12, "Harvest from dispositions in Benin / Cote d'Ivoire 2021-22",
        option "Extend Mali's derivation (Recommended)"; GH #1437 (open); Mali/_/CONTENTS.org,
        "the 2021-22 harvest total, and the window key"
    - text: >-
        consumed + given + sold + in stock is the harvest.  2018-19 of this country can test
        it, because it holds the harvest and all four dispositions on one row (s16cq12a;
        s16cq13a, s16cq14a, s16cq16a, s16cq22a): on 10,822 finished rows with dispositions in
        the harvest's unit the sum is exact on 82.7%, within 10% on 85.7%, median ratio 1.000,
        over 1.1 on 9.1% and under 0.9 on 5.0%.  That is consistency within a row, and a
        respondent may anchor on the harvest just stated.  s16d asks nothing about seed kept
        or post-harvest loss, so the sum can fall short of what was cut.
      basis: modelling-choice
      evidence: measured 2026-11-04 on s16c_me_CIV2018.dta
    - text: >-
        s16dq0?a holds 9999 on 9 records with no label calling it missing, and it enters
        the sum as recorded: 8 served rows sit at exactly 9999, 2 of them derived, and Site Q
        names the rows.
      basis: variable-label
      evidence: measured 2026-11-04; value labels of s16d_me_civ2021.dta
  validated_against: >-
    tests/test_civ_2021_wave.py, whose oracle reads s16c and s16d directly.  Pure-stand
    kg/ha, 2018-19 recorded against 2021-22 derived (n): cocoa 245 (912), 250 (717); rubber
    583 (229), 612 (226); rice 819 (134), 813 (94); cotton 901 (204), 822 (155); coffee 331
    (71), 292 (84); yam 1,852 (162), 1,250 (77); oil palm 1,872 (63), 833 (55).  Inside
    2021-22, on 1,875 unfinished single-row crops with a recorded harvest and dispositions in
    one matching unit, the sum equals the record on 61.3%, median 1.000, 10%-90% 0.73, 2.0.
  contents: 'CotedIvoire/_/CONTENTS.org, "2021-22 wired"'
  since: '2026-11-04'

CotedIvoire::sample::region-milieu-stratum:
  waves: ['2018-19']
  columns: [strata]
  rows: {}
  rule: >-
    strata = '<s00q01 label> <s00q04 label>', the household cover page's own
    region and residence milieu labels, stripped and joined with one space.
    Missing or blank either component gives NA; nonstring codes are refused.
    Preserve native labels without a geographic crosswalk or a region-only
    fallback. The existing shared GH812 construction supplies the value.
    2021-22 upper-cases the region first and so is a different rule, with a
    key of its own: CotedIvoire::sample::region-milieu-stratum-upper-region.
  function: lsms_library.ehcvm:derive_region_milieu_stratum
  inputs: lsms_library.countries.CotedIvoire.2018-19._.mapping:inputs_strata
  raw_variables: [s00q01, s00q04]
  assumptions:
    - text: >-
        the original 2018/19 household sampling stratum is the combination of
        region and milieu. 2018-19 was wired on 2026-11-10.
      basis: questionnaire
      evidence: >-
        Own INS Basic Information Document (survey design documentation,
