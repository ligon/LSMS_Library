# Sampling record -- does `v` denote the same cluster as in the PRECEDING wave of
# `Country('CotedIvoire').waves`?  Read by `lsms_library/sampling.py`.  Vocabulary: see
# sampling.py.  Only the EHCVM boundary is written; the CILSS waves have no entry.

Sampling:

  '2021-22':
    panel:
      household_continuity: rotating-panel
      cluster_id_continuity: stable
      cluster_id_note: |-
        `grappe` in both waves, and the BID says the survey "is a cluster panel survey".
        Measured on the raw covers: 1,081 of 2018-19's 1,084 grappes recur and none is new;
        region agrees on all of them and milieu on 99.9%; the 2021-22 point equals the 2018-19
        fix to the last digit on all 965 with one.  `rotating-panel` records the DESIGN: the
        BID has the 12 households of 2018/19 surveyed if found and the cluster completed
        otherwise.  The library serves NO household link across this boundary: 2021-22's `i`
        is `E2_`-prefixed, because a recurring (grappe, menage) key, flagged panel or not, has
        the head of another household of its grappe as often as its own
        (_/CONTENTS.org, "2021-22 wired"; GH #1697).
      source_type: local-documentation
      confidence: high
      source_file: 'lsms_library/countries/CotedIvoire/2021-22/Documentation/civ_ehcvm2_information_de_base_eng.pdf'
      locator: 'section 4.1 "Household and Community Component", PDF pp. 10-12; measured on s00_me_civ2021.dta, s00_me_CIV2018.dta and grappe_gps_CIV2018.dta through get_dataframe, 2026-11-04'
