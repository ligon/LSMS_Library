Country: Malawi
Wave: 2024-25

housing:
    # The cover defines which Panel rows are copies of the IHS6 interviews.
    # Declare it here so a cover change invalidates the housing parquet.
    dfs: [module_f, panel_cover]
    merge_on: [i]
    merge_how: outer
    final_index: [t, i]
    module_f:
        file:
            - Cross_Sectional/hh_mod_f.dta
            - Panel/hh_mod_f_24.dta:
                i: y5_hhid
                _housing_module_key: y5_hhid
        idxvars:
            i:
                - case_id
                - mapping: cs_i
        myvars:
            Roof: hh_f08
            Floor: hh_f09
            _housing_module_key: case_id
    panel_cover:
        file: Panel/hh_mod_a_filt_24.dta
        idxvars:
            i: y5_hhid
        myvars:
            _housing_cover_key: y5_hhid
            _housing_previous_key: y4_hhid
            _housing_ihs6_key: case_id


# 2024-25 food and its sample/identity dependencies (PR #1604).  The sample
# weights below are served as wired (maintainer ruling 2026-11-12, "Lift hold, rebase, merge"):
# that ruling covers this wave's content only and does NOT settle decision 48's
# joint-inclusion question.  No other wave's weights change.

sample:
    # weight: IHS6 households carry hh_wgt (its label is 'wt_ihs6'); retained
    # IHPS households carry wt_cross ('Cross-sectional weight').  panel_weight
    # is wt_long ('Longitudinal weight', BID section 3.2.3), retained only.
    # The Panel file's own hh_wgt is labelled 'Baseline Sampling Weight' and
    # panelweight_2019 is the previous round's: neither describes this wave.
    #
    # ihps_hhid / ihps_weight are y5_hhid and wt_cross on all 2,763 IHPS 2024
    # households, the 815 included: the hook moves them from the dropped Panel
    # row onto the household's IHS6 row.  That is the panel link for a later
    # round, and with it the IHPS 2024 cross-section can still be rebuilt:
    #     s[s.ihps_weight.notna()]
    file:
        - Cross_Sectional/hh_mod_a_filt.dta
        - Panel/hh_mod_a_filt_24.dta:
            i: y5_hhid
            SampleComponent: [y5_hhid, {mapping: ihps_component}]
            weight: wt_cross
            _ihs6_case_id: case_id
    idxvars:
        i:
            - case_id
            - mapping: cs_i
    myvars:
        SampleComponent: [case_id, {mapping: ihs_component}]
        v: ea_id
        weight: hh_wgt
        panel_weight: wt_long
        ihps_hhid: y5_hhid
        ihps_weight: wt_cross
        strata:
            - district
            - mappings: ['district', 'Alternate Spelling', 'Preferred Label']
        Rural: reside
        Region: region
        District: district


interview_date:
    # Each cover records one ISO interview date. IHPS consumption_date is
    # a different question, not a second interview visit.
    file:
        - Cross_Sectional/hh_mod_a_filt.dta
        - Panel/hh_mod_a_filt_24.dta:
            i: y5_hhid
    idxvars:
        i:
            - case_id
            - mapping: cs_i
    myvars:
        int_t:
            datetime: interviewDate
            calendar: gregorian
            format: '%Y-%m-%d'
            resolution: day


panel_ids:
    # The retained half only: y4_hhid is blank on the 815 refreshment
    # households, which format_id reads as missing and panel_ids drops.
    file: Panel/hh_mod_a_filt_24.dta
    idxvars:
        i: y5_hhid
    myvars:
        previous_i: y4_hhid


household_roster:
    # A refreshment IHPS interview is the same IHS6 interview. Declare its
    # cover alongside both Module B files so its sidecar invalidates the
    # roster, including the L2-wave parquet, when the released intake changes.
    dfs: [module_b, panel_cover]
    merge_on: [i]
    merge_how: left
    final_index: [t, i, pid]
    module_b:
        file:
            - Cross_Sectional/hh_mod_b.dta
            - Panel/hh_mod_b_24.dta:
                i: y5_hhid
                pid: id_code
        idxvars:
            i:
                - case_id
                - mapping: cs_i
            pid: PID
        myvars:
            Sex: hh_b03
            Age: hh_b05a
            Relationship: hh_b04
            MonthsAway: hh_b07
    panel_cover:
        file: Panel/hh_mod_a_filt_24.dta
        idxvars:
            i: y5_hhid
        myvars:
            _roster_y5_hhid: y5_hhid
            _roster_y4_hhid: y4_hhid
            _roster_ihs6_case_id: case_id
