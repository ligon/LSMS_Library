# Derivations -- served numbers in this country's tables that are NOT survey
# answers but CONSTRUCTIONS from raw answers.  One entry per registry key,
# `country::table::name`; the same key sits in the served table's
# `Derivation` column on every row it produced.  Loader and field contract:
# lsms_library/derivations.py.  Design: SkunkWorks/derived_values.org.
#
# Sibling of population.yml and recall.yml: a .yml here moves no cache hash.

Senegal::food_acquired::7day-purchase-at-last-purchase-unit-value:
  waves: ['2018-19', '2021-22']
  columns: [Expenditure]
  rows: {s: purchased}
  rule: >-
    Expenditure = Quantity * (s07bq08 / s07bq07a), where Quantity is the row's
    own served purchased quantity, (s07bq03a - s07bq04 - s07bq05).clip(lower=0)
    -- the 7-day consumption net of own production AND of gifts received, which
    is the survey's own accounting identity -- and s07bq08 / s07bq07a is the
    unit value of the household's LAST PURCHASE of the item.  NaN where
    s07bq07a is missing or not positive, and NaN where the last purchase was
    made in a different unit from the consumption unit (s07bq07b/s07bq07c vs
    s07bq03b/s07bq03c): this construction converts nothing between units, and
    NA is the honest answer.  (This entry used to say no EHCVM wave ships a
    unit-conversion table; 2021-22 does, GH #1452, and it is not used here.)
    Units are compared on
    the EHCVM numeric code where the label carries one, else on the label with
    case, accents, padding and punctuation folded -- the two variables carry
    DIFFERENT value-label sets inside the same .dta.  Before GH #876 the served
    Expenditure was s07bq08 itself: the value of one purchase of unrecorded
    size made up to 30 days earlier, beside a 7-day quantity.
  function: lsms_library.ehcvm:derive_ehcvm_purchase_value
  inputs: lsms_library.countries.Senegal.2018-19._.mapping:inputs_food_acquired
  raw_variables: [s07bq03a, s07bq03b, s07bq03c, s07bq04, s07bq05, s07bq07a,
                  s07bq07b, s07bq07c, s07bq08]
  assumptions:
    - text: >-
        the unit value of the last purchase is the price the household paid
        over the 7-day consumption window.  s07bq08 is the value of ONE
        purchase, which s07bq06 places up to 30 days back, while s07bq03a is
        the quantity consumed over 7 days -- one row, two clocks.
      basis: variable-label
      evidence: >-
        Stata labels in s07b_me_sen2018.dta, s07b_me_sen2021.dta: s07bq08 "7B.08. Valeur (en FCFA) du [PRODUIT]
        achete la derniere fois"; s07bq03a "7B.03a. Qtite tot du [PRODUIT]
        conso par le MEN au cours des 7 derniers jours"; s07bq07a "7B.07a.
        Quelle est la quantite du [PRODUIT] achete la derniere fois?"
    - text: >-
        a last purchase reported in a different unit from the consumption is
        NOT converted, and a row with no last purchase has no unit value to
        apply: the row is served with Expenditure NA. Counts are on the SERVED
        denominator -- purchased rows of the delivered table, after the
        canonical reshape and the (t, v, i, j, u, s) collapse -- because that
        is the number a user sees; the source-row counts are smaller and were
        what an earlier version of this entry quoted. 2018-19: 44,739 of the
        194,173 SERVED purchased rows (23.0%) -- 4,768 because no last
        purchase was reported at all (s07bq08 or s07bq07a missing / not
        positive), 27,631 because the last purchase used a different unit
        CODE, 12,340 because it used the same code in a different SIZE (Petit
        / Moyen / Grand / Taille unique), which is a different container and
        so a different price per unit. 2021-22: 30,621 of the 200,917 SERVED
        purchased rows (15.2%) -- 5,264 because no last purchase was reported
        at all (s07bq08 or s07bq07a missing / not positive), 15,645 because
        the last purchase used a different unit CODE, 9,712 because it used
        the same code in a different SIZE (Petit / Moyen / Grand / Taille
        unique), which is a different container and so a different price per
        unit.  Since 2026-11-12 (measured as a change against the build before
        it, not re-counted from scratch): 2021-22 serves 95 fewer purchased
        rows, 93 of them NA here (salt-per-capita-withheld), and 2018-19 2 more
        NA (near-zero-quantity-withheld, whose quantity is now NA).
      basis: variable-label
      evidence: >-
        the 2018-19 waves distribute no unit-conversion table, and 2021-22's
        ehcvm_nsu is not applied to a price;
        lsms_library/categorical_mapping/ehcvm_units.org is a code->label
        codebook with no factors
    - text: >-
        the quantity multiplied is the SURVEY'S OWN accounting identity,
        (s07bq03a - s07bq04 - s07bq05).clip(0) -- construction "C", chosen by
        @ligon on 2026-09-12 because it is the only one of the three candidates
        ehcvm_conso reproduces.  The alternatives, measured, are A = the gross
        7-day consumption s07bq03a (which would put the value of own-produced
        and gifted food into Expenditure) and B = net of own production only.
        2018-19: A 149,258,003, B 148,492,769, C (served) 147,345,571 FCFA, against a raw s07bq08 total of 171,946,368.  2021-22: A 185,164,741, B 184,227,372, C (served) 182,628,314 FCFA, against a raw s07bq08 total of 185,854,825.
      basis: modelling-choice
      evidence: SkunkWorks/derived_values.org; GH #876; measured 2026-09-12
    - text: >-
        the gift quantity s07bq05 is served as its own s = 'inkind' row, in the
        consumption unit s07bq03b, with Expenditure NA.  EHCVM asks no value for
        a gift.  UEMOA's depan(Don) is s07bq05 priced at this same last-purchase
        unit value -- verified, and therefore demonstrably an imputation by the
        people who built the aggregate rather than an answer anybody gave -- so
        it is checked and not served.  Own production keeps the identical
        treatment it already had (s = 'produced' from s07bq04, Expenditure NA).
        2018-19: 10,802 inkind rows carrying 55,371 units, 0 with an Expenditure.  2021-22: 10,917 inkind rows carrying 47,892 units, 0 with an Expenditure.
      basis: modelling-choice
      evidence: SkunkWorks/derived_values.org; GH #876; measured 2026-09-12
  validated_against: >-
    the product-level check against ehcvm_conso does not run for this wave: its
    conso codpr does not share a keyspace with s07bq01 here, and CotedIvoire
    2018-19 distributes no conso file at all.  The construction is validated on
    the two waves where the join works -- Togo 2018 and Guinea-Bissau 2018-19 --
    in which it reproduces depan(Achat) within 1% for 99.5% / 100% of the rows
    where the candidates differ, against 13.1% / 48.6% for the
    own-production-only residual and 0.0% / 0.0% for the gross 7-day quantity;
    s07bq05 * uv reproduces depan(Don) for 99.7% / 100%, which is why the gift
    rows are served with Expenditure NA rather than with that imputation.  The
    instrument is the same in all twelve waves (identical s07bq0* Stata
    labels), so the reading carries by inference, not by measurement here.
  contents: 'Senegal/_/CONTENTS.org, "food_acquired: one row, two windows (GH #876)"'
  since: '2026-09-12'

Senegal::community_prices::one-item-per-price:
  waves: ['2018-19']
  columns: [Quantity]
  rule: >-
    Quantity = 1 on every served community_prices row, in the row's own
    unit-size `u`.  s05_co_sen2018.dta records, per (grappe, product s05q01,
    unit-size s05q02), two prices -- s05q03 -> obs 1 and s05q04 -> obs 2 -- and
    NO quantity.  The form prices one item of the selected unit-size, so the
    quantity a price was recorded for is one `u` by construction of the form,
    not by any answer.  Price is served as recorded; nothing is divided,
    rescaled or converted, and no size is collapsed.
  function: lsms_library.countries.Senegal.2018-19._.mapping:derive_s05_one_item_per_price
  inputs: lsms_library.countries.Senegal.2018-19._.mapping:inputs_community_prices
  raw_variables: [grappe, vague, Existe, s05q01, s05q02, s05q03, s05q04]
  assumptions:
    - text: >-
        each recorded price is the price of ONE item of the selected unit-size.
        The held community workbooks, whose cover is REPUBLIQUE DU SENEGAL /
        AGENCE NATIONALE DE LA STATISTIQUE ET DE LA DEMOGRAPHIE, list in sheet
        SEC5_PRIX per product up to five `unité` rows with the columns "Relevé 1
        Prix" and "Relevé 2 Prix" and no quantity column.  Senegal's CAPI price
        form has, per product present in the market, a multiple choice of
        unit-sizes (5.02, a warning at six) and, per selected unit-size, "5.03.
        Relevé 1 Prix (en FCFA)" and 5.04, both NUMERIC: INTEGER, validated as
        multiples of 5 and above 0.  There is no quantity question.
      basis: questionnaire
      evidence: >-
        Held 2018-19/Documentation/sen_ehcvm1_qnr_community_excel_vague{1,2}.xls,
        sheet SEC5_PRIX.  UEMOA regional catalogue entry 49,
        https://phmecv.uemoa.int/nada/index.php/catalog/49/download/217 (not
        held; /download/218, listed as vague 2, is the identical file).
    - text: >-
        the distributed prices are served as recorded, including the 249 s05q03
        and 293 s05q04 values that are not integers and the values below 1 FCFA.
        The instrument accepted only integers that are multiples of 5, so those
        values were produced after collection, by a mechanism no held document
        describes; they are taken to be per one item like the rest and are
        neither reversed nor flagged.
      basis: modelling-choice
      evidence: Senegal/_/CONTENTS.org, "2018-19 community prices are wired (GH #1226)"
  validated_against: >-
    the instrument only.  No held file records the quantity behind a price, so
    the one-item reading cannot be checked against data.
  contents: 'Senegal/_/CONTENTS.org, "2018-19 community prices are wired (GH #1226)"'
  since: '2026-11-04'

Senegal::sample::region-milieu-stratum:
  waves: ['2018-19', '2021-22']
  columns: [strata]
  rows: {}
  rule: >-
    strata = '<s00q01 label> <s00q04 label>', the region and area of residence the
    household cover page records, for example 'Kaolack Urbain'.  Labels and never
    codes.  NA where either is missing.  No household file of these waves records a
    stratum.  The region part is then spelled through this country's `strata` table
    in categorical_mapping.org, at read time, which is the `Region` table crossed
    with the two milieu labels.
  function: lsms_library.ehcvm:derive_region_milieu_stratum
  inputs: lsms_library.countries.Senegal.2018-19._.mapping:inputs_strata
  raw_variables: [s00q01, s00q04]
  assumptions:
    - text: >-
        the stratum of the design is the combination of region and area of
        residence, and 2021-22 keeps the 2018-19 plan.
      basis: questionnaire
      evidence: >-
        sen_ehcvm2_information_de_base_eng.pdf (held, 2021-22/Documentation), section
        4.1, p.12: "The second edition is a cluster panel survey, and the sampling
        plan builds upon that of the 2018/2019 survey ... The stratum is the
        combination of region/residential area."  The basis is a Basic Information
        Document, not the instrument; it is the survey's own statement.  No held
        2018-19 document states it.
    - text: >-
        a cluster takes the cover page's label in each wave rather than carrying a
        2018-19 label forward.  In Senegal the choice moves nothing: 0 of the 6,432
        households in both waves change stratum.
      basis: modelling-choice
      evidence: Senegal/_/CONTENTS.org, GH #812 ruling option W2, 2026-11-04.
  validated_against: >-
    BID Table 1a, clusters by region and residence: all 28 cells equal 2018-19 (598
    clusters; tests/test_gh812_ehcvm_strata.py transcribes the table).  It is a real
    allocation: 299 + 299 clusters, and Table 1b's 7,176 planned households against 7,156
    held.  2021-22 is the
    same less the two dropped DRs, Dakar urban 75 and Ziguinchor rural 17.  Share of
    var(log cluster weight) between these cells 90.8% (2018-19) and 88.7% (2021-22),
    against 58.8% and 58.6% between regions alone.
  contents: 'Senegal/_/CONTENTS.org, "EHCVM strata are region x milieu labels (GH #812)"'
  since: '2026-11-04'

Senegal::food_acquired::nsu-national-unit-weight:
  waves: ['2018-19', '2021-22']
  columns: [Quantity_kg]
  rule: >-
    Quantity_kg = Quantity x kg_factor, per acquisition source, where kg_factor is the
    median over ehcvm_nsu_sen2021_nat.dta's rows of the row's (product, unit, size), in grams over 1000.
    Unit and size are the row's s07bq03b and s07bq03c codes in both waves.  The product
    is the s07bq01 code in 2021-22, whose numbering the table uses; in 2018-19, whose
    numbering is a different one, it is found by LABEL, never by code (ehcvm.
    nsu_product_crosswalk): the same label up to spelling, else through the country's
    harmonize_food, else the parts of a label listing goods the instrument later split,
    else the label's stem.  A product reading several table products takes the median of
    their weights.  Each row's tier is nsu_join in derivation_inputs.  NA, with no key,
    where no weight is found; where the served unit is Kg or Litre, whose kilograms the
    label states; and where the row's canonical key is duplicated at the build, because
    core sums Quantity on such a key and selects any other column.  Those rows stay on the
    inferred ladder.  No Quantity or u changes.
  function: lsms_library.ehcvm:derive_nsu_kg_factor
  inputs: lsms_library.countries.Senegal.2021-22._.mapping:inputs_food_acquired_unit_weight
  raw_variables: [s07bq01, s07bq03a, s07bq03b, s07bq03c, s07bq04, s07bq05, produitID, uniteID, tailleID, poids]
  assumptions:
    - text: >-
        a key's weight in the table is the weight of that unit of that product in
        that size, for any row of the wave.  The survey ships the table; the served
        row's own quantity is untouched.
      basis: variable-label
      evidence: >-
        ehcvm_nsu_sen2021_nat.dta, read by code; unit and size codes agree with s07b_me's on
        every code both files label, up to spelling.
    - text: >-
        national, not by stratum.  The stratum cell's departure from the national
        weight is mostly noise: against an independent implied weight, a household's
        last-purchase unit value over the same stratum's median Kg price with 5+
        reports each, the national weight's median absolute log error is
        the same number on both sides, 0.48, since the stratum file repeats the national table, and the slope of the household's deviation on the stratum's is
        undefined, no stratum differs.  99.9% of consumed rows find a weight (159 of 219,717 do not).
      basis: modelling-choice
      evidence: >-
        GH #1452, 2026-11-04.  The check is noisy: a small lot's price per kg runs
        above a kilogram's, so the implied weight runs high, and it compares the
        two rules, not either with the truth.
    - text: >-
        the three files are one table, so which is read is immaterial, and _nat is
        the plainest: ehcvm_nsu_sen2021.dta repeats it across 28 region x milieu
        cells (0 of 1,737 keys vary, 0 of 48,636 rows differ from _nat) and
        ehcvm_nsu_sen2021_nat2023.dta only renames produitID to codpr and adds
        unite = 10 * uniteID + tailleID (poids identical in every row).
      basis: variable-label
      evidence: tests/test_ehcvm_unit_weights.py reads all three.
    - text: >-
        the unit `paquet (250 g)`, served Paquet (250 g), reads the table, and is the
        one stated size the table overrules: table / label is a median 0.10 over its
        5,918 rows.  The label is the defect.  The market file weighs "paquet de 25g" tea at
        25 g on 477 observations, which owes nothing to household prices, and the same unit
        is sized Petit / Moyen / Grand, with the table reading 25 / 250 / 625 g for tea.
        Row by row, households put the table within 2x on 75-85% of rows and the label on
        12-13%: 85.1% / 12.2% on 5,400 served rows against the item's Kg-row price, 74.8% /
        13.3% on 5,691 last-purchase rows.  On the 1,650 rows with a stratum Kg price, 75.2% /
        38.8%.  Disclosed, not patched: Pates / Paquet / Grand reads 5 kg (Petit 250 g, Moyen
        500 g), which households' prices put near 0.5 kg; its 99 rows carry 978 of the unit's
        3,181 kg.
      basis: modelling-choice
      evidence: >-
        s07b_me_sen2021.dta, ehcvm_nsu_sen2021_nat.dta, ehcvm_prix_sen2021.dta.  The other
        stated sizes agree with the table at the median (Bouteille de 20 L at 0.95).
        Ruling @ligon 2026-11-04: a weighed table may overrule a stated label, with a
        report when they disagree (ehcvm.StatedLabelOverruledWarning).
    - text: >-
        2018-19 reads the same weight per key as 2021-22, with the product found by label.
        Of 2018-19's consumed rows 138,612 join on the label, 24,326 through harmonize_food
        and 4,450 as the parts of a bundle (Aubergine, Courge/Courgette alone, 0.508 / 54.8%
        against 2018-19's community price ratios, though its parts agree on the main keys);
        99.4% of non-metric served rows read a weight.  volume_as_mass=False cannot decline
        the stated-volume rows that read the table: 1,728 of 1,730 in 2021-22 and 2,276 of
        2,293 in 2018-19, 18,987 kg.  Disclosed, by ruling.
      basis: modelling-choice
      evidence: >-
        Ruling @ligon 2026-11-04.  Matched items, 2021-22 over 2018-19, median / row-weighted:
        Kg rows 1.14 / 1.14, inference 1.05 / 1.07, both waves on the table 1.16 / 1.14.
    - text: >-
        Kg and Litre keep their labels.  Their table rows are not read: a kilogram is
        a kilogram, and a table litre is not a density (in these tables most oils
        read exactly 1000 g).
      basis: modelling-choice
      evidence: GH #1452, 2026-11-04.  Those rows are the check on the join instead.
  validated_against: >-
    the rows whose label states the mass, which the table was not fitted to: the
    national weight of a Kg row is 1000 g at the median, and the delivered factor
    reproduces the table read directly from the two files
    (tests/test_ehcvm_unit_weights.py).  Outside the survey's households: ehcvm_prix_sen2021.dta weighs "paquet
    de 25g" tea at 0.025 kg on 477 observations, the table's Petit.  Table rows against market
    per-kg, median abs. log error / within 2x, go from 0.415 / 73.6% under the inference to
    0.413 / 69.0% under the table, and item medians' correlation with the market from 0.59 to
    0.69.  Table against 2018-19 community price ratios: 0.382 / 81.0%.
    Measured kilograms are in Senegal/_/CONTENTS.org.
  contents: 'Senegal/_/CONTENTS.org, "EHCVM unit-weight table wired (GH #1452)"'
  since: '2026-11-04'

# A DELETION: the records are not served, so none can carry a key.  This entry is
# the disclosure (`rows: 0`), and `derivation_inputs` returns the records.
Senegal::food_acquired::salt-per-capita-withheld:
  waves: ['2021-22']
  columns: [Quantity, Expenditure]
  rows: 0
  rule: >-
    A record of s07b_me_sen2021.dta for product 139 (Sel) in kg, size-free, whose
    s07bq03a is a whole multiple of 0.0199997 kg (s07bq03a / 0.0199997 within 1e-9
    of a whole number n >= 1) is not served: not its purchased row, its
    own-production row or its gift row.  100 records meet it (34% of the wave's 294
    salt-in-kg records); no record of any other product or unit does.  On all 100, n
    is the household's hhsize in ehcvm_welfare_sen2021.dta, so the rule is "0.0199997
    kg a person"; the build reads s07b alone and does not need the welfare file,
    which only the inputs callable reads, as evidence.  No record equals 0.02 x
    hhsize; the 2026-11-12 data check's "0.02" was the constant at 4 significant
    digits.  (Until the red team of 2026-11-12 the selector read hhsize itself and
    the table failed when the welfare file could not be fetched; the two selectors
    pick the same 100 records.)
  function: lsms_library.countries.Senegal.2021-22._.mapping:salt_per_capita_rows
  inputs: lsms_library.countries.Senegal.2021-22._.mapping:inputs_salt_per_capita
  raw_variables: [vague, s07bq01, s07bq03a, s07bq03b, s07bq03c, s07bq04, s07bq05,
                  s07bq06, s07bq07a, s07bq07b, s07bq07c, s07bq08, hhsize]
  assumptions:
    - text: >-
        a quantity that is one constant times household size on 100 records, and
        on no record of any other good, is a fill by the file's producers, not a
        household's answer.  The households' own median is 0.0278 kg a person, and
        none of the 28 region x milieu medians is the constant, so it is not the
        harmonised rule's region x milieu median either.
      basis: modelling-choice
      evidence: >-
        Ruling @ligon 2026-11-12, "Remove, registered", on the principle that
        undocumented imputations are not served without a very good reason.  No
        document held or public mentions salt, a per-capita norm or a 7B
        imputation (BID FR p.19 and EN, ANSD Rapport final 2021-22, World Bank DDI
        6278, the EHCVM-2 enumerator manual; documentation search 2026-11-12).
        A typed answer cannot meet the rule by chance: 0.0199997 x an integer
        carries 6-7 significant digits (0.099998 kg for 5 persons).  Measured on
        the released file, the 100 sit within 3.6e-15 of a whole multiple and the
        nearest other salt-in-kg record 4.5e-5 away; every tolerance from 1e-12 to
        1e-5 selects the same 100, and 1e-9 sits inside that range.  A value typed
        on a 0.01 kg grid sits at least 1.5e-5 from a whole multiple below 600 kg
        (0.02 kg is 1.5e-5 away, 0.1 kg 7.5e-5).
  validated_against: >-
    the base build: the 100 records were 100 served rows (95 purchased, 5 in kind;
    17.04 kg, 17.78 FCFA of Expenditure on the 2 that had one), all gone, and no
    other row of the table changes (Senegal/_/CONTENTS.org).
  contents: 'Senegal/_/CONTENTS.org, "2021-22 salt at a fixed amount per person withheld"'
  since: '2026-11-12'

# A WITHHELD VALUE (GH #1519): the rows stay, their quantity is NA, so no row
# carries this key; the entry is the disclosure (`rows: 0`), as Burkina Faso's
# copied-grappe-gps-withheld is.  The value precedent is GH #1594 (Mali 2014-15,
# s13q03c = 99,999,999 masked in the wave mapper), which has no entry here.
Senegal::food_acquired::near-zero-quantity-withheld:
  waves: ['2018-19']
  columns: [Quantity, Expenditure, Quantity_kg]
  rows: 0
  rule: >-
    A record of s07b_me_sen2018.dta whose s07bq03a and s07bq07a are both positive
    and below 1e-3 is served with Quantity NA.  Its Expenditure is NA too, because
    the registered 7day-purchase-at-last-purchase-unit-value rule multiplies that
    quantity by s07bq08 / s07bq07a.  Its Quantity_kg is NA, as it already was on all
    three (their kilograms came from the bottle's stated volume at read time, so
    none carried the nsu-national-unit-weight key; the hook would drop that key
    where it did).  The row stays, with its #876 key.
    Three records meet it, all product 132 (Autres tisanes et infusions), each
    with s07bq03a exactly 40 times s07bq07a; no other record of this file or of any
    other EHCVM wave's s07b does.  The third already had Expenditure NA (its last
    purchase is in a sachet, its consumption in a bottle), so it is left with no
    measurement.
  function: lsms_library.countries.Senegal.2018-19._.mapping:near_zero_quantity_rows
  inputs: lsms_library.countries.Senegal.2018-19._.mapping:inputs_near_zero_quantity
  raw_variables: [vague, s07bq01, s07bq03a, s07bq03b, s07bq03c, s07bq04, s07bq05,
                  s07bq06, s07bq07a, s07bq07b, s07bq07c, s07bq08]
  assumptions:
    - text: >-
        a released s07bq03a of 4e-19 to 9e-19 bottles, beside an s07bq07a of 1e-20 to
        2e-20, is not a quantity anyone answered; the pair is treated as
        missing.  Served as recorded they put 2018-19 food_prices (kgvalue) at 1.45e22
        and 1.79e22 FCFA/kg.
      basis: modelling-choice
      evidence: >-
        Ruling @ligon 2026-11-12, "Exact-value NA rule" (GH #1519).  The values are in
        the released file, not a subtraction in the build: both subtraction orders
        agree on all 434,299 source rows examined (GH #1519).  Their cause is unknown.
  validated_against: >-
    the base build: the three rows keep their keys and change only in Quantity (3)
    and Expenditure (2, 2,000 and 4,000 FCFA); every other row and column of the
    table is unchanged.  2018-19 food_prices (kgvalue) maximum 1.79e22 -> 479,452
    FCFA/kg and mean 2.17e17 -> 1,698.5; units='unitvalue' maximum 4.79e21 -> 70,000;
