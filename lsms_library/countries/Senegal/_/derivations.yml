# Derivations -- served numbers in this country's tables that are NOT survey
# answers but CONSTRUCTIONS from raw answers.  One entry per registry key,
# `country::table::name`; the same key sits in the served table's
# `Derivation` column on every row it produced.  Loader and field contract:
# lsms_library/derivations.py.  Design: SkunkWorks/derived_values.org.
#
# Sibling of population.yml and recall.yml: a .yml here moves no cache hash.

Senegal::food_acquired::7day-purchase-at-last-purchase-unit-value:
  waves: ['2018-19', '2021-22']
  columns: [Expenditure]
  rows: {s: purchased}
  rule: >-
    Expenditure = Quantity * (s07bq08 / s07bq07a), where Quantity is the row's
    own served purchased quantity, (s07bq03a - s07bq04 - s07bq05).clip(lower=0)
    -- the 7-day consumption net of own production AND of gifts received, which
    is the survey's own accounting identity -- and s07bq08 / s07bq07a is the
    unit value of the household's LAST PURCHASE of the item.  NaN where
    s07bq07a is missing or not positive, and NaN where the last purchase was
    made in a different unit from the consumption unit (s07bq07b/s07bq07c vs
    s07bq03b/s07bq03c): no EHCVM wave ships a unit-conversion table, so there
    is no exact conversion and NA is the honest answer.  Units are compared on
    the EHCVM numeric code where the label carries one, else on the label with
    case, accents, padding and punctuation folded -- the two variables carry
    DIFFERENT value-label sets inside the same .dta.  Before GH #876 the served
    Expenditure was s07bq08 itself: the value of one purchase of unrecorded
    size made up to 30 days earlier, beside a 7-day quantity.
  function: lsms_library.ehcvm:derive_ehcvm_purchase_value
  inputs: lsms_library.countries.Senegal.2018-19._.mapping:inputs_food_acquired
  raw_variables: [s07bq03a, s07bq03b, s07bq03c, s07bq04, s07bq05, s07bq07a,
                  s07bq07b, s07bq07c, s07bq08]
  assumptions:
    - text: >-
        the unit value of the last purchase is the price the household paid
        over the 7-day consumption window.  s07bq08 is the value of ONE
        purchase, which s07bq06 places up to 30 days back, while s07bq03a is
        the quantity consumed over 7 days -- one row, two clocks.
      basis: variable-label
      evidence: >-
        Stata labels in s07b_me_sen2018.dta, s07b_me_sen2021.dta: s07bq08 "7B.08. Valeur (en FCFA) du [PRODUIT]
        achete la derniere fois"; s07bq03a "7B.03a. Qtite tot du [PRODUIT]
        conso par le MEN au cours des 7 derniers jours"; s07bq07a "7B.07a.
        Quelle est la quantite du [PRODUIT] achete la derniere fois?"
    - text: >-
        a last purchase reported in a different unit from the consumption is
        NOT converted, and a row with no last purchase has no unit value to
        apply: the row is served with Expenditure NA. Counts are on the SERVED
        denominator -- purchased rows of the delivered table, after the
        canonical reshape and the (t, v, i, j, u, s) collapse -- because that
        is the number a user sees; the source-row counts are smaller and were
        what an earlier version of this entry quoted. 2018-19: 44,739 of the
        194,173 SERVED purchased rows (23.0%) -- 4,768 because no last
        purchase was reported at all (s07bq08 or s07bq07a missing / not
        positive), 27,631 because the last purchase used a different unit
        CODE, 12,340 because it used the same code in a different SIZE (Petit
        / Moyen / Grand / Taille unique), which is a different container and
        so a different price per unit. 2021-22: 30,621 of the 200,917 SERVED
        purchased rows (15.2%) -- 5,264 because no last purchase was reported
        at all (s07bq08 or s07bq07a missing / not positive), 15,645 because
        the last purchase used a different unit CODE, 9,712 because it used
        the same code in a different SIZE (Petit / Moyen / Grand / Taille
        unique), which is a different container and so a different price per
        unit.
      basis: variable-label
      evidence: >-
        no EHCVM wave distributes a unit-conversion table;
        lsms_library/categorical_mapping/ehcvm_units.org is a code->label
        codebook with no factors
    - text: >-
        the quantity multiplied is the SURVEY'S OWN accounting identity,
        (s07bq03a - s07bq04 - s07bq05).clip(0) -- construction "C", chosen by
        @ligon on 2026-09-12 because it is the only one of the three candidates
        ehcvm_conso reproduces.  The alternatives, measured, are A = the gross
        7-day consumption s07bq03a (which would put the value of own-produced
        and gifted food into Expenditure) and B = net of own production only.
        2018-19: A 149,258,003, B 148,492,769, C (served) 147,345,571 FCFA, against a raw s07bq08 total of 171,946,368.  2021-22: A 185,164,741, B 184,227,372, C (served) 182,628,314 FCFA, against a raw s07bq08 total of 185,854,825.
      basis: modelling-choice
      evidence: SkunkWorks/derived_values.org; GH #876; measured 2026-09-12
    - text: >-
        the gift quantity s07bq05 is served as its own s = 'inkind' row, in the
        consumption unit s07bq03b, with Expenditure NA.  EHCVM asks no value for
        a gift.  UEMOA's depan(Don) is s07bq05 priced at this same last-purchase
        unit value -- verified, and therefore demonstrably an imputation by the
        people who built the aggregate rather than an answer anybody gave -- so
        it is checked and not served.  Own production keeps the identical
        treatment it already had (s = 'produced' from s07bq04, Expenditure NA).
        2018-19: 10,802 inkind rows carrying 55,371 units, 0 with an Expenditure.  2021-22: 10,917 inkind rows carrying 47,892 units, 0 with an Expenditure.
      basis: modelling-choice
      evidence: SkunkWorks/derived_values.org; GH #876; measured 2026-09-12
  validated_against: >-
    the product-level check against ehcvm_conso does not run for this wave: its
    conso codpr does not share a keyspace with s07bq01 here, and CotedIvoire
    2018-19 distributes no conso file at all.  The construction is validated on
    the two waves where the join works -- Togo 2018 and Guinea-Bissau 2018-19 --
    in which it reproduces depan(Achat) within 1% for 99.5% / 100% of the rows
    where the candidates differ, against 13.1% / 48.6% for the
    own-production-only residual and 0.0% / 0.0% for the gross 7-day quantity;
    s07bq05 * uv reproduces depan(Don) for 99.7% / 100%, which is why the gift
    rows are served with Expenditure NA rather than with that imputation.  The
    instrument is the same in all twelve waves (identical s07bq0* Stata
    labels), so the reading carries by inference, not by measurement here.
  contents: 'Senegal/_/CONTENTS.org, "food_acquired: one row, two windows (GH #876)"'
  since: '2026-09-12'

Senegal::community_prices::one-item-per-price:
  waves: ['2018-19']
  columns: [Quantity]
  rule: >-
    Quantity = 1 on every served community_prices row, in the row's own
    unit-size `u`.  s05_co_sen2018.dta records, per (grappe, product s05q01,
    unit-size s05q02), two prices -- s05q03 -> obs 1 and s05q04 -> obs 2 -- and
    NO quantity.  The form prices one item of the selected unit-size, so the
    quantity a price was recorded for is one `u` by construction of the form,
    not by any answer.  Price is served as recorded; nothing is divided,
    rescaled or converted, and no size is collapsed.
  function: lsms_library.countries.Senegal.2018-19._.mapping:derive_s05_one_item_per_price
  inputs: lsms_library.countries.Senegal.2018-19._.mapping:inputs_community_prices
  raw_variables: [grappe, vague, Existe, s05q01, s05q02, s05q03, s05q04]
  assumptions:
    - text: >-
        each recorded price is the price of ONE item of the selected unit-size.
        The held community workbooks, whose cover is REPUBLIQUE DU SENEGAL /
        AGENCE NATIONALE DE LA STATISTIQUE ET DE LA DEMOGRAPHIE, list in sheet
        SEC5_PRIX per product up to five `unité` rows with the columns "Relevé 1
        Prix" and "Relevé 2 Prix" and no quantity column.  Senegal's CAPI price
        form has, per product present in the market, a multiple choice of
        unit-sizes (5.02, a warning at six) and, per selected unit-size, "5.03.
        Relevé 1 Prix (en FCFA)" and 5.04, both NUMERIC: INTEGER, validated as
        multiples of 5 and above 0.  There is no quantity question.
      basis: questionnaire
      evidence: >-
        Held 2018-19/Documentation/sen_ehcvm1_qnr_community_excel_vague{1,2}.xls,
        sheet SEC5_PRIX.  UEMOA regional catalogue entry 49,
        https://phmecv.uemoa.int/nada/index.php/catalog/49/download/217 (not
        held; /download/218, listed as vague 2, is the identical file).
    - text: >-
        the distributed prices are served as recorded, including the 249 s05q03
        and 293 s05q04 values that are not integers and the values below 1 FCFA.
        The instrument accepted only integers that are multiples of 5, so those
        values were produced after collection, by a mechanism no held document
        describes; they are taken to be per one item like the rest and are
        neither reversed nor flagged.
      basis: modelling-choice
      evidence: Senegal/_/CONTENTS.org, "2018-19 community prices are wired (GH #1226)"
  validated_against: >-
    the instrument only.  No held file records the quantity behind a price, so
    the one-item reading cannot be checked against data.
  contents: 'Senegal/_/CONTENTS.org, "2018-19 community prices are wired (GH #1226)"'
  since: '2026-11-04'

Senegal::sample::region-milieu-stratum:
  waves: ['2018-19', '2021-22']
  columns: [strata]
  rows: {}
  rule: >-
    strata = '<s00q01 label> <s00q04 label>', the region and area of residence the
    household cover page records, for example 'Kaolack Urbain'.  Labels and never
    codes.  NA where either is missing.  No household file of these waves records a
    stratum.  The region part is then spelled through this country's `strata` table
    in categorical_mapping.org, at read time, which is the `Region` table crossed
    with the two milieu labels.
  function: lsms_library.ehcvm:derive_region_milieu_stratum
  inputs: lsms_library.countries.Senegal.2018-19._.mapping:inputs_strata
  raw_variables: [s00q01, s00q04]
  assumptions:
    - text: >-
        the stratum of the design is the combination of region and area of
        residence, and 2021-22 keeps the 2018-19 plan.
      basis: questionnaire
      evidence: >-
        sen_ehcvm2_information_de_base_eng.pdf (held, 2021-22/Documentation), section
        4.1, p.12: "The second edition is a cluster panel survey, and the sampling
        plan builds upon that of the 2018/2019 survey ... The stratum is the
        combination of region/residential area."  The basis is a Basic Information
        Document, not the instrument; it is the survey's own statement.  No held
        2018-19 document states it.
    - text: >-
        a cluster takes the cover page's label in each wave rather than carrying a
        2018-19 label forward.  In Senegal the choice moves nothing: 0 of the 6,432
        households in both waves change stratum.
      basis: modelling-choice
      evidence: Senegal/_/CONTENTS.org, GH #812 ruling option W2, 2026-11-04.
  validated_against: >-
    BID Table 1a, clusters by region and residence: all 28 cells equal 2018-19 (598
    clusters; tests/test_gh812_ehcvm_strata.py transcribes the table).  2021-22 is the
    same less the two dropped DRs, Dakar urban 75 and Ziguinchor rural 17.  Share of
    var(log cluster weight) between these cells 90.8% (2018-19) and 88.7% (2021-22),
    against 58.8% and 58.6% between regions alone.
  contents: 'Senegal/_/CONTENTS.org, "EHCVM strata are region x milieu labels (GH #812)"'
  since: '2026-11-04'
