Country: Burkina Faso
Wave: 2021-22

# ONE ROUND, TWO CATALOG ENTRIES (GH #1276).  Every household file is read
# from BOTH components and concatenated (the Malawi 2016-17 / 2019-20 layout,
# #600):
#   Data/Panel/          WB 6224, EHCVM-P: 3,227 re-interviewed 2018-19
#                        households, grappes 2-585 (2018-19's own grappes).
#   Data/Cross_Section/  WB 6277, EHCVM-2: 7,176 households in 600 new
#                        grappes 586-1185, drawn from the 2019 census frame.
# The two are disjoint (0 households in both) and share the questionnaire.
#
# HOUSEHOLD IDS (GH #1244).  The panel component keeps the country `i`
# (grappe + menage.zfill(3)), which panel_ids / updated_ids link to 2018-19.
# The cross-section is an independent sample, and with the same formatter 9
# of its ids equal 2018-19 ids (for a three-digit menage m, 2018-19's (g, m)
# spells g + '0' + m, as does the cross-section's (10g, m)), so every
# Cross_Section/ entry that builds `i` overrides it per file with `cs_i`:
# 'CS_' + grappe + menage.zfill(3) (burkina_faso.CROSS_SECTION_PREFIX).
# cluster_features' `i: menage` is only projected away, so it needs none.
#
# A two-file `file:` list makes Wave.grab_data pass missing_ok=True, so a
# column absent from ONE component is filled NaN instead of raising.  The
# only requested column that is: hhweight_panel (absent from the
# cross-section's weights file; see `sample`).  Pinned by
# tests/test_gh1276_burkina_two_components.py.

sample:
    dfs:
        - df_cover
        - df_weights
    df_cover:
        file:
            - Panel/s00_me_bfa2021.dta
            - Cross_Section/s00_me_bfa2021.dta:
                i:
                    - grappe
                    - menage
                    - mapping: cs_i
        idxvars:
            v: grappe
            i:
                - grappe
                - menage
        myvars:
            Rural:
                - s00q04
                - mapping:
                    Rural: Rural
                    rural: Rural
                    RURAL: Rural
                    Urbain: Urban
                    urbain: Urban
                    URBAIN: Urban
    df_weights:
        # Each component's OWN weight in `weight` (@ligon, GH #1276 ruling 3;
        # the Malawi precedent): the panel's cross-sectional `hhweight2021`,
        # the cross-section's `hhweight`.  `panel_weight` is the panel's
        # `hhweight_panel` and is NaN for every cross-section household: the
        # cross-section's file has no such column, and missing_ok fills it.
        # Both weight files are one row per grappe, and the components'
        # grappes are disjoint, so the merge on `v` stays many-to-one.
        #
        # EACH COMPONENT IS WEIGHTED TO THE NATIONAL TOTAL ON ITS OWN (raw
        # sums over households, measured 2026-10-23: hhweight2021 3,084,993
        # on 3,227 panel households; hhweight 3,233,016 on 7,176
        # cross-section households).  So a pooled 2021-22 weighted mean
        # BLENDS TWO FRAMES, each counted as if it were the whole country --
        # 48.8% / 51.2% in weight, however unequal their household counts (a
        # panel household weighs about 2.1 cross-section ones).  Analyse one
        # component (`v` <= 585 is the panel, >= 586 the cross-section) or
        # rescale before pooling.  `_normalise_sample_weights` divides each
        # wave's weights by their mean, which rescales both components by the
        # same constant and does not change this.
        file:
            - Panel/ehcvm_panel_ponderations_bfa2021.dta
            - Cross_Section/ehcvm_ponderations_bfa2021.dta:
                weight: hhweight
        idxvars:
            v: grappe
        myvars:
            weight: hhweight2021
            panel_weight: hhweight_panel
    merge_on:
        - v
    final_index:
        - i
        - t

household_roster:
    dfs:
        - df_main
        - df_cover
    df_main:
        file:
            - Panel/s01_me_bfa2021.dta
            - Cross_Section/s01_me_bfa2021.dta:
                i:
                    - grappe
                    - menage
                    - mapping: cs_i
        idxvars:
            v: grappe
            i:
                - grappe
                - menage
            pid: pid
        myvars:
            Sex: s01q01
            Relationship: s01q02
            Age:
                - s01q04a
                - s01q03a
                - s01q03b
                - s01q03c
            MonthsSpent:
                - s01q12
                - mapping:
                    Oui: 12
                    Non: 0
    df_cover:
        file:
            - Panel/s00_me_bfa2021.dta
            - Cross_Section/s00_me_bfa2021.dta:
                i:
                    - grappe
                    - menage
                    - mapping: cs_i
        idxvars:
            v: grappe
            i:
                - grappe
                - menage
        myvars:
            interview_date: s00q23a
    merge_on:
        - v
        - i
    final_index:
        - v
        - i
        - pid

individual_education:
    # EHCVM 2021-22: highest education attained = educ_hi.  This wave's
    # household_roster keys pid off a SCALAR `pid` column, and the individu
    # file carries the same scalar `pid`, so individual_education uses
    # `pid: pid` (scalar) to align (verified 22,362/22,362 individu keys
    # overlap the roster after format_id).  i = country i([grappe, menage]).
    file:
        - Panel/ehcvm_individu_bfa2021.dta
        - Cross_Section/ehcvm_individu_bfa2021.dta:
            i:
                - grappe
                - menage
                - mapping: cs_i
    idxvars:
        v: grappe
        i:
            - grappe
            - menage
        pid: pid
    myvars:
        Educational Attainment:
            - educ_hi
            - mappings: ['harmonize_education', 'Original Label', 'Preferred Label']

cluster_features:
    file:
        - Panel/s00_me_bfa2021.dta
        - Cross_Section/s00_me_bfa2021.dta
    idxvars:
        i: menage
        v: grappe
    myvars:
        Region: s00q01
        District: s00q02
        Rural:
            - s00q04
            - mapping:
                Rural: Rural
                rural: Rural
                RURAL: Rural
                Urbain: Urban
                urbain: Urban
                URBAIN: Urban

