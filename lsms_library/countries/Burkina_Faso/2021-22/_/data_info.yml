                Diminué: True
                Augmenté: True
                Inchangé: False
                Non-concerné: False
        AffectedAssets:
            - s14bq04b
            - mapping:
                Diminué: True
                Augmenté: True
                Inchangé: False
                Non-concerné: False
        AffectedProduction:
            - s14bq04c
            - mapping:
                Diminué: True
                Augmenté: True
                Inchangé: False
                Non-concerné: False
        # s14bq04d is "Effectif du cheptel"; the food stock is s14bq04e (GH #1556).
        AffectedConsumption:
            - s14bq04e
            - mapping:
                Diminué: True
                Augmenté: True
                Inchangé: False
                Non-concerné: False
        Cope1: s14bq05__1
        Cope2: s14bq05__2
        Cope3: s14bq05__3
        Cope4: s14bq05__4
        Cope5: s14bq05__5
        Cope6: s14bq05__6
        Cope7: s14bq05__7
        Cope8: s14bq05__8
        Cope9: s14bq05__9
        Cope10: s14bq05__10
        Cope11: s14bq05__11
        Cope12: s14bq05__12
        Cope13: s14bq05__13
        Cope14: s14bq05__14
        Cope15: s14bq05__15
        Cope16: s14bq05__16
        Cope17: s14bq05__17
        Cope18: s14bq05__18
        Cope19: s14bq05__19
        Cope20: s14bq05__20
        Cope21: s14bq05__21
        Cope22: s14bq05__22
        Cope23: s14bq05__23
        Cope24: s14bq05__24
        Cope25: s14bq05__25
        Cope26: s14bq05__26

assets:
    file: s12_me_bfa2021.dta
    idxvars:
        i:
            - grappe
            - menage
        j: s12q01
    myvars:
        Quantity: s12q03
        Age: s12q07
        Value: s12q09
        Purchase Price: s12q08

food_acquired:
    file: s07b_me_bfa2021.dta
    idxvars:
        v: grappe
        visit: vague
        i:
            - grappe
            - menage
        j:
            - s07bq01
            - mappings: ['harmonize_food', 'Original Label', 'Preferred Label']
        u:
            - s07bq03b
            - mappings: ['ehcvm_units', 'Code', 'Preferred Label']
    myvars:
        Quantity: s07bq03a
        Produced: s07bq04
        # GH #876.  `Expenditure` is NOT a myvar here: it used to be wired
        # straight to `s07bq08`, "Valeur (en FCFA) du [PRODUIT] achete la
        # derniere fois" -- the value of ONE purchase up to 30 days old --
        # beside a 7-day consumption `Quantity`.  The served `Expenditure` is
        # now DERIVED by 2021-22/_/mapping.py's food_acquired hook
        # (lsms_library.ehcvm.derive_ehcvm_purchase_value) as
        #     purchased Quantity x s07bq08 / s07bq07a,
        # where purchased Quantity = (s07bq03a - s07bq04 - s07bq05).clip(0),
        # NA where the last purchase used a different unit or `s07bq07a` is
        # not positive.  Registered as
        # `Burkina_Faso::food_acquired::7day-purchase-at-last-purchase-unit-value`
        # in Burkina_Faso/_/derivations.yml; every purchased row carries that key
        # in its `Derivation` column.  The seven raw inputs below are read only
        # to feed that hook (all seven REQUIRED -- `food_acquired_ehcvm` raises
        # KeyError on a missing one) and are dropped by the canonical reshape;
        # `GiftQuantity` is also served on its own `s = 'inkind'` rows.
        # s07bq05, the quantity received as a GIFT, is subtracted from the
        # purchased quantity (the survey's own identity, @ligon 2026-09-12)
        # and served on its own `s = 'inkind'` rows with Expenditure NaN --
        # EHCVM asks no value for a gift, and UEMOA's depan(Don) is an
        # imputation, not an answer.
        GiftQuantity: s07bq05
        ConsumptionUnitCode: s07bq03b
        ConsumptionUnitSize: s07bq03c
        LastPurchaseQuantity: s07bq07a
        LastPurchaseUnitCode: s07bq07b
        LastPurchaseUnitSize: s07bq07c
        LastPurchaseValue: s07bq08

housing:
    file: s11_me_bfa2021.dta
    idxvars:
        i:
            - grappe
            - menage
    myvars:
        Roof:
            - s11q19
            - mapping:
                Dalle en ciment: Concrete Slab
                Tuile: Clay Tiles
                Tôles: Iron Sheets
                Paille: Thatch
                Banco: Mud
                Chaume: Thatch
                Nattes: Mats
                'Autre (à préciser)': Other
        Floor:
            - s11q20
            - mapping:
                Carreaux/Marbre: Tiles
                Ciment/Béton: Cement
                Terre battue/Sable: Earth
                "Bouse d'animaux": Dung
                Autre: Other

interview_date:
    # BOTH COMPONENTS (GH #1276): the panel cover and the cross-section cover
    # (Data/Cross_Section/, WB 6277) ask the same s00q23-25 visit timestamps.
    # The cross-section households get their `CS_` id through the same
    # per-file override as `sample` and `household_roster`.
    file:
        - s00_me_bfa2021.dta
        - Cross_Section/s00_me_bfa2021.dta:
            i:
                - grappe
                - menage
                - mapping: cs_i
    idxvars:
        i:
            - grappe
            - menage
    myvars:
        # q23/q24/q25 a/b = visits 1/2/3 start/end
        int_start:    s00q23a
        int_end:      s00q23b
        int_start_v2: s00q24a
        int_end_v2:   s00q24b
        int_start_v3: s00q25a
        int_end_v3:   s00q25b

food_security:
    # FAO 8-item FIES, EHCVM §8A.  s08aq01..08 -> Worried..WholeDay in
    # FAO order (same instrument as 2018-19; §8 was NOT split into
    # sub-modules unlike §20).  Oui->True, Non->False,
    # 'Ne sait pas'/'Refus'->NaN.  Recall: last 12 months.  s08aq07a/08a
    # are frequency follow-ups -- ignored.  FIES_score computed in
    # mapping.py's food_security() post-processor.
    file: s08a_me_bfa2021.dta
    idxvars:
        i:
            - grappe
            - menage
    myvars:
        Worried:
            - s08aq01
            - mapping: &fies_yn
                Oui: true
                Non: false
                Ne sait pas: null
                Refus: null
        HealthyDiet:
            - s08aq02
            - mapping: *fies_yn
        FewFoods:
            - s08aq03
            - mapping: *fies_yn
        SkippedMeal:
            - s08aq04
            - mapping: *fies_yn
        AteLess:
            - s08aq05
            - mapping: *fies_yn
        RanOut:
            - s08aq06
            - mapping: *fies_yn
        Hungry:
            - s08aq07
            - mapping: *fies_yn
        WholeDay:
            - s08aq08
            - mapping: *fies_yn

subjective_well_being:
    # EHCVM §20 'Pauvreté relative'.  In the 2021-22 instrument §20 was
    # split into sub-modules A/B/C; sub-module A (s20a_me) is relative
    # poverty, and s20aq05 is the ladder item equivalent to 2018-19's
    # s20q05.  4-point relative-wealth scale, higher = better off
    # (Très pauvre=1 ... Riche=4); Ne sait pas -> NaN.
    file: s20a_me_bfa2021.dta
    idxvars:
        i:
            - grappe
            - menage
    myvars:
        Own Step:
            - s20aq05
            - mapping:
                Très pauvre: 1
                Pauvre: 2
                Moyen: 3
                Riche: 4
                Ne sait pas: null
