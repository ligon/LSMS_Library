assets:
    file:
        - Panel/s12_me_bfa2021.dta
        - Cross_Section/s12_me_bfa2021.dta:
            i:
                - grappe
                - menage
                - mapping: cs_i
    idxvars:
        i:
            - grappe
            - menage
        j: s12q01
    myvars:
        Quantity: s12q03
        Age: s12q07
        Value: s12q09
        Purchase Price: s12q08

food_acquired:
    file:
        - Panel/s07b_me_bfa2021.dta
        - Cross_Section/s07b_me_bfa2021.dta:
            i:
                - grappe
                - menage
                - mapping: cs_i
    idxvars:
        v: grappe
        visit: vague
        i:
            - grappe
            - menage
        j:
            - s07bq01
            - mappings: ['harmonize_food', 'Original Label', 'Preferred Label']
        u:
            - s07bq03b
            - mappings: ['ehcvm_units', 'Code', 'Preferred Label']
    myvars:
        Quantity: s07bq03a
        Produced: s07bq04
        # GH #876.  `Expenditure` is NOT a myvar here: it used to be wired
        # straight to `s07bq08`, "Valeur (en FCFA) du [PRODUIT] achete la
        # derniere fois" -- the value of ONE purchase up to 30 days old --
        # beside a 7-day consumption `Quantity`.  The served `Expenditure` is
        # now DERIVED by 2021-22/_/mapping.py's food_acquired hook
        # (lsms_library.ehcvm.derive_ehcvm_purchase_value) as
        #     purchased Quantity x s07bq08 / s07bq07a,
        # where purchased Quantity = (s07bq03a - s07bq04 - s07bq05).clip(0),
        # NA where the last purchase used a different unit or `s07bq07a` is
        # not positive.  Registered as
        # `Burkina_Faso::food_acquired::7day-purchase-at-last-purchase-unit-value`
        # in Burkina_Faso/_/derivations.yml; every purchased row carries that key
        # in its `Derivation` column.  The seven raw inputs below are read only
        # to feed that hook (all seven REQUIRED -- `food_acquired_ehcvm` raises
        # KeyError on a missing one) and are dropped by the canonical reshape;
        # `GiftQuantity` is also served on its own `s = 'inkind'` rows.
        # s07bq05, the quantity received as a GIFT, is subtracted from the
        # purchased quantity (the survey's own identity, @ligon 2026-09-12)
        # and served on its own `s = 'inkind'` rows with Expenditure NaN --
        # EHCVM asks no value for a gift, and UEMOA's depan(Don) is an
        # imputation, not an answer.
        GiftQuantity: s07bq05
        ConsumptionUnitCode: s07bq03b
        ConsumptionUnitSize: s07bq03c
        LastPurchaseQuantity: s07bq07a
        LastPurchaseUnitCode: s07bq07b
        LastPurchaseUnitSize: s07bq07c
        LastPurchaseValue: s07bq08

