# Sampling design record -- HOW this survey's sample was drawn (GH #793).
#
# NO DESIGN FIELDS (GH #942, ruling 2026-10-18, option A): each entry carries
# the `panel:` block -- does `v` denote the same cluster as in the PRECEDING
# wave of `Country('Burkina_Faso').waves`?  The design fields are #793's
# curation and are not written yet; their absence here is "not curated", not
# "not found".  An entry may also carry `served_strata:` (GH #1577; below).
#
# Read by `lsms_library/sampling.py`.  `cluster_id_continuity` in
# {wave-scoped, redefined, mixed} makes a `Country('Burkina_Faso')` frame that
# carries `v` across that boundary warn (`ClusterIdentityWarning`); nothing is
# ever dropped or rewritten.  The first wave (2014) has no preceding wave and
# so no entry.  Vocabulary and field names: see sampling.py.
#
# The idiosyncrasy (GH #1243): `v` is a SAMPLE SERIAL in every wave, not a
# frame code.  2014 (EMC) numbers its 900 ZD 1-900 (`zd`, called `grappe` in
# emc2014_welfare.dta); EHCVM-1 numbers its own 585 ZD 1-585 (`grappe`).  Two
# independent draws whose id spaces OVERLAP -- unlike GhanaLSS 1991-92, whose
# disjoint 3xxx keyspace is what makes grouping across an unlinked boundary
# correct there.  EHCVM-2 (2021-22) has two components (GH #1276): a panel
# sub-sample of EHCVM-1's households, tracked within their EA, which keeps
# EHCVM-1's `grappe`; and a new cross-section whose 600 grappes are numbered
# 586-1185, disjoint from EHCVM-1's 1-585.
#
# Do NOT measure the 2014 boundary by shared `i`: both waves built `i` from
# the cluster serial, so 583 ids coincided and all 583 "kept" `v` -- an id
# collision, not 583 households (see the 2018-19 note and CONTENTS.org).
# Since GH #1244 the 2014 ids carry an 'EMC_' prefix and 0 are shared, which
# is evidence about nothing.

Sampling:

  # SERVED STRATA (GH #1577, ruling 2026-11-12): what `sample().strata` holds.  The
  # EHCVM waves serve the region x milieu construction registered in
  # _/derivations.yml.  2014 is NOT recorded: its `strate` is a bare number the
  # library decodes to a label through its own lookup (GH #1573, "recorded-code
  # decoding"), which none of sampling.py's `holds` values describes; the case is a
  # question in the #1577 report.  Absence of a 2014 entry is "unrecorded".

  '2018-19':
    served_strata:
      holds: constructed
      derivation: 'Burkina_Faso::sample::region-milieu-stratum'
      source_type: derived-from-data
      confidence: high
      locator: '_/derivations.yml, Burkina_Faso::sample::region-milieu-stratum (waves 2018-19, 2021-22); 2018-19/_/data_info.yml `sample.df_cover.strata` = [s00q01, s00q04, {mapping: strata_label}], stamped by 2018-19/_/mapping.py `sample`; CONTENTS.org, "2026-11-04 -- EHCVM strata are region x milieu labels (GH #812)": 26 region x milieu labels'
      note: |-
        No household file records a stratum.  Labels, never codes: `s00q01` 1 is
        Boucle du Mouhoun in 2018-19 and Hauts-Bassins in 2021-22.  The 26 cells
        rest on the panel BID (bid_bfa_ehcvm2.pdf p.4) and the survey's own unit
        table; the 2018-19 report and English BID describe other stratifications
        (CONTENTS.org, "26, on three documents that disagree").
    panel:
      household_continuity: independent
      cluster_id_continuity: redefined
      cluster_id_note: |-
        `v` is a sample serial in both waves (EMC 2014 `zd` 1-900, EHCVM-1
        `grappe` 1-585), so on the 585 shared integers the same id names an
        unrelated cluster: Region differs for 517, District for 540, Rural for
        282.  Two separate surveys, two separate PPS draws of ZD: EMC 900 ZD
        (Report.pdf p. 20), EHCVM-1 585 ZD (rapport general p. 17).  No
        household links across this boundary: the 2018-19 cover
        (s00_me_bfa2018.dta, 18 columns) carries no pointer to 2014, and
        panel_ids.py records no EMC -> EHCVM linkage.  The 583 `i` the two
        waves share all "keep" `v` only because both build `i` from the
        cluster serial (2014 zd + menage.zfill(3); 2018-19 grappe + '0' +
        menage.zfill(2)): an id collision, not a household -- the clusters'
        Region agrees for 80 of those 583.  `redefined`, not `unobservable`:
        the keyspaces OVERLAP, so a cross-wave groupby('v') merges 585 pairs
        of unrelated clusters, which is the hazard the warning exists for.
        The unit KIND is the same (a ZD); what changes is the sample list the
        serial indexes.  `redefined` is the closest warning-bearing value in
        the frozen vocabulary (its gloss, "a different KIND of unit", fits
        loosely); `wave-scoped` would claim a crosswalk is meaningful, and
        none is (GH #1243).  District is compared case- and accent-folded,
        Koulpelgo = Koulpelogo (measured before GH #1059's spelling table,
        PR #1242, landed); unfolded it differed for all 585.  Since GH #1244
        the 2014 ids are namespaced 'EMC_' (burkina_faso.emc_i), so 0 `i`
        are shared across this boundary by construction -- which says
        nothing about `v`, exactly as Niger's 'E_' does not.
      source_type: derived-from-data
      confidence: high
      source_file: null
      locator: 'measured 2026-10-23 through Country("Burkina_Faso").sample() and .cluster_features() on a cold build at development 9a0ed5f3c; draws quoted in CONTENTS.org, "2014 -- ... Sample design" and "2018-19 -- ... Sample-size figures"; no linkage: Burkina_Faso/_/panel_ids.py docstring'

      cluster_id_measurement:
        linked_households: 0
        not_applicable: [clusters_renumbered]
        note: |-
          The dated 2026-10-23 source review records no household linkage
          from EMC 2014 to EHCVM-1: the cover has no 2014 pointer and
          panel_ids.py declares none. Historical unprefixed IDs had 583
          collisions; the current EMC_ namespace removes those collisions
          without establishing household links or cross-wave v continuity.
          Shared v serials name unrelated independently drawn clusters,
          not renumberings of linked clusters. No new count was measured.
        source_type: derived-from-data
        confidence: high
        locator: '2026-10-23 cluster_id_note; Burkina_Faso/_/panel_ids.py; CONTENTS.org "v across wave boundaries" and the later GH #1244 EMC_ namespace checkpoint; historical review f1cf7d06f'

  '2021-22':
    served_strata:
      holds: constructed
      derivation: 'Burkina_Faso::sample::region-milieu-stratum'
      source_type: derived-from-data
      confidence: high
      locator: '_/derivations.yml, Burkina_Faso::sample::region-milieu-stratum (waves 2018-19, 2021-22); 2021-22/_/data_info.yml `sample.df_cover.strata` over both covers (s00_me_bfa2021.dta and Cross_Section/s00_me_bfa2021.dta), stamped by 2021-22/_/mapping.py `sample`; CONTENTS.org, "2026-11-04 -- EHCVM strata are region x milieu labels (GH #812)", "2021-22 has two components"'
      note: |-
        One construction over both components.  The cross-section's catalog entry
        (6277) names no stratum, so its label is an inference, recorded as a
        modelling choice in the registry entry.
    panel:
      household_continuity: rotating-panel
      cluster_id_continuity: stable
      cluster_id_note: |-
        `grappe` both waves.  2021-22 is ONE round in TWO catalog entries (GH
        #1276): the panel component (WB 6224, Data/) re-interviewed
        3,227 EHCVM-1 households tracked within their EA of origin
        (bid_bfa_ehcvm2.pdf, page 4), and grappe == grappe_EHCVM1 for all
        3,227, in 550 grappes, all among 2018-19's 585 (Region agrees 550/550;
        District names a different province on 3 grappes, Seno/Yagha,
        Poni/Noumbiel, Kompienga/Gourma, GH #1059, and Rural differs on 7:
        attribute recodes on a grappe the households were tracked within, not
        a renumbering).  The cross-section component (WB 6277,
        Data/Cross_Section/) is 7,176 households in 600 grappes numbered
        586-1185, above 2018-19's maximum of 585, so the added keyspace is
        DISJOINT and no new id names an old cluster (why `stable`, not
        `mixed`; the Niger 2021-22 precedent, whose new grappes are 900-996).
        `rotating-panel` (part retained, part replaced), not `panel`: 7,176 of
        10,403 households are a new draw from the 2019 census frame, with no
        2018-19 antecedent -- a judgement call, as for Niger 2021-22, which
        does not change whether this boundary warns.
      source_type: derived-from-data
      confidence: high
      source_file: 'lsms_library/countries/Burkina_Faso/2021-22/Data/s00_me_bfa2021.dta'
      locator: 'grappe vs grappe_EHCVM1 in that file, and grappe in Data/Cross_Section/s00_me_bfa2021.dta, read via get_dataframe 2026-10-23; design: bid_bfa_ehcvm2.pdf p. 4 (quoted in CONTENTS.org, "THE THING TO KNOW") and the WB 6277 catalog entry (sampling_procedure; quoted in CONTENTS.org, GH #1276 section)'
