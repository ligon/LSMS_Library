# Derivations -- served numbers in this country's tables that are NOT survey
# answers but CONSTRUCTIONS from raw answers.  One entry per registry key,
# `country::table::name`; the same key sits in the served table's
# `Derivation` column on every row it produced.  Loader and field contract:
# lsms_library/derivations.py.  Design: SkunkWorks/derived_values.org.
#
# Sibling of population.yml and recall.yml: a .yml here moves no cache hash.

Burkina_Faso::food_acquired::7day-purchase-at-last-purchase-unit-value:
  waves: ['2018-19', '2021-22']
  columns: [Expenditure]
  rows: {s: purchased}
  rule: >-
    Expenditure = Quantity * (s07bq08 / s07bq07a), where Quantity is the row's
    own served purchased quantity, (s07bq03a - s07bq04 - s07bq05).clip(lower=0)
    -- the 7-day consumption net of own production AND of gifts received, which
    is the survey's own accounting identity -- and s07bq08 / s07bq07a is the
    unit value of the household's LAST PURCHASE of the item.  NaN where
    s07bq07a is missing or not positive, and NaN where the last purchase was
    made in a different unit from the consumption unit (s07bq07b/s07bq07c vs
    s07bq03b/s07bq03c): this construction converts nothing between units, and
    NA is the honest answer.  (This entry used to say no EHCVM wave ships a
    unit-conversion table; 2021-22 does, GH #1452, and it is not used here.)
    Units are compared on
    the EHCVM numeric code where the label carries one, else on the label with
    case, accents, padding and punctuation folded -- the two variables carry
    DIFFERENT value-label sets inside the same .dta.  Before GH #876 the served
    Expenditure was s07bq08 itself: the value of one purchase of unrecorded
    size made up to 30 days earlier, beside a 7-day quantity.
  function: lsms_library.ehcvm:derive_ehcvm_purchase_value
  inputs: lsms_library.countries.Burkina_Faso.2018-19._.mapping:inputs_food_acquired
  raw_variables: [s07bq03a, s07bq03b, s07bq03c, s07bq04, s07bq05, s07bq07a,
                  s07bq07b, s07bq07c, s07bq08]
  assumptions:
    - text: >-
        the unit value of the last purchase is the price the household paid
        over the 7-day consumption window.  s07bq08 is the value of ONE
        purchase, which s07bq06 places up to 30 days back, while s07bq03a is
        the quantity consumed over 7 days -- one row, two clocks.
      basis: variable-label
      evidence: >-
        Stata labels in s07b_me_bfa2018.dta, s07b_me_bfa2021.dta: s07bq08 "7B.08. Valeur (en FCFA) du [PRODUIT]
        achete la derniere fois"; s07bq03a "7B.03a. Qtite tot du [PRODUIT]
        conso par le MEN au cours des 7 derniers jours"; s07bq07a "7B.07a.
        Quelle est la quantite du [PRODUIT] achete la derniere fois?"
    - text: >-
        a last purchase reported in a different unit from the consumption is
        NOT converted, and a row with no last purchase has no unit value to
        apply: the row is served with Expenditure NA. Counts are on the SERVED
        denominator -- purchased rows of the delivered table, after the
        canonical reshape and the (t, v, i, j, u, s) collapse -- because that
        is the number a user sees; the source-row counts are smaller and were
        what an earlier version of this entry quoted. 2018-19: 13,850 of the
        105,796 SERVED purchased rows (13.1%) -- 10,009 because no last
        purchase was reported at all (s07bq08 or s07bq07a missing / not
        positive), 1,684 because the last purchase used a different unit CODE,
        2,157 because it used the same code in a different SIZE (Petit / Moyen
        / Grand / Taille unique), which is a different container and so a
        different price per unit. 2021-22: 7,065 of the 52,820 SERVED
        purchased rows (13.4%) -- 4,859 because no last purchase was reported
        at all (s07bq08 or s07bq07a missing / not positive), 1,708 because the
        last purchase used a different unit CODE, 498 because it used the same
        code in a different SIZE (Petit / Moyen / Grand / Taille unique),
        which is a different container and so a different price per unit.
      basis: variable-label
      evidence: >-
        the 2018-19 waves distribute no unit-conversion table, and 2021-22's
        ehcvm_nsu is not applied to a price;
        lsms_library/categorical_mapping/ehcvm_units.org is a code->label
        codebook with no factors
    - text: >-
        the quantity multiplied is the SURVEY'S OWN accounting identity,
        (s07bq03a - s07bq04 - s07bq05).clip(0) -- construction "C", chosen by
        @ligon on 2026-09-12 because it is the only one of the three candidates
        ehcvm_conso reproduces.  The alternatives, measured, are A = the gross
        7-day consumption s07bq03a (which would put the value of own-produced
        and gifted food into Expenditure) and B = net of own production only.
        2018-19: A 54,075,976, B 53,497,881, C (served) 52,466,280 FCFA, against a raw s07bq08 total of 65,315,308.  2021-22: A 29,381,603, B 29,220,369, C (served) 27,888,221 FCFA, against a raw s07bq08 total of 39,905,158.
      basis: modelling-choice
      evidence: SkunkWorks/derived_values.org; GH #876; measured 2026-09-12
    - text: >-
        the gift quantity s07bq05 is served as its own s = 'inkind' row, in the
        consumption unit s07bq03b, with Expenditure NA.  EHCVM asks no value for
        a gift.  UEMOA's depan(Don) is s07bq05 priced at this same last-purchase
        unit value -- verified, and therefore demonstrably an imputation by the
        people who built the aggregate rather than an answer anybody gave -- so
        it is checked and not served.  Own production keeps the identical
        treatment it already had (s = 'produced' from s07bq04, Expenditure NA).
        2018-19: 9,386 inkind rows carrying 31,929 units, 0 with an Expenditure.  2021-22: 6,148 inkind rows carrying 24,918 units, 0 with an Expenditure.
      basis: modelling-choice
      evidence: SkunkWorks/derived_values.org; GH #876; measured 2026-09-12
  validated_against: >-
    the product-level check against ehcvm_conso does not run for this wave: its
    conso codpr does not share a keyspace with s07bq01 here, and CotedIvoire
    2018-19 distributes no conso file at all.  The construction is validated on
    the two waves where the join works -- Togo 2018 and Guinea-Bissau 2018-19 --
    in which it reproduces depan(Achat) within 1% for 99.5% / 100% of the rows
    where the candidates differ, against 13.1% / 48.6% for the
    own-production-only residual and 0.0% / 0.0% for the gross 7-day quantity;
    s07bq05 * uv reproduces depan(Don) for 99.7% / 100%, which is why the gift
    rows are served with Expenditure NA rather than with that imputation.  The
    instrument is the same in all twelve waves (identical s07bq0* Stata
    labels), so the reading carries by inference, not by measurement here.
  contents: 'Burkina_Faso/_/CONTENTS.org, "food_acquired: one row, two windows (GH #876)"'
  since: '2026-09-12'

Burkina_Faso::community_prices::quoted-native-unit-count:
  waves: ['2018-19']
  columns: [Quantity]
  rule: >-
    Quantity=1 counts one QUOTED native unit-size u per reported FCFA price.
    It is not a reported physical quantity, kg weight or unit-conversion
    factor. The source records no quantity. Price is served unchanged in
    both slots; complete product+unit codes remain in the constructed variety
    coordinate. Raw inputs expose the original seven fields without Quantity.
  function: lsms_library.countries.Burkina_Faso.2018-19._.mapping:derive_quoted_native_unit_count
  inputs: lsms_library.countries.Burkina_Faso.2018-19._.mapping:inputs_community_prices
  raw_variables: [grappe, vague, Existe, s05q01, s05q02, s05q03, s05q04]
  assumptions:
    - text: >-
        The own Burkina PRICE CAPI form selects up to six unit-sizes per
        product and generates two integer FCFA price questions5.03/5.04
        per selected unit-size, with positive/multiple5 validators and no
        quantity entry. This is a different instrument from the FOCUS
        workbook, which shows three quantity/price pairs.
      basis: questionnaire
      evidence: >-
        UEMOA catalogue43, Qx_EHCVM_PRIX_BF and Qx_EHCVM_PRIX_BF_V2,
        https://phmecv.uemoa.int/nada/index.php/catalog/43/download/104
        (v1p10) and /download/105 (v2p9). Authenticated PDF SHA256
        d6eb8a277defdae6c775cadef99dc594d0216baa4c185a420c7a2b1c30172f41
        and78195ddbc9c7b01ec660e5d4acf8f9249c4ec32f276068a8d31a1889ef7dc30d.
    - text: >-
        Interpret the selected-unit quote as the price of one native u,
        following the explicit Niger one-item-per-price precedent and
        GH1226 direction. The count is constructed, not an observed answer;
        a sack or Demi remains one quoted sack or half, never inferred kg.
        No price rounding, positivity filtering or missing-value filling
        follows from the form validators.
      basis: modelling-choice
      evidence: >-
        Shared community_prices Price-one-u contract; Niger derivation
        one-item-per-price; own Burkina PRICE instrument above; GH #1226
        source/instrument review (2026-10-30).
  validated_against: >-
    Instrument and modelling contract only. No reported quantity exists
    against which the derived count can be numerically validated. Native,
    API and fresh-process warm validation on authenticated closed source
    operands pass at c8f8bcc976 (138,534 rows). This is saved-source reuse,
    not a fresh raw decoder/source read or standalone Make/compiler claim.
    Direct native-to-storage strict transport remains failed: visit index
    nullable Int64 becomes NumPy int64; matching-storage scientific proof
    passes without normalizing actual frames.
  contents: 'Burkina_Faso/_/CONTENTS.org, GH1226 PRICE instrument'
  since: '2026-10-30'

Burkina_Faso::cluster_features::zd-modal-province:
  waves: ['2014']
  columns: [District]
  rule: >-
    District = the most common `province` among the zd's households, on every
    row of a zd whose households name more than one province and where one of
    them is strictly the most common: 92 of the 900 zd, 1,104 of the 10,800
    logement rows.  The other 806 zd name one province and carry no key.  The 2
    zd where two provinces tie (362, 727; 6 households each) are left as they
    are, carry no key, and are served the row the (t, v) collapse selects, so
    they keep the grain report.  The key sits on a zd whose served value was the
    mode anyway (83 of the 92): it describes the construction, not whether it
    moved the value.  9 zd move.
  function: lsms_library.countries.Burkina_Faso.2014._.mapping:derive_zd_modal_province
  inputs: lsms_library.countries.Burkina_Faso.2014._.mapping:inputs_cluster_features
  raw_variables: [zd, menage, region, province, milieu]
  assumptions:
    - text: >-
        A zd lies in one province, so the households of a zd that name several
        are mostly recording one province and miscoding the others.  The survey
        does not say this; it records province per household.  The zd is a frame
        unit, and `region` and `milieu` never vary within one.
      basis: modelling-choice
      evidence: >-
        GH #1060, ruling by @ligon 2026-11-03, option (b).  emc2014_p1_logement_27022015.dta,
        province by zd: 94 of 900 zd vary (86 name two, 8 name three), 1,128
        households, modal share median 0.92 and minimum 0.50, 169 households
        outside the mode.  Against the province-to-region pairing of the EHCVM-1
        cover (s00_me_bfa2018.dta), 90 households in 67 of the 94 zd name a
        province outside their zd's region, and no household anywhere else does;
        every one of the 92 modes, and all four provinces of the 2 ties, lie
        inside the zd's region.
    - text: >-
        A tie is not broken.  Nothing in the source prefers one of two provinces
        named by 6 households each, so no rule is added and the served value stays
        the first household's, chosen by core's most-complete-row selector.
      basis: modelling-choice
      evidence: GH #1060, ruling by @ligon 2026-11-03.
  validated_against: >-
    emc2014_welfare.dta carries the same province for 10,411 of 10,411 matched
    households, so it corroborates the raw variation and cannot adjudicate it.
    No held 2014 file gives a zd's own province.  The region check in the first
    assumption is the only outside evidence, and it can only see across a regional
    boundary: of the 157 households outside the mode in these 92 zd, 90 name a
    province outside the zd's region, and for the other 67 the mode is uncorroborated.
  contents: 'Burkina_Faso/_/CONTENTS.org, "2014 zd modal province (GH #1060)"'
  since: '2026-11-03'

Burkina_Faso::cluster_features::panel-grappe-gps-from-2018-19:
  waves: ['2021-22']
  columns: [Latitude, Longitude]
  rule: >-
    Latitude, Longitude = the 2018-19 cluster fix of the same grappe
    (grappe_gps_bfa2018.dta), on the 2021-22 row of a panel grappe: 516 of the
    550 panel grappes.  NA, with no key, for the 22 panel grappes other than 549
    that have no 2018-19 fix, for grappes 19, 365 and 549 (province changed), for
    grappes 103, 104, 226, 229, 237 and 240 (fix more than 25 km from the grappe's
    own 2021-22 parcels), for grappes 216, 218 and 350 (rounded copies of another
    grappe's reading), and for all 600 cross-section grappes.  The other values are
    carried as recorded.
  function: lsms_library.countries.Burkina_Faso.2021-22._.mapping:derive_panel_grappe_gps
  inputs: lsms_library.countries.Burkina_Faso.2021-22._.mapping:inputs_cluster_features
  raw_variables: [grappe, grappe_EHCVM1, coordonnes_gps__Latitude, coordonnes_gps__Longitude]
  assumptions:
    - text: >-
        The panel component re-interviews EHCVM-1 households inside their EA of
        origin, so a panel grappe is a 2018-19 EA.
      basis: questionnaire
      evidence: >-
        bid_bfa_ehcvm2.pdf p. 4, "Households were tracked within the EA. In other
        words, EHCVM-1 households that have left their EA of origin were not
        surveyed." (a survey document, not the instrument; the closest rung of
        the ladder).  s00_me_bfa2021.dta: grappe == grappe_EHCVM1 for 3,227 of 3,227
        households, in 550 grappes, all among 2018-19's 585; Region agrees on
        550 of 550.
    - text: >-
        Same grappe id means same EA, and the EA's location did not change between
        the waves, so the 2018-19 fix locates the 2021-22 row.  Rural differs on 7
        panel grappes (147, 150, 153, 154, 155, 180, 182), all carried: that is an
        attribute recode, and the rulings exclude on province, on distance from the
        grappe's own parcels and on a copied reading, not on this.
      basis: modelling-choice
      evidence: >-
        GH #1057, ruling by @ligon 2026-11-03, option (b), tightened.
    - text: >-
        Grappes 19, 365 and 549 are NOT carried.  Each names a different province
        in the two waves (Seno/Yagha, Poni/Noumbiel, Kompienga/Gourma), which puts
        the same-EA assumption in doubt for them, and they stay NA.  549 has no
        2018-19 fix, so its exclusion changes nothing served.
      basis: modelling-choice
      evidence: >-
        GH #1057, ruling by @ligon 2026-11-03; GH #1059.  s00_me_bfa2018.dta and
        s00_me_bfa2021.dta, s00q02: every household of each grappe agrees within
        its wave.  365's fix lies 85 km from the median of its own 2021-22 parcel
        coordinates, which supports the exclusion; 19 has no parcel coordinates.
    - text: >-
        Grappes 103, 104, 226, 229, 237 and 240 are NOT carried.  Each one's fix lies
        more than 25 km from the median of its own 2021-22 parcel coordinates, which
        puts the same-location assumption in doubt for them, and they stay NA.  25 km
        is a line drawn in a gap, not a law: 111 and 116 (21.6 and 21.8 km) sit just
        below it and are carried.
      basis: modelling-choice
      evidence: >-
        GH #1057, ruling by @ligon 2026-11-04.  s16a_me_bfa2021.dta, s16aq46__latitude /
        __longitude, median parcel to fix: 103 104.7 km (17 parcels), 104 103.7 (29),
        240 51.4 (26), 237 44.5 (14), 229 29.3 (17), 226 28.8 (15).  The parcels of each
        lie within a few km of their own median.
    - text: >-
        Grappes 216, 218 and 350 are NOT carried.  Each fix is a rounded copy of a
        neighbouring grappe's reading, so it is not a reading of this grappe, and they
        stay NA.  They are withheld in 2018-19 too, under
        Burkina_Faso::cluster_features::copied-grappe-gps-withheld.
      basis: modelling-choice
      evidence: >-
        GH #1057, ruling by @ligon 2026-11-05.  grappe_gps_bfa2018.dta: 216 copies 217, 218
        copies 219, 350 copies 351; same Timestamp and Altitude, and the source's position
        rounds to the copy.  350 lies 6.4 km from its own parcels; 216 and 218 have none.
    - text: >-
        The cross-section (grappes 586-1185) gets no fix.  It is a new draw from
        the 2019 census frame with no 2018-19 antecedent, and its cover's GPS__*
        are household positions (they differ within 578 of its 600 grappes).  A
        centroid of them is declined.
      basis: modelling-choice
      evidence: GH #1057, ruling by @ligon 2026-11-03; GH #1276.
  validated_against: >-
    s16a_me_bfa2021.dta, s16aq46__latitude / __longitude, parcel positions recorded
    in 2021-22 and independent of the fix: on the 270 carried grappes that have one,
    the median parcel position lies a median of 1.6 km from the carried fix (p90
    4.7 km, maximum 21.8 km), against 213 km for a fix paired with another grappe's
    parcels.  The six grappes beyond 25 km are withheld (see the assumptions).  The
    other 246 carried grappes have no parcel coordinate to compare.  The check reads
    the s16a file we hold; the current release of catalog 6224 no longer has these
    columns (CONTENTS.org, "what the World Bank states about 6224's versions"), so it
    can be repeated only on the held file.
  contents: 'Burkina_Faso/_/CONTENTS.org, "2021-22 GPS carried from 2018-19 (GH #1057)"'
  since: '2026-11-03'

# A withheld value has nowhere to carry a Derivation key, so this entry is the only
# place the withholding is disclosed: `rows: 0`, the attrs summary lists the key at 0,
# and `derivation_inputs` returns the file's own rows for the nine.
Burkina_Faso::cluster_features::copied-grappe-gps-withheld:
  waves: ['2018-19']
  columns: [Latitude, Longitude]
  rows: 0
  rule: >-
    Latitude and Longitude are NA on the 2018-19 row of grappes 103, 104, 216, 218, 226,
    237, 240, 350 and 365, whose fix in grappe_gps_bfa2018.dta is not a reading of that
    grappe.  The rows stay, with every other column, and carry no key.  555 fixes in the
    file, 546 served.
  function: lsms_library.countries.Burkina_Faso.2018-19._.mapping:withhold_copied_grappe_gps
  inputs: lsms_library.countries.Burkina_Faso.2018-19._.mapping:inputs_cluster_features
  raw_variables: [grappe, vague, coordonnes_gps__Latitude, coordonnes_gps__Longitude,
                  coordonnes_gps__Accuracy, coordonnes_gps__Altitude, coordonnes_gps__Timestamp]
  assumptions:
    - text: >-
        A fix at one or two decimals that shares its reading with another grappe is a
        copy of that reading, not a reading of its own grappe.  216 copies 217, 218 copies
        219, 226 copies 223, 237 and 240 copy 232, 350 copies 351, 365 copies 369.  The file
        does not say so; its variable label calls each the GPS position of the village or
        quarter.
      basis: modelling-choice
      evidence: >-
        GH #1057, ruling by @ligon 2026-11-05.  grappe_gps_bfa2018.dta: these seven are all
        the fixes at two decimals or fewer, all in vague 2.  Each shares its Timestamp to
        the second and its Altitude with its source, in the same province; its Accuracy
        differs only by rounding, and the source's position rounds to it.  These are also
        the only timestamps the file repeats.
    - text: >-
        103 and 104 hold a point in Kadiogo, not a reading of their grappes in Namentenga.
        They copy no one reading, so this is a separate ground under the same ruling.
      basis: modelling-choice
      evidence: >-
        GH #1057, ruling by @ligon 2026-11-05.  grappe_gps_bfa2018.dta and s00_me_bfa2018.dta:
        the two fixes are 6 m apart, 109 km from Namentenga's median fix and 6 km from
        Kadiogo's, within 30 m of Kadiogo grappes 89 and 136, and all four are stamped
        2019-07-23 within about two hours.  No other fixes of different provinces meet within
        100 m.
  validated_against: >-
    s16a_me_bfa2021.dta, s16aq46__latitude / __longitude, parcel positions recorded in
    2021-22 and independent of the fix, where a withheld grappe has them: 365 85.1 km, 240
    51.4, 237 44.5, 103 104.7, 104 103.7, 226 28.8, 350 6.4, against a median of 1.6 km for
    the carried grappes.  Their sources 232 and 223 are 1.4 and 2.6 km from their own, 351
    2.9.  216 and 218 have no parcel coordinate, so for them the copy pattern is the only
    evidence.  The check reads the s16a file we hold; the current release of catalog 6224
    no longer has these columns.
  contents: 'Burkina_Faso/_/CONTENTS.org, "Copied 2018-19 fixes withheld, in both waves (GH #1057)"'
  since: '2026-11-05'

Burkina_Faso::sample::region-milieu-stratum:
  waves: ['2018-19', '2021-22']
  columns: [strata]
  rows: {}
  rule: >-
    strata = '<s00q01 label> <s00q04 label>', the region and area of residence the
    household cover page records, for example 'Cascades Urbain'.  Labels and never
    codes.  NA where either is missing.  No household file of these waves records a
    stratum.  The region part is then spelled through this country's `strata` table
    in categorical_mapping.org, at read time, which is the `Region` table crossed
    with the two milieu labels.
  function: lsms_library.ehcvm:derive_region_milieu_stratum
  inputs: lsms_library.countries.Burkina_Faso.2018-19._.mapping:inputs_strata
  raw_variables: [s00q01, s00q04]
  assumptions:
    - text: >-
        the strata of the panel design are the 13 regions crossed with the two areas
        of residence.
      basis: questionnaire
      evidence: >-
        bid_bfa_ehcvm2.pdf (held, 2021-22/Documentation), p.4: "The different strata
        result from the combination of the 13 regions with the two areas of residence
        (urban, rural)."  A Basic Information Document, not the instrument.
    - text: >-
        2018-19 has the same 26 strata.  Three documents give three stratifications, and
        only bid_bfa_ehcvm2.pdf, p.4, of the later wave, states 13 x 2.  The French report
        on 2018-19 (ehcvm_2018_rapport_general.pdf, section 1.3.1, printed p.16) says "La
        stratification est faite avant le tirage des unités primaires et basée sur
        l'urbanisation des agglomérations (urbain, rural)", and its Tableaux 1.1 and 1.2
        allocate by region and by milieu separately.  basicinformationdocument_bfa.pdf,
        p.10, says "representative for the strata of Ouagadougou, other urban areas and
        rural areas".  Share of var(log cluster weight) between these 26 cells is 74.0%,
        against 22.7% between urban and rural and 8.2% between regions.  The report plans
        252 urban and 333 rural clusters where the cover has 263 and 322, so the cover
        differs from the plan by 11 clusters on milieu even in the base wave.
      basis: modelling-choice
      evidence: >-
        @ligon's ruling on GH #812, 2026-11-04, resting on the panel BID, the survey's 26
        unit-table codes and the weights.  The memo ruled on said the report gives 26; it
        does not.  Burkina_Faso/_/CONTENTS.org quotes the three documents.
    - text: >-
        the 2021-22 cross-section is stratified the same way.  Catalog 6277 names no
        stratum; 76.1% of var(log cluster weight) lies between these cells.
      basis: modelling-choice
      evidence: Burkina_Faso/_/CONTENTS.org, "strata by wave" (GH #812).
    - text: >-
        the survey's own coding is the same cross.
      basis: variable-label
      evidence: >-
        ehcvm_nsu_bfa2021.dta, a unit table: `strate`, "Code de la strate", labelled
        BOUCLE DU MOUHOUN Urbain and so on; its 26 codes equal 10 x region + milieu of
        ehcvm_welfare_2b_bfa2021.dta.
    - text: >-
        a cluster takes the cover page's label in each wave rather than carrying a
        2018-19 label forward.  Of 3,227 households in both waves 42 (7 clusters)
        change stratum: Plateau-Central Urbain to Rural, Nord Urbain to Rural.
      basis: modelling-choice
      evidence: Burkina_Faso/_/CONTENTS.org, GH #812 ruling option W2, 2026-11-04.
  validated_against: >-
    tests/test_gh812_ehcvm_strata.py, whose oracle reads the covers directly: 26 cells
    in 2018-19 and in each 2021-22 component.  No held table states Burkina's allocation
    by stratum.
  contents: 'Burkina_Faso/_/CONTENTS.org, "EHCVM strata are region x milieu labels (GH #812)"'
  since: '2026-11-04'

Burkina_Faso::food_acquired::nsu-national-unit-weight:
  waves: ['2018-19', '2021-22']
  columns: [Quantity_kg]
  rule: >-
    Quantity_kg = Quantity x kg_factor, per acquisition source, where kg_factor is the
    median over ehcvm_nsu_bfa2021.dta's rows of the row's (product, unit, size), in grams over 1000.
    Unit and size are the row's s07bq03b and s07bq03c codes in both waves.  The product
    is the s07bq01 code in 2021-22, whose numbering the table uses; in 2018-19, whose
    numbering is a different one, it is found by LABEL, never by code (ehcvm.
    nsu_product_crosswalk): the same label up to spelling, else through the country's
    harmonize_food, else the parts of a label listing goods the instrument later split,
    else the label's stem.  A product reading several table products takes the median of
    their weights.  Each row's tier is nsu_join in derivation_inputs.  NA, with no key,
    where no weight is found; where the served unit is Kg or Litre, whose kilograms the
    label states; and where the row's canonical key is duplicated at the build, because
    core sums Quantity on such a key and selects any other column.  Those rows stay on the
    inferred ladder.  No Quantity or u changes.
  function: lsms_library.ehcvm:derive_nsu_kg_factor
  inputs: lsms_library.countries.Burkina_Faso.2021-22._.mapping:inputs_food_acquired_unit_weight
  raw_variables: [s07bq01, s07bq03a, s07bq03b, s07bq03c, s07bq04, s07bq05, strate, codpr, uniteID, tailleID, poids_moyen, poids_median]
  assumptions:
    - text: >-
        a key's weight in the table is the weight of that unit of that product in
        that size, for any row of the wave.  The survey ships the table; the served
        row's own quantity is untouched.
      basis: variable-label
      evidence: >-
        ehcvm_nsu_bfa2021.dta, read by code; unit and size codes agree with s07b_me's on
        every code both files label, up to spelling.
    - text: >-
        national, not by stratum.  Against an independent implied weight, a household's
        last-purchase unit value over the same stratum's median Kg price with 5+ reports each,
        the national weight's median absolute log error is 0.27 against the stratum cell's 0.44,
        within 2x 82.1% against 68.7%; row by row 0.45 against 0.46, within 2x 76.9% against
        67.7%.  The slope of the household's deviation on the stratum's is -0.11, or -0.14 with
        key effects.  74.7% of consumed rows find a stratum cell, 89.7% a national weight;
        stratum weights would add 4.3% to the kilograms on rows both serve.  7,052 of 68,677
        consumed rows find none, among them every Choux row (1,337; the product is not in the
        table) and every Carreau row (140; nor the unit).
      basis: modelling-choice
      evidence: >-
        GH #1452, 2026-11-04.  The check is noisy: a small lot's price per kg runs
        above a kilogram's, so the implied weight runs high, and it compares the
        two rules, not either with the truth.
    - text: >-
        poids_moyen, not poids_median: the two labels are swapped in the file.  A
        median of gram weighings is an integer or a half.  Where poids_sd > 0,
        poids_moyen is one on 98.4% of 15,843 rows and poids_median on 39.5%, and
        poids_moyen reads exactly 1000 on 94.8% of Kg cells against 79.5%.  So the
        column read is the file's median, under the label "moyen".
      basis: modelling-choice
      evidence: >-
        ehcvm_nsu_bfa2021.dta, variable labels "Poids moyen ..." / "Poids median ...";
        tests/test_ehcvm_unit_weights.py.
    - text: >-
        2018-19 reads the same weight per key as 2021-22, with the product found by label.
        Of 2018-19's consumed rows 91,752 join on the label, 10,267 through harmonize_food
        and 4,780 as the parts of a bundle; 90.7% of non-metric served rows read a weight.
      basis: modelling-choice
      evidence: >-
        Ruling @ligon 2026-11-04.  Matched items, 2021-22 over 2018-19, median / row-weighted:
        Kg rows 1.10 / 1.15, inference 1.05 / 1.16, both waves on the table 1.06 / 1.14.
    - text: >-
        Kg and Litre keep their labels.  Their table rows are not read: a kilogram is
        a kilogram, and a table litre is not a density (in these tables most oils
        read exactly 1000 g).
      basis: modelling-choice
      evidence: GH #1452, 2026-11-04.  Those rows are the check on the join instead.
  validated_against: >-
    the rows whose label states the mass, which the table was not fitted to: the
    national weight of a Kg row is 1000 g at the median, and the delivered factor
    reproduces the table read directly from the two files
    (tests/test_ehcvm_unit_weights.py).  No ehcvm_prix file is held for this wave, so no market file checks
    this table.  Table against 2018-19 community price ratios: 0.182 / 96.5%.
    Measured kilograms are in Burkina_Faso/_/CONTENTS.org.
  contents: 'Burkina_Faso/_/CONTENTS.org, "EHCVM unit-weight table wired (GH #1452)"'
  since: '2026-11-04'

Burkina_Faso::crop_production::hh-crop-sale-single-row:
  waves: ['2021-22']
  columns: [Quantity_sold, Unit_sold, Value_sold, Condition_sold, condition_sold_native]
  rule: >-
    s16d records a sale for the household and crop, with no plot.  A sale is a record
    with a positive s16dq05a or s16dq06: 1,548 of the file's crop records.  Where the
    household has exactly one s16c line of the same crop CODE (s16cq04 = s16dq01), the
    sale is served on that line: Quantity_sold = s16dq05a, Unit_sold = s16dq05b on the
    served unit labels, Value_sold = s16dq06, Condition_sold and condition_sold_native =
    s16dq05d (GH #1528's fold), as recorded, and that row carries this key.  What is
    derived is the ATTACHMENT, not the numbers.  Any other sale is served on one row of
    that household and crop with plot_id = 'Farm-level' and no key, because its index
    value already discloses it.  No sale is split, summed, scaled or dropped.  This key
    shares a row with other keys through derivations.MULTI_SEP, in sorted order.
  function: lsms_library.ehcvm:derive_hh_crop_sale_attachment
  inputs: lsms_library.countries.Burkina_Faso.2021-22._.mapping:inputs_hh_crop_sale
  raw_variables: [s16cq02, s16cq03, s16cq04, s16dq01, s16dq04, s16dq05a, s16dq05b, s16dq05d,
                  s16dq06]
  assumptions:
    - text: >-
        s16d asks the sale once per crop, with no plot, and s16c records no sale.  Where
        the household has one harvest line of the crop, no other line can hold the sale.
        The sale is NOT thereby a share of that line's Quantity, and it may be in another
        unit: Unit_sold says which.
      basis: variable-label
      evidence: >-
        s16d_me_bfa2021.dta has no field or parcel variable; s16dq05a "16D.05a. Quelle est
        la quantite de ce produit qui a deja ete vendue", s16dq06 "16D.06. Quel a ete le
        montant tire de la vente de ce produit".  s16c_me_bfa2021.dta carries s16cq02 and
        s16cq03 and no sale variable.
    - text: >-
        a sale of a crop on two or more lines is not allocated among them, since any split
        would be invented.  It stays with the household and crop on a Farm-level row,
        with u = 'Unknown', where gross_crop_revenue and median_price_valuation can read
        it.  That row has no harvest Quantity unless its dispositions supply one.
      basis: modelling-choice
      evidence: >-
        ruling @ligon 2026-11-03, option (d), GH #824, for Mali 2021-22 (the #843 option-d
        rule).  Its application to Burkina 2021-22 comes from the brief of the 2026-11-13
        batch (GH #1436, second residual), not a ruling that names this country: flagged
        for the maintainer's confirmation.  The Farm-level convention in
        lsms_library/data_info.yml.
    - text: >-
        a sale and a harvest line are the same crop when they carry the same code.  The two
        files label one crop list with two different value-label sets, so a match by label
        would send 332 of the 1,548 sales to Farm-level for want of a line; by code every
        sale has at least one line.
      basis: derived-from-data
      evidence: >-
        s16cq04 "Id in cultures" and s16dq01 "Id in culture_utilisation_annuel" name two
        rosters, so their labels do not establish the link; the data do.  Measured
        2026-11-13 on the held files: all 6,603 s16d crop records have an s16c line of the
        same code in the same household (5,080 by label); the 23 s16d code-55 records all
        sit in households with s16c code-55 lines and none with code 65; the 24 code-65
        records all sit with 65.  1,331 sales on one line, 156 on two, 61 on three or more,
        0 on none.
  validated_against: >-
    tests/test_burkina_faso_2021_crop_production.py, whose oracle reads s16c and s16d
    directly.  Not validated against an external total: no document here reports one.
  contents: 'Burkina_Faso/_/CONTENTS.org, "2021-22 crop_production: the panel s16c and s16d sales"'
  since: '2026-11-13'

Burkina_Faso::crop_production::harvest-to-date:
  waves: ['2021-22']
  columns: [Quantity]
  rule: >-
    Identity on a row whose harvest is not finished and which records a quantity: s16cq11
    = Non with s16cq16a.  The value is served as recorded.  The key names its WINDOW: the
    question asks the quantity ALREADY harvested, so the row covers a part of the season
    under a column that otherwise means all of it.  A row with no recorded quantity
    carries no key.  In this wave every recorded quantity is on such a row (179 of the
    813 unfinished rows; 0 of the 7,663 finished rows records one, GH #1437), so every
    recorded 2021-22 harvest is PARTIAL, and harvest_kg / yield_kg on these rows are a
    partial harvest over the whole plot's area, not a yield.
  function: lsms_library.ehcvm:derive_harvest_to_date
  inputs: lsms_library.countries.Burkina_Faso.2021-22._.mapping:inputs_harvest_to_date
  raw_variables: [s16cq11, s16cq12, s16cq16a, s16cq16b]
  assumptions:
    - text: >-
        the recorded quantity on an unfinished row is what has been harvested so far, and
        not the season.  On the 179 rows, s16cq12 says a median 50% of the plot is still to
        harvest (interquartile range 15-70).
      basis: variable-label
      evidence: >-
        s16c_me_bfa2021.dta s16cq16a "16C.16a. Quelle est la quantite deja recoltee pour la
        presente campagne", s16cq11 "16C.11. Avez vous fini la recolte de cette culture",
        s16cq12 "16C.12. Quel pourcentage de la superficie vous reste-t-il a recolter"
        (measured 2026-11-13).
  validated_against: >-
    tests/test_burkina_faso_2021_crop_production.py, whose oracle reads s16c directly.  An
    identity has nothing to validate but its rows.
  contents: 'Burkina_Faso/_/CONTENTS.org, "2021-22 crop_production: the panel s16c and s16d sales"'
  since: '2026-11-13'

Burkina_Faso::crop_production::harvest-from-dispositions:
  waves: ['2021-22']
  columns: [Quantity, u]
  rule: >-
    Where every s16c row of a household's crop answers s16cq11 = Oui, none records
    s16cq16a, and the positive s16d quantities s16dq02a (consumed), s16dq03a (given),
    s16dq05a (sold) and s16dq13a (in stock) all state one unit (one code of the UML list,
    on its served label), Quantity is their sum and u that unit.  It goes on the crop's
    single s16c row, or for two or more rows on the crop's one plot_id = 'Farm-level' row,
    created if no sale made it, and is never split among plots.  A crop whose dispositions
    span units, a crop with none, a crop with a recorded quantity and a crop with an
    unfinished row all stay as recorded.  It extends Mali's ruled derivation,
    Mali::crop_production::harvest-from-dispositions, to this wave (ruling @ligon
    2026-11-13, "Extend Mali's rule"), through the same shared function as Benin and Cote
    d'Ivoire; GH #1437 stays open.
  function: lsms_library.ehcvm:derive_hh_crop_harvest_total
  inputs: lsms_library.countries.Burkina_Faso.2021-22._.mapping:inputs_harvest_from_dispositions
  raw_variables: [s16cq04, s16cq11, s16cq16a, s16dq01, s16dq02a, s16dq02b, s16dq03a, s16dq03b,
                  s16dq05a, s16dq05b, s16dq13a, s16dq13b]
  assumptions:
    - text: >-
        this extends Mali's ruled derivation to Burkina 2021-22, whose file has Mali's shape:
        s16cq16a is on 179 of 8,476 crop rows and 0 of the 7,663 finished ones.  Why s16cq16a
        is blank is not answered by it: GH #1437 stays open.
      basis: modelling-choice
      evidence: >-
        ruling @ligon 2026-11-13, "Wave-1 stream rulings after red team", "Burkina 2021-22
        harvest: Extend Mali's rule (Recommended)"; Mali/_/derivations.yml; GH #1437 (open)
    - text: >-
        a finished harvest was consumed, given, sold or stored, so the four dispositions add
        up to it.  The instrument asks the quantity of a finished harvest and the file lacks
        it on every finished row, a fielded skip or a release loss.
      basis: questionnaire
      evidence: >-
        bfa_ehcvm2_vague1.pdf / vague2.pdf, PDF p. 85: "(16C.11) 1 = Oui > (16C.16)" (the
        2026-11-09 CONTENTS entry).  This wave cannot test the sum: no finished row records a
        harvest.  Burkina 2018-19 holds the harvest and all four dispositions on one row
        (s16cq12a; s16cq13a consumed, s16cq14a given, s16cq16a sold, s16cq22a stock): on the
        12,490 of 14,956 finished rows whose every positive disposition is in the harvest's
        unit, the sum equals the harvest exactly on 87.9%, within 10% on 90.5%, median ratio
        1.000, 5.1% over 1.1 and 4.2% under 0.9 (measured 2026-11-13).  This is consistency
        within a row, and a respondent may anchor on the harvest just stated.
    - text: >-
        not all of a harvest need appear: s16d asks no quantity for seed kept, loss after
        harvest or animal feed, so the sum can fall short of what was cut.  Not sized.
      basis: modelling-choice
      evidence: s16d_me_bfa2021.dta variable labels
    - text: >-
        units are not converted: no factor exists.  Of the 6,397 household-crops finished on
        every line with no recorded quantity, 3,958 state their dispositions in one unit and
        are derived (3,421 on the single line, 537 Farm-level), 2,272 span units and stay NA,
        and 167 record no disposition.  Quantities in one unit are added across states
        (s16dq02c, s16dq03c, s16dq05d, s16dq13c), and the derived row is served under
        `unknown_condition`.
      basis: modelling-choice
      evidence: >-
        ruling @ligon 2026-11-04, option (b) of GH #1437, for Mali; measured 2026-11-13, by
        code, on the held s16c and s16d.
    - text: >-
        a crop with an unfinished row is held out (739 pairs), because its dispositions
        cover what is harvested so far.  A crop with a recorded quantity is held out,
        because a recorded harvest is not overridden and a Farm-level total beside it would
        count it twice.
      basis: modelling-choice
      evidence: GH #1437
  validated_against: >-
    tests/test_burkina_faso_2021_crop_production.py, whose oracle reads s16c and s16d
    directly.  Not validated against an external total: no document here reports one.
  contents: 'Burkina_Faso/_/CONTENTS.org, "2021-22 crop_production: the panel s16c and s16d sales"'
  since: '2026-11-13'

Burkina_Faso::crop_production::crop-code-from-roster-text:
  waves: ['2021-22']
  columns: [crop]
  rule: >-
    The served crop of codes 55, 58 and 64 is the label the file's own roster text gives
    them: 55 Anacarde, 58 Banane douce, 64 Soja, where s16c's value labels say 55 'Autre
    (a preciser)' and leave 58 and 64 bare, and s16d leaves all three bare.  Every s16c
    line and every Farm-level row of those codes carries this key.  Every other code
    keeps the harvest file's own label (mapping.derive_crop_code_label).
  function: lsms_library.countries.Burkina_Faso.2021-22._.mapping:derive_crop_code_label
  inputs: lsms_library.countries.Burkina_Faso.2021-22._.mapping:inputs_crop_code_from_text
  raw_variables: [s16cq04, s16cq03b, s16cq03_autre, s16dq01]
  assumptions:
    - text: >-
        the codes are those of the 2021-22 EHCVM-2 list that runs to 65, not of the list
        whose value labels s16c carries, which ends at 55 'Autre': codes 58, 64 and 65 occur
        in the file, which that list does not have, and 65 is the 'Autre' code (s16d labels
        it so, and its Precisez is filled on 38 of 38 lines against 0 of 59 code-55 lines).
      basis: derived-from-data
      evidence: >-
        s16c_me_bfa2021.dta, measured 2026-11-13.  The list to 65 is the one Mali, Togo,
        Benin, Senegal and Guinea-Bissau 2021-22 label (55 Anacarde / Caju, 58 Banane douce,
        64 Soja, 65 Autre); the list to 55 is Burkina 2018-19's and Niger's and Cote
        d'Ivoire's 2021-22.
    - text: >-
        the roster text names the crop.  s16cq03b ("Roster list question", the enumerator's
        name for the line) names anacarde or cajou on 54 of the 59 code-55 lines, banane on
        5 of 5 code-58 lines and soja or soya on 88 of 92 code-64 lines.  The code-55
        households are in Cascades 26, Hauts-Bassins 17, Sud-Ouest 12 and Centre-Ouest 2,
        the cashew belt.
      basis: derived-from-data
      evidence: >-
        s16c_me_bfa2021.dta s16cq03b, s16cq03_autre; s00_me_bfa2021.dta s00q01 (measured
        2026-11-13, pattern counts only; the red team's count of 48 of 59 used a narrower
        pattern).  Ruling default (coordinator, 2026-11-13): "Burkina code 55/58/64
        labelled from the file's own free text (basis derived-from-data)".
  validated_against: >-
    tests/test_burkina_faso_2021_crop_production.py.  The 2018-19 code list ends at 55, so no
    other Burkina wave can check these codes.
  contents: 'Burkina_Faso/_/CONTENTS.org, "2021-22 crop_production: the panel s16c and s16d sales"'
  since: '2026-11-13'
