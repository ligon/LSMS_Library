# Derivations -- served numbers in this country's tables that are NOT survey
# answers but CONSTRUCTIONS from raw answers.  One entry per registry key,
# `country::table::name`; the same key sits in the served table's
# `Derivation` column on every row it produced.  Loader and field contract:
# lsms_library/derivations.py.  Design: SkunkWorks/derived_values.org.
#
# Sibling of population.yml and recall.yml: a .yml here moves no cache hash.

Burkina_Faso::food_acquired::7day-purchase-at-last-purchase-unit-value:
  waves: ['2018-19', '2021-22']
  columns: [Expenditure]
  rows: {s: purchased}
  rule: >-
    Expenditure = Quantity * (s07bq08 / s07bq07a), where Quantity is the row's
    own served purchased quantity, (s07bq03a - s07bq04 - s07bq05).clip(lower=0)
    -- the 7-day consumption net of own production AND of gifts received, which
    is the survey's own accounting identity -- and s07bq08 / s07bq07a is the
    unit value of the household's LAST PURCHASE of the item.  NaN where
    s07bq07a is missing or not positive, and NaN where the last purchase was
    made in a different unit from the consumption unit (s07bq07b/s07bq07c vs
    s07bq03b/s07bq03c): no EHCVM wave ships a unit-conversion table, so there
    is no exact conversion and NA is the honest answer.  Units are compared on
    the EHCVM numeric code where the label carries one, else on the label with
    case, accents, padding and punctuation folded -- the two variables carry
    DIFFERENT value-label sets inside the same .dta.  Before GH #876 the served
    Expenditure was s07bq08 itself: the value of one purchase of unrecorded
    size made up to 30 days earlier, beside a 7-day quantity.
  function: lsms_library.ehcvm:derive_ehcvm_purchase_value
  inputs: lsms_library.countries.Burkina_Faso.2018-19._.mapping:inputs_food_acquired
  raw_variables: [s07bq03a, s07bq03b, s07bq03c, s07bq04, s07bq05, s07bq07a,
                  s07bq07b, s07bq07c, s07bq08]
  assumptions:
    - text: >-
        the unit value of the last purchase is the price the household paid
        over the 7-day consumption window.  s07bq08 is the value of ONE
        purchase, which s07bq06 places up to 30 days back, while s07bq03a is
        the quantity consumed over 7 days -- one row, two clocks.
      basis: variable-label
      evidence: >-
        Stata labels in s07b_me_bfa2018.dta, s07b_me_bfa2021.dta: s07bq08 "7B.08. Valeur (en FCFA) du [PRODUIT]
        achete la derniere fois"; s07bq03a "7B.03a. Qtite tot du [PRODUIT]
        conso par le MEN au cours des 7 derniers jours"; s07bq07a "7B.07a.
        Quelle est la quantite du [PRODUIT] achete la derniere fois?"
    - text: >-
        a last purchase reported in a different unit from the consumption is
        NOT converted, and a row with no last purchase has no unit value to
        apply: the row is served with Expenditure NA. Counts are on the SERVED
        denominator -- purchased rows of the delivered table, after the
        canonical reshape and the (t, v, i, j, u, s) collapse -- because that
        is the number a user sees; the source-row counts are smaller and were
        what an earlier version of this entry quoted. 2018-19: 13,850 of the
        105,796 SERVED purchased rows (13.1%) -- 10,009 because no last
        purchase was reported at all (s07bq08 or s07bq07a missing / not
        positive), 1,684 because the last purchase used a different unit CODE,
        2,157 because it used the same code in a different SIZE (Petit / Moyen
        / Grand / Taille unique), which is a different container and so a
        different price per unit. 2021-22: 7,065 of the 52,820 SERVED
        purchased rows (13.4%) -- 4,859 because no last purchase was reported
        at all (s07bq08 or s07bq07a missing / not positive), 1,708 because the
        last purchase used a different unit CODE, 498 because it used the same
        code in a different SIZE (Petit / Moyen / Grand / Taille unique),
        which is a different container and so a different price per unit.
      basis: variable-label
      evidence: >-
        no EHCVM wave distributes a unit-conversion table;
        lsms_library/categorical_mapping/ehcvm_units.org is a code->label
        codebook with no factors
    - text: >-
        the quantity multiplied is the SURVEY'S OWN accounting identity,
        (s07bq03a - s07bq04 - s07bq05).clip(0) -- construction "C", chosen by
        @ligon on 2026-09-12 because it is the only one of the three candidates
        ehcvm_conso reproduces.  The alternatives, measured, are A = the gross
        7-day consumption s07bq03a (which would put the value of own-produced
        and gifted food into Expenditure) and B = net of own production only.
        2018-19: A 54,075,976, B 53,497,881, C (served) 52,466,280 FCFA, against a raw s07bq08 total of 65,315,308.  2021-22: A 29,381,603, B 29,220,369, C (served) 27,888,221 FCFA, against a raw s07bq08 total of 39,905,158.
      basis: modelling-choice
      evidence: SkunkWorks/derived_values.org; GH #876; measured 2026-09-12
    - text: >-
        the gift quantity s07bq05 is served as its own s = 'inkind' row, in the
        consumption unit s07bq03b, with Expenditure NA.  EHCVM asks no value for
        a gift.  UEMOA's depan(Don) is s07bq05 priced at this same last-purchase
        unit value -- verified, and therefore demonstrably an imputation by the
        people who built the aggregate rather than an answer anybody gave -- so
        it is checked and not served.  Own production keeps the identical
        treatment it already had (s = 'produced' from s07bq04, Expenditure NA).
        2018-19: 9,386 inkind rows carrying 31,929 units, 0 with an Expenditure.  2021-22: 6,148 inkind rows carrying 24,918 units, 0 with an Expenditure.
      basis: modelling-choice
      evidence: SkunkWorks/derived_values.org; GH #876; measured 2026-09-12
  validated_against: >-
    the product-level check against ehcvm_conso does not run for this wave: its
    conso codpr does not share a keyspace with s07bq01 here, and CotedIvoire
    2018-19 distributes no conso file at all.  The construction is validated on
    the two waves where the join works -- Togo 2018 and Guinea-Bissau 2018-19 --
    in which it reproduces depan(Achat) within 1% for 99.5% / 100% of the rows
    where the candidates differ, against 13.1% / 48.6% for the
    own-production-only residual and 0.0% / 0.0% for the gross 7-day quantity;
    s07bq05 * uv reproduces depan(Don) for 99.7% / 100%, which is why the gift
    rows are served with Expenditure NA rather than with that imputation.  The
    instrument is the same in all twelve waves (identical s07bq0* Stata
    labels), so the reading carries by inference, not by measurement here.
  contents: 'Burkina_Faso/_/CONTENTS.org, "food_acquired: one row, two windows (GH #876)"'
  since: '2026-09-12'

Burkina_Faso::community_prices::quoted-native-unit-count:
  waves: ['2018-19']
  columns: [Quantity]
  rule: >-
    Quantity=1 counts one QUOTED native unit-size u per reported FCFA price.
    It is not a reported physical quantity, kg weight or unit-conversion
    factor. The source records no quantity. Price is served unchanged in
    both slots; complete product+unit codes remain in the constructed variety
    coordinate. Raw inputs expose the original seven fields without Quantity.
  function: lsms_library.countries.Burkina_Faso.2018-19._.mapping:derive_quoted_native_unit_count
  inputs: lsms_library.countries.Burkina_Faso.2018-19._.mapping:inputs_community_prices
  raw_variables: [grappe, vague, Existe, s05q01, s05q02, s05q03, s05q04]
  assumptions:
    - text: >-
        The own Burkina PRICE CAPI form selects up to six unit-sizes per
        product and generates two integer FCFA price questions5.03/5.04
        per selected unit-size, with positive/multiple5 validators and no
        quantity entry. This is a different instrument from the FOCUS
        workbook, which shows three quantity/price pairs.
      basis: questionnaire
      evidence: >-
        UEMOA catalogue43, Qx_EHCVM_PRIX_BF and Qx_EHCVM_PRIX_BF_V2,
        https://phmecv.uemoa.int/nada/index.php/catalog/43/download/104
        (v1p10) and /download/105 (v2p9). Authenticated PDF SHA256
        d6eb8a277defdae6c775cadef99dc594d0216baa4c185a420c7a2b1c30172f41
        and78195ddbc9c7b01ec660e5d4acf8f9249c4ec32f276068a8d31a1889ef7dc30d.
    - text: >-
        Interpret the selected-unit quote as the price of one native u,
        following the explicit Niger one-item-per-price precedent and
        GH1226 direction. The count is constructed, not an observed answer;
        a sack or Demi remains one quoted sack or half, never inferred kg.
        No price rounding, positivity filtering or missing-value filling
        follows from the form validators.
      basis: modelling-choice
      evidence: >-
        Shared community_prices Price-one-u contract; Niger derivation
        one-item-per-price; own Burkina PRICE instrument above; GH #1226
        source/instrument review (2026-10-30).
  validated_against: >-
    Instrument and modelling contract only. No reported quantity exists
    against which the derived count can be numerically validated. Native,
    API and fresh-process warm validation on authenticated closed source
    operands pass at c8f8bcc976 (138,534 rows). This is saved-source reuse,
    not a fresh raw decoder/source read or standalone Make/compiler claim.
    Direct native-to-storage strict transport remains failed: visit index
    nullable Int64 becomes NumPy int64; matching-storage scientific proof
    passes without normalizing actual frames.
  contents: 'Burkina_Faso/_/CONTENTS.org, GH1226 PRICE instrument'
  since: '2026-10-30'

Burkina_Faso::cluster_features::zd-modal-province:
  waves: ['2014']
  columns: [District]
  rule: >-
    District = the most common `province` among the zd's households, on every
    row of a zd whose households name more than one province and where one of
    them is strictly the most common: 92 of the 900 zd, 1,104 of the 10,800
    logement rows.  The other 806 zd name one province and carry no key.  The 2
    zd where two provinces tie (362, 727; 6 households each) are left as they
    are, carry no key, and are served the row the (t, v) collapse selects, so
    they keep the grain report.  The key sits on a zd whose served value was the
    mode anyway (83 of the 92): it describes the construction, not whether it
    moved the value.  9 zd move.
  function: lsms_library.countries.Burkina_Faso.2014._.mapping:derive_zd_modal_province
  inputs: lsms_library.countries.Burkina_Faso.2014._.mapping:inputs_cluster_features
  raw_variables: [zd, menage, region, province, milieu]
  assumptions:
    - text: >-
        A zd lies in one province, so the households of a zd that name several
        are mostly recording one province and miscoding the others.  The survey
        does not say this; it records province per household.  The zd is a frame
        unit, and `region` and `milieu` never vary within one.
      basis: modelling-choice
      evidence: >-
        GH #1060, ruling by @ligon 2026-11-03, option (b).  emc2014_p1_logement_27022015.dta,
        province by zd: 94 of 900 zd vary (86 name two, 8 name three), 1,128
        households, modal share median 0.92 and minimum 0.50, 169 households
        outside the mode.  Against the province-to-region pairing of the EHCVM-1
        cover (s00_me_bfa2018.dta), 90 households in 67 of the 94 zd name a
        province outside their zd's region, and no household anywhere else does;
        every one of the 92 modes, and all four provinces of the 2 ties, lie
        inside the zd's region.
    - text: >-
        A tie is not broken.  Nothing in the source prefers one of two provinces
        named by 6 households each, so no rule is added and the served value stays
        the first household's, chosen by core's most-complete-row selector.
      basis: modelling-choice
      evidence: GH #1060, ruling by @ligon 2026-11-03.
  validated_against: >-
    emc2014_welfare.dta carries the same province for 10,411 of 10,411 matched
    households, so it corroborates the raw variation and cannot adjudicate it.
    No held 2014 file gives a zd's own province.  The region check in the first
    assumption is the only outside evidence, and it can only see across a regional
    boundary: of the 157 households outside the mode in these 92 zd, 90 name a
    province outside the zd's region, and for the other 67 the mode is uncorroborated.
  contents: 'Burkina_Faso/_/CONTENTS.org, "2014 zd modal province (GH #1060)"'
  since: '2026-11-03'

Burkina_Faso::cluster_features::panel-grappe-gps-from-2018-19:
  waves: ['2021-22']
  columns: [Latitude, Longitude]
  rule: >-
    Latitude, Longitude = the 2018-19 cluster fix of the same grappe
    (grappe_gps_bfa2018.dta), on the 2021-22 row of a panel grappe: 519 of the
    550 panel grappes.  NA, with no key, for the 22 panel grappes other than 549
    that have no 2018-19 fix, for grappes 19, 365 and 549 (province changed), for
    grappes 103, 104, 226, 229, 237 and 240 (fix more than 25 km from the grappe's
    own 2021-22 parcels), and for all 600 cross-section grappes.  The other values
    are carried as recorded.  Three of them, 216, 218 and 350, are not readings of
    their own grappe but rounded copies of a neighbouring grappe's reading
    (CONTENTS.org, "Six carried GPS fixes withheld").
  function: lsms_library.countries.Burkina_Faso.2021-22._.mapping:derive_panel_grappe_gps
  inputs: lsms_library.countries.Burkina_Faso.2021-22._.mapping:inputs_cluster_features
  raw_variables: [grappe, grappe_EHCVM1, coordonnes_gps__Latitude, coordonnes_gps__Longitude]
  assumptions:
    - text: >-
        The panel component re-interviews EHCVM-1 households inside their EA of
        origin, so a panel grappe is a 2018-19 EA.
      basis: questionnaire
      evidence: >-
        bid_bfa_ehcvm2.pdf p. 4, "Households were tracked within the EA. In other
        words, EHCVM-1 households that have left their EA of origin were not
        surveyed." (a survey document, not the instrument; the closest rung of
        the ladder).  s00_me_bfa2021.dta: grappe == grappe_EHCVM1 for 3,227 of 3,227
        households, in 550 grappes, all among 2018-19's 585; Region agrees on
        550 of 550.
    - text: >-
        Same grappe id means same EA, and the EA's location did not change between
        the waves, so the 2018-19 fix locates the 2021-22 row.  Rural differs on 7
        panel grappes (147, 150, 153, 154, 155, 180, 182), all carried: that is an
        attribute recode, and the rulings exclude on province and on distance from the
        grappe's own parcels, not on this.
      basis: modelling-choice
      evidence: >-
        GH #1057, ruling by @ligon 2026-11-03, option (b), tightened.
    - text: >-
        Grappes 19, 365 and 549 are NOT carried.  Each names a different province
        in the two waves (Seno/Yagha, Poni/Noumbiel, Kompienga/Gourma), which puts
        the same-EA assumption in doubt for them, and they stay NA.  549 has no
        2018-19 fix, so its exclusion changes nothing served.
      basis: modelling-choice
      evidence: >-
        GH #1057, ruling by @ligon 2026-11-03; GH #1059.  s00_me_bfa2018.dta and
        s00_me_bfa2021.dta, s00q02: every household of each grappe agrees within
        its wave.  365's fix lies 85 km from the median of its own 2021-22 parcel
        coordinates, which supports the exclusion; 19 has no parcel coordinates.
    - text: >-
        Grappes 103, 104, 226, 229, 237 and 240 are NOT carried.  Each one's fix lies
        more than 25 km from the median of its own 2021-22 parcel coordinates, which
        puts the same-location assumption in doubt for them, and they stay NA.  25 km
        is a line drawn in a gap, not a law: 111 and 116 (21.6 and 21.8 km) sit just
        below it and are carried.
      basis: modelling-choice
      evidence: >-
        GH #1057, ruling by @ligon 2026-11-04.  s16a_me_bfa2021.dta, s16aq46__latitude /
        __longitude, median parcel to fix: 103 104.7 km (17 parcels), 104 103.7 (29),
        240 51.4 (26), 237 44.5 (14), 229 29.3 (17), 226 28.8 (15).  The parcels of each
        lie within a few km of their own median.
    - text: >-
        The cross-section (grappes 586-1185) gets no fix.  It is a new draw from
        the 2019 census frame with no 2018-19 antecedent, and its cover's GPS__*
        are household positions (they differ within 578 of its 600 grappes).  A
        centroid of them is declined.
      basis: modelling-choice
      evidence: GH #1057, ruling by @ligon 2026-11-03; GH #1276.
  validated_against: >-
    s16a_me_bfa2021.dta, s16aq46__latitude / __longitude, parcel positions recorded
    in 2021-22 and independent of the fix: on the 271 carried grappes that have one,
    the median parcel position lies a median of 1.6 km from the carried fix (p90
    4.9 km, maximum 21.8 km), against 213 km for a fix paired with another grappe's
    parcels.  The six grappes beyond 25 km are withheld (see the assumptions).  The
    other 248 carried grappes have no parcel coordinate to compare.  The check reads
    the s16a file we hold; the current release of catalog 6224 no longer has these
    columns (CONTENTS.org, "what the World Bank states about 6224's versions"), so it
    can be repeated only on the held file.
  contents: 'Burkina_Faso/_/CONTENTS.org, "2021-22 GPS carried from 2018-19 (GH #1057)"'
  since: '2026-11-03'
