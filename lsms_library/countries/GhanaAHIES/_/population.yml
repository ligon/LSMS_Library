# Population record -- what this survey's documentation says the sample
# represents.  One entry per wave, keyed by the API wave label (the value that
# appears in the `t` index level, i.e. an element of `Country(...).waves`).
#
# GENERATED by scripts/promote_population_records.py from
# slurm_logs/POPULATION_STATEMENTS_2026-07-21.org.  Edit the source document and
# re-run rather than editing this file by hand; every quoted block below is a
# verbatim transcription of survey documentation, sic spellings included.
#
#   THE TAG IS AN EDITORIAL READING.  IT IS NOT A QUOTE, AND NO DOCUMENT USES IT.
#
# `universe_tag` therefore never travels alone.  `source_type` says where the
# statement was found and `confidence` says how strongly it is a universe
# statement at all -- `medium` = "a coverage or representativeness claim, not a
# universe declaration"; `low` = "this is sample-design text and should not be
# laundered into a universe".  A reader who quotes the tag without those two has
# turned an editorial reading into a fact.
#
# `status: inert` marks a row the sweep recorded for a wave the library cannot
# currently build (no `_/data_scheme.yml`, or a duplicate staging directory).
# It is kept so the record is not lost, and is never returned by the loader.

Population:
  '2022Q1':
    universe_tag: national-all-households
    source_type: local-documentation
    confidence: high
    documented_as: '2022'
    survey: 'Annual Household Income and Expenditure Survey (AHIES) 2022, Ghana Statistical Service; study id DDI-GHA-GSS-AHIES-2022Q1-2022Q3-v1.0 (GSS NADA catalog entry 119; superseded for data by entry 128)'
    language: 'English'
    source_file: 'lsms_library/countries/GhanaAHIES/2022/Documentation/AHIES2022_Documentationq1q2q3_20230504.pdf'
    locator: 'p. 4, "Scope & Coverage" > "Universe"; sampling sentence at p. 5, "Sampling" > "Sampling Procedure".  The 2022-2024 study documentation (2024/Documentation/2022-2024_AHIES_Q1-Q4_Sec1-7.pdf, p. 4) carries the identical sentence.'
    population_statement: |-
      The universe covers the population living within individual households in Ghana. However, such population which is defined as institutionalised population as persons living at elderly houses, rest homes, correction facilities, military baracks, and hospitals with special characteristics, nursery,and also nomadic population are excluded.
    exclusions: |-
      From the same UNIVERSE field: "However, such population which is defined as institutionalised population as persons living at elderly houses, rest homes, correction facilities, military baracks, and hospitals with special characteristics, nursery,and also nomadic population are excluded" (sic: "baracks", "nursery,and").
    translation: |-
      n/a -- the quoted documentation is already in English.
    notes: |-
      GhanaAHIES is a quarterly household PANEL (10,800 households in 600 EAs drawn from the 2021 PHC frame; 18 per EA; 304 urban / 296 rural EAs, per the study documentation's Sampling Procedure), interviewed every quarter from 2022Q1 to 2024Q4.  The repository's wave DIRECTORIES are calendar years and its API wave labels are quarters (YYYYQn, via wave_folder_map), so this one row expands to four config entries.  The universe field NAMES the population ('the population living within individual households in Ghana') and states the institutional and nomadic exclusions, which is what earns national-all-households (the same phrasing GhanaLSS 2012-13 earned the tag on).  The documentation was obtained from the Ghana Statistical Service NADA (microdata.statsghana.gov.gh, entry 128 resources 544 and 465), not the World Bank; it is DVC-tracked in the repository.  Sampling Procedure, verbatim: 'With the sampling procedure, 10,800 households in 600 EAs, consisting of 304 (50.67%) urban and 296 (49.33%) rural households were drawn from the 2021 Population and Housing Census listing frame to form the secondary sampling units. A random sampling methodology was adopted to select eighteen (18) households per selected EAs in all regions to form the full sample for the fieldwork to be able to produce regionally representative expenditures for GDP.'  Text extracted with pdfminer; no diacritics are involved.
    record_source: slurm_logs/POPULATION_STATEMENTS_2026-07-21.org (section 3, 'GhanaAHIES 2022')
