    language: 'es'
    source_file: 'https://microdata.worldbank.org/index.php/catalog/596/study-description (WB Microdata Library, PER_1990_ENNIV_v01_M; DOI 10.48529/w7v4-sz09 — matches lsms_library/countries/Peru/1990/Documentation/SOURCE.org)'
    locator: 'Study Description page, section "Coverage" > "Universe" (and "Geographic Coverage" immediately above). Saved: /tmp/popdocs/cat/596.html, /tmp/popdocs/cat/596.txt lines 137-141.'
    population_statement: |-
