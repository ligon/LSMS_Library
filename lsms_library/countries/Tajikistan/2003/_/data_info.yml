Country: Tajikistan
Wave: 2003
household_roster:
    file:
        - ../Data/module1.dta
    idxvars:
        v: tlss_psu
        i: hhid
        pid: hhlid
    myvars:
        Sex:
            - m1q2
            - mapping:
                'Ìóæñêîé': male
                'Æåíñêèé': female
        Age: m1q3_1
        Marital:
            - m1q5
            - mapping:
                1.0: married
                2.0: married (polygamous union)
                3.0: divorced
                4.0: living together
                5.0: widow/widower
                6.0: single
                7.0: other
        MonthsAway: m1q8
        Relationship:
            - m1q4
            # m1q4 carries cp1251 value labels that get_dataframe reads as
            # latin-1, so the keys below are that mojibake, byte-for-byte as
            # the file yields them (decode with key.encode('latin-1')
            # .decode('cp1251')).  Code order, verified positionally against
            # taj03hhq.pdf Module 1 Q4 (GH #800, #797): 1 head, 2 spouse/
            # partner, 3 son/daughter, 4 son/daughter-in-law, 5 father/mother,
            # 6 father/mother-in-law (either side), 7 sister/brother,
            # 8 grandchild, 9 grandparent, 10 niece/nephew, 11 other relative,
            # 12 not related.  Labels follow the 2007/2009 vocabulary.  Do NOT
            # copy 1999's 13-code list here: that is what shifted codes 7-10
            # by one slot (GH #800).
            - mapping:
                'Ãëàâà äîìîõîçÿéñòâà': head
                'Ñóïðóã(à)/ïàðòíåð': spouse/partner
                'Ñûí/äî÷ü': son/daughter
                'Çÿòü/íåâåñòà': son/daughter-in-law
                'Îòåö/ìàòü': father/mother
                'Ðîäèòåëè ìóæà/æåíû': father/mother-in-law
                'Ñåñòðà/áðàò': sister/brother
                'Âíóê(÷êà)': grandchild
                'Äåäóøêà(áàáóøêà)': grandparent
                'Ïëåìÿííèöà/ïëåìÿííèê': niece/nephew
                'Äðóãèå ðîäñòâåííèêè': other relative
                'Íå ðîäñòâåííèêè': not related

cluster_features:
    file: ../Data/interview.dta
    idxvars:
        i: hhid
        v: tlss_psu
    myvars:
        Region: oblast
        Rural: type_reg

sample:
    dfs:
        - df_cover
        - df_weights
    df_cover:
        file: ../Data/interview.dta
        idxvars:
            i: hhid
        myvars:
            v: tlss_psu
            Rural: type_reg
    df_weights:
        file: ../Data/new_expend.dta
        idxvars:
            i: hhid
        myvars:
            weight: wgt_nat
    merge_on:
        - i
    final_index:
        - i
        - t

individual_education:
    # m3bq5 "highest diploma obtained" (Module 3b Education).  Value labels are
    # stripped in this wave's .dta; codes 0-7 match the 2007 file's clean
    # m3bq5 ladder ("what is the highest diploma you have obtained?") exactly.
    file: ../Data/module3.dta
    idxvars:
        v: tlss_psu
        i: hhid
        pid: hhlid
    myvars:
        Educational Attainment:
            # Grades-explicit ladder; right-hand values are canonical
            # harmonize_education levels (GH #493) — a wave with an inline
            # mapping: cannot also carry a mappings: table.
            - m3bq5
            - mapping:
                0.0: None                       # none
                1.0: Primary complete           # primary (grades 1-4)
                2.0: Lower secondary complete   # basic (grades 1-8(9))
                3.0: Upper secondary complete   # secondary general (grades 9-10(11))
                4.0: Vocational/Technical       # secondary special (technikum)
                5.0: Vocational/Technical       # secondary technical
                6.0: Bachelor                   # higher education (VUZ)
                7.0: Postgraduate               # graduate school/aspirantura
