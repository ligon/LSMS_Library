Nigeria::food_acquired::w3-food-conversion:
  waves: ['2015-16']
  columns: [Quantity_kg]
  rows: {t: ['2015Q3', '2016Q1']}
  rule: >-
    Quantity_kg = Quantity x kg_per_unit, where kg_per_unit is food_conv_w3.dta
    (one table for both W3 rounds; kilograms, or litres, per ONE unit) at the
    row's native key -- the item code, the acquisition source's OWN unit code
    (q3b / q6b / q7b) and, on code 900 'other specify', that source's own
    Other text (q3b_os / q6b_os / q7b_os), matched literally; a blank Other
    is no key -- in the household's OWN-ZONE column (conv_NC_1 ... conv_SW_6
    by `zone`).  No national fill for a row with no zone, no fill from another
    item, unit or wave.  The metric codes 1-4 (Kg, g, l, cl) keep their label
    rung; the table's two rows with no factor give none.  Every other row
    keeps Quantity_kg NA.  Stamped after the build's duplicate-key collapse;
    a served key whose contributors the table does not all cover keeps
    Quantity_kg NA (0 such keys).
  function: lsms_library.countries.Nigeria._.nigeria:derive_food_conversion_kg
  inputs: lsms_library.countries.Nigeria._.nigeria:inputs_food_acquired_conversion
  raw_variables: [hhid, item_cd, zone, s7bq3a, s7bq3b, s7bq3b_os, s7bq4, s7bq6a,
                  s7bq6b, s7bq6b_os, s7bq7a, s7bq7b, s7bq7b_os, s10bq3a,
                  s10bq3b, s10bq3b_os, s10bq4, s10bq6a, s10bq6b, s10bq6b_os,
                  s10bq7a, s10bq7b, s10bq7b_os, unit_other, conv_NC_1,
                  conv_NE_2, conv_NW_3, conv_SE_4, conv_SS_5, conv_SW_6, note]
  assumptions:
    - text: >-
        the table's factor is the kilograms (litres on a volume unit) of ONE
        unit of the row's unit code for that item and zone, the World Bank's
        own standard-unit conversion for W3.
      basis: variable-label
      evidence: >-
        2015-16/Documentation/ddi-documentation-english_microdata-2734.pdf
        (food_conv_w3: 1,029 cases, food conversion to standard units); its
        metric controls are Kg 1, g 0.001, l 1, cl 0.01.
    - text: >-
        the household's own zone column, not conv_national.  W4's per-row
        *_cvn is the World Bank applying this table: on the W4 rows where the
        two columns differ it equals the own-zone value on 16,595 of 16,595
        (2018Q3) and 13,476 of 13,489 (2019Q1) rows, the national value on
        83 and 45.  The choice moves little: on the tabled W3 rows, 171,499
        against 171,633 kg (2015Q3) and 160,477 against 160,576 (2016Q1).
        The zone columns are stored float32 (conv_national float64) and read
        as float64 unrounded: at most 5.7e-8 relative from their printed
        six-decimal value (burst job 41276356).
      basis: derived-from-data
      evidence: >-
        measured 2026-11-13 on the raw W4 sect7b / sect10b CSVs joined to
        food_conv_w3.dta through the W3 sized label (burst job 41271653,
        reports/nigeria/out/m1/m1.json, vs_w4_cvn).  The #1452 EHCVM
        precedent chose national medians on its own evidence.
    - text: >-
        the table's own notes record a conversion assumption on 167 of its
        1,029 rows ("Used milk cup ratio, garri" 103, "Used milk cup ratio,
        wheat flour, for bowl" 30, "Used salt conversions" 20, "Used 3, 5, 7
        medium pieces for heaps" 9, "Used leaves (item_cd==78) for bunch" 5).
        They are served as the World Bank recorded them and named in the
        inputs (`note`).
      basis: modelling-choice
      evidence: >-
        food_conv_w3.dta `note`; 2,380 (2015Q3) and 2,153 (2016Q1) tabled
        rows reach a noted cell (measured 2026-11-13).
    - text: >-
        a volume unit's litres are served as kilograms (1 l = 1 kg), as W4's
        *_cvn are; the table carries no mass / volume flag to separate them.
      basis: modelling-choice
      evidence: >-
        W4 s7bq2_cvn / s10bq2_cvn ("Kg/L conversion factor").
  validated_against: >-
    W4's *_cvn on the same served (item, unit) label, against the table's
    national column: median cell ratio 1.000,
    within 2x on 99.1% of 554 (2015Q3) and 99.0% of 496 (2016Q1) cells.  The
    household's own price-implied kg per unit: table / implied median 0.81 /
    0.885, within 2x on 64.1% / 67.4% of 31,103 / 23,590 purchased rows,
    against 0.46 / 0.50 and 43.8% / 47.7% for the inference it replaces
    (whose median is 0.59 / 0.56 of the national column).  Measured 2026-11-13 on the
    base build (f138a3d61).
  contents: >-
    Nigeria/_/CONTENTS.org, "food_acquired: the World Bank's own W2 / W3 food
    conversion tables" (GH #1502)
  since: '2026-11-13'

# GH #1518 (ruling @ligon 2026-11-12, decided with #1502): the harvest-side W3
# table, as the line's Quantity_kg (the harvest ladder's survey_kg rung).
Nigeria::crop_production::w3-ag-conversion:
  waves: ['2015-16']
  columns: [Quantity_kg]
  rows: {t: '2016Q1'}
  rule: >-
    Quantity_kg = Quantity x kg_per_unit on 2016Q1 (W3 post-harvest) harvest
    lines, where kg_per_unit is ag_conv_w3.dta at the line's NATIVE key: the
    crop code (cropcode), the harvest unit code as recorded (sa3iq6ii, which
    carries the size: 130 SACK/BAG SMALL, 131 MEDIUM, 132 LARGE, ...) and the
    household's own zone column (conv_NC_1 ... conv_SW_6), never the
    size-collapsed served u.  Not read: the metric units (KILOGRAM, GRAMS,
    LITRE), which keep their label rung, and the 9 table rows whose unit_name
    contradicts the harvest file's own card for that code (codes 160-162 of
    crops 2190, 2191 and 2194).  The jerry cans that state litres (codes
    190-192, 10 / 20 / 25 l; oil palm, palm oil) ARE read, at 1 l = 1 kg.
    Every other line keeps Quantity_kg NA.  KgFactor is not written: W3 asks
    no factor beside the quantity.
  function: lsms_library.countries.Nigeria._.nigeria:derive_crop_conversion_kg
  inputs: lsms_library.countries.Nigeria._.nigeria:inputs_crop_production_conversion
  raw_variables: [hhid, plotid, cropcode, cropid, zone, sa3iq6i, sa3iq6ii,
                  crop_cd, unit_cd, unit_name, conv_NC_1, conv_NE_2, conv_NW_3,
                  conv_SE_4, conv_SS_5, conv_SW_6, note]
  assumptions:
    - text: >-
        the table's factor is the kilograms of ONE unit of the harvest card's
        code for that crop and zone, the World Bank's own conversion for W3,
        matched to the harvest row by the card's code; where the table's
        unit_name differs from the harvest file's own label for the code, the
        row is held (the identity is unresolved).
      basis: variable-label
      evidence: >-
        ag_conv_w3.dta (crop_cd, unit_cd, unit_name, conv_national, six zone
        columns; 711 rows) against the secta3i_harvestw3.dta value labels of
        sa3iq6ii; the opt-in GH #1518 helper lsms_library.nigeria_harvest
        holds the same 9 identity rows (and its 7 fluid rows, which this key
        serves: the jerry cans at density 1, the LITRE rows by their label).
    - text: >-
        the litres of a jerry can are served as kilograms (1 l = 1 kg), as the
        food side serves the tables' litre containers; harvest_kg's
        volume_as_mass=False cannot decline them (it acts on unit labels, and
        survey_kg outranks them).
      basis: modelling-choice
      evidence: >-
        ruling @ligon 2026-11-13, "Serve tabled litres both sides".  71 native
        positive-quantity rows (oil palm, palm oil): 17 / 21 / 33 on the 10 /
        20 / 25 l cans.  Not held before the ruling but served WRONG:
        _canon_unit tests 'litre' before 'jerry', so "JERRY CAN/RUBBER 25
        LITRES" is served u = 'l' and harvest_kg's metric rung read one can as
        one litre (645 kg); this key serves 14,310 kg.  The served u is still
        'l' on these rows (Quantity counts cans), an open question.
        volume_as_mass=False leaves all 71 on survey_kg at 14,310 kg (burst
        jobs 41276093 / 41276285, reports/nigeria/out/m9, m11).
    - text: >-
        the household's own zone column, not conv_national, as on the food
        side: W4's reported crop factor sa3iq6_conv, matched to the W3 card
        through its unit and size labels, equals the own-zone value on 319 and
        the national value on 40 of the 366 W4 rows where the two columns
        differ.
      basis: derived-from-data
      evidence: >-
        measured 2026-11-13 on secta3i_harvestw4.dta / ag_conv_w3.dta (burst
        job 41271791, reports/nigeria/out/m1/m1.json, crop_vs_w4).
  validated_against: >-
    W4's reported per-row factor on the same crop and sized unit: median ratio
    1.000, 83% of 1,908 rows exactly equal to the own-zone value (68% to the
    national one).  Nothing independent checks the 2016Q1 kilograms
    themselves.  The zone columns are stored float32 in ag_conv_w3.dta (and
    food_conv_w3.dta; conv_national is float64) and are read as float64
    without rounding, so an own-zone factor differs from its printed
    six-decimal value by at most 5.7e-8 relative (burst job 41276356).
  contents: >-
    Nigeria/_/CONTENTS.org, "W3 shipped harvest factors" (GH #1518)
  since: '2026-11-13'
