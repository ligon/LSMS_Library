# GH #1035 (rulings @ligon 2026-10-18, amended 2026-10-19 after red team r1).
# A served Quantity_kg the survey did not record: the W1-PH food module's
# sized unit codes are the agriculture production-unit card, which states
# each container's weight, and a row recording a FRACTION of one container is
# given that weight times the fraction.  The `u` label stays weightless, so
# the stated weight is never served to a row of one or more containers.
Nigeria::food_acquired::w1-card-weight:
  waves: ['2010-11']
  columns: [Quantity_kg]
  rows: {t: '2011Q1'}
  rule: >-
    Quantity_kg = Quantity x card_kg, on 2011Q1 (W1 post-harvest) rows whose
    unit is a sized container with a stated MASS (codes 11-83 of the
    value-label set SP10BQ2B: Sack/Bag, Basket, Basin, Bunch, Tuber of yam,
    Bundle, Wheelbarrow, Pick-up van; 3 to 2,500 kg) and whose served
    Quantity satisfies 0 < Quantity < 1.  card_kg is the weight the label
    states ('11 Sack/Bag: Small (20 kg)'); for the three Bundle codes, whose
    labels Stata truncated at 60 characters, it is the survey's own
    w1agnsconversion.csv (15 / 25 / 40 kg, one value for every crop).  Every
    other row -- Quantity >= 1, which includes every row whose quantity
    equals its card weight, and the jerry-can / keg codes 91-95, which state
    LITRES -- keeps Quantity_kg NA and is served by the price-ratio
    inference under its weightless `u` label.  The rule reads the served
    Quantity, after the build's duplicate-key collapse (2011Q1 has no
    duplicate key on a sized code).
  function: lsms_library.countries.Nigeria.2010-11._.mapping:derive_w1_card_weight_kg
  inputs: lsms_library.countries.Nigeria.2010-11._.mapping:inputs_food_acquired_w1_card_weight
  raw_variables: [hhid, item_cd, s10bq3a, s10bq3b, s10bq4, s10bq5a, s10bq5b,
                  s10bq6a, s10bq6b]
  assumptions:
    - text: >-
        the sized codes in the W1-PH food unit fields mean the containers of
        the agriculture production-unit card, at the card's stated weight.
        The food page of the printed questionnaire lists only codes 1-4 (Kg,
        g, l, ml); the sized codes reach the food file through the .dta
        value-label set SP10BQ2B, which is the card the harvest unit sa3q6b
        also uses.  The codes respect container meaning item by item (yam on
        tuber codes 89 of 95 purchased rows, plantain on bunch codes 50 of
        55, palm oil and bottled drinks on jerry-can codes).
      basis: variable-label
      evidence: >-
        sect10b_harvestw1.dta, value-label set SP10BQ2B, attached to s10bq2b,
        s10bq3b, s10bq5b and s10bq6b; 2010-11/Data/w1agnsconversion.csv
        (min = max = the label weight for every nscode); W1-PH household
        questionnaire Section 10B (codes 1-4 only); GH #1035 red team r1, R2
        and R3.
    - text: >-
        the stated weight applies only where the row records a FRACTION of a
        container (0 < Quantity < 1).  A quantity of one or more containers
        reads as a COUNT of a local unit that the card's weight does not
        describe, and a quantity equal to the card weight as a kilogram
        figure keyed into the quantity field; both keep the price-ratio
        inference.
      basis: modelling-choice
      evidence: >-
        ruling @ligon 2026-10-19 on GH #1035, on red team r1's split of the
        2,574 priced purchased 2011Q1 rows on sized codes, each row's
        stated-weight Naira/kg against its item's own Kg-row median price:
        Quantity < 1 (1,838 rows) median ratio 0.65 -- bread at 0.05 of a
        20 kg sack is a 1 kg loaf; Quantity >= 1 (736 rows) median 0.032,
        carrying 95% of the kilograms an unconditional card weight adds; 165
        rows (all sources) record a Quantity equal to the card weight.
    - text: >-
        the jerry-can / keg / rubber-of-palm-oil codes 91-95 state a VOLUME
        and are not converted: a Quantity_kg built from litres would assert
        1 l = 1 kg as a survey figure that volume_as_mass=False cannot
        decline, and would carry that density into the price-per-kg
        baseline the inference keeps volumes out of.
      basis: modelling-choice
      evidence: >-
        transformations._BASELINE_UNIT_CONVERSION (no litre, ml or cl);
        Nigeria/_/CONTENTS.org, GH #1035 section.
  validated_against: >-
    the expenditure each derived purchased row records: the derived kilograms
    imply a Naira/kg price near the item's own Kg-row median (red team r1:
    median ratio 0.65 over the Quantity < 1 rows), where the same weight on
    the Quantity >= 1 rows implies a median 0.032.  Measured 2026-10-19 on
    the 2,574 priced purchased sized rows: expenditure-implied 5,514 kg;
    base 19,374; card weight on every row 46,600; this rule 10,517.  The
    inputs callable joins 1:1 to all 1,856 derived rows and reproduces their
    Quantity_kg; each derived row's served Quantity is its single raw answer
    (no duplicate-key sum).
  contents: >-
    Nigeria/_/CONTENTS.org, "W1 post-harvest units: the stated container
    weight serves a fraction of a container only" (GH #1035)
  since: '2026-10-19'

# GH #881 (ruling @ligon 2026-11-03, option A).  An IDENTITY derivation: the
# W4 purchased row's numbers are the survey's own and are served unchanged;
# what is registered is the WINDOW they describe, so it is visible on the row
# (CLAUDE.md "Derived Values": "a value served under a name implying a
# different window -- the function is the identity and the registry is the
# point"; the Ethiopia section-12 / permanent-crop precedents).
Nigeria::food_acquired::w4-last-purchase-30d:
  waves: ['2018-19']
  columns: [Quantity, Expenditure, Quantity_kg]
  rows: {t: ['2018Q3', '2019Q1'], s: purchased}
  rule: >-
    THE IDENTITY, on every W4 (2018Q3 post-planting, 2019Q1 post-harvest)
    food_acquired row with s = 'purchased': Quantity = q9a, its unit u = q9b
    (with its size, q9c, GH #1033),
    Quantity_kg = q9a x q9_cvn and Expenditure = q10, exactly as recorded.
    What is derived is the WINDOW: W4 asks no 7-day purchase value.  Its
    purchase block asks whether the household bought the item in the past
    30 days (q8) and, if so, the quantity, unit and cost of the MOST RECENT
    purchase (q9a / q9b / q10).  So this row is one purchase event within the
    last 30 days, while the produced (q6a) and in-kind (q7a) rows beside it
    -- and the purchased row of W1-W3 -- are 7-day consumption.  Quantity
    summed across s is not a 7-day total for W4; Expenditure is not a 7-day
    outlay.
  function: lsms_library.countries.Nigeria.2018-19._.mapping:derive_w4_last_purchase_30d
  inputs: lsms_library.countries.Nigeria.2018-19._.mapping:inputs_food_acquired_w4_last_purchase
  raw_variables: [hhid, item_cd, s7bq8, s7bq9a, s7bq9b, s7bq9c, s7bq9_cvn, s7bq10,
                  s7bq5a, s7bq2b, s7bq2c, s7bq2_cvn, s10bq8, s10bq9a, s10bq9b,
                  s10bq9c, s10bq9_cvn, s10bq10, s10bq5a, s10bq2b, s10bq2c,
                  s10bq2_cvn]
  assumptions:
    - text: >-
        q9a / q9b / q10 describe the household's most recent purchase of the
        item within the last 30 days (q8 "did the household purchase any
        [ITEM] in the past 30 days?"), not purchases over the 7-day
        consumption window that q2a and its decomposition q5a / q6a / q7a
        cover.
      basis: variable-label
      evidence: >-
        sect7b_plantingw4 / sect10b_harvestw4 Stata variable labels for q8,
        q9a/q9b/q9_cvn and q10 (Nigeria/_/CONTENTS.org, "food_acquired
        acquisition sources (GH #591)", table row q8-q10); the W4
        questionnaire's renumbering is recorded in
        2018-19/_/food_acquired.py.
    - text: >-
        the 30-day purchase is served as recorded and LABELLED, not
        converted.  Pairing q10 with q9a is what makes Expenditure /
        Quantity a real price (median survey / community unit-value ratio
        0.95 on matched (t, j, u) cells, 2019Q1).  The alternative -- a
        constructed 7-day Expenditure = q5a x (q10 / q9a), the #876 EHCVM
        pattern -- was declined by ruling; it is reproducible from this
        entry's inputs, but q5a is in the consumption unit q2b and q9a in
        the purchase unit q9b, which differ on 9.5% (2018Q3) / 13.1%
        (2019Q1) of priced rows, so it needs the q2_cvn / q9_cvn kg factors.
      basis: modelling-choice
      evidence: >-
        GH #881, ruling @ligon 2026-11-03 (option A); measured 2026-11-03 on
        the raw W4 CSVs: kg-reconciled option B would total 29.4M / 23.6M
        Naira against 40.0M / 33.4M of q10 on the same rows (median ratio
        1.0); the unreconciled product 117.7M / 163.4M.
  validated_against: >-
    Nothing is rescaled, so there is no target: the stamp is checked, not
    calibrated.  On a private cold build (base 7c2b5ed01 vs this change) the
    595,725-row food_acquired frame has identical index, Quantity,
    Expenditure and Quantity_kg; Derivation carries this key on exactly the
    W4 s = 'purchased' rows and nowhere else.  derivation_inputs joins 1:1 to
    those rows and its q9a / q10 reproduce their Quantity / Expenditure.  The
    recall record (recall.yml, within_wave_variation: by-s) says the same
    thing at wave grain; this entry puts it on the row, where it survives
    Feature().
  contents: >-
    Nigeria/_/CONTENTS.org, "Reference-period caveat -- W4 (2018Q3 / 2019Q1)
    only" (GH #881)
  since: '2026-11-03'

# GH #1502 (ruling @ligon 2026-11-12, "Wire W2 and W3").  The World Bank's own
# food conversion tables, served as the row's Quantity_kg (the survey_kg rung,
# the #1452 EHCVM precedent), one key per table so the path taken is countable.
Nigeria::food_acquired::w2-pp-food-conversion: &w2_food_conversion
  waves: ['2012-13']
  columns: [Quantity_kg]
  rows: {t: '2012Q3'}
  rule: >-
    Quantity_kg = Quantity x kg_per_unit, where kg_per_unit is the round's own
    shipped table at the row's native key: the item code and the acquisition
    source's OWN unit code (q3b purchased, q6b produced, q7b in kind).  W2's
    tables give `conv` per unit with a class flag g_cl: g_cl = 1 grams
    (kg_per_unit = conv / 1000); g_cl = 0 centilitres, read as litres
    (kg_per_unit = conv / 100, at 1 l = 1 kg) ONLY for the reviewed liquid
    items of nigeria.W2_CL_CLASS_LIQUID_ITEMS (the oils: 2012Q3 codes 50, 52,
    53; 2013Q1 50, 52) -- every other g_cl = 0 cell is a solid read as grams
    under Nigeria::food_acquired::w2-cl-class-read-as-grams.  Post-planting (2012Q3) reads
    food_conv_w2pp.csv, keyed on the item and the planting unit code s7bq2b;
    post-harvest (2013Q1) reads food_conv_w2ph.csv, keyed on nsu_cd.  The
    tables cover only the non-metric codes 5-16 (mudu, olodo, congo, paint
    rubber, three derica sizes, milk cup, cigarette cup, tiya, kobiowu,
    piece); the metric codes 1-4 keep their label rung.  Every other row
    keeps Quantity_kg NA.  Stamped after the build's duplicate-key collapse;
    a served key whose contributors the table does not all cover keeps
    Quantity_kg NA (0 such keys).
  function: lsms_library.countries.Nigeria._.nigeria:derive_food_conversion_kg
  inputs: lsms_library.countries.Nigeria._.nigeria:inputs_food_acquired_w2_pp_conversion
  raw_variables: [hhid, item_cd, zone, s7bq3a, s7bq3b, s7bq4, s7bq6a, s7bq6b,
                  s7bq7a, s7bq7b, s10bq3a, s10bq3b, s10bq4, s10bq6a, s10bq6b,
                  s10bq7a, s10bq7b, conv, g_cl, nsu_cd, s7bq2b]
  assumptions:
    - text: >-
        the table's `conv` is grams (g_cl = 1) or centilitres (g_cl = 0) per
        ONE unit of the row's unit code for that item, the World Bank's own
        standard-unit conversion for the round.
      basis: variable-label
      evidence: >-
        World Bank catalog 1952, food_conv_w2ph variable g_cl (V3262):
        0 = centiliters, 1 = grams, matching the 69 / 384 held cases.
    - text: >-
        the post-planting table's g_cl and conv mean what the post-harvest
        table's do.  Its own documentation does not survive: the catalog
        describes 385 cases keyed nsu_cd, the held file has 417 keyed s7bq2b.
      basis: derived-from-data
      evidence: >-
        on all 336 (item, unit) keys the two held W2 tables share with the same
        item meaning in both rounds (GH #1144 quarter labels), conv and g_cl are
        identical (51 cl / cl, 285 g / g); measured 2026-11-13, burst job
        41271653, reports/nigeria/out/m1/m1.json (tables_describe).
    - text: >-
        a centilitre row of a LIQUID item is served in LITRES as kilograms
        (1 l = 1 kg), the Kg/L convention of W3's table and W4's per-row
        *_cvn.  It cannot be declined with volume_as_mass=False, which acts on
        unit labels, not on survey_kg.  Differs from the W1 card-weight
        decision (GH #1035), which leaves litre containers to the inference.
      basis: modelling-choice
      evidence: >-
        ruling @ligon 2026-11-13, "Serve tabled litres both sides"; the oils'
        cl reading fits: 2012Q3 Palm oil cell median 1.49x the inference and
        1.99x W3's table (0.149 / 0.199 under grams), Groundnut oil 1.49 / 1.99;
        a mudu of palm oil is 1.272 l and a milk cup 0.159 l in both tables.
  validated_against: >-
    two independent references, measured on the base build's raw rows
    (f138a3d61, 2026-11-13) for the W2 tables as now read -- this key and
    w2-cl-class-read-as-grams together (burst job 41276128,
    reports/nigeria/out/m10/m10.json).  The household's own price-implied kg
    per unit (its Naira per unit over the item's same-round Kg-row median
    Naira per kg, purchased rows): table / implied median 1.01 (2012Q3) and
    0.93 (2013Q1), within 2x on 82.4% and 78.1% of 10,102 / 11,675 rows
    (1.03 / 0.96 and 82.6% / 79.1% under the flag's own cl reading), against
    0.93 / 0.875 and 85.9% / 82.2% for the inference it replaces.  W4's *_cvn
    on the same served (item, unit) label (93 / 126 cells, the rest have no
    same-label W4 cell): median ratio 0.92 / 0.94, within 2x on 72% / 74% of
    cells (0.94 / 0.99, 69% / 65% under the cl reading).  The three derica
    sizes fit worst on both references (table about half: 0.34-0.62
    price-implied, 0.41-0.54 against W4; measured before the re-read).
  contents: >-
    Nigeria/_/CONTENTS.org, "food_acquired: the World Bank's own W2 / W3 food
    conversion tables" (GH #1502)
  since: '2026-11-13'

Nigeria::food_acquired::w2-ph-food-conversion:
  <<: *w2_food_conversion
  rows: {t: '2013Q1'}
  inputs: lsms_library.countries.Nigeria._.nigeria:inputs_food_acquired_w2_ph_conversion

# GH #1502 red team F1 (ruling @ligon 2026-11-13, "Re-read solids as grams").
Nigeria::food_acquired::w2-cl-class-read-as-grams:
  waves: ['2012-13']
  columns: [Quantity_kg]
  rows: {t: ['2012Q3', '2013Q1']}
  rule: >-
    Quantity_kg = Quantity x conv / 1000 on W2 rows whose table cell is flagged
    g_cl = 0 ("centilitres") but whose item is NOT a liquid: the flag is read
    as GRAMS there.  The liquid items are an explicit, reviewed item-code list
    per round, nigeria.W2_CL_CLASS_LIQUID_ITEMS (2012Q3: 50 Palm oil, 52
    Groundnut oil, 53 Other oils and fats; 2013Q1: 50, 52), which keep conv /
    100 under the round's own key; every other item carrying a g_cl = 0 cell
    -- groundnuts, other nuts, tomatoes, tomato puree, onions, eggs, beef,
    mutton, fish (dried), snails, baby milk powder, chocolate drinks, coffee,
    tea, mangoes, cassava, yam -- is read here.  Same native key, collapse and
    stamping as the round keys.
  function: lsms_library.countries.Nigeria._.nigeria:derive_food_conversion_kg
  inputs: lsms_library.countries.Nigeria._.nigeria:inputs_food_acquired_w2_cl_as_grams
  raw_variables: [hhid, item_cd, zone, s7bq3a, s7bq3b, s7bq6a, s7bq6b, s7bq7a,
                  s7bq7b, s10bq3a, s10bq3b, s10bq6a, s10bq6b, s10bq7a, s10bq7b,
                  conv, g_cl]
  assumptions:
    - text: >-
        on a non-liquid item the table's `conv` is GRAMS per unit whatever its
        g_cl flag says.  The flag contradicts the table: one class gives a mudu
        of palm oil 1.272 and a mudu of tomatoes 10 (litres under the flag's
        reading), a milk cup of oil 0.159 and of groundnuts 1.0.  Read as
        grams, the solids sit near the inference, W3's table and W4's *_cvn;
        read as centilitres, about 10x above them.  The household
        price-implied reference does NOT agree (validated_against below).
        Which field the World Bank got wrong is not established.
      basis: derived-from-data
      evidence: >-
        GH #1502 red team (reports/nigeria-redteam/VERDICT.md, F1): cell
        medians against the inference 12.2x / 11.8x under cl, 1.22 / 1.18 under
        grams; 8.4x against W3's table.  Per item, burst job 41275442
        (reports/nigeria/out/m8/w2_gcl0_items.csv) and Nigeria/_/CONTENTS.org.
    - text: >-
        the liquid list is decided item by item on what the item is, with the
        evidence displayed, never by name pattern: the oils' cl reading fits
        all three references and the grams reading sits ~0.05-0.2x.  Every
        other item is read as grams, as the ruling says for non-liquids,
        INCLUDING the items where a reference prefers the cl reading, which are
