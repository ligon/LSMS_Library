# A DELETION: W1 PP kilogram / litre rows whose "count" reads as a size.
Nigeria::community_prices::pp-w1-count-as-size-hold:
  waves: ['2010-11']
  columns: [Price]
  rows: 0
  rule: >-
    W1 PP (2010Q3) priced rows on unit 101 "kg" or 103 "litre" whose Number
    of Units sc2q3b exceeds 50 (128 Kg + 204 l = 332 rows) are not served:
    there the count reads as a package size, not a number of kilograms /
    litres, and the division pp-w1-number-of-units would under-price them.
    W1 l rows with a count of 2-50 are divided (pp-w1-number-of-units); Kg
    rows with a count of 2-5 are divided under
    pp-w1-number-of-units-unvalidated and those with 6-50 are held
    (pp-w1-kg-mid-count-hold); a count of 1 is served as recorded.
