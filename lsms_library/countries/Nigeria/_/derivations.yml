  assumptions:
    - text: >-
        above 50 the count is not a count of kilograms / litres.  Measured
        against the same round's household unit value (matched cells,
        median community / household), divided by N: Kg 0.33 / 0.23 / 0.009
        for N of 6-50 / 51-200 / >200, l 0.014 / 0.001 for N of 51-200 /
        >200 -- 50-1000x too low -- while undivided the litre rows sit at
        1.05 / 0.85x (the kilogram rows at 4.8-22x, so no single reading fits
        them).  The threshold 50 is the ruling's; N = 50 is still divided.
        Ruled 2026-11-12, "Hold both groups".
      basis: modelling-choice
      evidence: >-
        .sucoder/isa-decisions.org 2026-11-12 ("GH587 W1 metric rows with a
        count"); GH #587 wiring report (burst isa-sm-20261112
