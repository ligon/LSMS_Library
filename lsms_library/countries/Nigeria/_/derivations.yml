# Derivations -- served numbers in this country's tables that are NOT survey
# answers but CONSTRUCTIONS from raw answers.  One entry per registry key,
# `country::table::name`; the same key sits in the served table's
# `Derivation` column on every row it produced.  Loader and field contract:
# lsms_library/derivations.py.  Design: SkunkWorks/derived_values.org.
#
# Sibling of population.yml and recall.yml: a .yml here moves no cache hash.

# GH1120 comment6380186741: a derived identity, not a new survey answer.
# Both builders use the same rule; Site 2 keeps the selected household's own
# provenance without changing which household is selected.
Nigeria::sample::ph-same-location: &ph_same_location
  waves: ['2018-19', '2023-24']
  columns: [v]
  rows: {t: ['2019Q1', '2024Q1']}
  rule: >-
    Only where the PH cover records ea=0 AND its own labelled answer says
    same/original location, reuse the complete known composite state/lga/ea
    from this household's PP cover in the SAME wave. W4 requires hhsmlc=1
    labelled YES; W5 requires hh_moved=2 labelled NO, IN ORIGINAL DWELLING.
    Never combine PP and PH geographic components. Keep the PH attributes
    and both PH weights unchanged. A missing/moved PP identity, actual move,
    numeric-only or wrong answer, and unlabelled W3 retain their sentinels.
  function: lsms_library.countries.Nigeria._.nigeria:derive_ph_same_location_v
  inputs: lsms_library.countries.Nigeria._.nigeria:inputs_ph_same_location
  raw_variables: [hhid, state, lga, ea, hhsmlc, hh_moved]
  assumptions:
    - text: >-
        The approved labelled PH same-location answer permits reuse of this
        household's known PP EA, including its PP state/lga components even
        where PH's state/lga differ. The answer alone cannot supply a missing
        PP identity. Raw codes without their labelled meaning do not qualify.
      basis: modelling-choice
      evidence: >-
        Owner ruling GH1120 comment6380186741, 2026-10-24. Named label evidence
        is recorded in framework1135-Nigeria-counts/DIAGNOSIS.md (historical
        source review); independently rechecked on the cached PH sources
        in the 2026-10-29 public-base extraction.
  validated_against: >-
    Actual-helper synthetic counterfactuals pass. Fresh cached-source checks
    on 2026-10-29 verify 20 W4 and 31 W5 repaired PH sample identities,
    unchanged PH weights/payload and selected-row geo provenance. Independent
    root acceptance remains pending. Inputs retain named PH answers and pp_-namespaced original PP
    operands at (t,i), finer than selected cluster grain. Source storage
    dtypes are recorded separately; missing PP matches never coerce IDs to float.
  contents: Nigeria/_/CONTENTS.org, "Labelled same-location PH answers"
  since: '2026-10-25'

Nigeria::cluster_features::ph-same-location: *ph_same_location

# GH #843 rulings (@ligon, 2026-11-03 and 2026-11-04).  W3-W5 record the crop sale per household
# and crop (A3.ii, secta3ii), with no plot.  One function, one decision, a key
# per path so the path taken is countable.  A `plot_id='Farm-level'` row holding
# one source record carries NO key: it is a survey answer at its own grain, and
# the index value discloses that.  That covers 1,603 W4/W5 rows whose Unit_sold
# and KgFactor_sold are the household total's, which the form states the sale in.
# The frame alone cannot tell them from W3's own-unit answers; the assumptions on
# the first entry below are the only record of that reading.
Nigeria::crop_production::hh-crop-sale-single-row:
  waves: ['2015-16', '2018-19', '2023-24']
  columns: [Quantity_sold, Value_sold, Unit_sold, KgFactor_sold]
  rows: {t: ['2016Q1', '2019Q1', '2024Q1']}
  rule: >-
    A household-crop sale from A3.ii is placed on the household's ONE row for
    that crop that STATES A HARVEST, even where its other rows are explicit "did
    not harvest".  The figures are the reported ones; what is derived is the
    ATTACHMENT to a plot the sale block does not name.  A row states a harvest
    when its harvest Quantity is positive.  A blank does not, a zero does not,
    and an explicit "did not harvest" does not: every such line in the files has
    a blank quantity, so the screener needs no separate read.  Each served harvest
    line is one row (GH #1433).  Two or more rows stating a harvest, or none, is a
    plot_id='Farm-level' row instead, including two lines of one plot.  Unit_sold is
    the sale's own unit and can differ from the row's harvest `u`.
  function: lsms_library.countries.Nigeria._.nigeria:derive_hh_crop_sale_attachment
  inputs: lsms_library.countries.Nigeria._.nigeria:inputs_hh_crop_sale_single_row
  raw_variables: &hh_crop_sale_variables
    - secta3ii_harvestw3.hhid / cropcode / crop_number, sa3iiq3, sa3iiq5a, sa3iiq5b, sa3iiq6
    - secta3ii_harvestw4.hhid / cropcode, sa3iiq3, sa3iiq5a, sa3iiq1c, sa3iiq1d, sa3iiq1b, sa3iiq1_conv, sa3iiq6
    - secta3ii_harvestw5.hhid / cropcode, sa3iiq4, sa3iiq6, sa3iiq3b, sa3iiq3c, sa3iiq3d, sa3iiq1_conv, sa3iiq7
  assumptions:
    - text: >-
        A3.ii asks the sale per crop, not per plot.  W5 form p. 19: "CAPI WILL
        MAKE A LIST OF ALL HARVESTED CROPS FROM FLAP D. IT WILL NOT LIST CROPS
        MORE THAN ONCE. IF THE RESPONDENTS HARVESTED MAIZE FROM 2 DIFFERENT
        PLOTS, CAPI WILL LIST MAIZE ONCE."
      basis: questionnaire
      evidence: >-
        ghs_panel_w5_ph_agriculture_questionnaire.pdf p. 19;
        ph_w4_agriculture_quest.pdf p. 20; PH_W3_Agriculture_Quest.pdf p. 28
        (section A3.ii, all three).
    - text: >-
        W3 asks the sale's own unit (Q5 QUANTITY + PROD. UNIT CODE, sa3iiq5b).
        W4 and W5 print only a QUANTITY box, worded "Of the [QTY] [UNIT]
        [CONDITION] of [CROP] harvested, how much of it did your household
        sell?", so the sold quantity is in the unit, size and condition of the
        household's total harvest asked just before (W4 sa3iiq1c / sa3iiq1d /
        sa3iiq1b, W5 sa3iiq3b / sa3iiq3c / sa3iiq3d).
      basis: questionnaire
      evidence: >-
        The same three pages, and the W5 interviewer manual p. 99: "the
        respondent MUST provide the quantity of unprocessed CROP NAME sold in the
        SAME UNIT AS THE QUANTITY HARVESTED".  EPAR reads W4 the same way
        (EPAR_UW_Nigeria_GHS_W4.do:690-694 renames sa3iiq5a qty beside sa3iiq1b/c/d).
        Corroboration: the W4/W5 sold quantity is at most
        the total stated in that unit on 3,820 of 3,825 and 3,747 of 3,747
        sales (median share 0.67 / 0.63), and on attached one-record sales the
        W4/W5 unit equals the row's own `u` on 2,798 of 2,800 and 3,062 of
        3,063; W3, which asks its own, on 2,926 of 3,041.  All three unit
        columns carry the harvest unit's value labels (W4/W5 split its
        '40. DERICA/TIN' into two codes).
    - text: >-
        sa3iiq1_conv is the form's Kg/L factor for the unit, size and condition
        of the household's total harvest, so in W4 and W5 it is kg per one sold
        unit: KgFactor_sold.  It does not rate the row's harvest `u`.
      basis: questionnaire
      evidence: >-
        Stata label "Kg/L conversion factor", beside sa3iiq1a/c/d/b; the assumption
        above fixes the sale to that unit.  The World Bank does this:
        NGA_GHS4.do:281, gen harvest_sold_kg_temp = sa3iiq5a * sa3iiq1_conv.
    - text: >-
        A sale by a household with one row for that crop that states a harvest came
        from that row, even beside rows that state none.  That moved 64 / 94 / 57
        household-crops (N1.5M / N3.4M / N8.8M) onto their one harvesting row, and
        2 / 2 / 0 (N51,500) off a lone row stating none, against counting served rows
        whatever they stated.
      basis: modelling-choice
      evidence: >-
        Rulings on GH #843, @ligon: option d, 2026-11-03; choice A, 2026-11-04, "Yes,
        take all four on #843".  Screener by quantity in every held file: 0 lines say
        NO with a positive quantity, and every positive quantity sits under a YES.
        The only reading the definition settles is a YES with 0 beside a positive
        row (1 household-crop, W3, N48,000).  Those counts are from the frame of the
        ruling, which served one line per (plot, crop); GH #1433 serves every line,
        which CONTENTS.org records as moving 123 household-crops to Farm-level and 2
        off it.
  validated_against: >-
    Cold build of Nigeria: Value_sold on attached plus Farm-level rows equals
    the raw secta3ii sum in all three rounds (N196,085,180 / N226,761,273 /
    N716,443,945), and tests/test_gh843_nigeria_household_crop_sales.py pins
    the rules against an oracle that reads the source files directly.  Not a
    check that the sale truly came from that plot: the survey cannot say.
  contents: Nigeria/_/CONTENTS.org, "crop_production W3-W5 sales"
  since: '2026-11-03'

Nigeria::crop_production::hh-crop-sale-records-summed:
  waves: ['2015-16', '2018-19', '2023-24']
  columns: [Quantity_sold, Value_sold, KgFactor_sold]
  rows: {t: ['2016Q1', '2019Q1', '2024Q1']}
  rule: >-
    Where one household and served crop holds several A3.ii sale records whose
    quantities are all in one unit (same raw unit code, and the same size and
    condition where the form asks them), Quantity_sold and Value_sold are their
    sums.  Several records arise because harmonize_food gives several crop
    codes one label (Yam--roots is 1120-1124) and W3's roster can repeat a code
    on two lines.  The row carries this key whichever row it landed on.
    KgFactor_sold is never summed: it is carried only where every record
    reports the same factor, missingness included (the canonical note's policy,
    as Mali's), and is otherwise NA with the quantity kept.
  function: lsms_library.countries.Nigeria._.nigeria:derive_hh_crop_sale_attachment
  inputs: lsms_library.countries.Nigeria._.nigeria:inputs_hh_crop_sale_records_summed
  raw_variables: *hh_crop_sale_variables
  assumptions:
    - text: >-
        Two records of one household and served crop in one unit are additive:
        they are two varieties, or two roster lines, of the crop one label
        serves.  They are not re-entries: none of the source records is an
        exact duplicate of another.
      basis: modelling-choice
      evidence: >-
        Census of secta3ii, 2026-11-03: 60 / 22 / 26 such pairs (W3 / W4 / W5);
        0 exact-duplicate records in all three files, unlike Niger's s16d.
  validated_against: >-
    Conservation by Unit_sold against raw secta3ii sums,
    tests/test_gh843_nigeria_household_crop_sales.py.
  contents: Nigeria/_/CONTENTS.org, "crop_production W3-W5 sales"
  since: '2026-11-03'

Nigeria::crop_production::hh-crop-sale-two-units:
  waves: ['2015-16', '2018-19', '2023-24']
  columns: [Value_sold, Quantity_sold, Unit_sold, KgFactor_sold]
  rows: {t: ['2016Q1', '2019Q1', '2024Q1']}
  rule: >-
    Where one household and served crop holds several A3.ii sale records in
    DIFFERENT units (raw unit code, size or condition differ), Value_sold is
    their sum and Quantity_sold, Unit_sold and KgFactor_sold are NA.  A sale is
    placed once per household and crop, so the two quantities are not two rows,
    and the served value of Quantity_sold has one unit, so they cannot be
    summed.  The quantities are not lost: derivation_inputs returns each
    record's own.
  function: lsms_library.countries.Nigeria._.nigeria:derive_hh_crop_sale_attachment
  inputs: lsms_library.countries.Nigeria._.nigeria:inputs_hh_crop_sale_two_units
  raw_variables: *hh_crop_sale_variables
  assumptions:
    - text: >-
        Naira add across units; quantities do not.  `_canon_unit` is
        size-agnostic, so two sacks of different sizes are two units here even
        though both would serve Unit_sold 'Sack/Bag'.
      basis: modelling-choice
      evidence: >-
        Ruling on GH #843, @ligon 2026-11-04, choice B.  Serving one record's quantity beside
        the summed value would state a price of neither record.  Census
        2026-11-03: 13 / 14 / 7 pairs (W3 / W4 / W5), of which 4 / 11 / 4 differ
        in the canonical label too.
  validated_against: >-
    Conservation of Value_sold, and the withheld quantities recovered from
    derivation_inputs, tests/test_gh843_nigeria_household_crop_sales.py.
  contents: Nigeria/_/CONTENTS.org, "crop_production W3-W5 sales"
  since: '2026-11-03'

Nigeria::community_prices::c8-metric-size:
  waves: ['2015-16', '2018-19', '2023-24']
  columns: [Price]
  # The PH quarters only: the same folders' post-planting g / cl rows carry
  # their own pp-* keys (GH #587).
  rows: {t: ['2016Q1', '2019Q1', '2024Q1'], u: [g, cl]}
  rule: >-
    Price = reported_price / size_quantity, with size_quantity decoded from
    the C8 SIZE field into grams or centilitres and the row's unit `u` set to
    the metric base unit.  The C8 form prices "a quantity of ONE (1) [ITEM]"
    in a stated UNIT and SIZE; where the size states a metric quantity the
    reported Naira figure is the price of THAT PACKAGE, not of one gram or
    one centilitre.  W4 (c8q2c) and W5 (c8aq2_c) share one coded size list
    ('30. 20 GRAMS' ... '38. 1 KG', '50. 100 GRAMS (25 CUBES)' ...,
    '20. 33 CL' ... '26. 1.5 LITRE'); W5's c8aq2_a (quantity) and c8aq2_cvn
    (kg/l conversion factor) agree with the coded quantity and are a
    cross-check, not a second source.  W3's c8q2b is free text and blank on
    the whole metric-unit block; the handful stating a quantity
    ('300gram', 'one 75cl bottle', 'one 450g tin') are parsed and divided,
    the rest are DROPPED (not derivable -- a price of an unrecorded package
    is not a per-unit price; the drop is registered separately as
    Nigeria::community_prices::c8-unrecorded-size-drop).  Ordinal sizes
    (SMALL / MEDIUM / LARGE / VERY LARGE, '99. ONE SIZE ONLY') carry no
    metric content: those rows stay under the base unit and are NOT
    derived.
  function: lsms_library.countries.Nigeria.2018-19._.mapping:derive_c8_metric_package_unit_price
  inputs: lsms_library.countries.Nigeria.2018-19._.mapping:inputs_community_prices
  raw_variables: [c8q2, c8q2b, c8q2c, c8q3, c8aq2_a, c8aq2_b, c8aq2_c,
                  c8aq2_cvn, c8aq3, item_cd, state, lga, ea]
  assumptions:
    - text: >-
        the price recorded beside a coded metric size is the price of one
        package of that size, so dividing by the size quantity gives the
        price of one base unit.  The W4 questionnaire prints "2. PLEASE USE
        A QUANTITY OF ONE (1) FOR [ITEM] AND THE UNIT OF MEASURE YOU ARE
        USING" over sub-columns headed UNIT OF MEASURE and SIZE, then "3.
        What is the price for the item?" in NAIRA -- one package of the
        stated size, one price.
      basis: questionnaire
      evidence: >-
        ph_w4_community_quest.pdf, section C8 p.13; measured against
        the household unit value on matched (t, j, u, geography) cells
        pre-fix the median community/household ratio was 1.000 on Kg (596
        cells) and l (124), but 1/189 on g (130) and 1/42 on cl (125) -- the
        g/cl ratios ARE the package sizes (20-500 g; 33-75 cl)
        (slurm_logs/price_sources/Nigeria/REPORT.org N-02).
    - text: >-
        a metric-unit row with an UNRECORDED size (all of W3's g/cl rows
        except one; all of W3's Kg/l rows; W5's 133 'GRAMS (G)' rows and 49
        '4. CENTLITRES (CL)' rows)
        cannot be normalised and is dropped rather than served mis-scaled
        -- registered separately as
        Nigeria::community_prices::c8-unrecorded-size-drop.  '99. ONE SIZE
        ONLY' is the questionnaire's own statement that the price IS of one
        unit and is the single exemption; a blank size beside KILOGRAMS or
        LITRES in W4/W5 reads as one kilogram / one litre and is served,
        not dropped.
      basis: modelling-choice
      evidence: >-
        GH #834; Nigeria/_/CONTENTS.org "The C8 SIZE field is recorded by
        the survey and NOT read by the build"
  validated_against: >-
    the household unit value (food_acquired Expenditure/Quantity) on matched
    (t, j, u, cluster-geography) cells: post-fix the community/household
    median ratio is ~1.0 on the metric units where the two sources overlap,
    the same agreement the unambiguous Kg and l units showed pre-fix.
  contents: Nigeria/_/CONTENTS.org, "The C8 SIZE field" (GH #834)
  since: '2026-09-13'

# A DELETION: a metric-unit C8 row whose package size is unrecorded is DROPPED
# by the build (a price of an unrecorded package is not a per-unit price;
# serving it as g/cl would misprice by the package size, ~189x/~42x
# measured).  A dropped row has nowhere to carry a Derivation key, so this
# entry is the only place the drop is disclosed: `rows: 0` and the attrs
# summary lists the key at 0, while `derivation_inputs` returns the dropped
# source rows themselves.
Nigeria::community_prices::c8-unrecorded-size-drop:
  waves: ['2015-16', '2018-19', '2023-24']
  columns: [Price]
  rows: 0
  rule: >-
    Rows whose unit is g / cl but whose
    package SIZE is unrecorded are dropped from community_prices rather than
    served as a per-unit price: with no size, the recorded Naira figure is
    the price of a package of unknown quantity, and no division can recover
    a per-unit price.  The set is all of W3's g/cl rows whose free-text
    c8q2b is blank: 11,170 of the files' 11,171 g/cl rows (8,557 at the 1st
    location, 2,614 at the 2nd; the 11,171st parses '50cl' and is derived,
    not dropped).  An earlier version of this entry said "13,767 of 13,768";
    the held files, decoded by today's _canon_community_unit, hold 11,171
    (measured 2026-11-13, burst job 41275442), which is also what the build
    drops and these inputs return, and W5's 182 rows -- 133 on '2. GRAMS (G)' and 49 on
    '4. CENTLITRES (CL)' (served as 'l' until GH #587 corrected the decoder)
    -- whose coded size c8aq2_c is blank.  W4 drops NOTHING under this rule: its 1,191 rows on raw unit
    code 1 read '1. KILOGRAMS (KG)' in sectc8_harvestw4.dta (pre-#834 prose
    described them as a dropped 'Grams(g)' unit -- that spelling is not
    what the file decodes to), a blank size beside KILOGRAMS reads as one
    kilogram, and those rows are served.  W4/W5 rows carrying the
    questionnaire's own '99. ONE SIZE ONLY' code are EXEMPT -- that code is
    the survey's statement that the item is priced in one size only, so the
    price IS of one unit.  W3's 3,433 Kg / l rows with the same blank free
    text (2,597 Kg, 836 l) were in this set until GH #587's "Measure PH,
    then align" (ruling @ligon 2026-11-12): measured 2026-11-13 against the
    same round's household unit value they price per kilogram / per litre
    (median 1.000 / 1.14 on matched (v, j) cells), so they are served as
    recorded, as PP W3's 4,120 are; a blank size beside a base metric unit
    reads as one unit, as W4's does.
  function: lsms_library.countries.Nigeria.2018-19._.mapping:inputs_c8_unrecorded_size_drop
  inputs: lsms_library.countries.Nigeria.2018-19._.mapping:inputs_c8_unrecorded_size_drop
  raw_variables: [c8q2, c8q2b, c8q2c, c8q3, c8aq2_b, c8aq2_c, c8aq3,
                  item_cd, state, lga, ea]
  assumptions:
    - text: >-
        a price recorded beside a metric unit with no recoverable size
        cannot be normalised to a per-unit price, so dropping the row is
        honest where serving it would be wrong; the alternative -- serving
        the package price under `g`/`cl` -- measured 1/189 and 1/42 of the
        household unit value pre-fix, i.e. wrong by the package size.
      basis: modelling-choice
      evidence: >-
        GH #834; Nigeria/_/CONTENTS.org "The C8 SIZE field"; the derivation
        Nigeria::community_prices::c8-metric-size, whose second assumption
        records the same drop from the serving side.
  validated_against: >-
    the build's own drop predicate: `derivation_inputs` returns exactly the
    source rows the wave scripts remove -- 11,170 rows for 2015-16 (g / cl
    only since GH #587, 2026-11-13; 14,603 with the Kg / l rows before), 0 for 2018-19, 182 for 2023-24 (133 g + 49
    cl, GH #587) -- and every
    served row of community_prices under a metric unit either carries the
    c8-metric-size key or sits on a base unit whose blank size reads as one
    unit.
  contents: Nigeria/_/CONTENTS.org, "The C8 SIZE field" (GH #834)
  since: '2026-09-13'

# ---------------------------------------------------------------------------
# GH #587 (rulings @ligon 2026-11-12): the POST-PLANTING community prices.
# Every PP community form prices food in Section C2 (CONTENTS.org corrects the
# old "C8 is post-harvest only" entry).  PP rows are built by
# _/pp_community_prices.py; each served construction and each priced row left
# unserved is one entry below.  The PH entries above are untouched: their
# `inputs` return PH rows only, so PP rows get their own keys.
# ---------------------------------------------------------------------------
Nigeria::community_prices::pp-w1-number-of-units:
  waves: ['2010-11']
  columns: [Price]
  rows: {t: '2010Q3', u: [g, ml, l]}
  rule: >-
    Price = sc2q3a / sc2q3b on W1 post-planting (2010Q3) rows whose Number of
    Units sc2q3b exceeds 1, on the bands where the division is supported by
    the evidence: g and ml with N >= 6 and l with N 2-50 (2,725 rows: g
    2,017 = 263 at N 6-50 + 1,754 at N > 50; ml 372 = 44 + 328; l 336 = 183
    at N 2-5 + 153 at N 6-50).  The other N > 1 rows are either divided
    under their own key marking the division unvalidated
    (pp-w1-number-of-units-unvalidated: non-metric N 2-50, Kg N 2-5, every
    Unknown-unit row) or held (pp-w1-metric-small-count-hold,
    pp-w1-kg-mid-count-hold, pp-w1-nonmetric-count-as-size-hold,
    pp-w1-count-as-size-hold).  Rows with sc2q3b = 1 are served as recorded
    (no key), except g / ml (pp-w1-metric-package-hold); rows with no count
    are not served (pp-w1-no-count-hold).
  function: lsms_library.countries.Nigeria._.pp_community_prices:derive_pp_w1_unit_price
  inputs: lsms_library.countries.Nigeria._.pp_community_prices:inputs_pp_w1_number_of_units
  raw_variables: [state, lga, ea, item_cd, sc2q2, sc2q3a, sc2q3b, sc2q3c]
  assumptions:
    - text: >-
        the W1 PP form records the price in three columns -- "What is the
        price for the item?  Naira | Number of Units | Unit Codes" -- and,
        unlike W2-W5, prints no "quantity of one" instruction.
      basis: questionnaire
      evidence: >-
        2010-11 Community_Questionnaire_Final (1).pdf, Section 2 "Food
        Prices", PDF pp.5-8; sectc2_plantingw1.dta variable labels "What is
        the price for [ITEM]? (Naira)" / "(Number of units)" / "(unit code)".
    - text: >-
        the Naira figure is the price of all sc2q3b units together, so one
        unit costs sc2q3a / sc2q3b.  Ruled by the maintainer ("Register the
        division", 2026-11-12); the form does not state it in words.
      basis: modelling-choice
      evidence: >-
        .sucoder/isa-decisions.org, 2026-11-12 GH587 second round; GH #587
        mapping report (burst isa-sm-20261112 reports/587-mapping) section 4.
    - text: >-
        on these bands the divided price agrees with an outside reference.
        Median divided price / reference, share within 2x in brackets:
        against the same round's household unit value (food_acquired
        purchased Expenditure / Quantity, same (v, j, u) cell; its Kg N = 1
        rows calibrate it at 1.05) g N 6-50 1.01 (90 cells, 44%), g N > 50
        0.75 (566, 58%), ml N > 50 1.00 (27, 74%), l N 2-5 1.00 (84, 79%);
        against PH 2011Q1's community price in the same cluster (its l
        N = 1 rows calibrate it at 0.85) l N 2-5 0.89 (53, 77%).  Undivided
        the same rows sit at 30x / 233x / 330x / 3.9x household.  l N 6-50
        is mixed -- 0.67 household (79 cells, 54%), 0.71 PH (40), 0.12
        against W1's own l N = 1 price (147 rows) -- and ml N 6-50 has no
        matched cell; both stay here by the ruling ("Supported bands (g other
        N, ml, l) stay under the existing division key").
      basis: modelling-choice
      evidence: >-
        GH #587 red team (burst isa-sm-20261112 reports/587-redteam/VERDICT.md
        F1, F2; probe2 / probe3); .sucoder/isa-decisions.org 2026-11-12
        ("GH587 W1 division after red team").
  validated_against: >-
    household unit values and PH 2011Q1 community prices on matched cells
    (the second assumption); derivation_inputs joins the 2,725 stamped rows
    and the registered function reproduces their Price.
  contents: Nigeria/_/CONTENTS.org, "Post-planting community prices (GH #587)"
  since: '2026-11-12'

# The same W1 division on the bands NO comparator validates: a separate key,
# so a user can see -- and drop -- the rows whose basis is unvalidated.
Nigeria::community_prices::pp-w1-number-of-units-unvalidated:
  waves: ['2010-11']
  columns: [Price]
  # Selector by t only, so it nominally spans every 2010Q3 row; the rows it
  # stamps are on u = Kg, Unknown and the W1 non-metric units -- never on
  # g / ml / l, which carry pp-w1-number-of-units or a hold.
  rows: {t: '2010Q3'}
  rule: >-
    Price = sc2q3a / sc2q3b, as pp-w1-number-of-units, on the W1
    post-planting (2010Q3) rows the ruling keeps divided although no
    comparator validates the division (3,629 rows): non-metric units
    (every W1 unit but Kg / g / l / ml) with Number of Units 2-50 (3,033:
    1,432 at N 2-5, 1,601 at N 6-50), Kg with N 2-5 (547) and every
    Unknown-unit row with N > 1 (49: 20 at N 2-5, 26 at N 6-50, 3 above
    50).  Ruled 2026-11-12, "Flag them, hold g N 2-5".  The 3 Unknown rows
    above 50 show the signature of the held non-metric N > 50 band (0.005x
    divided, 0.99x undivided, on 2 matched rows); they are divided here
    only because the ruling names all 49 Unknown-unit rows.
  function: lsms_library.countries.Nigeria._.pp_community_prices:derive_pp_w1_unit_price
  inputs: lsms_library.countries.Nigeria._.pp_community_prices:inputs_pp_w1_number_of_units_unvalidated
  raw_variables: [state, lga, ea, item_cd, sc2q2, sc2q3a, sc2q3b, sc2q3c]
  assumptions:
    - text: >-
        the Naira figure is the price of all sc2q3b units together (the
        pp-w1-number-of-units reading).  On these bands NEITHER reading
        fits.  Median price / reference (share within 2x), divided vs
        undivided: non-metric against W1's own N = 1 price for the same
        (j, u), N 2-5 0.50 (42%) vs 1.67 (32%) on 1,240 rows, N 6-50 0.14
        (17%) vs 1.5 (39%) on 1,408; against PH 2011Q1 in the same cluster
        (N = 1 calibrates at 1.00) 0.40 / 0.20 divided.  By unit, divided /
        N = 1: Piece 0.25 (1,735 rows), Basket 0.05, Bunch 0.19, Tuber
        0.33, Congo/Mudu 0.33, Milk cup 0.63, Cigarette cup 0.89 (the one
        fit), other specify 0.024 (pools several units).  Kg N 2-5: 0.75
        household (237 cells), 0.56 PH (266), 0.60 W1 N = 1 (534) divided,
        against 1.67 / 1.43 / 1.6 undivided.  Unknown: 0.38 / 0.23 / 0.005
        at N 2-5 / 6-50 / > 50 divided against W1's Unknown N = 1 price
        (13 / 12 / 2 rows), 1.1 / 1.75 / 0.99 undivided.  Within each item
        and unit the elasticity of the Naira figure with respect to N is
        0.47 (non-metric), 0.46 (Kg), 0.41 (Unknown) -- between the 0 of a
        count that is a size and the 1 of a true count.
      basis: modelling-choice
      evidence: >-
        GH #587 red team (burst isa-sm-20261112 reports/587-redteam/VERDICT.md
        F1; probe2 / probe3).
    - text: >-
        the within-W1 reference and the elasticity assume N is unrelated to
        the size of what is priced; "5 small pieces" beside another
        cluster's "1 large piece" would produce the same pattern under a
        correct division, and base u folds W1's size into Size.  So these
        rows are UNVALIDATED, not refuted, and are served divided under
        this key -- the maintainer's choice over holding them or serving
        them as recorded.  Ruled 2026-11-12, "Flag them, hold g N 2-5".
      basis: modelling-choice
      evidence: >-
        .sucoder/isa-decisions.org 2026-11-12 ("GH587 W1 division after red
        team"); red team VERDICT.md F1 caveat.
  contents: Nigeria/_/CONTENTS.org, "Post-planting community prices (GH #587)"
  since: '2026-11-12'

Nigeria::community_prices::pp-c2-metric-size:
  waves: ['2018-19', '2023-24']
  columns: [Price]
  rows: {t: ['2018Q3', '2023Q3'], u: [g, cl]}
  rule: >-
    The PH c8-metric-size division, applied to the post-planting C2 rows
    (ruling 2026-11-12, "Reuse PH c8-metric-size"): where the W4/W5 PP SIZE
    field c2q2c states a metric quantity ('24. 75 CL', '34. 250 GRAMS',
    '11. 50 KG', ...), Price = c2q3 / size_quantity with the quantity in g
    or cl, and `u` becomes 'g' / 'cl'.  The same decoder
    (nigeria._c8_size_metric_grams) and the same function as the PH entry.
    Ordinal sizes and '99. ONE SIZE ONLY' are not divided.  `Size` keeps the
    recorded size label.  Rows: 2018Q3 3,156; 2023Q3 4,619, of which 63 are
    W5 Bottle/Can rows whose c2q2a Quantity is not 1 (ruling 2026-11-12,
    "Serve the 63 via c8"): divided by the coded size like the others, their
    c2q2a unused.
  function: lsms_library.countries.Nigeria.2018-19._.mapping:derive_c8_metric_package_unit_price
  inputs: lsms_library.countries.Nigeria._.pp_community_prices:inputs_pp_c2_metric_size
  raw_variables: [state, lga, ea, item_cd, c2q1, c2q2, c2q2b, c2q2c, c2q2a,
                  c2q2_cvn, c2q3]
  assumptions:
    - text: >-
        the PP C2 form prints the PH C8 wording -- "PLEASE USE A QUANTITY OF
        ONE (1) FOR [ITEM] AND THE UNIT OF MEASURE YOU ARE USING" over UNIT
        and SIZE, then "What is the price for the item?" in NAIRA -- so the
        price beside a metric size is of one package of that size.
      basis: questionnaire
      evidence: >-
        pp_w4_community_quest.pdf, C2 Food Prices, PDF pp.5-9 (size card
        p.13); ghs_panel_w5_pp_community_questionnaire.pdf, Section C2, PDF
        pp.6-11; the PH entry Nigeria::community_prices::c8-metric-size.
    - text: >-
        PP and PH treat these rows alike: the PH rule is reused, not
        re-derived.  Ruled by the maintainer 2026-11-12 for this rule only.
      basis: modelling-choice
      evidence: .sucoder/isa-decisions.org, 2026-11-12 GH587 second round.
    - text: >-
        a W5 Bottle/Can row with a coded metric size is the price of one
        package of that size even where its c2q2a Quantity is not 1 (63
        rows; sizes 33 CL to 1.5 LITRE).  c2q2a restates the coded size on
        8 of the 63; what it means on the other 55 is not established, and
        it is not used.  Divided by the size they sit at 0.96x the same
        round's other pp-c2-metric-size rows (median against the item-unit
        median, 62 matched, p10-p90 0.88-1.07, all within 2x) and 0.70x PH
        2024Q1's c8-metric-size (62, all within 2x).  The other 60 W5 rows recording a c2q2a other than
        1 stay held (pp-w5-quantity-not-one-hold).  Ruled 2026-11-12,
        "Serve the 63 via c8".
      basis: modelling-choice
      evidence: >-
        .sucoder/isa-decisions.org 2026-11-12 ("GH587 label judgements and
        two follow-ups"); sectc2_plantingw5.dta c2q2a / c2q2c (aggregates in
        burst isa-sm-20261112 reports/587-final).
  contents: Nigeria/_/CONTENTS.org, "Post-planting community prices (GH #587)"
  since: '2026-11-12'

# W5 PP gram / centilitre rows with no SIZE: the package is stated in c2q2a.
Nigeria::community_prices::pp-w5-metric-unit-quantity:
  waves: ['2023-24']
  columns: [Price]
  rows: {t: '2023Q3', u: [g, cl]}
  rule: >-
    Price = c2q3 / c2q2a on W5 post-planting (2023Q3) rows whose unit c2q2b
    is '2. GRAMS (G)' or '4. CENTLITRES (CL)', whose SIZE c2q2c is blank,
    and which record a positive Quantity c2q2a (208 rows: 176 g, 32 cl):
    the price of ONE gram / centilitre, `u` staying 'g' / 'cl'.  The 23 such
    rows with no c2q2a stay held (pp-unrecorded-size-hold).  Ruled
    2026-11-12, "Serve W3 kg/l and W5 g/cl".
  function: lsms_library.countries.Nigeria._.pp_community_prices:derive_pp_w5_metric_unit_price
  inputs: lsms_library.countries.Nigeria._.pp_community_prices:inputs_pp_w5_metric_unit_quantity
  raw_variables: [state, lga, ea, item_cd, c2q1, c2q2a, c2q2b, c2q2b_os, c2q2c,
                  c2q2_cvn, c2q3]
  assumptions:
    - text: >-
        c2q2a counts the unit c2q2b names: the .dta labels c2q2a "Quantity"
        beside c2q2b "Unit of measurement", and c2q2_cvn "conversion factor
        item-unit-size-zone" is 0.001 on every g row and 0.01 on every cl
        row that carries it (196 of the 208), a per-gram / per-centilitre
        kg / l factor.  No label states that the quantity is the package
        priced.
      basis: variable-label
      evidence: >-
        sectc2_plantingw5.dta variable labels and c2q2_cvn values
        (aggregates in the GH #587 final wiring report, burst
        isa-sm-20261112 reports/587-wiring-final).
    - text: >-
        on these rows c2q2a is the size of the package the Naira price c2q3
        is for, in grams / centilitres.  No document says so: the printed
        PP form has no quantity column (Section C2, PDF pp.6-11), and the
        PP supervisor manual's C2 instructions ask for "the UNIT for ONE
        quantity" and "the price for ONE quantity" (PDF pp.22-23).  The
        file's Other-unit text c2q2b_os, non-blank on all 231 g / cl
        no-size rows, states the package (a gram figure, a gram figure with
        a container word, a millilitre figure with a container word): on
        the 176 g rows c2q2a equals the text's gram figure on
        172 and a number in the text on 175 (one only to float32
        precision).  On the 32 cl rows the text states millilitres and
        c2q2a equals that figure / 10 -- centilitres -- on all 32, the
        ml-to-cl conversion the W5 household manual instructs ("500ml is
        50cl", PP interviewer manual PDF p.66).  One g row is unresolved:
        its text has a letter inside its number and most plausibly states
        a package about 12x its c2q2a, so its served price may be about 12x
        high (it sits above the p90 of the divided g rows); it is served as
        ruled, with the other 207.  No text states a unit other than the
        row's.  The 23 rows without c2q2a have no number in their text.
      basis: modelling-choice
      evidence: >-
        sectc2_plantingw5.dta values (aggregates in the GH #587 final
        wiring report); ghs_panel_w5_pp_community_questionnaire.pdf;
        ghs_panel_w5_pp_supervisor_manual.pdf "SECTION C2: FOOD PRICES";
        ghs_panel_w5_pp_interviewer_manual.pdf p.66.
    - text: >-
        so the price of one gram / centilitre is c2q3 / c2q2a.  Divided,
        the rows sit at 1.5x / 1.5x the same round's pp-c2-metric-size
        per-unit prices (item medians, 6 g / 5 cl items) and 0.96x / 1.23x
        PH 2024Q1's; as recorded they sit at 543x / 13x.  W5 has no
        food_acquired, so there is no household comparator.  Ruled
        2026-11-12, "Serve W3 kg/l and W5 g/cl".
      basis: modelling-choice
      evidence: >-
        .sucoder/isa-decisions.org 2026-11-12 ("GH587 metric units with no
        recorded package size"); GH #587 wiring report (burst
        isa-sm-20261112 reports/587-wiring) section 6.
  contents: Nigeria/_/CONTENTS.org, "Post-planting community prices (GH #587)"
  since: '2026-11-12'

