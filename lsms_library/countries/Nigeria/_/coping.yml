# Coping-strategy label classes for the read-time rules of GH #1562
# (lsms_library/coping.py), applied in Country._finalize_result on every
# shocks read.  Not a build input: editing this file moves no cache hash.
#
#   filler       a slot filler, terminator or missing code: served NA in its
#                HowCoped<n> position and never a member of HowCopedSet
#                (ruling 2026-11-13, "NA in positions, not in set").
#   did_nothing  an explicit "did nothing" answer: kept in its position as
#                recorded; a HowCopedSet member only when it is the only
#                answer, dropped from the set beside a real strategy
#                (ruling 2026-11-13, "Member only when alone").
#
# A label matches the SERVED string exactly.  `waves` (served t values)
# scopes an entry; without it the entry applies to every wave.  `evidence`
# is required.  Counts are from the GH #1562 audit
# (burst/isa-sm-20261113/reports/1562-coping-audit, base f138a3d61).

# NOT classed: the unlabelled codes served as '31.0', '41.0' and '51.0' in
# 2012-13 (10 cells).  An undocumented code is not a documented missing code,
# and the ruling names only '99.0'; they stay as recorded pending the user's
# answer (GH #1562 report, questions).

did_nothing:
  - label: did nothing
    evidence: s15aq5a/b/c value label, 2010-11 (code 21).
  - label: DID NOTHING
    evidence: s15aq5a/b/c value label, 2012-13 (code 21).
  - label: 21. DID NOTHING
    evidence: >-
      s15aq5a/b/c (2015-16) and s15aq7_1..4 (2018-19) value label.
