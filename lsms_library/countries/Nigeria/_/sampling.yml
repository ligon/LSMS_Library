# Sampling design record -- HOW this survey's sample was drawn (GH #793).
#
# PANEL-ONLY (GH #942, ruling 2026-10-18, option A): each entry carries only
# the `panel:` block -- does `v` denote the same cluster as in the PRECEDING
# wave of `Country('Nigeria').waves`?  The design fields are #793's curation
# and are not written yet; their absence here is "not curated", not "not
# found".
#
# Keys are the API wave labels, which for Nigeria are the post-planting /
# post-harvest ROUNDS (2010Q3, 2011Q1, ...): a PP -> PH boundary is a revisit
# within one wave directory.  Since GH #1120 D1 (2026-10-23) each round's `v`
# comes from that round's OWN cover page, so a household that moved BETWEEN
# the two visits changes `v` at a PP -> PH boundary too (to a `moved-{hhid}`
# singleton) -- still `stable`, for the reason given below: a mover's
# singleton, not a renumbered EA.  The first round (2010Q3) has no preceding
# wave and so no entry.
#
# `v` is the composite `state/lga/ea` built from raw codes (CONTENTS.org,
# "Cluster (PSU) identifier"), and a real EA keeps it -- EXCEPT where the raw
# LGA code of a whole EA changes between waves (1 EA at 2018Q3, 12 at 2023Q3;
# measured 2026-10-19, see those entries), which renumbers that cluster's
# composite `v` and is declared `wave-scoped` (partial).  Otherwise what
# changes across a PH -> PP boundary is the households that MOVED:
# the survey records them with `ea == 0`, and the library gives each its own
# singleton `v = moved-{hhid}` rather than a fake pooled cluster.  So a mover
# has a different `v` in each round by design, not because an EA was
# renumbered.  (Whether a mover's DESIGN cluster is its original EA -- the
# BID pins its weight there -- is DESIGN.org Q7, `cluster_reference`, not
# decided.)

Sampling:

  '2011Q1':
    panel:
      household_continuity: panel
      cluster_id_continuity: stable
      cluster_id_note: |-
        Post-harvest revisit of the 2010Q3 households, from the PH cover.
        Measured: 4,939 of 4,939 linked households keep `v` (500 EAs); the PH
        cover does not list 61 of the 5,000 PP households.
      source_type: derived-from-data
      confidence: high
      source_file: null
      locator: 'slurm_logs/2026-09-18_gh942_cluster_identity/DESIGN.org §2 (Nigeria rows); re-measured 2026-10-23 through Country("Nigeria").sample() after GH #1120 D1'

