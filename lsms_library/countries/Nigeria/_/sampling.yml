    panel:
      household_continuity: panel
      cluster_id_continuity: stable
      cluster_id_note: |-
        Post-harvest revisit of the 2010Q3 households.  Over the GH #1264
        crosswalk, 4,916 of 4,916 linked households keep `v` (500 EAs).
      source_type: derived-from-data
      confidence: high
      source_file: null
      locator: 'slurm_logs/2026-09-18_gh942_cluster_identity/DESIGN.org §2 (Nigeria rows); CONTENTS.org, "Panel crosswalk rebuilt"; re-measured 2026-11-04 over _/panel_ids.json through Country("Nigeria").sample()'

