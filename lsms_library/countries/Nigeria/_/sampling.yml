      cluster_id_continuity: wave-scoped
      cluster_id_note: |-
        Partial: ONE long-panel EA (10 households) has its raw LGA code
        changed, so its composite `v` changes (16/1624/136 -> 16/1622/136,
        neither id occurring in the other wave); every other EA keeps its id.
        W4 is a partial refresh: 360 new EAs plus a 159-EA "long panel" of the
        2010 sample (BID, quoted in CONTENTS.org).  Measured over the
        long-panel households: 1,414 of 1,493 (94.7%) keep `v`; of the 79 that
