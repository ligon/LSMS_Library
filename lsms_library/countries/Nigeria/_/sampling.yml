      cluster_id_measurement:
        linked_households: 1493
        households_changed: 79
        households_changed_net_of_movers: 10
        clusters_renumbered: 1
        mover_rule: |-
          A household is a mover if it carries the `moved-{hhid}` singleton
          (`ea == 0`) on either side: 69 of the 79.  The other 10 all answer
          the W4 cover's hhsmlc ("DOES THE HOUSEHOLD LIVE AT THE SAME
          LOCATION?") with 1, YES, so none of them is a recorded mover.
        note: |-
          The 10 are one EA id whose LGA code changes (same state and EA
          serial), a one-to-one relation.  Confidence is medium, not high,
          because the "same location" of hhsmlc is read as the dwelling of
          the previous wave: the W4 interviewer manual (PDF pp. 24-25)
          supports that reading, but the round that pre-fills the address is
          not confirmed against the instrument.  The 2026-10-19 ruling on
          GH #1135 quotes this boundary as 0.67%.
        source_type: derived-from-data
        confidence: medium
        locator: 'slurm_logs/isa_backlog_2026-10-21/framework1135-Nigeria-counts/counts-safe.json, boundary 2016Q1 -> 2018Q3 (source pin f8d236694; DIAGNOSIS.md there); W4 manual reading: slurm_logs/isa_backlog_2026-10-21/1135-public-instruments/PUBLIC-INSTRUMENTS.org; GH #1135 thread'

