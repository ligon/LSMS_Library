Country: Nigeria
Wave: 2018-19

# sample and cluster_features are NOT declared here (GH #1120 D1, @ligon
# 2026-10-23).  This file is read once per ROUND (both quarters of the folder
# map to it). The former blocks named the PP cover for both rounds,
# which tagged the post-harvest round with the post-planting cover's
# households and clusters.  Each round now reads its OWN cover: see
# _/sample.py and _/cluster_features.py in this folder, nigeria.round_covers,
# and the "Sampling Design" section of ../../_/CONTENTS.org (the composite
# state/lga/ea `v`, GH #323, and the `moved-{hhid}` singleton are unchanged).

assets:
    # GH #1562: once, under the post-planting quarter.  See 2010-11/_/data_info.yml.
    file:
        - sect5_plantingw4.dta:
            t: '2018Q3'
    idxvars:
        t: hhid
        i: hhid
        j: item_cd
    myvars:
        Quantity: s5q1
        Age: s5q3
        Value: s5q4

shocks:
    # GH #1562 (ruling 2026-11-13, "W4 fills the set only").  The W4 question is
    # "How did your household cope with the most recent [SHOCK]? ... SELECT ALL
    # THAT APPLY" (ph_w4_household_quest.pdf p62): s15aq7_1..4 record WHICH
    # strategies, in entry order, not a rank.  So HowCoped0..2 are NA: the
    # mapping.py shocks hook writes HowCopedSet from all four.  Once, under the
    # post-harvest quarter.  See 2010-11/_/data_info.yml.
    file:
        - sect15a_harvestw4.dta:
            t: '2019Q1'
    idxvars:
        t: hhid
        i: hhid
        Shock: shock_cd
    myvars:
        Cope1: s15aq7_1
        Cope2: s15aq7_2
        Cope3: s15aq7_3
        Cope4: s15aq7_4

individual_education:
    # GH #171: highest education level completed per household member.
    # Post-harvest section 2 (sect2_harvestw4) s2aq9, full coverage.
    # Raw labels mapped onto the canonical ordinal vocabulary via the
    # row-additive harmonize_education table.
    file:
        - sect2_harvestw4.dta:
            t: '2019Q1'
    idxvars:
        t: hhid
        i: hhid
        pid: indiv
    myvars:
        Educational Attainment:
            - s2aq9
            - mappings: ['harmonize_education', 'Original Label', 'Preferred Label']
