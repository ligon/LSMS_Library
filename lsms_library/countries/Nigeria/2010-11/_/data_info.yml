Country: Nigeria
Wave: 2010-11

# sample and cluster_features are NOT declared here (GH #1120 D1, @ligon
# 2026-10-23).  This file is read once per ROUND (both quarters of the folder
# map to it). The former blocks named the PP cover for both rounds,
# which tagged the post-harvest round with the post-planting cover's
# households and clusters.  Each round now reads its OWN cover: see
# _/sample.py and _/cluster_features.py in this folder, nigeria.round_covers,
# and the "Sampling Design" section of ../../_/CONTENTS.org (the composite
# state/lga/ea `v`, GH #323, and the `moved-{hhid}` singleton are unchanged).

assets:
    # GH #1562: read ONCE, under the post-planting quarter its file belongs to.
    # This folder is read once per round, so an unpinned block was served under
    # both quarters (the shocks defect; individual_education pins the same way).
    file:
        - Post Planting Wave 1/Household/sect5_plantingw1.dta:
            t: '2010Q3'
    idxvars:
        t: hhid
        i: hhid
        j: item_cd
    myvars:
        Quantity: s5q1

shocks:
    # GH #1562 (ruling 2026-11-13).  Read ONCE, under the post-harvest quarter
    # whose file this is, as individual_education is; unpinned, the block was
    # served under both quarters (2,200 rows twice).  s15aq5a..d are the four
    # ranked columns ("1st".."4th"), so the fourth is HowCoped3.  HowCopedSet is
    # derived from the four at read time (lsms_library/coping.py).
    file:
        - Post Harvest Wave 1/Household/sect15a_harvestw1.dta:
            t: '2011Q1'
    idxvars:
        t: hhid
        i: hhid
        Shock: shock_cd
    myvars:
        HowCoped0: s15aq5a
        HowCoped1: s15aq5b
        HowCoped2: s15aq5c
        HowCoped3: s15aq5d

individual_education:
    # GH #171: highest education level completed per household member.
    # Post-harvest section 2 (sect2a_harvestw1) records s2aq9 ("highest
    # level completed") only for members who had LEFT school -> low
    # coverage (~640 rows) in W1.  Raw labels mapped onto the canonical
    # ordinal vocabulary via the row-additive harmonize_education table
    # (global base + Nigeria delta in _/categorical_mapping.org).
    # GH #1713 (ruling @ligon 2026-11-13, "Wire W1/W2 PP + verdicts"): the
    # POST-PLANTING round fields its own full Section 2 (sect2_plantingw1,
    # 23,321 members; s2q7 "highest educational level completed" on 17,116),
    # served under its own t = 2010Q3.  Distinct series, never pooled with
    # the PH new-member block.
    file:
        - Post Harvest Wave 1/Household/sect2a_harvestw1.dta:
            t: '2011Q1'
        - Post Planting Wave 1/Household/sect2_plantingw1.dta:
            t: '2010Q3'
            Educational Attainment:
                - s2q7
                - mappings: ['harmonize_education', 'Original Label', 'Preferred Label']
    idxvars:
        t: hhid
        i: hhid
        pid: indiv
    myvars:
        Educational Attainment:
            - s2aq9
            - mappings: ['harmonize_education', 'Original Label', 'Preferred Label']
