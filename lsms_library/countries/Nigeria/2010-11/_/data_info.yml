Country: Nigeria
Wave: 2010-11

# sample and cluster_features are NOT declared here (GH #1120 D1, @ligon
# 2026-10-23).  This file is read once per ROUND (both quarters of the folder
# map to it), so a YAML block can only read one cover page for both rounds --
# which is what tagged the post-harvest round with the post-planting cover's
# households and clusters.  Each round now reads its OWN cover: see
# _/sample.py and _/cluster_features.py in this folder, nigeria.round_covers,
# and the "Sampling Design" section of ../../_/CONTENTS.org (the composite
# state/lga/ea `v`, GH #323, and the `moved-{hhid}` singleton are unchanged).

assets:
    file: Post Planting Wave 1/Household/sect5_plantingw1.dta
    idxvars:
        i: hhid
        j: item_cd
    myvars:
        Quantity: s5q1

shocks:
    file: Post Harvest Wave 1/Household/sect15a_harvestw1.dta
    idxvars:
        i: hhid
        Shock: shock_cd
    myvars:
        HowCoped0: s15aq5a
        HowCoped1: s15aq5b
        HowCoped2: s15aq5c

individual_education:
    # GH #171: highest education level completed per household member.
    # Post-harvest section 2 (sect2a_harvestw1) records s2aq9 ("highest
    # level completed") only for members who had LEFT school -> low
    # coverage (~640 rows) in W1.  Raw labels mapped onto the canonical
    # ordinal vocabulary via the row-additive harmonize_education table
    # (global base + Nigeria delta in _/categorical_mapping.org).
    file: Post Harvest Wave 1/Household/sect2a_harvestw1.dta
    idxvars:
        i: hhid
        pid: indiv
    myvars:
        Educational Attainment:
            - s2aq9
            - mappings: ['harmonize_education', 'Original Label', 'Preferred Label']
