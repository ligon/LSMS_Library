Country: Nigeria
Wave: 2012-13

# sample and cluster_features are NOT declared here (GH #1120 D1, @ligon
# 2026-10-23).  This file is read once per ROUND (both quarters of the folder
# map to it). The former blocks named the PP cover for both rounds,
# which tagged the post-harvest round with the post-planting cover's
# households and clusters.  Each round now reads its OWN cover: see
# _/sample.py and _/cluster_features.py in this folder, nigeria.round_covers,
# and the "Sampling Design" section of ../../_/CONTENTS.org (the composite
# state/lga/ea `v`, GH #323, and the `moved-{hhid}` singleton are unchanged).

assets:
    dfs:
        - df_qty
        - df_detail
    df_qty:
        file: Post Planting Wave 2/Household/sect5a_plantingw2.dta
        idxvars:
            i: hhid
            j: item_cd
        myvars:
            Quantity: s5q1
    df_detail:
        file: Post Planting Wave 2/Household/sect5b_plantingw2.dta
        idxvars:
            i: hhid
            j: item_cd
        myvars:
            Age: s5q3
            Value: s5q4
    merge_on:
        - i
        - j
    final_index:
        - t
        - i
        - j

shocks:
    file: Post Harvest Wave 2/Household/sect15a_harvestw2.dta
    idxvars:
        i: hhid
        Shock: shock_cd
    myvars:
        HowCoped0: s15aq5a
        HowCoped1: s15aq5b
        HowCoped2: s15aq5c

individual_education:
    # GH #171: highest education level completed per household member.
    # Post-harvest section 2A records s2aq9 for new members aged 5+
    # who ever attended school (313 held-source answers, including 175
    # current students). See CONTENTS.org; not a left-school-only series.
    # Raw labels mapped onto the canonical ordinal vocabulary via the
    # row-additive harmonize_education table.
    # GH #1713 (ruling @ligon 2026-11-13, "Wire W1/W2 PP + verdicts"): the
    # POST-PLANTING round fields its own full Section 2 (sect2_plantingw2,
    # 27,165 members; s2q8 "HIGHEST EDUCATIONAL LEVEL COMPLETED" on 17,403),
    # served under its own t = 2012Q3.  Distinct series, never pooled with
    # the PH new-member block.
    file:
        - Post Harvest Wave 2/Household/sect2a_harvestw2.dta:
            t: '2013Q1'
        - Post Planting Wave 2/Household/sect2_plantingw2.dta:
            t: '2012Q3'
            Educational Attainment:
                - s2q8
                - mappings: ['harmonize_education', 'Original Label', 'Preferred Label']
    idxvars:
        t: hhid
        i: hhid
        pid: indiv
    myvars:
        Educational Attainment:
            - s2aq9
            - mappings: ['harmonize_education', 'Original Label', 'Preferred Label']
