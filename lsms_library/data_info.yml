Single Index:
  v: cluster
  i: household id
  j: expenditure item
  t: wave
  pid: individual id
  plot_id: plot id
  int_t: interview date
  # `u` -- unit.  CANONICAL MISSING-UNIT SENTINEL: `Unknown` (GH #842/#847).
  #
  # A survey that records an amount and no unit must put `Unknown` on `u`, NOT
  # a null.  `u` is a DECLARED index level in every table that has it
  # (food_acquired, food_prices, food_quantities, crop_production, plot_inputs,
  # community_prices), and a NaN on a declared index level is a DEFERRED SILENT
  # DELETION: the row is served, so no build-time guard fires, and it then
  # vanishes in whichever `groupby` runs first -- `_finalize_result`'s canonical
  # de-dup, `Feature()` assembly, or the consumer's own aggregation -- because
  # pandas `groupby(dropna=True)` drops NaN keys.  The loss is counted nowhere
  # and is attributed to the consumer's code.  See CLAUDE.md "Grain Collapse"
  # §3b, and the identical argument for `crop_production.condition`'s
  # `unknown_condition` under `Columns:` below.
  #
  # `Unknown` is the spelling already in force: it is the non-ordinal sentinel
  # for `individual_education.Educational Attainment` (see below), and Uganda's
  # `crop_production` already writes it onto this very level.  Niger's four
  # `u` tables joined it in #842 (its `_/categorical_mapping.org` maps
  # `Manquant`/`manquant`/`produit absent` onto it, at build AND read time).
  #
  # CONSUMER RULE: `u == 'Unknown'` is NOT a unit.  Exclude it before any
  # per-unit price, quantity or conversion, and REPORT how many rows you
  # excluded.  Keeping it silently yields a price per nothing; dropping it
  # silently is the bug the sentinel exists to make visible.
  #
  # NOT declared as a `spellings:` block under `Columns:`, deliberately:
  # `diagnostics._check_declared_spellings` reads a `spellings` block as a
  # CLOSED vocabulary and fails every value outside it, and the `u` vocabulary
  # is deliberately open (cross-country unit harmonization is GH #223).
  # Measured 2026-09-09: declaring it that way grades `fail` on every real unit
  # in every food/crop country.
  u: unit
  m: region
  s: acquisition source       # values: purchased, produced, inkind, other (food_acquired)

Index Info:
  note: global index info
  index_info:
    cluster_features: (t, v)
    household_roster: (t, v, i, pid)
    household_characteristics: (t, v, i, m)
    plot_features: (t, v, i, plot_id)
    food_acquired: (t, v, i, j, u, s)
    interview_date: (t, v, i, visit)
    shocks: (t, i, Shock)
    panel_ids: (t, i)
    assets: (t, i, j)
    individual_education: (t, v, i, pid)
    food_prices: (t, v, i, j, u, s)
    food_quantities: (t, v, i, j, u, s)
    # GH #496: register so Feature() assembles a named MultiIndex instead of
    # collapsing to a single object-tuple Index.  livestock is homogeneous
    # across countries; people_last7days is (t,v,i,pid) for all but Uganda
    # (reduced to (t,v,i) -- handled as a reduced-index country).  The other
    # two plot-level ag features (plot_labor/plot_inputs) are still NOT here:
    # their per-country index NAMES diverge (plot vs plot_id, crop vs j) and
    # need harmonizing before registration -- GH #569.  The plot axis half of
    # that divergence is settled: `plot_id` is the canonical spelling
    # EVERYWHERE (@ligon, 2026-09-10) -- it is what all 23 `plot_features`
    # countries already declare -- and `plot` is the alias.  crop_production is
    # registered below; the name divergence is now handled DECLARATIVELY by
    # `level_aliases`, so the same treatment generalises to the other two.
    livestock: (t, i, animal)
    people_last7days: (t, v, i, pid)
    # GH #817: `nonfood_expenditures` shipped in two shapes -- Togo long
    # (t, i, j), Uganda/Nigeria a WIDE item-by-household matrix with `m` baked
    # into the index -- and had no entry here, so nothing checked the cross-
    # country assembly.  Registered with `v` present, which is what arms
    # `_join_v_from_sample` (the table is household-grain and must NOT emit v
    # itself); no `skip_extra` entry is therefore needed below.
    nonfood_expenditures: (t, v, i, j)
    # GH #569/#775.  The canonical crop grain is the one the `KgFactor` note
    # under `Columns:` already states -- "(t, i, plot_id, j, u, condition,
    # season) and are never summed across `u` or `condition`" -- plus `v`, which
    # every
    # frame carries because `_join_v_from_sample` adds it at API time (the same
    # reason food_acquired is registered `(t, v, i, j, u, s)` while every
    # country declares `(t, i, j, u, s)`).  KEEPING `v` HERE IS LOAD-BEARING:
    # `country._compute_no_v_join` exempts any table whose canonical index omits
    # `v`, so registering without it would silently strip `v` from every
    # `Country(...).crop_production()` frame in the corpus.
    #
    # Registration alone would have kept nothing extra: only Uganda declares the
    # full shape.  What makes it work is `level_aliases` (plot -> plot_id, crop
    # -> j) and `missing_level_sentinels` below -- see `feature.py`'s
    # `_align_to_canonical_levels`.
    #
    # The plot axis is `plot_id`, not `plot` (@ligon, 2026-09-10).  `plot_id` is
    # what `plot_features` declares in all 23 countries that have it, and what
    # Ethiopia / GhanaSPS / Tanzania already declare on crop_production; `plot`
    # was Uganda's spelling and is now an ALIAS.  See
    # `.coder/ledger/crop-production-plot-id.md`.
    crop_production: (t, v, i, plot_id, j, u, condition, season)

  # Per-feature canonical level-name ALIASES: `<the name a country emits>:
  # <the canonical name>`.  Applied by `feature._rename_index_levels` to each
  # country's frame BEFORE alignment, so a country that names the same axis
  # differently stacks instead of being excluded by the kept-shape filter.
  #
  # This is the mechanism GH #569 asked for.  It is a RENAME, never a
  # re-interpretation: only add a pair when the two names denote the SAME axis
  # with the SAME vocabulary.  crop/j are both the harmonize_crop ->
  # harmonize_food Preferred Label (the fact `transformations._CROP_LEVELS`
  # already encodes); plot/plot_id are both the within-household plot key,
  # `plot_id` being the canonical spelling (see the `crop_production` entry
  # above).  A rename does NOT make two plot VOCABULARIES joinable: Uganda's
  # `crop_production` keys plots `{hhid}-{parcel}-{plot}` while its
  # `plot_features` keys them `{parcel}_{suffix}`, which is exactly what
  # `transformations._parcel_from_crop_plot` exists for.
  level_aliases:
    crop_production:
      plot: plot_id
      crop: j

  # Per-feature SENTINEL for a canonical index level a country does not carry.
  # Distinct from `fabricate_missing_levels` above in the one way that matters:
  # that fills with `pd.NA`, and a NULL on a declared index level is a DEFERRED
  # SILENT DELETION (CLAUDE.md "Grain Collapse" 3b -- `groupby(dropna=True)`
  # deletes the row in whichever aggregation runs first).  A sentinel is a real,
  # greppable value, so the row survives and the absence is visible.  Prefer
  # this to `fabricate_missing_levels` for any NEW feature.
  #
  # Declaring a level here also licenses PROMOTION: if the country carries that
  # canonical level as a COLUMN rather than an index level, `feature.py` moves
  # it into the index (null-filled with this sentinel) instead of fabricating a
  # sentinel over real values.  That is what keeps Mali / Nigeria / Tanzania --
  # each of which reports a real `u` in a column -- in the assembly.
  #
  # crop_production:
  #   u        -- `Unknown` is the canonical missing-unit sentinel already in
  #               force corpus-wide; see the `u:` comment at the top of this file.
  #   condition-- `unknown_condition` is the value `Columns: crop_production:
  #               condition` already defines ("a real value, never NA").
  #   season   -- `unknown_season`, new here, same argument.
  missing_level_sentinels:
    crop_production:
      u: Unknown
      condition: unknown_condition
      season: unknown_season

  # Features whose reduced-index countries get their MISSING canonical levels
  # FABRICATED as NaN (so all countries share the full canonical shape and are
  # KEPT) instead of being modal-excluded.  Use only where the reduced shape is
  # legitimate variation, not an incompatible table.
  # interview_date (#506): EHCVM countries are genuinely per-visit (t,v,i,visit);
  # single-visit countries get visit=NaN so Feature() keeps the per-visit dates
  # instead of dropping `visit` and first()-collapsing one date per household.
  fabricate_missing_levels:
    - interview_date

# Cluster-id (v) join policy.  _finalize_result() joins v from sample() onto
# household-level (i, t) tables that lack it.  A table is SKIPPED when its
# canonical index in `index_info` above omits v, OR when it is listed in
# `skip_extra` below.  Declarative (GH #436, code/config separation): adding a
# feature whose canonical index has no v needs no framework-code edit -- declare
# its index in `index_info`, or (for tables not yet there) add it to skip_extra.
# If this whole section is absent (e.g. an older data_info.yml is loaded), the
# framework falls back to its historical hardcoded set rather than re-enabling
# the join, so behavior never silently changes under version skew.
Join v from sample:
  skip_extra:
    # Framework-special or not-yet-in-index_info tables:
    #   sample            -- the v source itself (also already carries a v column)
    #   cluster_features  -- keyed by (t, v) directly; has no i, so never joined
    #   panel_ids/updated_ids -- dict @property tables, not (i, t) frames
    #   livestock/income  -- household tables not yet declared in index_info
    - sample
    - cluster_features
    - panel_ids
    - updated_ids
    - livestock
    - income

# Canonical column definitions for cross-country tables.
# 'required: true' means every country declaring this table must include
# the column.  'spellings' is an inverse dictionary: each key is the
# canonical value, its list contains accepted variant spellings that the
# runtime maps to the canonical form.  The canonical values are simply
# spellings.keys().
Columns:
  household_roster:
    # Kinship decomposition (Kroeber 1909; Romney & D'Andrade 1964).
    # Sex x Generation x Distance x Affinity recovers all conventional
    # relationship labels without redundancy.  A component the instrument
    # does not determine is NULL (kinship.yml header, GH #698/#797): an
    # "other relative" is [null, null, consanguineal], a "relative of head
    # or spouse" [null, null, null].  Nulls in Generation/Distance are
    # therefore data, not defects, for those rows.
    Sex:
      type: str
      required: true
      spellings:
        # English / French covered by the original list; Portuguese
        # (Masculino / Feminino) added for Guinea-Bissau; Spanish
        # (masculino / femenino, lowercase) for Guatemala; bare
        # 'Feminin' (capital, no accent) for Burkina_Faso.
        M: [Male, male, Masculin, masculin, Homme, homme, m, MALE,
            Masculino, masculino]
        F: [Female, female, Féminin, feminin, Femme, femme, f, FEMALE,
            Feminin, Feminino, femenino]
    Age:
      # Float64 (pandas nullable) so DOB-derived fractional ages
      # survive (e.g. age_handler returns 3.8 from a (DOB, interview)
      # pair).  Int64 round-then-cast was reverted in v0.7.2 because
      # it pushed boundary-fractional ages into the wrong demographic
      # bracket via pd.cut(..., right=False) in age_intervals().
      type: float
      required: true
    Relationship:
      type: str
      required: true
      note: original survey label for relationship to household head
    Generation:
      type: int
      required: true
      api_derived: true
      note: vertical distance from head (0=same, +1=parent, -1=child, etc.)
    Distance:
      type: int
      required: true
      api_derived: true
      note: collateral distance (0=lineal, 1=sibling line, 2=cousin line)
    Affinity:
      type: str
      required: true
      api_derived: true
      spellings:
        consanguineal: []
        affinal: []
        step: []
        foster: []
        unrelated: []
        guest: []
        servant: []
  sample:
    # `sample` was historically absent from this section, which made
    # _enforce_canonical_spellings a complete no-op on sample() -- it did not
    # merely fail to reject unknown values, it never even mapped the *known*
    # variants.  That is why Tajikistan shipped 9,020 rows of lowercase
    # 'rural'/'urban' sitting next to canonical 'Rural'/'Urban'.  GH #602.
    #
    # Rural is deliberately NOT `required: true`: many countries' sample table
    # carries only (v, weight, strata) and has no urban/rural indicator at all.
    Rural:
      type: str
      spellings:
        # Same vocabulary as cluster_features.Rural below -- one concept, one
        # canonical spelling, wherever it appears.
        # French (EHCVM) and Portuguese (Guinea-Bissau) labels are accepted
        # variants of the same concept -- the survey language should not change
        # the canonical value the user filters on.  GH #602.
        Rural: [rural, RURAL, Rurale, rurale, RURALE, Rural (zone rurale)]
        Urban: [urban, URBAN, Urbain, urbain, URBAIN, Urbano, urbano, URBANO]
        # Third settlement stratum, used only by South Africa 1993 (PSLSD),
        # whose sampling frame classifies areas as urban / rural / informal
        # (squatter settlement).  It is deliberately NOT folded into Urban:
        # the source's own `metro` variable groups these households with the
        # non-metro areas (type=3 is entirely metro=3, whereas the urban
        # stratum is entirely metro=1), so there is no evidence they are urban.
        # Kept as a distinct, VISIBLE value rather than guessed away.  GH #602.
        Informal: []
  cluster_features:
    Region:
      type: str
      required: true
    Rural:
      type: str
      required: true
      spellings:
        # Canonical values are 'Rural' / 'Urban' (capitalised).  Some
        # wave-level extractions emit lowercase; normalise here via the
        # standard spellings path.  GH #163.
        # French (EHCVM) and Portuguese (Guinea-Bissau) labels are accepted
        # variants of the same concept -- the survey language should not change
        # the canonical value the user filters on.  GH #602.
        Rural: [rural, RURAL, Rurale, rurale, RURALE, Rural (zone rurale)]
        Urban: [urban, URBAN, Urbain, urbain, URBAIN, Urbano, urbano, URBANO]
        # Third settlement stratum, used only by South Africa 1993 (PSLSD),
        # whose sampling frame classifies areas as urban / rural / informal
        # (squatter settlement).  It is deliberately NOT folded into Urban:
        # the source's own `metro` variable groups these households with the
        # non-metro areas (type=3 is entirely metro=3, whereas the urban
        # stratum is entirely metro=1), so there is no evidence they are urban.
        # Kept as a distinct, VISIBLE value rather than guessed away.  GH #602.
        Informal: []
    District:
      type: str
    Latitude:
      type: float
    Longitude:
      type: float
  plot_features:
    # Lasting plot/parcel characteristics (GH #167).  Per-season detail
    # (which crop, who farmed it this season, season-specific inputs,
    # crop-share %) belongs in a future plot_cultivation table.  See
    # slurm_logs/DESIGN_erhs_plot_features_2026-05-20.org for the design
    # rationale; Uganda is the Phase-1 pilot.
    Area:
      type: float
      required: true
      note: plot area in hectares (canonical unit)
    AreaUnit:
      type: str
      note: original survey unit before conversion to hectares
    Tenure:
      type: str
      note: |
        Form under which the plot is held by the surveyed household.
        Captures the lasting ownership disposition; per-season contract
        detail (this year's crop-share percentage, this year's cash
        rent amount, partner identity) belongs in plot_cultivation.
        `use_right` = held under agreement with a use-rights owner (a
        recognized informal arrangement, often non-cash).  `squatted` =
        informal occupation without a recognized transfer (used without
        the owner's agreement, or cleared / walked-in).  Countries may
        extend this list rather than force-fit a local category.
      spellings:
        owned: []
        leased: []
        rented_in: []
        rented_out: []
        sharecropped_in: []
        sharecropped_out: []
        inherited: []
        communal: []
        use_right: []
        squatted: []
        other_tenure: []
    TenureSystem:
      type: str
      note: |
        Lasting legal / customary land-tenure regime, orthogonal to
        Tenure (which captures the household's ownership disposition).
        Country-specific vocabulary is permitted; Uganda contributes
        the mailo system, other countries are expected to extend the
        spellings list rather than force-fit to a foreign regime.
      spellings:
        freehold: []
        leasehold: []
        mailo: []
        customary: []
        granted_right_of_occupancy: []
        state: []
        community: []
        cooperative: []
        other_tenure_system: []
    SoilType:
      type: str
    Irrigated:
      type: bool
      note: |
        True if the plot has irrigation infrastructure / customary
        water access.  Treat as a lasting attribute (per-season
        variation in irrigated use lives in plot_cultivation).
    Latitude:
      type: float
    Longitude:
      type: float
  shocks:
    AffectedIncome:
      type: bool
    AffectedAssets:
      type: bool
    AffectedProduction:
      type: bool
    AffectedConsumption:
      type: bool
    HowCoped0:
      type: str
    HowCoped1:
      type: str
    HowCoped2:
      type: str
  interview_date:
    # Int_t: legacy single interview datetime (most countries).  EHCVM
    # records a start (and end) timestamp per enumerator visit, melted onto
    # an ordinal `visit` index (local_tools.melt_visit_intervals) into
    # Interview start / Interview end.  None required: a country emits
    # whichever columns its source records (start-only -> Interview start).
    Int_t:
      type: datetime
    Interview start:
      type: datetime
    Interview end:
      type: datetime
  individual_education:
    Educational Attainment:
      type: str
      note: |
        Canonical ordinal vocabulary, low -> high, defined in
        categorical_mapping/canonical_education_labels.org.  Country grade
        detail collapses onto these levels; `Unknown` is the non-ordinal
        sentinel for don't-know / refused / unmappable.
      spellings:
        # GH #645: level 0 was spelled `None` until the to_parquet null-coercion
        # fix.  That spelling was indistinguishable from a missing value after
        # `astype(str)` -- and from YAML/CSV nulls -- so it was silently nulled
        # on every parquet write and the row then deleted by
        # `_finalize_result`'s `dropna(how='all')`.  Renamed to `No education`
        # throughout `harmonize_education`; `None` stays here as an accepted
        # VARIANT so parquets written before the rename, and any country whose
        # mapping table has not been updated, still resolve at API time.
        No education: ['None', 'NONE', 'none']
        Informal: []
        Pre-primary: []
        Primary incomplete: []
        Primary complete: []
        Lower secondary: []
        Lower secondary complete: []
        Upper secondary: []
        Upper secondary complete: []
        Vocational/Technical: []
        Tertiary certificate/diploma: []
        Bachelor: []
        Postgraduate: []
        Doctorate: []
        Unknown: []
  panel_ids:
    previous_i:
      type: str
  livestock:
    # Grain (t, i, animal) for the 13 roster countries; EthiopiaRHS is the
    # documented (t, i) household-total variant (pre-aggregated herd scalars
    # from the IFPRI ERHS deposit -- it has no per-species roster).
    #
    # NOTHING here is `required: true`, deliberately.  `required` in this file
    # makes tests/test_schema_consistency.py::TestRequiredColumns demand the
    # column of EVERY country declaring the table, and livestock's column set
    # genuinely varies with the instrument: the 7 EHCVM countries record head
    # counts and no value at all, EthiopiaRHS records value and no head
    # counts.  Any `required` livestock column would be a false universal.
    #
    # ---- THE VALUE COLUMNS ARE SPLIT BY ADDITIVITY, NOT BY GRAIN ----
    #
    # Three distinct quantities were all spelled `Value`.  They share a dtype,
    # a grain and a currency, so nothing in the library could tell them apart
    # and all three graded `sane`.  Summing the wrong one is silent.  The
    # split is by WHAT ARITHMETIC IS LEGAL:
    #
    #   ValuePerAnimal  price per head          -- NOT additive
    #   HerdValue       stock total             -- additive over `animal`
    #   SalesValue      transaction-flow total  -- additive over `animal`
    #
    # Which one a country has is settled on the QUESTIONNAIRE WORDING (quoted
    # per column below), corroborated by a conditional test.  Correlation with
    # HeadCount does NOT discriminate -- neither a unit price nor a sales
    # total tracks herd size, so both look alike under it.  The test that
    # separates them is: IS THE VALUE REPORTED WHEN NOTHING WAS SOLD?
    #
    #   % rows with value > 0 | given HeadSold == 0 | given HeadSold > 0
    #   ----------------------+---------------------+--------------------
    #   Nigeria               |         98.0        |        98.2
    #   Malawi                |         92.1        |        91.4
    #   Uganda 2009-10        |         99.2        |        89.6
    #   Uganda 2011-12+       |          0.0        |        94.9
    #   Ethiopia              |          2.0        |        95.6
    #   Mali                  |          0.0        |        92.5
    #
    # A price reported regardless of any sale is a reservation price
    # (Nigeria / Malawi / early Uganda).  A number that exists only when a
    # sale happened is sale-linked -- but that alone does NOT prove it is a
    # total: Uganda 2011-12+ is also 0.0 and is still PER HEAD ("the value of
    # each sold").  Only the wording settles it, which is why it is quoted.
    HeadCount:
      type: float
      note: |
        Head of this animal owned / kept by the household at interview.
        A stock.  Summing over `animal` adds cattle to chickens; the
        meaningful aggregate is TLU (sum of head x species factor).  For the
        roster countries TLU is a transformation over these rows and is
        deliberately NOT stored -- see the TLU entry below for the one case
        where the source ships it pre-aggregated.
    HeadAcquired:
      type: float
      note: |
        Head PURCHASED alive during the survey's recall window (12 months in
        every country that records it).  A flow.  Births and gifts are
        separate reported flows and are deliberately NOT folded in.
    HeadSold:
      type: float
      note: |
        Head SOLD alive during the recall window.  A flow, and the
        denominator that turns SalesValue into a per-animal sale price.
    ValuePerAnimal:
      type: float
      monetary: true
      note: |
        Price of ONE head, in local currency.  NOT ADDITIVE -- summing it
        over `animal`, or over households, produces a number with no meaning.
        A household's holding value is ValuePerAnimal * HeadCount, computed
        by the analyst; the library does not store it.

        Two instrument variants, both per-head:
          - RESERVATION price -- "If you would sell one of the [ANIMAL]
            today, how much would you receive?"  Reported whether or not
            anything was sold.  Nigeria (s11iq3), Malawi (ag_r04), Uganda
            2009-10 / 2010-11 (a6aq6).
          - REALISED average -- "What was, on average, the value of each
            sold?"  Defined only where the household sold.  Uganda 2011-12
            onward (a6aq14b / s6aq14b), which dropped the sell-today question.

        The switch is within-concept -- both are per head -- so it does not
        change the column, but it DOES change coverage: Uganda's non-null
        rate falls from ~96% to ~21% at 2011-12, and every non-null row from
        then on is conditional on a sale.
    HerdValue:
      type: float
      monetary: true
      note: |
        Total value of the animals described by this row, in local currency.
        ADDITIVE: at (t, i, animal) it is the per-species herd total and sums
        over `animal` to the household's livestock wealth; at the (t, i)
        grain the row already IS the household total.

        A stock -- it values HeadCount.  Contrast SalesValue, which values
        HeadSold.  Declared by EthiopiaRHS (lvsval80 / livval6 / lvs_val7,
        "total value of livestock herd", Birr, at the (t, i) grain).
    SalesValue:
      type: float
      monetary: true
      note: |
        Gross value of the animals SOLD during the recall window, in local
        currency.  ADDITIVE over `animal`, but a FLOW: it values HeadSold,
        not HeadCount, so it is NOT a herd valuation and must never be summed
        into a wealth aggregate.  A per-animal sale price is
        SalesValue / HeadSold.

        Declared by Ethiopia (ls_s8aq60, "What was the total value of sales
        of [LIVESTOCK] in the last 12 months? (BIRR)") and Mali (s4aq24 /
        s8b1q14, "Valeur brute des ventes").  Both rosters record NO current
        herd value, which is why neither country has a HerdValue -- an
        earlier reading that mapped these onto ValuePerAnimal would have
        relabelled an additive total as a unit price.
    TLU:
      type: float
      note: |
        Tropical Livestock Units -- head weighted by a species conversion
        factor, so herds of different composition are commensurable.  A
        stock, additive over `animal`, and NOT monetary (it is an animal
        count in cattle-equivalents, not a currency amount), which is why it
        is absent from currency._DEFAULT_MONETARY['livestock'].

        Stored ONLY where the source ships it pre-aggregated: EthiopiaRHS
        (lsu80 / lsu6 / tlu7, at the (t, i) grain).  For the 13 roster
        countries TLU is a transformation over HeadCount and is deliberately
        not stored -- their configs say so individually, and computing it
        needs a species factor table the library does not yet carry.
  crop_production:
    # NOTE: `condition` is an INDEX level, not a column -- deliberately
    # declared here anyway.  `_enforce_canonical_spellings` (country.py:3962)
    # applies a spellings map to index levels as well as columns, so this is
    # the working half of the mechanism.  The half that does NOT work for an
    # index level is *enforcement*: nothing rejects a value outside the list
    # (contrast food_acquired's `s`, enumerated in code as
    # transformations.S_VALUES).  A follow-up should either add a
    # CONDITION_VALUES constant alongside S_VALUES or, better, drive an
    # index-level enumeration check from this file so `s` stops being
    # special-cased.  Declaring the vocabulary here is not blocked on that.
    condition:
      type: str
      note: |
        Physical state of the crop at the moment the reported harvest
        Quantity was measured.  A harvest module that asks "how much did
        you harvest, in what unit, AND IN WHAT CONDITION" records one row
        per condition for the same plot-crop-season, so this is a level of
        the survey's own grain: 240 kg of dry coffee and 100 kg of fresh
        coffee off one plot are two facts, not one 340 kg fact.  Quantities
        in different conditions are NOT commensurable and must not be
        summed across this level without a drying / shelling conversion.

        The vocabulary crosses a DRYNESS family with a physical FORM:
        `green` / `fresh` / `dry_at_harvest` / `dried`, each optionally
        qualified by `_with_shell_and_stalk`, `_with_shell`, `_in_cob`,
        `_in_pods` or `_grain`.  The unqualified family token means "state
        not applicable" -- the survey asked, and the crop has no shell,
        cob or pod to speak of.

        Seeded from Uganda's UNPS scheme (GH #323 / #637), which is the
        finest instrument in the library.  A country whose questionnaire
        asks only a coarse dry/fresh distinction uses the bare family
        tokens; a country asking something Uganda does not should extend
        this list rather than force-fit a foreign category, per the
        `Tenure` / `TenureSystem` precedent above.

        MALAWI IS THE FIRST EXTENSION, and it extends the FORM axis, not
        the dryness one (GH #854).  IHS3-IHS5 Module G question 13c asks
        only "(S/U)" -- shelled, unshelled, or not applicable -- and never
        asks the dryness at all.  So its values are the BARE FORM tokens
        `shelled` / `unshelled` / `shell_not_applicable`, added below.
        They are NOT spelled `dried_grain` / `dried_with_shell`: those
        assert a dryness family the instrument never recorded, and the
        whole point of this level is that it says what was actually
        measured.  `shell_not_applicable` is the survey's OWN answer (code
        3, "this crop has no shell to speak of"), which is why it is a
        value and not the missing-data sentinel below.  Read the cross as
        partial rather than complete: a country may pin the dryness family,
        the form, or -- as Uganda does -- both.

        `unknown_condition` is
        the sentinel for a record whose condition code is missing or
        outside the source's labelled scheme -- it is a real value, never
        NA, because a null index key is silently dropped by the duplicate
        collapse in a country's build script.
      spellings: &crop_condition_vocabulary
        green_with_shell_and_stalk: []
        green_with_shell: []
        green_in_cob: []
        green_in_pods: []
        fresh: []
        fresh_with_shell_and_stalk: []
        fresh_with_shell: []
        fresh_in_cob: []
        fresh_in_pods: []
        dry_at_harvest_with_shell_and_stalk: []
        dry_at_harvest_with_shell: []
        dry_at_harvest_in_cob: []
        dry_at_harvest_grain: []
        dried: []
        dried_with_shell_and_stalk: []
        dried_with_shell: []
        dried_in_cob: []
        dried_in_pods: []
        dried_grain: []
        # Bare FORM tokens -- dryness not asked (Malawi IHS3-IHS5 ag_g13c).
        shelled: []
        unshelled: []
        shell_not_applicable: []
        other_condition: []
        unknown_condition: []
    season:
      type: str
      note: |
        Cropping season the harvest was reported for.  Like `condition` this
        is an INDEX level, declared here for documentation and so
        `_enforce_canonical_spellings` can reach it if a spellings map is ever
        added.

        DELIBERATELY NO `spellings:` BLOCK.  The per-country vocabularies are
        not yet harmonized -- Uganda reports the UNPS `A` / `B` seasons,
        GhanaSPS reports `major` / `minor` / `annual` -- and
        `diagnostics._check_declared_spellings` reads a `spellings` block as a
        CLOSED vocabulary, so declaring one now would grade `fail` on every
        real season value.  Same reasoning, verbatim, as the `u:` comment at
        the top of this file.  Harmonizing the two vocabularies is a follow-up
        to GH #569; the LEVEL assembles across countries today, the VALUES do
        not yet compare.

        `unknown_season` is the sentinel for a country whose harvest module
        records no season at all (every crop_production country except Uganda
        and GhanaSPS).  It is a real value, never NA, for exactly the reason
        `condition` above gives: a null index key is silently dropped by the
        first groupby that touches it.  Applied at cross-country assembly by
        `Index Info > missing_level_sentinels`, not baked into any parquet.
    KgFactor:
      type: float
      optional: true
      note: |
        Kilograms per ONE unit of this row's `u`, AS THE INSTRUMENT REPORTS
        IT -- e.g. UNPS `a5?q6d`, "conversion factor into kg", asked
        alongside the harvest quantity and unit.  `Quantity * KgFactor` is
        that row's harvest in kilograms.  NaN where the survey does not
        record it; optional because most countries never ask.

        REPORTED, NEVER CONSTRUCTED.  Only a number the instrument wrote
        down ON THIS ROW belongs in this column.  Nothing inferred goes here
        -- not a median over sibling rows, not a factor from the library's
        unit tables.  That keeps the served table what every crop_production
        config already promises it is ("REPORTED values only -- no
        harvest_kg / yield / main_crop", said independently by Uganda, Mali,
        Niger, Tanzania and Togo), and it keeps the inference revisable
        without a rebuild: construction happens at read time in
        `transformations.harvest_kg`, which layers reported -> a shipped
        conversion table -> median of reported for the same (u, condition)
        in the same country-wave -> the library's inferred factor, and
        discloses which layer served each row.

        NOR A SHIPPED CONVERSION TABLE.  A survey-supplied table -- the WB's
        Ethiopia `Crop_CF_Wave{2..5}`, Malawi's IHS5 crop files -- is keyed
        on crop x unit x region, not on the row, so writing it here would
        bake a de-duplication rule and a region join into a parquet where
        neither can be seen or audited (GH #852's duplicate: crop 74, unit
        62, 4.34 vs 6.125).  Such a table is applied AT READ TIME instead,
        by `harvest_kg(shipped_factors=...)`, as its own `shipped` layer --
        which also keeps the `reported_vs_shipped` disagreement audit
        possible, since the two numbers stay distinct.  An earlier version
        of this note read "the survey (or a survey-supplied conversion
        table)", which pointed a loader author at this column; it does not
        any more.

        A FACTOR HERE, A PRODUCT IN `food_acquired`.  The antecedent is
        `food_acquired.Quantity_kg` (Nigeria `s10bq2_cvn`, Malawi
        `cfactor`), which carries the exact per-row kilogram AMOUNT and is
        preferred over the inferred factor by the same rule -- see
        `transformations.conversion_to_kgs` and
        `food_quantities_from_acquired`.  The two are one design with one
        difference of carrier, and the difference is forced by the grain.
        Food rows are SUMMED across units within an acquisition source, so
        food needs the summable product.  Crop rows sit at
        (t, i, plot_id, j, u, condition, season) and are never summed across
        `u` or `condition`, so the factor is the natural carrier: it
        identifies the container (a 100 kg sack is not a 120 kg sack), it
        can be audited against the library's inferred factors for the same
        `u`, and the product is one multiplication away.

        CONSUMERS MUST NEVER TREAT THIS AS A QUANTITY.  It is kg per unit,
        not kg.  Summing it, averaging it across rows of different `u`, or
        reading it as a harvest is a category error; the only sanctioned
        use is `Quantity * KgFactor` on the SAME row, which is what
        `harvest_kg` does.
    Unit_sold:
      type: str
      optional: true
      note: |
        The unit the SALE was reported in, AS THE INSTRUMENT ASKED IT --
        e.g. UNPS q7c, "Unit Code" on the sale block, asked beside the sold
        quantity.  A SECOND unit, distinct from the row's `u`, which is the
        HARVEST unit.

        WHY IT IS A COLUMN AND NOT THE INDEX LEVEL `u`.  A harvest module
        that asks "how much did you harvest, in what unit" and then "how
        much of it did you sell, in what unit" has recorded ONE plot-crop
        record with TWO units.  The harvest quantity is in `u`; the sold
        quantity is in `Unit_sold`.  Making the sold unit a second index
        level would split every row in two and duplicate the harvest; making
        it overwrite `u` would relabel the harvest.  It is a per-row
        attribute of the sale, so it is a column.

        THE CONSUMER RULE, IN TWO PARTS, AND THE SECOND PART IS THE ONE
        THAT BITES.

        (1) WHERE `Unit_sold` AND `u` AGREE -- the large majority of rows --
        `Value_sold / Quantity_sold` is a price per that unit, and a
        farmgate price per kilogram is
        `Value_sold / (Quantity_sold * kg-per-unit)`, converted through the
        SAME unit machinery `u` uses.  Nothing is ambiguous here.

        (2) WHERE THEY DISAGREE, THE ROW IS A FLAG, NOT AN IDENTIFICATION.
        `Unit_sold` is what the household answered to "in what unit was it
        sold", and it is the only honest label for `Quantity_sold` AS
        REPORTED -- but a row whose two unit reports contradict each other
        is a row whose unit reporting is unreliable, and the disagreement
        does not say WHICH of the two answers is the sound one.  Measured on
        Uganda (GH #824 red-team, 2026-09-10), by two tests that share no
        instrument: `Unit_sold` is the CLOSER denominator on only 40.5% of
        the disagreeing priced rows under a price test (n=1,021, benchmarked
        on agreeing rows) and 42.7% under the household's OWN reported
        sold-kg factor (UNPS q7d, n=468) -- i.e. `u` is closer more often
        than `Unit_sold` is.  The single largest cell makes it concrete:
        Uganda rows with `u = 'Sack (100 kgs)'` and `Unit_sold = 'Kg'` have
        a median `Value_sold / Quantity_sold` of 34,167 UShs (n=162), which
        is a SACK price -- taking it as a kilogram price overstates maize by
        ~70x, an error in the opposite direction from the one this column
        exists to prevent.

        SO: a consumer forming a per-unit or per-kg price must treat
        `Unit_sold != u` rows as AMBIGUOUS -- exclude them, or resolve them
        with further evidence (a reported per-row sold kg factor, where the
        survey has one) -- and must REPORT how many were excluded.  An
        earlier version of this note said "a price per ONE `Unit_sold` --
        NEVER per `u`"; that instruction was measured to be wrong on the
        majority of exactly the rows it governed, and canonical-schema prose
        is the worst place for such a rule.  Where `Unit_sold` is NA the
        survey recorded no unit for that sale and the ratio has no
        denominator you can name; that is not licence to substitute `u`
        either.

        HOW OFTEN IT MATTERS is a per-country fact and must be measured, not
        assumed: sold and harvest unit agree on 95-97% of Nigeria's sale
        rows, 63-99% of Niger's by wave, and 96.1% of Uganda's (measured
        2026-09-10 over the 40,083 rows with a positive `Quantity_sold` that
        know both units; GH #824).  Tanzania records every sale in kilograms
        and needs no such column.

        NA-BEARING, NEVER SENTINEL-FILLED.  `u` carries the string
        `Unknown` because it is a declared INDEX level and a null index key
        is deleted outright by `groupby(dropna=True)` (see the `u` note at
        the top of this file).  `Unit_sold` is a column, has no such hazard,
        and NA says something a category cannot: this row records no sale,
        or records one whose unit the survey did not capture.

        A COUNTRY MAY LEGITIMATELY NOT DECLARE IT.  Where the sale module
        is a SEPARATE file at a coarser grain, the honest fix is to attach
        the sale only to the harvest row measured in the SAME unit, so the
        ratio is a price per `u` BY CONSTRUCTION -- which is what Malawi
        does (`malawi._sale_block` / `assemble_crop_production`, commit
        85947ff5, merging on `(i, _crop_code, u)`).  Both shapes are
        correct; what is not correct is dividing by a quantity whose unit
        the table never states.  `optional: true` because of exactly this:
        the column exists where the instrument asks a second unit on the
        same row (Uganda), and is absent where it does not.
    Condition_sold:
      type: str
      optional: true
      note: |
        Physical state of the crop AT THE MOMENT OF SALE -- UNPS q7b,
        "Condition/State Code", asked beside the sold quantity and the sold
        unit.  Same vocabulary as the harvest `condition` above (the
        `spellings` block is a YAML alias of it, so the two cannot drift),
        and the same warning applies with more force: a quantity sold DRY
        and a quantity sold FRESH are not commensurable, and neither are
        their prices.

        It is a separate answer from `condition`, not a copy: a household
        may harvest green and sell dried.  NA where the wave records no
        sold-condition column (Uganda 2011-12 ships none, though the
        questionnaire asks it) or the household reported no sale --
        NA-bearing for the same reason `Unit_sold` is, and unlike the
        `condition` INDEX level, which must carry `unknown_condition`.
      spellings: *crop_condition_vocabulary
  food_acquired:
    # Acquisition source 's' is an INDEX level (see Index Info above),
    # not a column.  Canonical values: purchased, produced, inkind,
    # other.  Enforced in code (lsms_library.transformations.S_VALUES);
    # data_info.yml has no schema for index-level value enumerations.
    Quantity:
      type: float
      required: true
      note: amount acquired in unit u, per acquisition source s
    Expenditure:
      type: float
      monetary: true
      note: monetary value of the acquisition; primarily for
        s=purchased, also for s=inkind where the survey records an
        imputed value
    Price:
      type: float
      api_derived: true
      monetary: true
      note: |
        Value per unit at the relevant point of acquisition.  Market
        price for s=purchased (Expenditure / Quantity, back-calculated
        in _finalize_result if not stored).  Farmgate price for
        s=produced (survey-reported where available).  Imputed value
        for s=inkind where available.  NaN otherwise.
  nonfood_expenditures:
    # GH #817.  The canonical shape is Togo's (PR #773): item-level, long, one
    # row per (wave, household, item) actually reported.  It is
    # `food_acquired` minus the unit `u` and the acquisition source `s` --
    # non-food modules record an amount spent, not a quantity in a unit.
    #
    # SPARSITY, and it is the point of the shape.  A household that did not
    # report an item has NO ROW -- never a fabricated 0.  That is the
    # convention `transformations.food_expenditures_from_acquired` documents
    # for food, and the wide item-by-household matrices Uganda and Nigeria used
    # to serve broke it: their `fillna(0)` made "not asked / not reported" and
    # "reported zero" the same number.
    #
    # `Expenditure` is the amount the household REPORTED, in nominal local
    # currency, over the recall window the instrument used for that item.  It
    # is NOT annualised and NOT rescaled to a common window: annualising is a
    # transformation and belongs to the analyst (same rule as
    # crop_production.harvest_kg; see Togo/_/data_scheme.yml, "WINDOW
    # DECISION").  Where a country's modules use more than one window, the
    # window is carried in `RecallWindow` so the numbers stay interpretable.
    Expenditure:
      type: float
      required: true
      monetary: true
      note: |
        Amount spent on item j by household i in wave t, over that item's
        recall window, in nominal local currency.  Reported, not annualised.
        Rows exist only where the household reported the item.
    RecallWindow:
      type: str
      optional: true
      note: |
        The recall window `Expenditure` was reported over, verbatim from the
        instrument (Togo: '7 days', '30 days', '3 months', '6 months',
        '12 months').  Optional because a survey whose non-food module uses a
        single window has nothing to disambiguate -- but a country whose
        modules mix windows and does NOT carry this column is pooling
        incommensurable numbers.

# Spellings that must never appear in column names.  Key is the rejected
# spelling; value is the canonical replacement.
# The set of features the coverage matrix grades EVERY country against.
#
# Why this exists (GH #724).  `coverage_matrix.build_matrix` used to derive its
# feature axis from each country's own `data_scheme`, so a feature a country
# never declared produced NO ROW AT ALL -- not `absent`, not `unconfigured`.
# GhanaSPS then reported 21/21 = 100% `sane` while ~300 of its 328 tracked
# source files sat unwired.  A denominator that omits the work you have not
# started is not a denominator -- the same principle `build_matrix` already
# applies to `unconfigured` COUNTRIES, one level down.
#
# Why PINNED here rather than computed as the union of what countries declare:
# a live union makes every country's denominator move whenever ONE country
# adds a feature, so a country's score would change without anything about it
# changing.  Editing this list is the deliberate act of widening the corpus's
# ambit.  `tests/test_feature_vocabulary.py` ratchets it: a source feature any
# country declares that is missing here fails, so growth is loud.
#
# Membership, as MEASURED (2026-08-24) -- not a tuned threshold.  Ranking the
# 33 source features by how many countries declare each left a real GAP:
# 22 features were declared by >= 6 countries, and the next most common by 2.
# Nothing was declared by 3, 4 or 5.  So ">= 3" and ">= 6" picked out the
# IDENTICAL set, and the cut was a property of the corpus rather than a knob.
#
# THE GAP HAS SINCE CLOSED (2026-09-04), and the threshold now does real work.
# `nutrition` (Uganda, Ethiopia + GhanaLSS, #563/PR #769) and
# `nonfood_expenditures` (Uganda, Nigeria + Togo, PR #773) each landed a THIRD
# declarer, so both sit at exactly 3 -- inside ">= 3", outside ">= 6".  They
# are added below because they are genuinely cross-country, not local helpers:
# `nutrition` is constructible wherever `food_quantities` is, and the EHCVM
# `s09` non-food modules ship in 12 (country, wave) cells across all eight
# WAEMU countries, of which 11 remain unwired.  ">= 3" is retained rather than
# raised to ">= 6": a feature three independent countries declare is corpus
# vocabulary by any reading, and raising the bar to keep the old coincidence
# would be tuning the threshold to avoid the answer.
#
# The COST is real and is the reason this is a deliberate edit: each entry puts
# its feature on the matrix axis, so every country not declaring it grades
# `undeclared` -- about 34 cells apiece at present, ~68 for the two together.
# That is the intended reading (work not started is not the same as work not
# applicable), which is exactly #724's argument, but it does move every
# country's denominator.
#
# The excluded tail is local helper tables, not corpus vocabulary --
# e.g. Tanzania's `community_cluster_xwalk`, EthiopiaRHS's `hhsize`, Uganda's
# `fct`/`earnings`/`enterprise_income`, India's `employment`.  Including a
# one-country helper would manufacture ~35 false `undeclared` rows apiece and
# discredit the tier.
#
# DERIVED features are deliberately absent: `food_expenditures`, `food_prices`,
# `food_quantities` and `household_characteristics` auto-derive from
# `food_acquired` / `household_roster` (`feature._DERIVED_SOURCE`), so an
# "undeclared food_expenditures" is just "undeclared food_acquired" restated.
# Country-level-only features (`panel_ids`, `updated_ids`) are absent too --
# they are graded by their own path.
Feature Vocabulary:
  - anthropometry
  - assets
  - cluster_features
  - community_prices
  - crop_production
  - food_acquired
  - food_coping
  - food_security
  - household_roster
  - housing
  - individual_education
  - interview_date
  - life_satisfaction
  - livestock
  - months_food_inadequate
  - nonfood_expenditures
  - nutrition
  - people_last7days
  - plot_features
  - plot_inputs
  - plot_labor
  - sample
  - shocks
  - subjective_well_being

Rejected Spellings:
  Effected: Affected
  Highest_education: Educational Attainment
  Highest Education: Educational Attainment
  # interview_date canonical column is Int_t (see Columns.interview_date
  # above); 10/11 countries emit lowercase 'int_t' (2026-04-13 feature
  # scan).  Substring rewrite is case-sensitive, so this matches 'int_t'
  # exactly without touching 'Int_t' or unrelated columns.
  int_t: Int_t

# Per-country currency for monetary columns (ISO 4217 alpha-3).
#
# Monetary values in the harmonized tables (food_expenditures.Expenditure,
# food_prices.Price, assets.Value, plot_labor.Wage, ...) are in nominal local
# currency units.  Within a single country they are commensurable; across
# countries (ll.Feature('food_expenditures')) they are not.  This section is the
# single source of truth mapping (country, wave) -> ISO 4217 code, consumed by
# lsms_library.currency.currency_for() and attached to monetary tables at API
# time when the caller passes currency='index'/'column' (see currency.py).
#
# It is also the JOIN KEY for the planned conversion layer (FX / PPP / CPI ->
# USD / international$ / real); that layer is NOT built yet.
#
# A value is either a scalar ISO code (constant across all of a country's waves)
# or a mapping {default: CODE, overrides: {'<wave>': CODE, ...}}.  Wave keys MUST
# be quoted strings -- they are matched against the string-valued `t` index level
# (e.g. '2005-06', '1999'), so an unquoted 1999 (YAML int) would never match.
#
# Currency is a function of (country, wave), NOT country alone: two in-sample
# redenominations changed both the SCALE and the ISO code mid-survey --
#   * GhanaLSS: old cedi GHC -> Ghana cedi GHS at 2007 (1 GHS = 10,000 GHC).
#   * Tajikistan: Tajikistani ruble TJR -> somoni TJS at 2000 (1 TJS = 1000 TJR).
# Currency is also NOT injective with country: the 8 EHCVM/WAEMU countries all
# share XOF.  Lines tagged `# VERIFY` are best-effort and should be confirmed
# against the questionnaire/codebook before relying on them downstream.
Currency:
  Albania: ALL
  Armenia: AMD
  Azerbaijan:                       # only the 1995 wave is present (pre-2006
    default: AZN                    # manat redenomination, 1 AZN = 5000 AZM)
    overrides: {'1995': AZM}
  Benin: XOF
  Burkina_Faso: XOF
  Cambodia: KHR
  China: CNY
  CotedIvoire: XOF
  Ethiopia: ETB
  EthiopiaRHS: ETB
  GhanaLSS:                         # 2007 redenomination, 1 GHS = 10,000 GHC
    default: GHS                    # (2012-13, 2016-17 -> GHS via default)
    overrides:
      '1987-88': GHC
      '1988-89': GHC
      '1991-92': GHC
      '1998-99': GHC
      '2005-06': GHC
  GhanaSPS: GHS                     # waves 2009-10/2013-14/2017-18, all post-reform
  Guatemala: GTQ
  Guinea-Bissau: XOF
  Guyana: GYD
  India: INR
  Iraq: IQD
  Kazakhstan: KZT
  Kosovo: EUR
  Liberia: LRD                      # VERIFY: HIES may report USD (dual currency)
  Malawi: MWK
  Mali: XOF
  Nepal: NPR
  Niger: XOF
  Nigeria: NGN
  Pakistan: PKR
  Panama: PAB                       # Balboa pegged 1:1 to USD; USD also circulates (dual currency)
  Peru:                             # 1991 reform, 1 PEN (nuevo sol) = 1,000,000 PEI (inti)
    default: PEN                    # ENNIV 1991 was fielded Sep-Nov 1991 and 1994
    overrides:                      # May-Aug 1994, both after the 1 Jul 1991 reform
      '1985': PEI                   # inti, which replaced the sol de oro on 1 Feb 1985;
      '1990': PEI                   # ENNIV 85-86 ran late 1985 into 1986, ENNIV 90 in Jun 1990
  # The fieldwork months above are measured from the data (1991 N00A.moi is
  # 9/10/11; 1994 REG01.a18 is 5..8) and from the ENNIV 90 questionnaire cover
  # ("JUNIO 1990"); the reform dates are external.  NOTE that no Peru wave
  # currently extracts a monetary column at all -- food_acquired is declared but
  # unwired -- so nothing in the returned data depends on these codes yet.
  Senegal: XOF
  Serbia: RSD                       # 2007 wave (RSD since 2006)
  'Serbia and Montenegro':          # 2002, 2003 waves
    default: CSD                    # Serbian dinar (CSD) from 2003
    overrides: {'2002': YUM}        # VERIFY: Yugoslav dinar (YUM) in 2002
  South Africa: ZAR
  Tajikistan:                       # 2000 somoni reform, 1 TJS = 1000 TJR
    default: TJS                    # (2003, 2007, 2009 -> TJS via default)
    overrides: {'1999': TJR}
  Tanzania: TZS
  Timor-Leste: USD                  # USD official since 2000
  Togo: XOF
  Uganda: UGX
# Countries whose config exists but whose source microdata is NOT in this
# repository.  Their features cannot build; that is a fact about data
# availability, not a defect.  The coverage matrix grades their cells `n/a`
# rather than `broken`, so a real build failure elsewhere is not lost in the
# noise (before this, all 8 `broken` cells in the cube were these two).
#
# Keep this in sync with the "Countries Without Microdata" table in CLAUDE.md.
Countries Without Microdata:
  note: >-
    Config present, source .dta absent.  See CLAUDE.md.  Adding the data is an
    acquisition task; it is not a bug in the country's config.
  countries: {}
  # EMPTIED 2026-07-12.  Both former entries were MISCLASSIFIED, and both in the
  # same way: a live gap hidden behind a label that reads "nothing to see here".
  #
  #   Nepal   -> `blocked` (.coder/coverage/blocked_sources.csv).  The data
  #              EXISTS and we WANT it; NSO Nepal hosts it and their site is
  #              down.  Grading it n/a said "don't look".  It is now visible and
