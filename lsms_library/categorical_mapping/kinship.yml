# set), so no reader encoding recovers them.  Those artefacts, and their
# .title() forms, used to be keys in this file (with a "low-confidence"
# P: parent entry among them).  Since GH #801 the wave hook
# Mali/2018-19/_/mapping.py::household_roster restores the full labels by
# code position and this file carries only the clean spellings.  The same
# went for the C1-control "Frere, S\x9cUr" spellings from Niger / Senegal /
# Benin / Togo 2018-19 (cp1252 files read as Latin-1 -- fixed in each
