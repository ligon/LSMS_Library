# never emitted by any wave (every EHCVM instrument writes the accented,
# comma-separated pair) and were deleted on 2026-10-14 (GH #974,
# ADJUDICATION.org rows 3, 8, 9).  A future encoding regression must warn,
# not resolve silently through a pre-emptive key.
