# --- GhanaSPS (Ghana Socio-Economic Panel Survey) variants ---
# The relationship vocabulary DRIFTS across the three GSPS waves for the same
# underlying category, so each spelling needs its own key.  Keys are given in
# the title-cased form that _expand_kinship tries first ('X'.title()):
#   adopted/foster/step  W1 'Adopted/Foster/Stepchild'
#                        W2 'Adopted, foster, or stepchild'
#                        W3 'Adopted, foster/stepchild'
#   parent-in-law        W2 'Parent or parent-in-law'      (W1/W3 use 'Parent/Parent-in-Law')
#   child-in-law         W2 'Son or daughter in-law'       (W1/W3 use 'Son/Daughter-in-law')
# None of those spellings reaches this file: GhanaSPS/_/categorical_mapping.org
# (and GhanaLSS's, for GLSS5-7's 'Parent/Parentlaw') relabels them onto the
# shared Ghana vocabulary first, so kinship sees 'Parent', 'Child-in-law' and
# the one key below.  NOTE (GH #698, 2026-10-19): the parent-OR-parent-in-law
# code is therefore served 'Parent' -> [1, 0, consanguineal], although under
# the AFFINITY-ONLY rule in the header it is a blood-or-in-law code and should
# be [1, 0, null].  Fixing it means a new Ghana Preferred Label (a vocabulary
# decision, and a build-input edit for both Ghana countries), not a key here;
# it was left for its own issue rather than done silently.
"Adopted/Foster/Stepchild":      [-1, 0, null]   # Ghana shared label: adoptive/foster/step undetermined (GH #797, 2026-09-07)

