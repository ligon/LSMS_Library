# "Otro Pariente" is UNDETERMINED by the instruments that use it, and is
# recorded as an explicit unknown rather than a guess.  Peru ENNIV 1994's
# enumerator manual (Peru/1994/Documentation/m-encues.pdf, "Pregunta No 1:
# Parentesco o relacion con el jefe") defines the category verbatim:
#
#   "Otro pariente (codigo 7) comprende a los parientes consanguineos y de
#    matrimonio con el jefe: hermano, tio, primo, consuegro, bisnieto,
#    abuelo, cunado, bisabuelo, sobrino."
#
# Brother, uncle, cousin, co-parent-in-law, great-grandchild, grandfather,
# brother-in-law, great-grandfather, nephew -- that single code spans
# Generation -3..+3, Distance 0..2, and BOTH affinities.  Any single tuple is
# therefore refuted by the source, not merely uninformative; the previous
# [0, 0, consanguineal] asserted "same generation, lineal, blood", which is
# Kroeber's cell for ego itself, for 884 Peruvian and 596 Guatemalan people.
#
# A null tuple is expressible with no framework change: `_load_kinship_map`
# does `tuple(vals)`, `_expand_kinship._component` returns `x[i]` for any
# tuple, and `pd.array(..., Int64Dtype())` turns None into pd.NA.  The key
# still MATCHES, so no "unknown relationship labels" warning fires -- which is
# the point: a warning would invite the next reader to supply a fresh guess.
# DO NOT "fix" this by inventing a tuple.  See GH #698.
"Otro Pariente":                         [null, null, null]
"Otro No Pariente":                      [0, 0, unrelated]
"Empleada Domestica":                    [0, 0, servant]
"Pensionista - Huesped":                 [0, 0, guest]

