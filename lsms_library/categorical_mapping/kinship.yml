# Kinship decomposition (Kroeber 1909; Romney & D'Andrade 1964).
#
# Maps relationship label strings to [Generation, Distance, Affinity].
# Sex is already captured in a separate column, so gendered labels
# (Brother/Sister, Son/Daughter, etc.) map to the same tuple.
#
# Generation : vertical distance from head (0 = same generation)
# Distance   : collateral distance (0 = lineal, 1 = sibling line, 2 = cousin)
# Affinity   : consanguineal | affinal | step | foster | unrelated | guest | servant
#
# Add new labels here as they are encountered in survey data.
#
# DO NOT add a key that is not title-cased when its .title() twin is already
# a key (GH #945).  _expand_kinship looks up ``label.title()`` FIRST and the
# raw stripped label only as a fallback, so such a key can never be reached:
# the twin always answers first.  70 of them had accumulated and were removed
# on 2026-09-18; tests/test_kinship_yml_hygiene.py keeps the count at zero.
#
# DO NOT write a key twice.  yaml.safe_load keeps the LAST copy silently, so
# two copies are a cliff for the first edit that changes one of them.  The
# file carried 15 redundant lines for 13 keys until 2026-10-14 (GH #974 /
# #945); the same hygiene test now reads the file as text and fails on any
# repeated key line.
#
# DO NOT add a speculative spelling (an accent-stripped, re-spaced or
# re-punctuated twin of a key a survey actually emits).  The 2026-09-18
# adjudication (slurm_logs/2026-09-18_kinship_813/ADJUDICATION.org, GH #813
# / #974) deleted 15 such keys; the bare and slash-joined English and French
# vocabulary that remains unreached is kept deliberately, as reference
# breadth for a new country.
#
# ONE KEY PER LOOKUP FORM (GH #974).  The lookup is ``label.strip().title()``
# then the raw stripped label -- exact match, nothing else folded.  Spellings
# that share a ``.strip().title()`` form are ONE key, written in that form
# (it answers every one of them on the first lookup); four such groups were
# folded on 2026-10-17.  The title form is whatever ``str.title()`` yields,
# artefacts included ("Lodger/Lodger'S Relative", "Cuñado (A)"): do not
# "correct" it, or the first lookup stops matching.  Spellings that differ in
# whitespace or punctuation ("Brother / sister-in-law" vs "brother
# /sister-in-law") are DIFFERENT lookup forms and must each stay a key until
# the lookup itself normalises more than case (GH #945 option 2).
#
# Partial and full NULL tuples are DELIBERATE, not gaps (GH #698, #797;
# decided 2026-09-07).  A component the instrument does not determine is
# null; the lookup still MATCHES, so no "Unknown relationship labels"
# warning fires and nobody is invited to supply a guess:
#   "Other relative"-class labels          -> [null, null, consanguineal]
#       a blood relative; generation and collateral distance unrecorded.
#       (Until 2026-09-07 these sat on Head's cell [0, 0, consanguineal]:
#       the tuple could not tell a head from an unspecified relative, over
#       54,251 people in 25 countries.)
#   "relative of head OR SPOUSE" labels     -> [null, null, null]
#       (EHCVM "autres parents du CM ou du conjoint", "of head or spouse",
#       Peru "Otro pariente"): blood and marriage conflated, so affinity is
#       unknown too; 45,993 people in 7 countries.
#   AFFINITY-ONLY conflations              -> [G, D, null]
#       (GH #698, ruled 2026-10-18 -- the same rule, carried to the labels
#       whose Generation and Distance ARE determinate.)  Two label forms:
#       "X of head or spouse" (Uganda "Son / daughter of head or spouse",
#       Serbia and Montenegro "Child of the head / spouse", Serbia 2007
#       "child of head of household/spouse, partner", CotedIvoire "Parent of
#       head or spouse") -- a child of the spouse alone is the head's
#       STEPchild, a parent of the spouse a parent-in-law; and "X or
#       X-in-law" (Peru "Padre/Suegro", Guyana "Father/Mother/T-in-law/
#       M-in-law", Serbia 2007 "brother/sister or brother/sister-in-law").
#       Both served "consanguineal" -- the modal guess, written as a fact --
#       until 2026-10-19: 13 keys, 43,782 people in 6 countries.  Guyana's
#       "Bro/Sis/B-in-law/S-in-law/Other relative" also folds in "other
#       relative", so it is [null, null, null] (459 people).
#       NOT conflated, and kept: an in-law "of the head/spouse" (affinal
#       either way), a person unrelated to head AND spouse, the spouse's
#       parent alone ("Father/Mother Of The Wife Of Head").  An English
#       gendered in-law pair ("Father/Mother-in-law") is a pair of in-laws,
#       not a blood-or-in-law code.  tests/test_kinship_affinity_conflation.py
#       guards both forms structurally.
# Do not "repair" a null tuple by choosing a cell; the instrument did not.

